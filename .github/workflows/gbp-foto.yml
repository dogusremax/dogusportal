name: Google işletme fotoğraflarını indir
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/gbp-foto.js
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      - run: |
          git config user.name "dogus-bot"
          git config user.email "bot@dogusremax.com"
          git add assets/ofis/gbp
          git diff --cached --quiet || (git commit -m "Google işletme fotoğrafları indirildi" && git pull --rebase && git push)

name: ceyrek deneme (gecici)
on:
  push:
    branches: [claude/project-thread-5c1qc5]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node scripts/ceyrek.js 2026-Q3
      - run: DRY_RUN=1 node scripts/ceyrek-ig.js
      - uses: actions/upload-artifact@v4
        with: { name: ceyrek, path: performans/ceyrek }

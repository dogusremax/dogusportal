name: ilan-olustur
# Danışmanın verdiği ilandan dogusportal.com/ilan/<kod>/ önizleme sayfası üretir.
# Tetikleyen: Danışman Takip Apps Script (action=ilanOlustur, IlanOnizleme.js). Kod: scripts/ilan-olustur.js
on:
  workflow_dispatch:
    inputs:
      kod: { description: "sayfa kodu", required: true }
      danisman: { description: "danışman id", required: true }
      girdi: { description: "ilan linki ya da numarası", default: "" }
      veri: { description: "Doğuş İlan düğmesinin topladığı JSON (isteğe bağlı)", default: "" }
permissions:
  contents: write
jobs:
  olustur:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # site büyük (~800MB): yalnız gereken klasörler indirilir
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts
            data
            ilan/${{ inputs.kod }}
      - uses: actions/cache@v4
        with: { path: node_modules, key: sharp-0.33.5-linux }
      - name: Paketler
        id: paket
        env:
          GIRDI: ${{ inputs.girdi }}
          VERI: ${{ inputs.veri }}
        run: |
          # sahibinden fotoğraflarındaki filigran ve logo için (scripts/foto-temizle.py): python paketleri
          # arka planda kurulur, ilan-olustur.js gerekince bekler
          if printf '%s %s' "$GIRDI" "$VERI" | grep -qiE 'sahibinden|shbdn|(^|[^0-9])[0-9]{9,11}([^0-9]|$)'; then
            echo "shb=1" >> "$GITHUB_OUTPUT"
            (pip install -q onnxruntime==1.20.1 opencv-python-headless==4.10.0.84 numpy==1.26.4; touch "$RUNNER_TEMP/pip.ok") > "$RUNNER_TEMP/pip.log" 2>&1 < /dev/null &
          else touch "$RUNNER_TEMP/pip.ok"; fi
          [ -d node_modules/sharp ] || npm i --no-save --no-audit --no-fund sharp@0.33.5
      - uses: actions/cache@v4
        if: steps.paket.outputs.shb == '1'
        with: { path: lama_fp32.onnx, key: lama-fp32-v1 }
      - name: Sayfayı üret
        env:
          KOD: ${{ inputs.kod }}
          DANISMAN: ${{ inputs.danisman }}
          GIRDI: ${{ inputs.girdi }}
          VERI: ${{ inputs.veri }}
          PIP_HAZIR: ${{ runner.temp }}/pip.ok
        run: node scripts/ilan-olustur.js
      - name: Yayınla
        env:
          KOD: ${{ inputs.kod }}
        run: |
          git config user.name dogus-bot
          git config user.email bot@remaxdogus.com.tr
          git add --sparse "ilan/$KOD"
          git commit -qm "İlan önizleme: $KOD"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
      # kalan sahibinden fotoğrafları: sayfa yayındayken temizlenip eklenir
      - name: Kalan fotoğrafları temizle
        env:
          KOD: ${{ inputs.kod }}
          LAMA_SUREC: "2"
          LAMA_IS: "2"
        run: |
          B="ilan/$KOD/bekleyen.json"
          [ -f "$B" ] || exit 0
          a=""; for f in $(jq -r '.[1:][]' "$B"); do a="$a ilan/$KOD/$f ilan/$KOD/$f"; done
          for i in $(seq 600); do [ -f "$RUNNER_TEMP/pip.ok" ] && break; sleep 0.2; done
          [ -n "$a" ] && python3 scripts/foto-temizle.py $a
          FOTO_EKLE=1 node scripts/ilan-olustur.js
          git add --sparse -A "ilan/$KOD"
          git commit -qm "İlan önizleme: $KOD fotoğraflar"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1
      # hazır bekleyen boş sayfa havuzu azaldıysa yenilerini üret (scripts/ilan-havuz.js)
      - name: Havuzu doldur
        if: always()
        run: |
          git pull -q --rebase origin main || true
          node scripts/ilan-havuz.js
          git diff --quiet data/ilan-havuz.json && [ -z "$(git ls-files -o --exclude-standard ilan)" ] && exit 0
          git add --sparse -A data/ilan-havuz.json ilan
          git commit -qm "İlan havuzu: yeni boş sayfalar"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i*3))
          done
          exit 1

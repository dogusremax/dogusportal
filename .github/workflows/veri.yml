name: veri çek
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B="https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec"
          K="k=dogus-performans"
          mkdir -p veri/kullanim
          for ay in 2026-03 2026-04 2026-05 2026-06 2026-07 2026-08 2026-09 2026-10 2026-11; do
            curl -sL "$B?action=aylik&ay=$ay&$K" -o veri/kullanim/ay-$ay.json
          done
          d=2026-07-06
          while [ "$d" \< "2026-11-17" ]; do
            curl -sL "$B?action=haftalik&hafta=$d&$K" -o veri/kullanim/h-$d.json
            d=$(date -d "$d + 7 days" +%F)
          done
          git config user.name bot; git config user.email b@b
          git add veri && git commit -m "veri: kullanim analizi" && git push

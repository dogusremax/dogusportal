name: veri çek
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          B="https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec"
          K="k=dogus-performans"
          mkdir -p veri
          curl -sL "$B?action=aylik&ay=2026-10&$K" -o veri/ay10.json
          curl -sL "$B?action=aylik&ay=2026-09&$K" -o veri/ay09.json
          curl -sL "$B?action=haftalik&hafta=2026-10-12&$K" -o veri/h1012.json
          curl -sL "$B?action=haftalik&hafta=2026-10-05&$K" -o veri/h1005.json
          curl -sL "$B?action=haftalik&hafta=2026-09-28&$K" -o veri/h0928.json
          curl -sL "$B?action=haftalik&hafta=2026-09-21&$K" -o veri/h0921.json
          git config user.name bot; git config user.email b@b
          git add veri && git commit -m "veri" && git push

name: Danışman video kapaklarını ve reels videolarını indir
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kapak:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save sharp@0.33.5 && (command -v ffmpeg || (sudo apt-get update -q && sudo apt-get install -y -q ffmpeg))
      - name: Güncel IG token'ı al
        run: |
          T=$(curl -sL "https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec?action=igToken&k=${{ secrets.PORTAL_ANAHTAR }}")
          if [ -z "$T" ] || [ "${#T}" -lt 50 ]; then T="${{ secrets.IG_TOKEN }}"; fi
          echo "::add-mask::$T"
          echo "IG_TOKEN=$T" >> $GITHUB_ENV
      - run: node scripts/video-kapak.js
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
      - run: |
          git config user.name "dogus-bot"
          git config user.email "bot@dogusremax.com"
          git add assets/video-kapak assets/reels
          git diff --cached --quiet || (git commit -m "Danışman video kapakları indirildi" && git pull --rebase && git push)

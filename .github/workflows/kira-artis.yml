name: Kira artış oranı (TÜFE)

on:
  schedule:
    # TÜİK TÜFE'yi ayın 3'ünde 10:00'da açıklar; tatil/hafta sonu ilk iş gününe kayar.
    # 3-6 arası her gün 07:30 UTC = 10:30 TR. Veri değişmemişse script commit atmaz.
    - cron: '30 7 3,4,5,6 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: EVDS'ten çek ve hesapla
        id: fetch
        continue-on-error: true
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: |
          mkdir -p data
          set -o pipefail
          node scripts/update-kira.js 2>&1 | tee data/son-calisma.log
          echo "kod=$?" >> $GITHUB_OUTPUT

      - name: Sonucu ve log'u kaydet
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "dogus-bot"
            git config user.email "actions@github.com"
            git add -A kira-artis.html data
            git commit -m "Kira artış oranı çalıştırma sonucu"
            git push
          else
            echo "Değişiklik yok."
          fi

      - name: Adım başarısızsa işi düşür
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "EVDS adımı hata verdi — data/son-calisma.log dosyasına bakın."
          exit 1

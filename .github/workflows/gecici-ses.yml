# GEÇİCİ (main'e alınmayacak): gecici/ altındaki yeni mp3'ü yazıya döker, kontrol için
name: Geçici ses yazıya dökme
on:
  push:
    branches: [claude/project-thread-h0cmgl]
    paths: [gecici/hafta-02-kasim.mp3, .github/workflows/gecici-ses.yml]
permissions: { contents: write }
jobs:
  ses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip -q install -U faster-whisper av
      - run: python scripts/ses-zaman.py gecici/hafta-02-kasim.mp3 gecici/zaman-02-kasim.json
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gecici && (git diff --cached --quiet || (git commit -qm "2 Kasım ses metni" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done))

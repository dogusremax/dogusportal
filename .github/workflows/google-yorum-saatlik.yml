name: Google yorumları + Sizlerden Gelenler otomatik paylaşım
on:
  schedule:
    - cron: "7,22,37,52 * * * *"   # 15 dk'da bir — Business Profile API'den tüm yorumlar; yeni olan arşive eklenir
  workflow_dispatch:
    inputs:
      bildirim_deneme:
        description: "Sadece deneme e-postası gönder"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: google-yorum
  cancel-in-progress: false
jobs:
  yorum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Deneme e-postası
        if: inputs.bildirim_deneme
        run: |
          echo "Bu bir deneme e-postasıdır. Otomatik paylaşılmayan yeni Google yorumları ve Sizlerden Gelenler paylaşım hataları bu adrese gelecek." > deneme.txt
          node scripts/bildir.js "Deneme: Google yorumu bildirimi" deneme.txt
      - if: ${{ !inputs.bildirim_deneme }}
        run: node scripts/google-yorum.js
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      - run: |
          git config user.name "dogus-bot"
          git config user.email "bot@dogusremax.com"
          git add data/google-yorumlar.json data/google-yorum-gorulen.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Google yorumları güncellendi" && git pull --rebase && git push)

      # Otomatik paylaşılmayan yeni yorumlar (1-3★, metinsiz, danışman adı yok) → Umut'a e-posta; bunlar asla yayınlanmaz
      - name: Paylaşılmayan yeni yorumu bildir
        if: hashFiles('yorum-bildirim.txt') != ''
        continue-on-error: true   # bildirim gitmese de paylaşım adımları durmasın
        run: node scripts/bildir.js "Yeni Google yorumu (otomatik paylaşılmadı)" yorum-bildirim.txt

      # Sizlerden Gelenler: yeni 4-5★ yorum → story + karusel. Sadece sizlerden-story/.canli dosyası varken çalışır.
      - name: Yeni yorum seç
        if: hashFiles('sizlerden-story/.canli') != ''
        env:
          SADECE_YENI: "1"
        run: node scripts/sizlerden-story.js sec
      - name: Story ve karusel görsellerini üret
        if: hashFiles('sizlerden-story/.secim.json') != ''
        run: |
          npm i playwright@1.47.0 && npx playwright install --with-deps chromium
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          SITE=http://localhost:8000 node scripts/sizlerden-story.js
          rm -f sizlerden-story/.secim.json
          git add sizlerden-story
          git diff --cached --quiet || (git commit -m "Sizlerden Gelenler: $(cat sizlerden-story/.son)" && git pull --rebase && git push)
      - name: Güncel IG token'ı al
        if: hashFiles('sizlerden-story/.canli') != '' && hashFiles('sizlerden-story/.media') != ''
        run: |
          T=$(curl -sL "https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec?action=igToken&k=dogus-performans")
          if [ -z "$T" ] || [ "${#T}" -lt 50 ]; then T="${{ secrets.IG_TOKEN }}"; fi
          echo "::add-mask::$T"
          echo "IG_TOKEN=$T" >> $GITHUB_ENV
      - name: Instagram'a paylaş
        if: hashFiles('sizlerden-story/.canli') != '' && hashFiles('sizlerden-story/.media') != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        shell: bash
        run: |
          set -o pipefail
          ST=0; node scripts/sizlerden-ig.js 2>&1 | tee sizlerden-story/ig-log.txt || ST=$?
          for f in ig-log.txt .pub .pub-story; do [ -f sizlerden-story/$f ] && git add sizlerden-story/$f; done
          git diff --cached --quiet || (git commit -m "Sizlerden Gelenler: ig log" && git pull --rebase && git push)
          exit $ST
      - name: Paylaşım hatasını bildir
        if: failure()
        run: |
          # Aynı yorum için tek e-posta (15 dk'da bir tekrar denenirken her seferinde mail gelmesin)
          K=$(node -e "try{console.log(JSON.parse(require('fs').readFileSync('sizlerden-story/.media','utf8')).key)}catch(e){console.log('genel-'+new Date().toISOString().slice(0,10))}")
          [ "$(cat sizlerden-story/.hata-bildirildi 2>/dev/null)" = "$K" ] && exit 0
          { echo "Sizlerden Gelenler otomatik paylaşımı hata verdi."; echo; echo "Çalışma: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"; echo; tail -20 sizlerden-story/ig-log.txt 2>/dev/null; } > hata.txt
          node scripts/bildir.js "Sizlerden Gelenler paylaşım hatası" hata.txt
          echo "$K" > sizlerden-story/.hata-bildirildi
          git add sizlerden-story/.hata-bildirildi && git commit -qm "Sizlerden Gelenler: hata bildirildi" && git pull --rebase && git push || true

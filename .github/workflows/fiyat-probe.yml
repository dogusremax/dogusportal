name: fiyat-probe
# Fiyatlama raporu veri kaynağı denemesi (scripts/fiyat-probe.js). Yalnız okur, hiçbir şey yazmaz/yayınlamaz.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/fiyat-probe.js

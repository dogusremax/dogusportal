# GEÇİCİ: 2026-10-19 Reel'ini hazır yüz videosuyla yeniden altyazılar (birleştirmeden önce silinecek)
name: Reel altyazı testi
on:
  push:
    branches: [claude/project-thread-h0cmgl]
    paths: [.github/workflows/reel-altyazi-test.yml]
permissions: { contents: write, actions: read }
jobs:
  yeniden:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env: { H: "2026-10-19" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - uses: actions/download-artifact@v4
        with: { name: hazirlik, run-id: 38797972311, github-token: "${{ github.token }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "yuz-*", merge-multiple: true, run-id: 38797972311, github-token: "${{ github.token }}" }
      - name: Altyazı zamanları (medium + ipucu)
        run: |
          pip -q install faster-whisper==1.1.1
          python scripts/ses-zaman.py reel-ses.mp3 reel-zaman.json
      - name: Videoyu birleştir
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          node scripts/reel-parca.js birlestir
          mkdir -p fontlar
          U=$(curl -sS "https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700" | grep -o 'https://[^)]*\.ttf' | head -1)
          curl -sSL -o fontlar/PlusJakartaSans.ttf "$U"
          node scripts/astro-reel.js altyazi
          D=$(ffprobe -v error -show_entries format=duration -of csv=p=0 reel-ses.mp3)
          T=$(node -p "($D+0.8).toFixed(2)")
          TABAN="[0:v]scale=-2:1920:flags=lanczos,crop=1080:1920:iw-1080:0,fps=30,tpad=stop_mode=clone:stop_duration=2[b]"
          ffmpeg -y -loglevel error -i yuz.mp4 -i assets/dogus-logo.png -i reel-ses.mp3 -filter_complex \
            "$TABAN;[1]scale=267:-1[l];[b][l]overlay=W-w-82:77[bl];[bl]ass=reel.ass:fontsdir=fontlar,drawtext=fontfile=fontlar/PlusJakartaSans.ttf:text='Yapay zeka ile oluşturulmuştur':fontsize=26:fontcolor=white@0.8:x=48:y=96[v]" \
            -map "[v]" -map 2:a -t $T -c:v libx264 -profile:v high -pix_fmt yuv420p -preset medium -crf 23 -r 30 -c:a aac -b:a 128k -ar 44100 -movflags +faststart \
            "yatirim-astroloji/$H-reel.mp4"
          ffmpeg -y -loglevel error -ss 1.5 -i "yatirim-astroloji/$H-reel.mp4" -frames:v 1 -q:v 3 "yatirim-astroloji/$H-reel-kapak.jpg"
          mkdir -p avatar-test && cp reel-zaman.json parcalar.json avatar-test/
      - name: Kaydet
        run: |
          git config user.name "dogus-bot"; git config user.email "bot@dogusremax.com"
          git add yatirim-astroloji/$H-reel.mp4 yatirim-astroloji/$H-reel-kapak.jpg avatar-test/reel-zaman.json avatar-test/parcalar.json
          git diff --cached --quiet || (git commit -m "Astrolog Reel'i: $H altyazı düzeltmesi" && git pull --rebase && git push)

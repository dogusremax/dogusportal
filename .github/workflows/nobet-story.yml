name: Günlük nöbetçi story
on:
  schedule:
    - cron: "40 5 * * *"   # 08:40 TR (ana)
    - cron: "25 6 * * *"   # 09:25 TR (yedek; kilit sayesinde mükerrer atmaz)
  workflow_dispatch:
permissions:
  contents: write
jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i playwright@1.47.0 && npx playwright install --with-deps chromium
      - run: node scripts/story.js
      - run: |
          git config user.name "dogus-bot"
          git config user.email "bot@dogusremax.com"
          git add nobet-story || true
          git diff --cached --quiet || git commit -m "Nöbetçi story: $(cat nobet-story/.son)"
          git push
      - name: Güncel IG token'ı al
        if: hashFiles('nobet-story/.media') != ''
        run: |
          T=$(curl -sL "https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec?action=igToken&k=dogus-performans")
          if [ -z "$T" ] || [ "${#T}" -lt 50 ]; then T="${{ secrets.IG_TOKEN }}"; fi
          echo "::add-mask::$T"
          echo "IG_TOKEN=$T" >> $GITHUB_ENV
      - name: Instagram'a paylaş
        if: hashFiles('nobet-story/.media') != ''
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/ig-story.js 2>&1 | tee ig-log.txt || true
          git config user.name dogus-bot; git config user.email bot@dogusremax.com
          git add ig-log.txt nobet-story/.pub 2>/dev/null; git commit -m "ig log" && git push || true

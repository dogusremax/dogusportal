# GEÇİCİ (main'e alınmayacak): Umut'un yeni görseliyle 26 Ekim HeyGen videosu, tek istek
name: Geçici 26 Ekim HeyGen
on:
  push:
    branches: [claude/project-thread-h0cmgl]
    paths: [gecici/heygen.py]
permissions: { contents: write }
jobs:
  heygen:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq install -y ffmpeg >/dev/null && pip -q install requests
      - run: python gecici/heygen.py
        env: { HEYGEN_API_KEY: "${{ secrets.HEYGEN_API_KEY }}" }
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gecici && (git diff --cached --quiet || (git commit -qm "26 Ekim HeyGen videosu (yeni görsel)" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done))

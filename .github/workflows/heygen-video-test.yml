# GEÇİCİ: Doğuş Astrolog avatarıyla HeyGen Avatar IV örnek videosu (birleştirmeden önce silinecek)
name: HeyGen video testi
on:
  workflow_dispatch:
    inputs:
      ses: { description: "HeyGen voice_id", default: "664b73058b784aa89ddb2924c141d441" }
  push:
    branches: [claude/project-thread-h0cmgl]
    paths: [.github/workflows/heygen-video-test.yml]
permissions: { contents: write }
jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      SES: ${{ inputs.ses || '664b73058b784aa89ddb2924c141d441' }}
      AVATAR: 1488a5f81c834cf9a1e8a34ea720d4af
    steps:
      - uses: actions/checkout@v4
      - name: Videoyu üret
        run: |
          python3 - <<'PY'
          import json, os, time, urllib.request
          K = os.environ['HEYGEN_API_KEY']
          def istek(url, veri=None):
              r = urllib.request.Request(url, data=json.dumps(veri).encode() if veri else None,
                  headers={'X-Api-Key': K, 'Content-Type': 'application/json'})
              try: return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e: print('HATA', e.code, e.read().decode()[:800]); raise
          metin = open('avatar-test/heygen-metin.txt').read().replace('\n', ' ').strip()
          govde = {"video_inputs": [{
              "character": {"type": "talking_photo", "talking_photo_id": os.environ['AVATAR'], "use_avatar_iv_model": True},
              "voice": {"type": "text", "input_text": metin, "voice_id": os.environ['SES'], "speed": 1.0}}],
              "dimension": {"width": 1080, "height": 1920}, "title": "Astrolog deneme"}
          r = istek('https://api.heygen.com/v2/video/generate', govde); print(r)
          vid = r['data']['video_id']
          for _ in range(160):
              time.sleep(15)
              s = istek(f'https://api.heygen.com/v1/video_status.get?video_id={vid}')['data']
              print(s.get('status'), s.get('error'))
              if s['status'] == 'completed':
                  urllib.request.urlretrieve(s['video_url'], 'avatar-test/heygen-ornek.mp4'); break
              if s['status'] == 'failed': raise SystemExit(json.dumps(s))
          PY
          ls -la avatar-test/heygen-ornek.mp4
      - name: Kaydet
        run: |
          git config user.name "dogus-bot"; git config user.email "bot@dogusremax.com"
          git add avatar-test/heygen-ornek.mp4
          git diff --cached --quiet || (git commit -m "HeyGen astrolog örnek videosu" && git pull --rebase && git push)

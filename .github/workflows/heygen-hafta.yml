# GEÇİCİ: Umut'un yüklediği Elvan mp3'lerini yazıya döker (ücretsiz); VIDEO=1 ile seçilen sesten tek HeyGen videosu üretir
name: HeyGen haftalık astrolog
on:
  workflow_dispatch:
    inputs:
      ses: { description: "avatar-test içindeki mp3", default: "" }
      video: { description: "1 = HeyGen videosu üret", default: "0" }
  push:
    branches: [claude/project-thread-h0cmgl]
    paths: [.github/workflows/heygen-hafta-tetik]
permissions: { contents: write }
jobs:
  is:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
      AVATAR: 3136c6b3b42c468285849e2b950dc5d1   # yaka kartlı görünüm
      SES: ${{ inputs.ses }}
      VIDEO: ${{ inputs.video || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Yazıya dök
        if: env.VIDEO != '1'
        run: |
          pip -q install faster-whisper==1.1.1 requests
          for f in avatar-test/hafta-*.mp3; do python scripts/ses-zaman.py "$f" "${f%.mp3}-zaman.json"; done
      - name: HeyGen videosu (tek istek)
        if: env.VIDEO == '1'
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null
          python3 - <<'PY'
          import json, os, time, urllib.request
          H = {'X-Api-Key': os.environ['HEYGEN_API_KEY']}
          def istek(url, veri=None, bas=None, yontem=None):
              h = dict(H, **(bas or {}))
              if isinstance(veri, dict): veri = json.dumps(veri).encode(); h['Content-Type'] = 'application/json'
              r = urllib.request.Request(url, data=veri, headers=h, method=yontem)
              try: return json.load(urllib.request.urlopen(r))
              except urllib.error.HTTPError as e: print('HATA', url, e.code, e.read().decode()[:800]); raise
          import subprocess
          ses = os.environ['SES']; ad = os.path.splitext(os.path.basename(ses))[0]
          # Avatar IV ilk ~1 sn'de dudakları geç oturtuyor: başa 0,6 sn sessizlik ekle, sonra videodan kes
          subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-f', 'lavfi', '-t', '0.6', '-i', 'anullsrc=r=44100:cl=mono', '-i', ses,
                          '-filter_complex', '[1]aformat=sample_rates=44100:channel_layouts=mono[s];[0][s]concat=n=2:v=0:a=1', '-c:a', 'libmp3lame', '-b:a', '192k', 'giris.mp3'], check=True)
          up = istek('https://upload.heygen.com/v1/asset', open('giris.mp3', 'rb').read(), {'Content-Type': 'audio/mpeg'}, 'POST'); print(up)
          govde = {"video_inputs": [{
              "character": {"type": "talking_photo", "talking_photo_id": os.environ['AVATAR'], "use_avatar_iv_model": True},
              "voice": {"type": "audio", "audio_asset_id": up['data']['id']}}],
              "dimension": {"width": 1080, "height": 1920}, "title": f"Güneş {ad}"}
          r = istek('https://api.heygen.com/v2/video/generate', govde); print(r)
          vid = r['data']['video_id']; open(f'avatar-test/{ad}-video-id.txt', 'w').write(vid)
          for _ in range(200):
              time.sleep(15)
              s = istek(f'https://api.heygen.com/v1/video_status.get?video_id={vid}')['data']
              print(s.get('status'), s.get('error'))
              if s['status'] == 'completed':
                  urllib.request.urlretrieve(s['video_url'], 'heygen-ham.mp4')
                  subprocess.run(['ffmpeg', '-y', '-loglevel', 'error', '-ss', '0.6', '-i', 'heygen-ham.mp4', '-c:v', 'libx264', '-crf', '16',
                                  '-preset', 'medium', '-c:a', 'aac', '-b:a', '192k', f'avatar-test/{ad}-heygen.mp4'], check=True); break
              if s['status'] == 'failed': raise SystemExit(json.dumps(s))
          PY
      - name: Kaydet
        if: always()
        run: |
          git config user.name "dogus-bot"; git config user.email "bot@dogusremax.com"
          git add avatar-test/ 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "HeyGen haftalık astrolog çıktıları" && git pull --rebase && git push)

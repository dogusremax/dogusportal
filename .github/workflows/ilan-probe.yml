name: ilan-probe
on:
  push:
    branches: [claude/project-thread-ql8rpw]
    paths: [".github/workflows/ilan-probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="WhatsApp/2.23.20.0"
          for u in https://www.sahibinden.com/ "https://www.sahibinden.com/satilik-daire/istanbul-kadikoy" "https://www.sahibinden.com/satilik-daire?address_town=446"; do
            echo "=== $u"; curl -sS -A "$UA" --max-time 20 -o l.html -w "HTTP %{http_code} %{size_download}\n" "$u" || true
            grep -oE '/ilan/[a-z0-9-]+-[0-9]{9,11}/detay' l.html | sort -u | head -5
          done
          L=$(grep -ohE '/ilan/[a-z0-9-]+-[0-9]{9,11}/detay' l.html | head -1)
          [ -z "$L" ] && L="/ilan/emlak-konut-satilik-fikirtepe-1270000000/detay"
          echo "=== DETAY $L"
          for ua in "WhatsApp/2.23.20.0" "WhatsApp/2.24.1.1 i" "facebookexternalhit/1.1"; do
            curl -sS -A "$ua" --max-time 20 -o d.html -w "[$ua] HTTP %{http_code} %{size_download}\n" "https://www.sahibinden.com$L" || true
          done
          curl -sS -A "WhatsApp/2.23.20.0" --max-time 20 -o d.html "https://www.sahibinden.com$L"
          grep -o '<title>[^<]*' d.html; grep -oE '<meta (property|name)="(og:[^"]*|description)"[^>]*>' d.html | head -10
          grep -oE 'https://i[0-9]*\.shbdn\.com/photos/[^"\\ ]+' d.html | sort -u | head -30 | tee foto.txt | head -5; wc -l foto.txt
          python3 - <<'PY'
          import re,html
          s=open('d.html',encoding='utf8',errors='ignore').read()
          for m in re.finditer(r'<li>\s*<strong[^>]*>(.*?)</strong>\s*<span[^>]*>(.*?)</span>',s,re.S): print(re.sub(r'\s+',' ',html.unescape(m.group(1))).strip(),'=',re.sub(r'<[^>]+>|\s+',' ',html.unescape(m.group(2))).strip())
          j=s.find('classifiedDescription'); print('DESC', re.sub(r'<[^>]+>|\s+',' ',s[j:j+1500])[:700] if j>0 else None)
          j=s.find('classifiedInfo'); print('INFO', re.sub(r'<[^>]+>|\s+',' ',s[j:j+1200])[:600] if j>0 else None)
          print('ld', s.count('ld+json'), 'len', len(s))
          print(s[:1500] if len(s)<20000 else '')
          PY

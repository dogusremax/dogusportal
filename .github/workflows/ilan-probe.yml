name: ilan-probe
on:
  push:
    branches: [claude/project-thread-ql8rpw]
    paths: [".github/workflows/ilan-probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for ua in "WhatsApp/2.23.20.0" "TelegramBot (like TwitterBot)" "Slackbot-LinkExpanding 1.0 (+https://api.slack.com/robots)" "Mozilla/5.0 (compatible; bingbot/2.0)" "okhttp/4.9.0" "Hepsiemlak/5.0 (iPhone; iOS 17.0)"; do
            for u in "https://www.hepsiemlak.com/kadikoy-satilik" "https://www.hepsiemlak.com/api/realty-detail/12345-678" "https://api.hepsiemlak.com/" "https://m.hepsiemlak.com/" "https://www.hepsiemlak.com/api/realties?city=istanbul&page=1"; do
              curl -sS -A "$ua" --max-time 15 -o h.html -w "[$ua] %{http_code} %{size_download} $u\n" "$u" || true
              grep -o '<title>[^<]*' h.html | head -1
            done
          done
          echo "== kmp"; curl -sS --max-time 15 -o h.json -w "%{http_code}\n" "https://www.hepsiemlak.com/api/realties?city=istanbul&page=1" -H "Accept: application/json"; head -c 300 h.json

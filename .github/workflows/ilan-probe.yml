name: ilan-probe
on:
  push:
    branches: [claude/project-thread-ql8rpw]
    paths: [".github/workflows/ilan-probe.yml"]
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          npm i playwright@1.47.2 >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch({ channel: 'chrome', headless: true, args:['--disable-blink-features=AutomationControlled'] });
          const c = await b.newContext({ locale:'tr-TR', userAgent:'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36', viewport:{width:1366,height:900}});
          await c.addInitScript(()=>{Object.defineProperty(navigator,'webdriver',{get:()=>undefined})});
          const p = await c.newPage();
          for (const u of ['https://www.hepsiemlak.com/kadikoy-satilik','https://www.sahibinden.com/ilan/emlak-konut-satilik-tek-yetkili-bagdattan-minibuse-yakin-ara-katta-genis-3-plus1-daire-1323616594/detay']) {
            try { const r = await p.goto(u,{waitUntil:'domcontentloaded',timeout:30000}); await p.waitForTimeout(12000);
              const h = await p.content(); console.log('==',u,r&&r.status(),(await p.title()).slice(0,100),h.length);
              const l = [...new Set((h.match(/\/[a-z0-9-]+\/\d+-\d+/g)||[]))].slice(0,5); console.log(l.join(' '));
              console.log((h.match(/shbdn\.com\/photos\/[^"]+/g)||[]).length, 'shb foto');
            } catch(e){ console.log('ERR',u,e.message) }
          }
          await b.close();
          JS
          node t.mjs

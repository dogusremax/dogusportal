name: ilan-probe
on:
  push:
    branches: [claude/project-thread-ql8rpw]
    paths: [".github/workflows/ilan-probe.yml"]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p ornek; cd ornek
          W="WhatsApp/2.23.20.0"; M="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          curl -sS -A "$W" -o shb-arama.html "https://www.sahibinden.com/emlak?query_text=1323616594"
          curl -sS -A "$W" -o shb-detay.html "https://www.sahibinden.com/ilan/emlak-konut-satilik-tek-yetkili-bagdattan-minibuse-yakin-ara-katta-genis-3-plus1-daire-1323616594/detay"
          curl -sS -A "$W" -o shb-kira.html "https://www.sahibinden.com/emlak?query_text=1340059567"
          curl -sSL -A "$M" -o remax.html "https://remax.com.tr/tr/portfoy/P01342800"
          curl -sSL -A "$M" -o remax2.html "https://remax.com.tr/tr/portfoy/P06374523"
          curl -sSL -A "$M" -o ej.html "https://www.emlakjet.com/ilan/akbati-avm-arkasinda-tertemiz-sifir-21-19224629"
          gzip -9 *.html; ls -la
          cd ..; git config user.name dogus-bot; git config user.email bot@remaxdogus.com.tr
          git add ornek; git commit -m "probe ornek"; git push

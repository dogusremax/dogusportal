name: ilan-probe
on:
  push:
    branches: [claude/project-thread-ql8rpw]
    paths: [probe/test/**, scripts/foto-temizle.py, .github/workflows/ilan-probe.yml]
permissions: { contents: write }
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with: { path: lama_fp32.onnx, key: lama-fp32-v1 }
      - run: pip install -q onnxruntime opencv-python-headless numpy
      - run: |
          mkdir -p probe/out
          a=""; for f in probe/test/*.jpg; do a="$a $f probe/out/$(basename $f)"; done
          time python3 scripts/foto-temizle.py $a
          nproc
          time LAMA_SUREC=2 LAMA_IS=2 python3 scripts/foto-temizle.py $a
          time LAMA_SUREC=4 LAMA_IS=1 python3 scripts/foto-temizle.py $a
      - run: |
          git config user.name dogus-bot; git config user.email bot@remaxdogus.com.tr
          git add probe/out; git commit -m "probe out [skip ci]" && git push

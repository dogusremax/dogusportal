# GEÇİCİ (main'e alınmayacak): 2 Kasım Güneş HeyGen videosu. mod.txt: kontrol = yalnız bakiye, uret = tek render
name: Geçici 2 Kasım Güneş
on:
  push:
    branches: [claude/project-thread-q799gu]
    paths: [gecici-gunes/mod.txt]
permissions: { contents: write }
concurrency: { group: gecici-gunes, cancel-in-progress: false }
jobs:
  heygen:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get -qq update && sudo apt-get -qq install -y ffmpeg >/dev/null && pip -q install requests
      - run: python gecici-gunes/heygen3.py
        env: { HEYGEN_API_KEY: "${{ secrets.HEYGEN_API_KEY }}" }
      - if: always()
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add gecici-gunes && (git diff --cached --quiet || (git commit -qm "Geçici: 2 Kasım Güneş HeyGen çıktısı" && for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done))

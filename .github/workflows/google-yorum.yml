name: Google yorumları
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  yorum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/google-yorum.js
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
      - run: |
          git config user.name "dogus-bot"
          git config user.email "bot@dogusremax.com"
          git add data/google-yorumlar.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Google yorumları güncellendi" && git pull --rebase && git push)

name: Geçici Reels yayını (tek seferlik)
on:
  push:
    branches: [claude/project-thread-j96d19]
    paths: ['yayin/kibris-lansman-reels/istek.json']
permissions:
  contents: write
concurrency:
  group: gecici-reels-yayin
  cancel-in-progress: false
jobs:
  yayin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Güncel IG token'ı al
        run: |
          T=$(curl -sL "https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec?action=igToken&k=${{ secrets.PORTAL_ANAHTAR }}")
          if [ -z "$T" ] || [ "${#T}" -lt 50 ]; then T="${{ secrets.IG_TOKEN }}"; fi
          echo "::add-mask::$T"
          echo "IG_TOKEN=$T" >> $GITHUB_ENV
      - name: Reels + story paylaş
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DAL: ${{ github.ref_name }}
        run: node scripts/tek-reels-yayin.js yayin/kibris-lansman-reels
      - name: Sonucu kaydet
        if: always()
        run: |
          git config user.name dogus-bot; git config user.email bot@dogusremax.com
          git add yayin/kibris-lansman-reels/sonuc.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Reels yayın sonucu" && git push)

<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anket gönder</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f8;margin:0;padding:16px;color:#0b1f4b}.w{max-width:560px;margin:auto}.c{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}input[type=password]{width:100%;padding:12px;font-size:16px;border:1px solid #ccd;border-radius:10px;box-sizing:border-box}button{background:#DC1C2E;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%;margin-top:10px}label{display:flex;gap:10px;padding:8px 0;border-bottom:1px solid #eee}.s{font-size:13px;color:#667}.m{background:#f4f5f8;border-radius:10px;padding:10px;font-size:14px}</style></head><body><div class="w">
<div class="c"><b>Kıbrıs anketi gönderimi</b><div class="s">Yalnız Umut Bey. Ofis hattından, onaylı duyuru şablonuyla gider.</div><input id="pin" type="password" placeholder="Danışman Takip PIN"><button id="gir">Listeyi göster</button><div id="h" class="s" style="color:#DC1C2E"></div></div>
<div id="a" style="display:none"><div class="c"><b>Gidecek metin</b><div class="m" id="mt"></div><div class="s">Başında "Merhaba [ad]," sonunda "RE/MAX Doğuş Otomatik Bilgilendirme Mesajı" yer alır.</div></div><div class="c"><b>Lansmana gelenler</b><div id="ls"></div><button id="gn">Seçilenlere gönder</button><div id="so" class="s"></div></div></div></div>
<script>var S='https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec';
var $=function(i){return document.getElementById(i)};$('pin').value=localStorage.getItem('kb_pin')||'';
function ist(g){g.action='lansman';g.pin=$('pin').value.trim();return fetch(S,{method:'POST',redirect:'follow',body:JSON.stringify(g)}).then(function(r){return r.text()}).then(function(t){try{return JSON.parse(t)}catch(e){return{ok:false,error:'Bağlanılamadı'}}}).catch(function(){return{ok:false,error:'Bağlantı hatası'}})}
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
$('gir').onclick=function(){ist({islem:'anketListe'}).then(function(r){if(!r.ok){$('h').textContent=r.error;return}localStorage.setItem('kb_pin',$('pin').value.trim());$('h').textContent='';$('a').style.display='';$('mt').textContent=r.metin.replace('{link}','[kişiye özel bağlantı]');
$('ls').innerHTML=r.alicilar.map(function(x){return '<label><input type="checkbox" value="'+esc(x.k)+'"'+(x.telefonVar?' checked':' disabled')+'><span>'+esc(x.ad)+'<div class="s">'+esc(x.danisman)+(x.telefonVar?'':' · telefon yok')+'</div></span></label>'}).join('')})};
$('gn').onclick=function(){var k=[].map.call(document.querySelectorAll('#ls input:checked'),function(e){return e.value});if(!k.length)return;if(!confirm(k.length+' kişiye anket gönderilsin mi?'))return;$('gn').disabled=true;
ist({islem:'anketGonder',kisiler:k}).then(function(r){$('gn').disabled=false;$('so').textContent=r.ok?r.sonuclar.map(function(x){return x.ad+': '+(x.ok?(x.not||'gönderildi'):'olmadı ('+x.hata+')')}).join(' | '):r.error})};</script></body></html>

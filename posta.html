<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="robots" content="noindex, nofollow">
<title>Doğuş Posta</title>
<link rel="apple-touch-icon" href="assets/app-ikon-180.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0b0f2a;--kart:#111738;--kart2:#161c44;--cizgi:rgba(255,255,255,.08);--soluk:rgba(255,255,255,.55);--red:#DC1C2E;--coral:#FB5160}
  *{box-sizing:border-box;margin:0;padding:0}
  [hidden]{display:none!important}
  html,body{height:100%}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:#fff;overflow:hidden}
  button{font:700 14px 'Plus Jakarta Sans',sans-serif;border:0;border-radius:10px;padding:10px 15px;cursor:pointer;background:var(--red);color:#fff}
  button:disabled{opacity:.45;cursor:default}
  button.ghost{background:rgba(255,255,255,.08);color:#fff}
  button.ghost:hover{background:rgba(255,255,255,.14)}
  input,select{font:500 14px 'Plus Jakarta Sans',sans-serif;background:var(--bg);color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:10px;padding:10px 12px;outline:none}
  input:focus,select:focus{border-color:var(--coral)}
  .durum{font-size:13px;color:var(--soluk)}
  .durum.hata{color:#ff8a95}

  /* Giriş ve kurulum */
  #giris,#kurulum{max-width:380px;margin:70px auto;display:flex;flex-direction:column;gap:12px;padding:0 16px;text-align:center}
  #giris img,#kurulum img{height:38px;margin:0 auto 6px}
  #giris{max-width:460px}
  .kimler{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
  .kimler button{display:flex;align-items:center;gap:7px;background:#161c44;border:2px solid transparent;border-radius:30px;padding:3px 12px 3px 3px;font-size:12px;font-weight:600}
  .kimler button img{width:30px;height:30px;border-radius:50%}
  .kimler button.on{border-color:var(--red);background:#1d2557}
  #giris input{font:700 24px 'Plus Jakarta Sans',sans-serif;text-align:center;letter-spacing:8px;padding:12px}
  #kurulum{text-align:left}
  #kurulum label{font-size:12px;font-weight:700;color:var(--soluk);text-transform:uppercase;letter-spacing:.4px;margin-bottom:-6px}
  #kurulum h1{font-size:20px;text-align:center}
  #kurulum p.durum{text-align:center}

  /* Ana yerleşim */
  #ana{display:grid;grid-template-columns:210px 380px 1fr;height:100vh;height:100dvh;box-sizing:border-box;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .yan{border-right:1px solid var(--cizgi);display:flex;flex-direction:column;padding:14px 10px;gap:4px;overflow:auto;min-height:0;-webkit-overflow-scrolling:touch}
  .yan .logo{display:flex;align-items:center;gap:8px;padding:2px 8px 14px}
  .yan .logo img{height:26px}
  .yan .logo b{font-size:14px}
  .yaz{margin:0 0 12px;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
  .klasor{display:flex;align-items:center;gap:10px;background:transparent;font-weight:600;padding:9px 10px;border-radius:9px;text-align:left;color:rgba(255,255,255,.8)}
  .klasor:hover{background:rgba(255,255,255,.06)}
  .klasor.on{background:var(--kart2);color:#fff}
  .klasor svg{width:18px;height:18px;flex:none}
  .klasor .say{margin-left:auto;font-size:12px;background:var(--red);border-radius:20px;padding:1px 8px}
  .klasor .say:empty,.klasor .top:empty{display:none}
  .klasor .top{font-size:12px;color:var(--soluk);font-weight:600;margin-left:auto}
  .klasor .say+.top{margin-left:6px}
  .klasor .say:empty+.top{margin-left:auto}
  .yan .alt{margin-top:auto;display:flex;flex-direction:column;gap:4px;padding-top:12px;border-top:1px solid var(--cizgi)}
  .yan .hesap{font-size:12px;color:var(--soluk);padding:6px 10px;word-break:break-all}

  .liste{border-right:1px solid var(--cizgi);display:flex;flex-direction:column;min-width:0;min-height:0}
  .liste .ust{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--cizgi);align-items:center}
  .liste .ust input{flex:1;min-width:0}
  .liste .ust .geri{display:none}
  #mesajlar{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .m,.klasor,.tumSec,.secbar button,.okuma .ust button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  .m{display:block;width:100%;text-align:left;background:transparent;border-radius:0;border-bottom:1px solid var(--cizgi);padding:12px 14px;font-weight:500;color:#fff;position:relative}
  .m:hover{background:rgba(255,255,255,.04)}
  .m.on{background:var(--kart2)}
  .m .s1{display:flex;gap:8px;align-items:baseline}
  .m{padding-left:42px}
  .m .kutu{position:absolute;left:12px;top:14px;width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:13px;line-height:1}
  .m .kutu:hover{border-color:var(--coral)}
  .m.secili{background:rgba(220,28,46,.14)}
  .m.secili .kutu{background:var(--red);border-color:var(--red)}
  .m.yeni:before{left:4px;top:22px}
  .secbar{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--cizgi);background:var(--kart2);flex-wrap:wrap}
  .secbar b{flex:1;font-size:14px}
  .tumSec{display:flex;align-items:center;gap:10px;width:100%;background:transparent;border-radius:0;border-bottom:1px solid var(--cizgi);padding:9px 12px;font-size:13px;font-weight:600;color:var(--soluk);text-align:left}
  .tumSec .kutu{width:20px;height:20px;border-radius:6px;border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:13px;color:#fff}
  .tumSec.on .kutu{background:var(--red);border-color:var(--red)}
  .tumSec:hover{color:#fff}
  .copBosalt{display:block;width:calc(100% - 24px);margin:10px 12px;background:transparent;border:1px solid rgba(220,28,46,.6);color:#ff8a95;font-size:13px;padding:9px}
  .copBosalt:hover{background:rgba(220,28,46,.15)}
  .secbar button{padding:8px 12px;font-size:13px}
  .silBtn{background:var(--red)!important}
  .m .kim{flex:1;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.85)}
  .m .tar{font-size:12px;color:var(--soluk);flex:none}
  .m .konu{font-size:13px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:rgba(255,255,255,.85)}
  .m .oz{font-size:12px;margin-top:2px;color:var(--soluk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .m.yeni .kim,.m.yeni .konu{font-weight:800;color:#fff}
  .m.yeni:before{content:'';position:absolute;left:4px;top:18px;width:6px;height:6px;border-radius:50%;background:var(--coral)}
  .m .isaret{font-size:12px;margin-left:4px}
  .bos{padding:40px 20px;text-align:center;color:var(--soluk);font-size:14px}
  .daha{margin:12px auto;display:block}

  .okuma{display:flex;flex-direction:column;min-width:0;min-height:0;background:#0d1233}
  #okumaIc{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .okuma .ust{position:sticky;top:0;z-index:2;background:#0d1233}
  .okuma .ust{display:flex;gap:6px;padding:10px 12px;border-bottom:1px solid var(--cizgi);flex-wrap:wrap;align-items:center}
  .okuma .ust .geri{display:none}
  .okuma .ust button{padding:8px 12px;font-size:13px}
  .okuma .bilgi{padding:16px 20px 10px}
  .okuma h2{font-size:19px;line-height:1.3;margin-bottom:10px;word-break:break-word}
  .okuma .kisi{font-size:13px;color:var(--soluk);line-height:1.6;word-break:break-word}
  .okuma .kisi b{color:#fff}
  .ekler{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 10px}
  .ek{background:var(--kart2);font-weight:600;font-size:12px;padding:7px 10px;display:flex;gap:6px;align-items:center;max-width:260px}
  .ek span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #govde{display:block;border:0;background:#fff;width:100%;min-height:300px;margin:0;border-radius:0;flex:none}
  .govdeZemin{background:#fff;flex:1 0 auto}
  .okuma .yer{flex:1;display:flex;align-items:center;justify-content:center;color:var(--soluk);font-size:14px;flex-direction:column;gap:10px}
  .okuma .yer svg{width:54px;height:54px;opacity:.3}

  /* Yazma penceresi */
  #yazPen{position:fixed;inset:0;background:rgba(3,6,25,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .pen{background:var(--kart);border:1px solid var(--cizgi);border-radius:16px;width:min(860px,100%);max-height:100%;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  .pen .bas{display:flex;align-items:center;padding:12px 16px;border-bottom:1px solid var(--cizgi);gap:10px}
  .pen .bas b{flex:1;font-size:15px}
  .alan{display:flex;align-items:center;border-bottom:1px solid var(--cizgi);padding:0 16px}
  .alan span{font-size:13px;color:var(--soluk);width:56px;flex:none}
  .alan input{border:0;background:transparent;padding:11px 0;flex:1;border-radius:0}
  .alan .kucuk{background:transparent;color:var(--soluk);font-size:12px;padding:6px 8px}
  .arac{display:flex;gap:4px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--cizgi);align-items:center;position:relative}
  .arac button{background:transparent;color:#fff;font-size:14px;padding:6px 9px;min-width:34px;border-radius:7px}
  .arac button:hover{background:rgba(255,255,255,.08)}
  .arac button.on{background:var(--red)}
  .arac select{padding:6px 8px;font-size:13px;border-radius:7px;max-width:150px}
  .arac .ayrac{width:1px;height:22px;background:var(--cizgi);margin:0 4px}
  .arac input[type=color]{width:0;height:0;padding:0;border:0;opacity:0;position:absolute}
  .renk{position:relative}
  .renk i{position:absolute;left:8px;right:8px;bottom:3px;height:3px;border-radius:2px;background:var(--r,#DC1C2E)}
  .editor{flex:1;min-height:260px;overflow:auto;background:#fff;color:#111;padding:16px 18px;outline:none;font:14px Arial,Helvetica,sans-serif;line-height:1.5;word-wrap:break-word}
  .editor:empty:before{content:attr(data-ph);color:#999}
  .editor blockquote{border-left:3px solid #ccc;margin:8px 0;padding-left:12px;color:#555}
  .editor img{max-width:100%}
  .imzaKutu{border-top:1px dashed #ccc;margin-top:16px;padding-top:8px}
  .emojiler{display:none;position:absolute;top:100%;left:8px;z-index:5;width:min(360px,calc(100vw - 48px));max-height:260px;overflow:auto;grid-template-columns:repeat(8,1fr);gap:2px;background:var(--kart2);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.4)}
  .emojiler.acik{display:grid}
  .emojiler button{font-size:22px;padding:4px;min-width:0}
  .emojiler .bk{grid-column:1/-1;font-size:11px;color:var(--soluk);font-weight:700;text-transform:uppercase;padding:6px 2px 2px}
  .pen .son{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--cizgi);flex-wrap:wrap}
  .pen .son .durum{flex:1}
  .eklist{display:flex;flex-wrap:wrap;gap:6px;padding:8px 16px 0}
  .eklist:empty{display:none}
  .eklist .ek button{background:transparent;padding:0 2px;color:var(--soluk)}
  .imzaSec{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--soluk)}
  .imzaSec input{accent-color:var(--red);width:16px;height:16px}

  /* Ayarlar */
  #ayarPen .pen{width:min(720px,100%)}
  #ayarPen .ic{padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
  #ayarPen label{font-size:12px;font-weight:700;color:var(--soluk);text-transform:uppercase;letter-spacing:.4px}
  #ayarPen .editor{min-height:160px;border-radius:0 0 10px 10px}
  #ayarPen .imzaCerceve{border:1px solid rgba(255,255,255,.15);border-radius:10px;overflow:hidden}
  #ayarPen{position:fixed;inset:0;background:rgba(3,6,25,.65);display:flex;align-items:center;justify-content:center;z-index:30;padding:16px}

  .bildirim{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1d2557;border:1px solid rgba(255,255,255,.15);padding:11px 18px;border-radius:12px;font-size:14px;z-index:50;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw}

  @media (max-width:1100px){#ana{grid-template-columns:190px 320px 1fr}}
  @media (max-width:820px){
    #ana{grid-template-columns:1fr;position:relative}
    .yan{display:none}
    #ana.menu .yan{display:flex;position:absolute;inset:0 30% 0 0;background:var(--kart);z-index:10;box-shadow:10px 0 40px rgba(0,0,0,.5)}
    .liste .ust .geri,.okuma .ust .geri{display:inline-flex}
    .okuma{display:none}
    #ana.oku .liste{display:none}
    #ana.oku .okuma{display:flex}
    #yazPen,#ayarPen{padding:0}
    .pen{border-radius:0;height:100%;width:100%}
    .alan span{width:48px}
    .okuma .ust{gap:4px;flex-wrap:wrap}
    .okuma .ust button{padding:7px 10px;font-size:12px;white-space:nowrap;flex:none}
  }
</style>
<script src="assets/broker.js"></script>
<script src="assets/imza.js?v=3"></script>
</head>
<body>

<div id="giris" hidden>
  <img src="assets/dogus-logo.png" alt="">
  <p class="durum">Doğuş Posta</p>
  <div class="kimler" id="kimler"></div>
  <p class="durum" id="pinEtiket">PIN'in</p>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button id="girBtn">Giriş</button>
  <p id="girisHata" class="durum hata"></p>
</div>

<div id="kurulum" hidden>
  <img src="assets/dogus-logo.png" alt="">
  <h1>Posta hesabını bağla</h1>
  <p class="durum">Bir kez yapılır. Şifre yalnız bizim sunucuda saklanır, bu sayfaya bir daha gelmez.</p>
  <label>E-posta adresi</label>
  <input id="kAdres" type="email" placeholder="ad@remaxdogus.com.tr" autocomplete="username">
  <label>Şifre</label>
  <input id="kSifre" type="password" autocomplete="current-password" placeholder="Webmail şifren">
  <label>Gönderen adı</label>
  <input id="kAd" type="text">
  <button id="kBtn">Bağlan</button>
  <p id="kDurum" class="durum"></p>
</div>

<div id="ana" hidden>
  <aside class="yan">
    <div class="logo"><img src="assets/dogus-logo.png" alt=""><b>Posta</b></div>
    <button class="yaz" onclick="yeniMesaj()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>Yeni posta</button>
    <button class="klasor on" data-k="gelen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 01-2 2H4a2 2 0 01-2-2v-6z"/></svg>Gelen Kutusu<span class="say"></span><span class="top"></span></button>
    <button class="klasor" data-k="giden"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4z"/></svg>Gönderilenler<span class="say"></span><span class="top"></span></button>
    <button class="klasor" data-k="taslak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></svg>Taslaklar<span class="say"></span><span class="top"></span></button>
    <button class="klasor" data-k="istenmeyen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.9 4.9l14.2 14.2"/></svg>İstenmeyen<span class="say"></span><span class="top"></span></button>
    <button class="klasor" data-k="cop"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>Çöp<span class="say"></span><span class="top"></span></button>
    <div class="alt">
      <button class="klasor" onclick="ayarAc()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>İmza ve ayarlar</button>
      <div class="hesap" id="hesap"></div>
      <button class="klasor" onclick="if(confirm('Bu cihazda Doğuş Posta\'dan çıkılsın mı?'))cikis('',true)">⎋ Çıkış</button>
    </div>
  </aside>

  <section class="liste">
    <div class="ust">
      <button class="ghost geri" onclick="$('ana').classList.add('menu')" title="Klasörler">☰</button>
      <input id="ara" type="search" placeholder="Postalarda ara">
      <button class="ghost" id="yenileBtn" title="Yenile" onclick="listeYukle(true)">↻</button>
      <button class="geri" onclick="yeniMesaj()" title="Yeni posta">✎</button>
    </div>
    <div class="secbar" id="secbar" hidden>
      <b id="secSay"></b>
      <button class="ghost" id="klasorSec" hidden onclick="TUM_KLASOR=!TUM_KLASOR;ciz()"></button>
      <button class="silBtn" id="secSil" onclick="secilenleriSil()">🗑 Sil</button>
      <button class="ghost" onclick="secilenleriOkundu()">Okundu</button>
      <button class="ghost" onclick="SECILENLER.clear();TUM_KLASOR=false;ciz()">Vazgeç</button>
    </div>
    <div id="mesajlar"><div class="bos">Postalar yükleniyor…</div></div>
  </section>

  <section class="okuma" id="okuma">
    <div class="yer" id="okumaBos"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>Okumak için bir posta seç</div>
    <div id="okumaIc" hidden style="display:flex;flex-direction:column;flex:1;min-height:0">
      <div class="ust">
        <button class="ghost geri" onclick="$('ana').classList.remove('oku')">‹ Geri</button>
        <button onclick="yanitla('r')">Yanıtla</button>
        <button class="ghost" onclick="yanitla('a')">Tümünü yanıtla</button>
        <button class="ghost" onclick="yanitla('w')">İlet</button>
        <button class="ghost" id="yildizBtn" onclick="yildiz()" title="Yıldızla">☆</button>
        <button class="ghost" onclick="okunmadi()" title="Okunmadı yap">●</button>
        <button class="silBtn" id="copBtn" onclick="cope()" title="Sil (Delete)">🗑 Sil</button>
      </div>
      <div class="bilgi">
        <h2 id="oKonu"></h2>
        <div class="kisi" id="oKisi"></div>
      </div>
      <div class="ekler" id="oEkler"></div>
      <div class="govdeZemin"><iframe id="govde" scrolling="no" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin" referrerpolicy="no-referrer"></iframe></div>
    </div>
  </section>
</div>

<!-- Yazma -->
<div id="yazPen" hidden>
  <div class="pen">
    <div class="bas"><b id="yazBaslik">Yeni posta</b><button class="ghost" onclick="yazKapat()">✕</button></div>
    <div class="alan"><span>Kime</span><input id="yKime" type="text" autocomplete="email" placeholder="ad@ornek.com, ..."><button class="kucuk" id="bilgiAc" onclick="this.hidden=true;$('bilgiSatir').hidden=false;$('gizliSatir').hidden=false;$('yBilgi').focus()">Bilgi / Gizli</button></div>
    <div class="alan" id="bilgiSatir" hidden><span>Bilgi</span><input id="yBilgi" type="text"></div>
    <div class="alan" id="gizliSatir" hidden><span>Gizli</span><input id="yGizli" type="text"></div>
    <div class="alan"><span>Konu</span><input id="yKonu" type="text"></div>
    <div class="arac" data-ed="yEditor"></div>
    <div class="editor" id="yEditor" contenteditable="true" data-ph="Mesajını yaz…"></div>
    <div class="eklist" id="yEkler"></div>
    <div class="son">
      <button id="gonderBtn" onclick="gonder()">Gönder</button>
      <label class="ghost" style="cursor:pointer;font-weight:700;font-size:14px;padding:10px 14px;border-radius:10px;background:rgba(255,255,255,.08)">📎 Dosya ekle<input type="file" multiple hidden onchange="dosyaEkle(this)"></label>
      <label class="imzaSec"><input type="checkbox" id="imzaVar" checked onchange="imzaGuncelle()">İmza</label>
      <span class="durum" id="yDurum"></span>
    </div>
  </div>
</div>

<!-- Ayarlar -->
<div id="ayarPen" hidden>
  <div class="pen">
    <div class="bas"><b>İmza ve ayarlar</b><button class="ghost" onclick="$('ayarPen').hidden=true">✕</button></div>
    <div class="ic">
      <label>Gönderen adı</label>
      <input id="aAd" type="text">
      <label>İmza</label>
      <div class="imzaCerceve">
        <div class="arac" data-ed="aImza" data-imza="1"></div>
        <div class="editor" id="aImza" contenteditable="true" data-ph="Örn. Umut Tokkuş · Broker · RE/MAX Doğuş · 0216 315 15 15"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button onclick="imzaKaydet()">Kaydet</button>
        <button class="ghost" onclick="imzaHazir()">Hazır imza</button>
        <span class="durum" id="aDurum" style="align-self:center"></span>
      </div>

        <input id="aSifre" type="password" placeholder="Yeni şifre (şifreyi değiştirdiysen)" style="flex:1;min-width:200px" autocomplete="new-password">
        <button class="ghost" onclick="sifreGuncelle()">Şifreyi güncelle</button>
      </div>
      <button class="ghost" style="margin-top:14px;align-self:flex-start" onclick="if(confirm('Bu cihazda Doğuş Posta\'dan çıkılsın mı? Tekrar girerken PIN sorulur.'))cikis('',true)">⎋ Çıkış yap</button>
    </div>
  </div>
</div>

<script>
// dogus-whatsapp-service (Eposta.js) — şifre sunucuda, sayfa yalnız PIN taşır
const SERVIS = "https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec";
const $ = id => document.getElementById(id);
const depo = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) { return null; } };
const kac = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let HESAP = {}, KLASOR = 'gelen', MESAJLAR = [], SECILI = null, ACIK = null, YAZ = null, EKLER = [], SONKONTROL = 0, ILK = true;
// Hız: klasör listeleri bu cihazda önbellekte (anında görünür, arkada tazelenir); açılan postalar bellekte
let ONBELLEK = {}, OTURUM = depo('posta_oturum') || '', KIM = depo('posta_kim') || '';
function onbellekOku() { try { ONBELLEK = JSON.parse(depo('posta_onbellek_' + KIM) || '{}') || {}; } catch (e) { ONBELLEK = {}; } }
onbellekOku(); depo('posta_onbellek', null);
const MSJ = new Map();
function onbellekYaz() { try { depo('posta_onbellek_' + KIM, JSON.stringify(ONBELLEK)); } catch (e) {} }
function msjSakla(m) { MSJ.set(m.id, m); if (MSJ.size > 60) MSJ.delete(MSJ.keys().next().value); }

async function servis(veri, sure) {
  const ac = new AbortController(), z = setTimeout(() => ac.abort(), sure || 90000);
  try {
    const r = await fetch(SERVIS + '?cb=' + Date.now(), { method: 'POST', redirect: 'follow', signal: ac.signal,
      body: JSON.stringify(Object.assign({ action: 'eposta', oturum: OTURUM }, veri)) });
    const j = JSON.parse(await r.text());
    if (j && j.error === 'OTURUM_YOK' && veri.islem !== 'giris') { cikis('Oturum süresi doldu, tekrar giriş yap.'); }
    return j;
  } catch (e) {
    throw new Error(e.name === 'AbortError' ? 'Sunucu yanıt vermedi, tekrar dene.' : e.message);
  } finally { clearTimeout(z); }
}

function bildir(m, sure) {
  const b = document.createElement('div'); b.className = 'bildirim'; b.textContent = m; document.body.appendChild(b);
  setTimeout(() => b.remove(), sure || 3000);
}

// ── Giriş ────────────────────────────────────────────────
// Kim giriyor: fotoğraflı kişi listesi (assets/imza.js), son seçilen hatırlanır
let SECILEN_KIM = KIM || depo('posta_son_kim') || 'umut';
function kimlerCiz() {
  $('kimler').innerHTML = IMZA_KISILER.map(k => '<button class="' + (k.id === SECILEN_KIM ? 'on' : '') + '" data-id="' + k.id + '"><img src="assets/imza/' + k.id + '.png" alt="">' + k.ad.split(' ')[0] + '</button>').join('');
  $('kimler').querySelectorAll('button').forEach(b => b.onclick = () => { SECILEN_KIM = b.dataset.id; depo('posta_son_kim', SECILEN_KIM); kimlerCiz(); $('pin').focus(); });
  const k = IMZA_KISILER.find(x => x.id === SECILEN_KIM);
  $('pinEtiket').textContent = k ? k.ad + ' · ' + (k.unvan === 'Broker' ? 'broker PIN\'in' : 'Danışman Takip PIN\'in') : 'PIN\'in';
}
kimlerCiz();

function oturumAc(j) {
  OTURUM = j.oturum; KIM = j.kim; depo('posta_oturum', OTURUM); depo('posta_kim', KIM); depo('posta_pin', null);
  HESAP = j; hesapSakla(); onbellekOku();
  $('giris').hidden = true;
  if (!j.kurulu) { kurulumAc(); return; }
  anaAc();
}
function kurulumAc() {
  $('ana').hidden = true; $('kurulum').hidden = false;
  $('kAdres').value = HESAP.adres || ''; $('kAd').value = HESAP.ad || '';
  ($('kAdres').value ? $('kSifre') : $('kAdres')).focus();
}
async function giris(p, kim) {
  $('girisHata').textContent = 'Kontrol ediliyor…'; $('girBtn').disabled = true;
  const yavas = setTimeout(() => { $('girisHata').textContent = 'Kontrol ediliyor… sunucu bazen 20-30 sn sürebiliyor.'; }, 5000);
  try {
    const j = await servis({ islem: 'giris', kim: kim || SECILEN_KIM, pin: p }, 60000);
    if (!j.ok) { $('girisHata').textContent = j.error || 'Giriş başarısız'; $('pin').value = ''; return false; }
    $('girisHata').textContent = ''; oturumAc(j); return true;
  } catch (e) { $('girisHata').textContent = 'Servise ulaşılamadı: ' + e.message; return false; }
  finally { clearTimeout(yavas); $('girBtn').disabled = false; }
}
$('girBtn').onclick = () => giris($('pin').value.trim());
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') $('girBtn').click(); });

$('kBtn').onclick = async () => {
  const d = $('kDurum'); d.className = 'durum'; d.textContent = 'Posta sunucusuna bağlanılıyor…'; $('kBtn').disabled = true;
  try {
    const j = await servis({ islem: 'ayarla', adres: $('kAdres').value.trim(), sifre: $('kSifre').value, ad: $('kAd').value.trim() });
    if (!j.ok) { d.className = 'durum hata'; d.textContent = j.error; return; }
    HESAP = j; hesapSakla(); $('kSifre').value = ''; $('kurulum').hidden = true; anaAc(); bildir('Hesap bağlandı');
  } catch (e) { d.className = 'durum hata'; d.textContent = e.message; }
  finally { $('kBtn').disabled = false; }
};
$('kSifre').addEventListener('keydown', e => { if (e.key === 'Enter') $('kBtn').click(); });

function anaAc() {
  $('ana').hidden = false; $('hesap').textContent = HESAP.adres;
  imzaGecir();
  if (ONBELLEK.gelen) { MESAJLAR = Object.assign(ONBELLEK.gelen.mesajlar.slice(), { dahaVar: ONBELLEK.gelen.dahaVar }); sayilar(ONBELLEK.sayilar); ciz(); }
  hepsiYukle();
  if (!window.YOKLAMA) {   // yeni posta: sayfa açıkken 30 sn'de bir, sekmeye dönünce hemen
    window.YOKLAMA = setInterval(() => { if (!document.hidden && OTURUM) listeYukle(false, true); }, 30000);
    document.addEventListener('visibilitychange', () => { if (!document.hidden && OTURUM && Date.now() - SONKONTROL > 10000) listeYukle(false, true); });
  }
}

// ── Liste ────────────────────────────────────────────────
async function hepsiYukle() {
  try {
    const j = await servis({ islem: 'hepsi', limit: 40 });
    if (!j.ok) throw new Error(j.error);
    Object.keys(j.klasorListeleri || {}).forEach(k => { ONBELLEK[k] = j.klasorListeleri[k]; });
    ONBELLEK.sayilar = j.klasorler; onbellekYaz();
    sayilar(j.klasorler);
    if (!$('ara').value.trim() && ONBELLEK[KLASOR]) { listeyiKoy(ONBELLEK[KLASOR], false); }
    ILK = false; SONKONTROL = Date.now();
    onYukle();
  } catch (e) { listeYukle(); }
}
function listeyiKoy(v, daha) {
  setTimeout(() => onYukle(), 0);
  const eskiIdler = new Set(MESAJLAR.map(m => m.id));
  const yeniler = (!ILK && KLASOR === 'gelen' && !daha) ? v.mesajlar.filter(m => !eskiIdler.has(m.id) && m.okunmamis) : [];
  MESAJLAR = daha ? MESAJLAR.concat(v.mesajlar) : v.mesajlar.slice();
  MESAJLAR.dahaVar = v.dahaVar; ciz();
  return yeniler;
}
// Listedeki postalar arkada, 10'arlı tek çağrılarla önceden alınır (okundu işaretlenmez) → tıklayınca anında açılır
let onYukleniyor = false, onKuyruk = [];
function onYukle(ids) {
  const liste = ids || MESAJLAR.slice(0, 20).map(m => m.id);
  liste.forEach(id => { if (!MSJ.has(id) && !onKuyruk.includes(id)) onKuyruk.push(id); });
  onCalis();
}
async function onCalis() {
  if (onYukleniyor) return; onYukleniyor = true;
  try {
    while (onKuyruk.length && !document.hidden) {
      const paket = onKuyruk.splice(0, 10).filter(id => !MSJ.has(id));
      if (!paket.length) continue;
      const j = await servis({ islem: 'okuToplu', ids: paket }).catch(() => null);
      if (!j || !j.ok) break;
      j.mesajlar.forEach(msjSakla);
    }
  } finally { onYukleniyor = false; }
}
document.querySelectorAll('.klasor[data-k]').forEach(b => b.onclick = () => {
  document.querySelectorAll('.klasor[data-k]').forEach(x => x.classList.toggle('on', x === b));
  KLASOR = b.dataset.k; $('ara').value = ''; MESAJLAR = []; $('ana').classList.remove('menu', 'oku');
  if (ONBELLEK[KLASOR]) { listeyiKoy(ONBELLEK[KLASOR], false); listeYukle(false, true); }
  else { $('mesajlar').innerHTML = '<div class="bos">Yükleniyor…</div>'; listeYukle(true); }
});
let araZ; $('ara').addEventListener('input', () => { clearTimeout(araZ); araZ = setTimeout(() => listeYukle(true), 450); });

async function listeYukle(elle, sessiz, daha) {
  SONKONTROL = Date.now();
  const kl = KLASOR, ara = $('ara').value.trim();
  if (elle) $('yenileBtn').textContent = '…';
  try {
    const j = await servis({ islem: 'liste', klasor: kl, ara, offset: daha ? MESAJLAR.length : 0, limit: 40 });
    if (kl !== KLASOR || ara !== $('ara').value.trim()) return;   // bu arada klasör değişti
    if (!j.ok) {
      if (/KURULU_DEGIL/.test(j.error)) { $('ana').hidden = true; $('kurulum').hidden = false; return; }
      if (!sessiz) $('mesajlar').innerHTML = '<div class="bos">' + kac(j.error) + '</div>'; return;
    }
    const yeniler = listeyiKoy(j, daha);
    if (!ara && !daha) { ONBELLEK[kl] = { mesajlar: j.mesajlar, dahaVar: j.dahaVar }; }
    ONBELLEK.sayilar = j.klasorler; onbellekYaz();
    sayilar(j.klasorler);

    if (yeniler.length) bildir(yeniler.length === 1 ? 'Yeni posta: ' + (yeniler[0].kimden.ad || yeniler[0].kimden.adres) : yeniler.length + ' yeni posta');
    ILK = false;
  } catch (e) { if (!sessiz) $('mesajlar').innerHTML = '<div class="bos">' + kac(e.message) + '</div>'; }
  finally { $('yenileBtn').textContent = '↻'; }
}

// Kırmızı: okunmamış, gri: klasördeki toplam posta
let SAYI = null;
function sayilar(k) {
  if (!k) return;
  SAYI = JSON.parse(JSON.stringify(k));
  document.querySelectorAll('.klasor[data-k]').forEach(b => {
    const s = k[b.dataset.k] || {}, okn = Math.max(0, s.okunmamis || 0), top = Math.max(0, s.toplam || 0);
    b.querySelector('.say').textContent = (okn && b.dataset.k !== 'giden') ? okn.toLocaleString('tr-TR') : '';
    b.querySelector('.top').textContent = top ? top.toLocaleString('tr-TR') : '';
    b.title = top ? top + ' posta' + (okn ? ', ' + okn + ' okunmamış' : '') : '';
  });
  const g = k.gelen ? k.gelen.okunmamis : 0;
  document.title = (g ? '(' + g + ') ' : '') + 'Doğuş Posta';
}

function tarihYaz(ms) {
  const d = new Date(ms), b = new Date();
  if (d.toDateString() === b.toDateString()) return d.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
  const dun = new Date(b); dun.setDate(b.getDate() - 1);
  if (d.toDateString() === dun.toDateString()) return 'Dün';
  return d.toLocaleDateString('tr-TR', d.getFullYear() === b.getFullYear() ? { day: 'numeric', month: 'short' } : { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function ciz() {
  const el = $('mesajlar');
  if (!MESAJLAR.length) { el.innerHTML = '<div class="bos">' + ($('ara').value ? 'Sonuç yok' : 'Bu klasör boş') + '</div>'; $('secbar').hidden = true; return; }
  const giden = KLASOR === 'giden' || KLASOR === 'taslak';
  const hepsi = MESAJLAR.every(m => SECILENLER.has(m.id));
  el.innerHTML = (KLASOR === 'cop' ? '<button class="copBosalt" onclick="copBosalt()">🗑 Çöp kutusunu boşalt</button>' : '') + '<button class="tumSec' + (hepsi ? ' on' : '') + '" onclick="tumunuSec()"><span class="kutu">' + (hepsi ? '✓' : '') + '</span>' + (hepsi ? 'Seçimi kaldır' : 'Tümünü seç') + '</button>' + MESAJLAR.map(m => {
    const kisi = giden ? 'Kime: ' + (m.kime.map(k => k.ad || k.adres).join(', ') || '—') : (m.kimden.ad || m.kimden.adres || '—');
    return '<button class="m' + (m.okunmamis ? ' yeni' : '') + (m.id === SECILI ? ' on' : '') + (SECILENLER.has(m.id) ? ' secili' : '') + '" data-id="' + kac(m.id) + '">' +
      '<span class="kutu" title="Seç">' + (SECILENLER.has(m.id) ? '✓' : '') + '</span>' +
      '<div class="s1"><span class="kim">' + kac(kisi) + '</span><span class="tar">' + (m.ekli ? '📎 ' : '') + (m.yildiz ? '★ ' : '') + tarihYaz(m.tarih) + '</span></div>' +
      '<div class="konu">' + kac(m.konu || '(konu yok)') + '</div><div class="oz">' + kac(m.ozet) + '</div></button>';
  }).join('') + (MESAJLAR.dahaVar ? '<button class="ghost daha" onclick="listeYukle(false,false,true)">Daha fazla</button>' : '');
  el.querySelectorAll('.m').forEach(b => b.onclick = e => {
    if (e.target.closest('.kutu') || SECILENLER.size || e.metaKey || e.ctrlKey) return secDegistir(b.dataset.id);
    oku(b.dataset.id);
  });
  // Telefonda: postaya basılı tut → seç
  el.querySelectorAll('.m').forEach(b => {
    let z; b.addEventListener('touchstart', () => { z = setTimeout(() => { z = 'oldu'; secDegistir(b.dataset.id); }, 500); }, { passive: true });
    const bitir = e => { if (z === 'oldu') { e.preventDefault(); } else clearTimeout(z); z = null; };
    b.addEventListener('touchend', bitir); b.addEventListener('touchmove', () => { clearTimeout(z); z = null; }, { passive: true });
  });
  if (!hepsi) TUM_KLASOR = false;
  const toplam = (SAYI && SAYI[KLASOR] && SAYI[KLASOR].toplam) || 0, aramada = !!$('ara').value.trim();
  const fazlasiVar = hepsi && (MESAJLAR.dahaVar || toplam > MESAJLAR.length);
  $('secbar').hidden = !SECILENLER.size;
  $('secSay').textContent = TUM_KLASOR ? (aramada ? 'Aramaya uyan tüm postalar seçili' : 'Klasördeki tüm ' + toplam.toLocaleString('tr-TR') + ' posta seçili') : SECILENLER.size + ' posta seçili';
  $('klasorSec').hidden = !fazlasiVar;
  $('klasorSec').textContent = TUM_KLASOR ? 'Sadece bu ' + MESAJLAR.length : (aramada ? 'Aramaya uyan hepsini seç' : 'Klasördeki tüm ' + toplam.toLocaleString('tr-TR') + ' postayı seç');
  const geri = KLASOR === 'cop';
  $('secSil').textContent = geri ? '↩ Gelen Kutusu\'na al' : (hepsi ? '🗑 Tümünü sil' : '🗑 Sil');
  const sec = el.querySelector('.m.on'); if (sec) sec.scrollIntoView({ block: 'nearest' });
}

// ── Çoklu seçim ve silme ─────────────────────────────────
const SECILENLER = new Set();
let TUM_KLASOR = false;   // listede görünenler değil, klasördeki BÜTÜN postalar
function secDegistir(id) { SECILENLER.has(id) ? SECILENLER.delete(id) : SECILENLER.add(id); ciz(); }
function tumunuSec() { if (MESAJLAR.every(m => SECILENLER.has(m.id))) SECILENLER.clear(); else MESAJLAR.forEach(m => SECILENLER.add(m.id)); ciz(); }
function sayiOynat(kl, dToplam, dOkunmamis) {
  if (!SAYI || !SAYI[kl]) return;
  SAYI[kl].toplam = Math.max(0, (SAYI[kl].toplam || 0) + dToplam);
  SAYI[kl].okunmamis = Math.max(0, (SAYI[kl].okunmamis || 0) + dOkunmamis);
  ONBELLEK.sayilar = SAYI; sayilar(SAYI);
}
function listedenCikar(ids) {
  const s = new Set(ids);
  const giden = MESAJLAR.filter(x => s.has(x.id)), okn = giden.filter(x => x.okunmamis).length;
  sayiOynat(KLASOR, -giden.length, -okn);
  if (KLASOR !== 'cop') sayiOynat('cop', giden.length, okn); else sayiOynat('gelen', giden.length, okn);
  MESAJLAR = Object.assign(MESAJLAR.filter(x => !s.has(x.id)), { dahaVar: MESAJLAR.dahaVar });
  if (ONBELLEK[KLASOR]) { ONBELLEK[KLASOR].mesajlar = ONBELLEK[KLASOR].mesajlar.filter(x => !s.has(x.id)); onbellekYaz(); }
  delete ONBELLEK.cop;   // çöp listesi bir sonraki açılışta sunucudan gelsin
  if (ACIK && s.has(ACIK.id)) { SECILI = null; ACIK = null; $('okumaIc').hidden = true; $('okumaBos').hidden = false; $('okumaBos').lastChild.textContent = 'Okumak için bir posta seç'; $('ana').classList.remove('oku'); }
  ids.forEach(i => SECILENLER.delete(i));
  ciz();
}
async function copBosalt() {
  const n = (SAYI && SAYI.cop && SAYI.cop.toplam) || MESAJLAR.length;
  if (!confirm('Çöp kutusundaki ' + n.toLocaleString('tr-TR') + ' posta KALICI olarak silinecek. Geri alınamaz. Emin misin?')) return;
  SECILENLER.clear(); MESAJLAR = []; ciz();
  $('mesajlar').innerHTML = '<div class="bos">Çöp kutusu boşaltılıyor…</div>';
  try {
    const j = await servis({ islem: 'copBosalt' }, 120000);
    if (!j.ok) throw new Error(j.error);
    sayilar(j.klasorler); bildir('Çöp kutusu boşaltıldı');
  } catch (e) { bildir(e.message, 5000); }
  delete ONBELLEK.cop; onbellekYaz();
  if (KLASOR === 'cop') listeYukle(true);
}
async function klasoruTasi() {
  const geri = KLASOR === 'cop', kl = KLASOR, ara = $('ara').value.trim();
  const toplam = (SAYI && SAYI[kl] && SAYI[kl].toplam) || 0;
  if (!confirm((ara ? 'Aramaya uyan bütün postalar' : 'Klasördeki ' + toplam.toLocaleString('tr-TR') + ' postanın hepsi') + (geri ? ' Gelen Kutusu\'na alınsın mı?' : ' Çöp\'e taşınsın mı?'))) return;
  SECILENLER.clear(); TUM_KLASOR = false; MESAJLAR = []; ciz();
  $('mesajlar').innerHTML = '<div class="bos" id="topluDurum">Taşınıyor…</div>';
  let tasinan = 0;
  try {
    for (let tur = 0; tur < 40; tur++) {
      const j = await servis({ islem: 'toplu', klasor: kl, ara }, 120000);
      if (!j.ok) throw new Error(j.error);
      tasinan += j.tasinan; sayilar(j.klasorler);
      const d = $('topluDurum'); if (d) d.textContent = tasinan.toLocaleString('tr-TR') + ' posta taşındı…';
      if (!j.kalan) break;

let okuZ;
document.addEventListener('keydown', e => {
  if ($('ana').hidden || !$('yazPen').hidden || !$('ayarPen').hidden) return;
  const h = e.target; if (h.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(h.tagName)) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!MESAJLAR.length) return;
    e.preventDefault();
    const i = MESAJLAR.findIndex(m => m.id === SECILI);
    const y = i < 0 ? 0 : Math.max(0, Math.min(MESAJLAR.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)));
    if (y === i) return;
    const id = MESAJLAR[y].id;
    SECILI = id; ciz();
    clearTimeout(okuZ); okuZ = setTimeout(() => oku(id), MSJ.has(id) ? 0 : 180);   // hızlı basışta her postayı sunucudan çekme
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (SECILENLER.size) { e.preventDefault(); secilenleriSil(); } else if (ACIK) { e.preventDefault(); cope(); }
  } else if (e.key === 'Escape' && SECILENLER.size) { SECILENLER.clear(); ciz(); }
  else if (e.key === 'Enter' && SECILI && !ACIK) oku(SECILI);
});

// Posta gövdesi iframe'de kendi yüksekliği kadar açılır, okuma alanı tek parça kayar (iPhone'da iç içe kaydırma takılıyordu);
// telefona sığmayan geniş postalar ekrana sığacak kadar küçültülür
function govdeBoyutla() {
  const f = $('govde'); let d;
  try { d = f.contentDocument; } catch (e) { return; }
  if (!d || !d.body) return;
  const g = f.clientWidth, w = d.documentElement.scrollWidth;
  if (w > g + 4 && !d.body.dataset.olcek) { d.body.dataset.olcek = 1; d.body.style.zoom = (g / w).toFixed(3); }
  f.style.height = Math.max(300, Math.ceil(d.documentElement.scrollHeight) + 8) + 'px';
}
$('govde').addEventListener('load', () => {
  govdeBoyutla();
  try {
    const d = $('govde').contentDocument;
    d.querySelectorAll('img').forEach(i => i.addEventListener('load', govdeBoyutla));
    // Safari (Mac) kaydırmayan iframe'deki tekerleği dışarı aktarmıyor: biz aktarıyoruz
    d.addEventListener('wheel', e => {
      if (e.ctrlKey) return;   // yakınlaştırma hareketi
      const k = e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? $('okumaIc').clientHeight : 1;
      $('okumaIc').scrollBy({ top: e.deltaY * k, left: 0, behavior: 'instant' });
      e.preventDefault();
    }, { passive: false });
    d.addEventListener('keydown', e => { if (/^(ArrowUp|ArrowDown|Delete|Backspace)$/.test(e.key)) { e.preventDefault(); document.dispatchEvent(new KeyboardEvent('keydown', { key: e.key })); } });
  } catch (e) {}
  setTimeout(govdeBoyutla, 600); setTimeout(govdeBoyutla, 2000);
});
window.addEventListener('resize', () => { try { delete $('govde').contentDocument.body.dataset.olcek; $('govde').contentDocument.body.style.zoom = ''; } catch (e) {} govdeBoyutla(); });

function boyut(b) { return b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB'; }

async function ekIndir(e, b) {
  const eski = b.innerHTML; b.disabled = true; b.innerHTML = 'İndiriliyor…';
  try {
    const j = await servis({ islem: 'ek', id: ACIK.id, parca: e.parca, ad: e.ad });
    if (!j.ok) return bildir(j.error, 5000);
    const bayt = Uint8Array.from(atob(j.veri), c => c.charCodeAt(0));

}

  }
  const cevap = m.yanitAdresi || m.kimden;
  let kime = [cevap], bilgi = [];
  if (m.kimden.adres && m.kimden.adres.toLowerCase() === ben && m.kime.length) kime = m.kime; // kendi gönderdiğime yanıt
  if (tur === 'a') {
    const hepsi = m.kime.concat(m.bilgi).filter(k => k.adres && k.adres.toLowerCase() !== ben && !kime.some(x => x.adres.toLowerCase() === k.adres.toLowerCase()));
    bilgi = hepsi;
  }
  const ust = '<br><div>' + kac(tarih) + ' tarihinde ' + kisiYaz(m.kimden) + ' şunu yazdı:</div>';
  yazAc(tur === 'a' ? 'Tümünü yanıtla' : 'Yanıtla',
    { kime: kime.map(adresMetni).join(', '), bilgi: bilgi.map(adresMetni).join(', '), konu: onEk('Ynt', m.konu || ''), ref: { id: m.id } },
    ust + '<blockquote data-alinti="1">' + orjinal + '</blockquote>');
}

function dosyaEkle(inp) {
  [...inp.files].forEach(f => {
    if (f.size > 15 * 1024 * 1024) return bildir(f.name + ' 15 MB\'tan büyük', 4000);
    const r = new FileReader();
    r.onload = () => { EKLER.push({ ad: f.name, tur: f.type || 'application/octet-stream', boyut: f.size, veri: String(r.result).split(',')[1] }); ekCiz(); };
    r.readAsDataURL(f);
  });
  inp.value = '';
}
function ekCiz() {
  $('yEkler').innerHTML = EKLER.map((e, i) => '<span class="ek">📎 <span>' + kac(e.ad) + '</span> <small style="opacity:.6">' + boyut(e.boyut) + '</small><button title="Kaldır" data-i="' + i + '">✕</button></span>').join('');
  $('yEkler').querySelectorAll('button').forEach(b => b.onclick = () => { EKLER.splice(b.dataset.i, 1); ekCiz(); });
}

function govdeHazirla() {
  const kopya = $('yEditor').cloneNode(true);
  kopya.querySelectorAll('[data-imza]').forEach(d => { d.removeAttribute('data-imza'); d.removeAttribute('class'); d.style.marginTop = '16px'; });
  kopya.querySelectorAll('blockquote').forEach(q => { q.removeAttribute('data-alinti'); q.setAttribute('style', 'margin:8px 0 0 4px;padding-left:12px;border-left:3px solid #ccc;color:#555'); });
  return kopya.innerHTML;
}

async function gonder() {
  const d = $('yDurum'); d.className = 'durum'; d.textContent = '';
  if (!$('yKime').value.trim() && !$('yBilgi').value.trim() && !$('yGizli').value.trim()) { d.className = 'durum hata'; d.textContent = 'Alıcı yaz.'; $('yKime').focus(); return; }
  if (!$('yKonu').value.trim() && !confirm('Konu boş. Yine de gönderilsin mi?')) return;
  // Pencere hemen kapanır, posta arka planda gider; hata olursa taslak geri açılır
  const taslak = { baslik: $('yazBaslik').textContent, kime: $('yKime').value, bilgi: $('yBilgi').value, gizli: $('yGizli').value,
    konu: $('yKonu').value, govde: $('yEditor').innerHTML, yaz: YAZ, ekler: EKLER.slice() };
  const istek = {
    islem: 'gonder', kime: taslak.kime, bilgi: taslak.bilgi, gizli: taslak.gizli,
    konu: taslak.konu.trim(), html: govdeHazirla(), duz: $('yEditor').innerText,
    yanitId: YAZ && YAZ.id, yonlendir: YAZ && YAZ.yonlendir,
    ekler: EKLER.filter(e => !e.eski).map(e => ({ ad: e.ad, tur: e.tur, veri: e.veri })),
    eskiEkler: EKLER.filter(e => e.eski).map(e => ({ parca: e.parca }))
  };
  $('yazPen').hidden = true;
  const t = document.createElement('div'); t.className = 'bildirim'; document.body.appendChild(t);
  t.textContent = istek.ekler.length ? 'Ekler yükleniyor, gönderiliyor…' : 'Gönderiliyor…';
  let hata = '';
  try { const j = await servis(istek, 180000); if (!j.ok) hata = j.error || 'Gönderilemedi'; }
  catch (e) { hata = e.message; }
  if (!hata) {
    t.textContent = 'Gönderildi ✓'; setTimeout(() => t.remove(), 2500);
    if (KLASOR === 'giden') listeYukle(false, true);
    return;
  }
  t.remove();
  if (!$('yazPen').hidden && !confirm('Posta gönderilemedi: ' + hata + '\nAçık olan yeni postanın yerine gönderilemeyen taslak geri açılsın mı?')) return;
  $('yazBaslik').textContent = taslak.baslik; $('yKime').value = taslak.kime; $('yBilgi').value = taslak.bilgi; $('yGizli').value = taslak.gizli;
  $('yKonu').value = taslak.konu; $('yEditor').innerHTML = taslak.govde; YAZ = taslak.yaz; EKLER = taslak.ekler; ekCiz();
  $('yazPen').hidden = false; d.className = 'durum hata'; d.textContent = 'Gönderilemedi: ' + hata;
}
document.addEventListener('keydown', e => {
  if (!$('yazPen').hidden && (e.metaKey || e.ctrlKey) && e.key === 'Enter') gonder();
  if (e.key === 'Escape') { if (!$('ayarPen').hidden) $('ayarPen').hidden = true; else if (!$('yazPen').hidden) yazKapat(); }
});

// ── Ayarlar ──────────────────────────────────────────────
function ayarAc() {
  $('ana').classList.remove('menu');
  $('aAd').value = HESAP.ad || ''; $('aImza').innerHTML = HESAP.imza || ''; $('aDurum').textContent = '';
  $('aHesap').textContent = (HESAP.ad || '') + ' · ' + HESAP.adres; $('aSifre').value = '';
  $('ayarPen').hidden = false;
}
// Herkesin imzası ortak formata (18 Ekim) bir kez otomatik geçer: imza yoksa ya da eski hazır imzaysa
function imzaGecir() {
  const i = HESAP.imza || '';
  // 📞 (4 baytlık emoji) alıcıya \uD83D\uDCDE olarak gidiyordu; ☎ ile yeniden kurulur
  if (!/\uD83D\uDCDE|\\uD83D/i.test(i) && (i.includes('assets/imza/') || (i && !i.includes('dogus-logo-koyu.png')))) return;
  servis({ islem: 'imza', ad: HESAP.ad, imza: imzaHtml(HESAP.kim || KIM, HESAP.ad) })
    .then(j => { if (j.ok) { HESAP = j; hesapSakla(); } }).catch(() => {});
}
function imzaHazir() {
  // assets/imza.js: Umut'un formatı (yuvarlak fotoğraf, Broker · RE/MAX Doğuş, telefon, site, adres, logo)
  $('aImza').innerHTML = imzaHtml(HESAP.kim || KIM, $('aAd').value.trim() || HESAP.ad);
}
async function imzaKaydet() {
  const d = $('aDurum'); d.className = 'durum'; d.textContent = 'Kaydediliyor…';
  try {
    const j = await servis({ islem: 'imza', ad: $('aAd').value.trim(), imza: $('aImza').textContent.trim() || $('aImza').querySelector('img') ? $('aImza').innerHTML : '' });
    if (!j.ok) { d.className = 'durum hata'; d.textContent = j.error; return; }
    HESAP = j; hesapSakla(); d.textContent = 'Kaydedildi ✓';
  } catch (e) { d.className = 'durum hata'; d.textContent = e.message; }
}
async function sifreGuncelle() {
  const d = $('aDurum'); d.className = 'durum';
  if (!$('aSifre').value) { d.className = 'durum hata'; d.textContent = 'Yeni şifreyi yaz.'; return; }
  d.textContent = 'Sunucuda deneniyor…';
  try {
    const j = await servis({ islem: 'ayarla', sifre: $('aSifre').value });
    if (!j.ok) { d.className = 'durum hata'; d.textContent = j.error; return; }
    HESAP = j; hesapSakla(); $('aSifre').value = ''; d.textContent = 'Şifre güncellendi ✓';
  } catch (e) { d.className = 'durum hata'; d.textContent = e.message; }
}

function hesapSakla() { try { depo('posta_hesap', JSON.stringify({ kim: HESAP.kim, kurulu: HESAP.kurulu, adres: HESAP.adres, ad: HESAP.ad, imza: HESAP.imza })); } catch (e) {} }
function cikis(neden, sunucuya) {
  if (sunucuya && OTURUM) servis({ islem: 'cikis' }).catch(() => {});
  try { localStorage.removeItem('posta_onbellek_' + KIM); } catch (e) {}
  depo('posta_oturum', null); depo('posta_kim', null); depo('posta_hesap', null); depo('posta_pin', null);
  OTURUM = ''; KIM = ''; HESAP = {}; ONBELLEK = {}; MESAJLAR = []; MSJ.clear();
  $('ana').hidden = true; $('kurulum').hidden = true; $('yazPen').hidden = true; $('ayarPen').hidden = true; $('giris').hidden = false;
  $('girisHata').textContent = neden || ''; $('pin').value = ''; kimlerCiz(); $('pin').focus();
}

// Yenileyince giriş ekranı gelmesin: bu cihazda oturum varsa posta hemen açılır, oturum arkada doğrulanır
let hesapKayit = null; try { hesapKayit = JSON.parse(depo('posta_hesap') || 'null'); } catch (e) {}
if (OTURUM && hesapKayit && hesapKayit.kurulu) {
  HESAP = hesapKayit; anaAc();
  servis({ islem: 'durum' }, 60000).then(j => {
    if (!j.ok) return;
    HESAP = j; hesapSakla();
    if (!j.kurulu) kurulumAc();
  }).catch(() => {});
} else if (OTURUM) {
  servis({ islem: 'durum' }, 60000).then(j => { if (j.ok) { HESAP = j; hesapSakla(); j.kurulu ? anaAc() : kurulumAc(); } }).catch(() => { $('giris').hidden = false; });
} else {
  // İlk sürümden geçiş: bu cihazda Umut'un PIN'i kayıtlıysa sessizce oturuma çevir
  const eski = depo('posta_pin') || (window.brokerPinAl && brokerPinAl());
  if (eski) { giris(eski, 'umut').then(ok => { if (!ok) { $('giris').hidden = false; $('girisHata').textContent = ''; $('pin').focus(); } }); }
  else { $('giris').hidden = false; $('pin').focus(); }
}
</script>

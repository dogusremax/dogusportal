<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<style>
:root{
  /* RE/MAX kurumsal */
  --kirmizi:#DC1C2E;
  --kirmizi-koyu:#A3121F;
  --kirmizi-ac:#F2445A;
  --mavi:#003DA5;
  --mavi-koyu:#002A73;
  --mavi-ac:#2C6BD8;

  --bg:#f4f6f9;
  --card:#ffffff;
  --line:#e3e7ee;
  --line-soft:#eef1f6;
  --ink:#131a26;
  --muted:#68738a;
  --soft:#8b95a8;

  --amber:#E8A33D;
  --amber-bg:#fff6e8;
  --kirmizi-bg:#fdeef0;
  --mavi-bg:#eaf1fb;
  --yesil:#0f9b6c;
  --yesil-bg:#e7f6f0;

  --r:20px;
  --pad:16px;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{padding:0}
body{
  background:var(--bg);color:var(--ink);
  font-family:Arial,Helvetica,'Liberation Sans',sans-serif;
  font-size:15px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));
}
button,input,textarea,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
.disp{letter-spacing:-.03em}
.gizli{display:none!important}

/* ===== BAŞLIK ===== */
header{
  padding:calc(20px + env(safe-area-inset-top)) var(--pad) 20px;
  background:
    radial-gradient(circle at 22% 0%,rgba(255,255,255,.14),transparent 55%),
    linear-gradient(170deg,var(--mavi) 0%,var(--mavi-koyu) 100%);
  border-radius:0 0 26px 26px;
  box-shadow:
    0 14px 30px -18px rgba(0,42,115,.9),
    inset 0 -3px 10px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.22);
  position:relative;overflow:hidden;
  animation:iner .5s ease backwards;
}
header::after{
  content:'';position:absolute;left:0;right:0;bottom:0;height:4px;
  background:linear-gradient(90deg,var(--kirmizi) 0 38%,#fff 38% 62%,var(--mavi-ac) 62% 100%);
  opacity:.9;
}
header{text-align:center}
header h1{
  font-size:24px;font-weight:700;letter-spacing:.07em;line-height:1;color:#fff;
  display:inline-flex;align-items:center;gap:9px;margin-top:14px;position:relative;
  text-shadow:0 2px 6px rgba(0,0,0,.28);
}
header h1::before{
  content:'';width:6px;height:23px;border-radius:99px;
  background:linear-gradient(180deg,var(--kirmizi) 0 50%,#fff 50% 100%);
  box-shadow:0 3px 8px -2px rgba(220,28,46,.6);
}
.logo{
  height:30px;width:auto;display:block;margin:0 auto 0 0;position:relative;
  filter:drop-shadow(0 3px 7px rgba(0,0,0,.45));
  animation:pop .5s ease backwards .12s;
}
.kim{
  font-size:13px;color:rgba(255,255,255,.92);font-weight:700;margin-top:8px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;
}
.tarih{
  font-size:10.5px;color:rgba(255,255,255,.62);text-transform:uppercase;
  letter-spacing:.14em;font-weight:700;margin-top:5px;position:relative;
}

main{padding:16px var(--pad) 0}

/* ===== KART ===== */
.kart{
  background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(19,26,38,.05),0 10px 24px -18px rgba(19,26,38,.35);
  animation:yukari .42s ease backwards;
  transition:border-color .18s ease,box-shadow .18s ease,transform .14s ease;
  position:relative;overflow:hidden;
}
.kart::before{content:'';position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px 0 0 99px}
.kart.gecikmis::before{width:5px;background:linear-gradient(180deg,var(--kirmizi-ac),var(--kirmizi))}
.kart.bugunku::before{width:5px;background:linear-gradient(180deg,var(--mavi-ac),var(--mavi))}
.kart.uyari::before{width:5px;background:linear-gradient(180deg,#f5c078,var(--amber))}
.kart.gecikmis,.kart.bugunku,.kart.uyari{padding-left:20px}
@media (hover:hover){.kart:hover{border-color:#cfd7e6;box-shadow:0 2px 6px rgba(19,26,38,.06),0 18px 34px -20px rgba(19,26,38,.4)}}

.ust{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.ad{font-size:17px;font-weight:700;letter-spacing:-.03em;line-height:1.2}
.tel{font-size:13px;color:var(--muted);margin-top:3px;font-variant-numeric:tabular-nums}

.rozet{
  font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;
  white-space:nowrap;letter-spacing:-.01em;
  background:var(--mavi-bg);color:var(--mavi);
  box-shadow:inset 0 -1px 0 rgba(0,0,0,.04);
}
.rozet.kirmizi{background:var(--kirmizi-bg);color:var(--kirmizi-koyu)}
.rozet.sari{background:var(--amber-bg);color:#8a5c14}
.rozet.gri{background:var(--line-soft);color:var(--muted)}

.adim{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);font-size:14.5px}
.etiket,.adim .etiket{
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--soft);display:block;margin-bottom:3px;font-weight:700;
}
.sonnot{margin-top:9px;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.sayaclar{display:flex;gap:10px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.sayac{
  flex:1;text-align:center;padding:10px 4px;border-radius:14px;
  background:linear-gradient(180deg,#fafbfd,#f1f4f9);
  border:1px solid var(--line-soft);
  box-shadow:inset 0 1px 0 #fff;
}
.sayac b{font-size:19px;font-weight:700;display:block;line-height:1.1;letter-spacing:-.03em}
.sayac span{font-size:10.5px;color:var(--muted);display:block;margin-top:2px}

/* ===== 3D DÜĞMELER ===== */
.aksiyon{display:flex;gap:9px;margin-top:14px}
.aksiyon a,.aksiyon button{
  flex:1;text-align:center;padding:12px 8px;border-radius:14px;
  font-size:14px;font-weight:700;letter-spacing:-.01em;
  text-decoration:none;color:var(--ink);
  background:linear-gradient(180deg,#fff,#f2f5f9);
  border:1px solid var(--line);
  box-shadow:0 2px 0 #dfe4ec,0 6px 14px -8px rgba(19,26,38,.3),inset 0 1px 0 #fff;
  transition:transform .12s ease,box-shadow .12s ease;
}
.aksiyon a:active,.aksiyon button:active{transform:translateY(2px);box-shadow:0 0 0 #dfe4ec,0 3px 8px -6px rgba(19,26,38,.3)}

.aksiyon .birincil{
  flex:1.35;color:#fff;border-color:transparent;
  background:radial-gradient(circle at 30% 18%,var(--mavi-ac),var(--mavi) 72%);
  box-shadow:
    0 3px 0 var(--mavi-koyu),
    0 12px 22px -10px rgba(0,61,165,.75),
    inset 0 2px 3px rgba(255,255,255,.34),
    inset 0 -3px 6px rgba(0,0,0,.2);
}
.aksiyon .birincil:active{transform:translateY(3px);box-shadow:0 0 0 var(--mavi-koyu),0 5px 12px -8px rgba(0,61,165,.7),inset 0 2px 3px rgba(255,255,255,.3)}

.kaydet{
  width:100%;padding:16px;border-radius:16px;color:#fff;
  font-size:15.5px;font-weight:700;letter-spacing:-.01em;margin-top:6px;
  background:radial-gradient(circle at 30% 18%,var(--mavi-ac),var(--mavi) 72%);
  box-shadow:
    0 4px 0 var(--mavi-koyu),
    0 16px 28px -12px rgba(0,61,165,.75),
    inset 0 2px 3px rgba(255,255,255,.34),
    inset 0 -4px 7px rgba(0,0,0,.2);
  transition:transform .12s ease,box-shadow .12s ease;
}
.kaydet:active{transform:translateY(4px);box-shadow:0 0 0 var(--mavi-koyu),0 6px 14px -10px rgba(0,61,165,.7),inset 0 2px 3px rgba(255,255,255,.3)}

.ikincil{
  width:100%;padding:14px;border-radius:16px;margin-top:11px;
  font-size:15px;font-weight:700;letter-spacing:-.01em;
  background:linear-gradient(180deg,#fff,#f2f5f9);
  border:1px solid var(--line);
  box-shadow:0 2px 0 #dfe4ec,0 8px 18px -10px rgba(19,26,38,.3),inset 0 1px 0 #fff;
  transition:transform .12s ease,box-shadow .12s ease;
}
.ikincil:active{transform:translateY(2px);box-shadow:0 0 0 #dfe4ec,0 4px 10px -8px rgba(19,26,38,.3)}

.sil{
  width:100%;padding:13px;border-radius:14px;margin-top:12px;
  color:var(--kirmizi);font-weight:700;font-size:14px;
  background:var(--kirmizi-bg);border:1px solid #f7d4d9;
  transition:transform .12s ease;
}
.sil:active{transform:scale(.98)}

/* ===== BÖLÜM ===== */
.bolum{display:flex;align-items:center;gap:11px;margin:24px 0 12px}
.bolum h2{font-size:14px;font-weight:700;letter-spacing:-.02em}
.bolum .cizgi{flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}
.bolum .sayi{
  font-size:11px;font-weight:700;color:var(--muted);
  background:var(--line-soft);padding:3px 9px;border-radius:999px;
}

.bos{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:34px 22px;text-align:center;
  box-shadow:0 1px 3px rgba(19,26,38,.05);
}
.bos .baslik{font-weight:700;font-size:17px;margin-bottom:7px;letter-spacing:-.03em}
.bos p{color:var(--muted);font-size:14px}

/* ===== ARAMA & ÇİP ===== */
.arama{
  width:100%;padding:14px 16px;border-radius:16px;
  border:1px solid var(--line);background:var(--card);margin-bottom:12px;
  box-shadow:0 1px 3px rgba(19,26,38,.05);
  transition:border-color .15s,box-shadow .15s;
}
.arama::placeholder{color:var(--soft)}
.arama:focus{outline:none;border-color:var(--mavi);box-shadow:0 0 0 3px rgba(0,61,165,.12)}

.cipler{
  display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;
  margin:0 calc(var(--pad)*-1);padding-left:var(--pad);padding-right:var(--pad);
  scrollbar-width:none;
}
.cipler::-webkit-scrollbar{display:none}
.cip{
  padding:9px 15px;border-radius:999px;white-space:nowrap;
  font-size:13px;font-weight:700;color:var(--muted);
  background:linear-gradient(180deg,#fff,#f4f7fa);
  border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(19,26,38,.05),inset 0 1px 0 #fff;
  transition:transform .12s ease,box-shadow .12s ease,color .15s;
}
.cip:active{transform:translateY(1px)}
.cip.secili{
  color:#fff;border-color:transparent;
  background:radial-gradient(circle at 30% 20%,var(--mavi-ac),var(--mavi) 75%);
  box-shadow:0 2px 0 var(--mavi-koyu),0 8px 16px -8px rgba(0,61,165,.6),inset 0 1px 2px rgba(255,255,255,.3);
}

/* ===== ALT MENÜ ===== */
nav{
  position:fixed;left:0;right:0;bottom:0;z-index:40;
  background:rgba(255,255,255,.88);backdrop-filter:blur(18px);
  border-top:1px solid var(--line);
  display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 28px -18px rgba(19,26,38,.4);
}
nav button{
  flex:1;padding:7px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:5px;
  font-size:10.5px;font-weight:700;color:var(--soft);position:relative;letter-spacing:-.01em;
  transition:color .18s ease;
}
nav .kutu{
  width:40px;height:34px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s ease,box-shadow .2s ease,transform .2s ease;
}
nav .kutu svg{width:20px;height:20px;stroke-width:2.1}
nav button.aktif{color:var(--mavi)}
nav button.aktif .kutu{
  color:#fff;transform:translateY(-1px);
  background:radial-gradient(circle at 30% 20%,var(--mavi-ac),var(--mavi) 75%);
  box-shadow:0 3px 0 var(--mavi-koyu),0 10px 18px -8px rgba(0,61,165,.65),inset 0 1px 2px rgba(255,255,255,.35);
}
nav .nokta{
  position:absolute;top:3px;left:50%;margin-left:9px;
  width:9px;height:9px;border-radius:50%;background:var(--kirmizi);
  border:2px solid #fff;box-shadow:0 2px 5px -1px rgba(220,28,46,.7);
}

/* ===== EKLE DÜĞMESİ ===== */
.fab{
  position:fixed;right:18px;bottom:calc(96px + env(safe-area-inset-bottom));
  width:58px;height:58px;border-radius:20px;z-index:41;color:#fff;
  display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 30% 20%,var(--kirmizi-ac),var(--kirmizi) 72%);
  box-shadow:
    0 4px 0 var(--kirmizi-koyu),
    0 18px 30px -12px rgba(220,28,46,.75),
    inset 0 2px 3px rgba(255,255,255,.38),
    inset 0 -4px 7px rgba(0,0,0,.2);
  transition:transform .14s ease,box-shadow .14s ease;
  animation:pop .4s ease backwards .2s;
}
.fab svg{width:25px;height:25px;stroke-width:2.6}
.fab:active{transform:translateY(4px);box-shadow:0 0 0 var(--kirmizi-koyu),0 8px 16px -10px rgba(220,28,46,.7),inset 0 2px 3px rgba(255,255,255,.3)}

/* ===== PERDE ===== */
.perde{
  position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;
  background:rgba(19,26,38,.45);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .2s ease;
}
.perde.acik{opacity:1;pointer-events:auto}
.sayfa{
  background:var(--bg);width:100%;max-height:93vh;overflow-y:auto;
  border-radius:26px 26px 0 0;
  padding:0 var(--pad) calc(30px + env(safe-area-inset-bottom));
  transform:translateY(26px);
  transition:transform .26s cubic-bezier(.3,.85,.35,1);
  box-shadow:0 -20px 50px -20px rgba(19,26,38,.5);
}
.perde.acik .sayfa{transform:translateY(0)}
.sayfaUst{
  position:sticky;top:0;z-index:2;background:var(--bg);
  padding:18px 0 13px;display:flex;justify-content:space-between;align-items:center;gap:10px;
  border-bottom:1px solid var(--line-soft);margin-bottom:6px;
}
.sayfaUst h3{font-size:19px;font-weight:700;letter-spacing:-.035em;flex:1;min-width:0}
.kapat{
  font-size:13px;color:var(--muted);font-weight:700;flex-shrink:0;
  padding:8px 14px;border-radius:999px;background:var(--line-soft);
  transition:transform .12s ease;
}
.kapat:active{transform:scale(.95)}

/* ===== FORM ===== */
label.alan{display:block;margin-bottom:14px}
label.alan span{
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  color:var(--soft);display:block;margin-bottom:6px;font-weight:700;
}
label.alan input,label.alan textarea,label.alan select{
  width:100%;padding:13px 14px;border-radius:14px;
  border:1px solid var(--line);background:var(--card);
  box-shadow:0 1px 2px rgba(19,26,38,.04);
  transition:border-color .15s,box-shadow .15s;
}
label.alan textarea{min-height:92px;resize:vertical}
label.alan input:focus,label.alan textarea:focus,label.alan select:focus{
  outline:none;border-color:var(--mavi);box-shadow:0 0 0 3px rgba(0,61,165,.12);
}
.ikili{display:grid;grid-template-columns:1fr 1fr;gap:11px}

/* ===== ZAMAN ÇİZGİSİ ===== */
.iz{position:relative;padding-left:24px;margin-bottom:16px}
.iz::before{
  content:'';position:absolute;left:2px;top:5px;width:9px;height:9px;border-radius:50%;
  background:radial-gradient(circle at 30% 25%,var(--mavi-ac),var(--mavi));
  box-shadow:0 2px 5px -1px rgba(0,61,165,.6);
}
.iz::after{content:'';position:absolute;left:6px;top:18px;bottom:-16px;width:1.5px;background:var(--line)}
.iz:last-child::after{display:none}
.iz .zaman{font-size:11px;color:var(--soft);font-weight:700;font-variant-numeric:tabular-nums}
.iz .metin{font-size:14px;margin-top:2px;color:#3d4757;line-height:1.55}

.satir{display:flex;justify-content:space-between;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line-soft)}
.satir:last-child{border-bottom:0}
.satir .sol b{font-weight:700;font-size:14px;display:block;letter-spacing:-.02em}
.satir .sol i{font-style:normal;font-size:12px;color:var(--muted)}

/* ===== HEDEF ===== */
.hedefKart{
  border-radius:var(--r);padding:26px 20px;margin-bottom:14px;color:#fff;
  background:radial-gradient(circle at 18% 12%,var(--mavi-ac),var(--mavi) 58%,var(--mavi-koyu) 100%);
  box-shadow:
    0 20px 40px -18px rgba(0,61,165,.8),
    inset 0 2px 4px rgba(255,255,255,.28),
    inset 0 -5px 12px rgba(0,0,0,.22);
  animation:yukari .45s ease backwards;
  position:relative;overflow:hidden;
}
.hedefKart::after{
  content:'';position:absolute;top:-44px;right:-34px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.16),transparent 68%);
}
.hedefKart .rakam{font-size:42px;font-weight:700;letter-spacing:-.045em;line-height:1;position:relative}
.hedefKart .alt{font-size:12.5px;color:rgba(255,255,255,.78);margin-top:8px;font-weight:700;position:relative}
.bar{height:9px;background:rgba(0,0,0,.22);border-radius:999px;margin-top:18px;overflow:hidden;position:relative;box-shadow:inset 0 1px 3px rgba(0,0,0,.3)}
.bar i{
  display:block;height:100%;border-radius:999px;
  background:linear-gradient(90deg,#ff6b7d,var(--kirmizi-ac));
  box-shadow:0 0 12px rgba(242,68,90,.7);
  transition:width .7s cubic-bezier(.3,.9,.4,1);
}

.rapor{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;white-space:pre-wrap;font-size:14px;line-height:1.6;margin-bottom:12px;
  box-shadow:0 1px 3px rgba(19,26,38,.05);
}
.dip{text-align:center;font-size:12px;color:var(--muted);padding:22px 10px 6px;line-height:1.6}
.dip a{color:var(--mavi);font-weight:700}
.yukleniyor{text-align:center;color:var(--soft);padding:44px 0;font-size:13px;font-weight:700}

/* ===== HAREKET ===== */
@keyframes yukari{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes iner{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
.kart:nth-of-type(1){animation-delay:.03s}
.kart:nth-of-type(2){animation-delay:.07s}
.kart:nth-of-type(3){animation-delay:.11s}
.kart:nth-of-type(4){animation-delay:.15s}
.kart:nth-of-type(5){animation-delay:.19s}
.kart:nth-of-type(6){animation-delay:.23s}
.kart:nth-of-type(7){animation-delay:.27s}
.kart:nth-of-type(8){animation-delay:.31s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div style="background:#151A20;color:#fff;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.06em;text-align:center;padding:7px 12px">DEMO — Portföy sekmesinden «Bağlantıyı kur» → «Aktar» dene</div>

<header>
  <img class="logo" src="https://dogusportal.com/assets/dogus-logo.png" alt="RE/MAX Doğuş">
  <h1 class="disp">AJANDA</h1>
  <div class="kim" id="kim"></div>
  <div class="tarih" id="tarihYazi"></div>
</header>

<main>
  <div id="yukleniyor" class="yukleniyor">açılıyor…</div>

  <section id="ekranBugun" class="gizli">
    <div id="bugunListe"></div>
    <div class="bolum gizli" id="soguyanBaslik"><h2 class="disp">Sessiz kalanlar</h2><span class="cizgi"></span><span class="sayi" id="soguyanSayi"></span></div>
    <div id="soguyanListe"></div>
  </section>

  <section id="ekranKisiler" class="gizli">
    <input class="arama" id="arama" placeholder="İsim, telefon veya not ara" autocomplete="off">
    <div class="cipler" id="durumCipler"></div>
    <div id="kisiListe"></div>
  </section>

  <section id="ekranPortfoy" class="gizli">
    <div id="senkronCubuk"></div>
    <input class="arama" id="aramaP" placeholder="Başlık, adres veya mal sahibi ara" autocomplete="off">
    <div class="cipler" id="pDurumCipler"></div>
    <div id="portfoyListe"></div>
  </section>

  <section id="ekranHedef" class="gizli">
    <div class="hedefKart">
      <div class="rakam mono" id="hedefRakam">—</div>
      <div class="alt" id="hedefAlt"></div>
      <div class="bar"><i id="hedefBar" style="width:0"></i></div>
    </div>

function _gf(t){if(!t)return null;var p=String(t).split(' ')[0].split('-');if(p.length!==3)return null;
  var d=new Date(+p[0],+p[1]-1,+p[2]);var b=new Date();b.setHours(0,0,0,0);return Math.round((d-b)/86400000)}
function _kop(o){return JSON.parse(JSON.stringify(o))}
function _simdi(){var d=new Date();return _g(0)+' '+(d.getHours()<10?'0':'')+d.getHours()+':'+(d.getMinutes()<10?'0':'')+d.getMinutes()}

function _anah(s){return String(s==null?'':s)
  .replace(/İ/g,'i').replace(/I/g,'i').replace(/ı/g,'i').replace(/Ş/g,'s').replace(/ş/g,'s')
  .replace(/Ğ/g,'g').replace(/ğ/g,'g').replace(/Ü/g,'u').replace(/ü/g,'u')
  .replace(/Ö/g,'o').replace(/ö/g,'o').replace(/Ç/g,'c').replace(/ç/g,'c').toLowerCase()
  .replace(/mahallesi|mahalle|mah\.?|sokak|sok\.?|caddesi|cadde|cad\.?|bulvari|blv\.?|no:?|daire|d:?|blok|kat:?|k:?|etap|site(si)?/g,' ')
  .replace(/[^a-z0-9]/g,'')}
function _telAnah(t){var s=String(t||'').replace(/\D/g,'');if(s.length>10)s=s.slice(-10);return s}
function _esl(a,b){var x=_anah(a),y=_anah(b);if(!x||!y)return false;if(x===y)return true;
  if(x.length>=12&&y.indexOf(x)>-1)return true;if(y.length>=12&&x.indexOf(y)>-1)return true;return false}
function _trT(s){var m=String(s||'').match(/(\d{2})\.(\d{2})\.(\d{4})/);return m?m[3]+'-'+m[2]+'-'+m[1]:''}
function _yb(imza,sure){var p=String(imza||'').split('.');if(p.length!==3)return '';
  var d=new Date(+p[2],+p[1]-1,+p[0]);var m=String(sure||'').match(/(\d+)\s*(ay|yıl|hafta)/i);
  if(m){var n=+m[1],b=m[2].toLowerCase();if(b==='ay')d.setMonth(d.getMonth()+n);
    else if(b==='yıl')d.setFullYear(d.getFullYear()+n);else d.setDate(d.getDate()+n*7)}
  else d.setMonth(d.getMonth()+3);
  return d.getFullYear()+'-'+(d.getMonth()+1<10?'0':'')+(d.getMonth()+1)+'-'+(d.getDate()<10?'0':'')+d.getDate()}

function api(fn){
  var a=Array.prototype.slice.call(arguments,1);
  return new Promise(function(res){ setTimeout(function(){ res(_demo(fn,a)); }, 140); });
}

function _demo(fn,a){
  var akt=function(k){return k.durum!=='Kazanıldı'&&k.durum!=='Kaybedildi'};

  if(fn==='baslat') return {eposta:'demo',ad:DEMO.ayar.ad,hedef:DEMO.ayar.hedef,dosyaUrl:'#',
    matbuKurulu:DEMO.ayar.matbuKurulu,matbuDanisman:DEMO.ayar.matbuDanisman,
    sonMatbuSenkron:DEMO.ayar.sonMatbuSenkron,otoSenkron:DEMO.ayar.otoSenkron};

  if(fn==='ayarKaydet'){ if(a[0].ad)DEMO.ayar.ad=a[0].ad; if(a[0].hedef!==undefined)DEMO.ayar.hedef=+a[0].hedef; return true; }

  if(fn==='matbuKur'){
    DEMO.ayar.matbuKurulu=true; DEMO.ayar.matbuDanisman=a[2]||'Örnek Danışman';
    return {tamam:true,yetki:MATBU.yetkiler.length,gosterim:MATBU.gosterimler.length,teklif:0};
  }

  if(fn==='otomatikSenkron'){ DEMO.ayar.otoSenkron=!!a[0]; return true; }

  if(fn==='matbuSenkron'){
    var s={yeniPortfoy:0,yeniKisi:0,yeniGosterim:0,eslesmeyen:[],notlar:[]};

    MATBU.yetkiler.forEach(function(y){
      var m=null; DEMO.portfoyler.forEach(function(p){if(!m&&_esl(p.adres,y.adres))m=p});
      if(m){
        var d=false;
        if(!m.malSahibi){m.malSahibi=y.malSahibi;d=true}
        if(!m.malSahibiTel){m.malSahibiTel=y.malSahibiTel;d=true}
        if(!m.yetkiBitis){m.yetkiBitis=_yb(y.imzaTarihi,y.sure);d=true}
        if(!m.pdfLink){m.pdfLink=y.pdf;d=true}
        if(d){m.sonSenkron=_simdi();s.notlar.push(m.baslik+': mal sahibi ve yetki tarihi eklendi')}
        return;
      }
      DEMO.portfoyler.push({id:'p'+Math.floor(Math.random()*99999),baslik:y.kayitAdi,adres:y.adres,
        tip:y.tur==='Satılık'?'Satılık daire':'Kiralık daire',oda:'',m2:'',fiyat:y.fiyat,
        malSahibi:y.malSahibi,malSahibiTel:y.malSahibiTel,yetkiBitis:_yb(y.imzaTarihi,y.sure),
        durum:'Yayında',ilanLink:'',pdfLink:y.pdf,kaynak:'Yetki sözleşmesi',sonSenkron:_simdi(),notlar:''});
      s.yeniPortfoy++;
    });

    var varOlan={}; DEMO.gosterimler.forEach(function(g){if(g.disAnahtar)varOlan[g.disAnahtar]=true});

    MATBU.gosterimler.forEach(function(g){
      var tarih=_trT(g.tarih)||_g(0);
      var dis='matbu|'+_telAnah(g.musteriTel)+'|'+_anah(g.adres)+'|'+tarih;
      if(varOlan[dis])return;

      var kisi=null,tel=_telAnah(g.musteriTel);
      DEMO.kisiler.forEach(function(k){if(!kisi&&tel&&_telAnah(k.telefon)===tel)kisi=k});
      if(!kisi){
        kisi={id:'k'+Math.floor(Math.random()*99999),ad:g.musteriAd,telefon:g.musteriTel,
          eposta:g.musteriMail,tip:'Alıcı',durum:'Yer gösterimi',butce:'',arayis:'',
          kaynak:'Yer gösterme belgesi',notlar:'',sonrakiAdim:'',sonrakiTarih:'',
          sonTemas:tarih,komisyon:'',kapanisTarihi:''};
        DEMO.kisiler.push(kisi); s.yeniKisi++;
      }else{
        if(!kisi.eposta&&g.musteriMail)kisi.eposta=g.musteriMail;
        if(String(kisi.sonTemas||'')<tarih)kisi.sonTemas=tarih;
      }

      var pf=null; DEMO.portfoyler.forEach(function(p){if(!pf&&_esl(p.adres,g.adres))pf=p});
      if(!pf){
        s.eslesmeyen.push({disAnahtar:dis,kisiId:kisi.id,kisiAd:kisi.ad,adres:g.adres,tarih:tarih,fiyat:g.fiyat||''});
        return;
      }
      DEMO.gosterimler.push({id:'g'+Math.random(),portfoyId:pf.id,kisiId:kisi.id,tarih:tarih,
        ilgi:'',geriBildirim:'',kaynak:'Yer gösterme belgesi',disAnahtar:dis});
      varOlan[dis]=true; s.yeniGosterim++;
    });

    DEMO.ayar.sonMatbuSenkron=_simdi();
    s.zaman=_simdi();
    return s;
  }

  if(fn==='eslesmeyeniBagla'){
    var o=a[0];
    DEMO.gosterimler.push({id:'g'+Math.random(),portfoyId:o.portfoyId,kisiId:o.kisiId,

    return {tamam:true};
  }

  if(fn==='eslesmeyendenPortfoy'){
    var o=a[0];
    var p={id:'p'+Math.floor(Math.random()*99999),baslik:o.adres.slice(0,60),adres:o.adres,tip:'',oda:'',m2:'',
      fiyat:o.fiyat||'',malSahibi:'',malSahibiTel:'',yetkiBitis:'',durum:'Yayında',ilanLink:'',pdfLink:'',

    if(o.kisiId)_demo('eslesmeyeniBagla',[{portfoyId:p.id,kisiId:o.kisiId,tarih:o.tarih,disAnahtar:o.disAnahtar}]);
    return {tamam:true,portfoyId:p.id};
  }

  if(fn==='bugun'){
    var l=_kop(DEMO.kisiler.filter(function(k){var f=_gf(k.sonrakiTarih);return akt(k)&&f!==null&&f<=0}));
    l.forEach(function(k){k.gecikme=-_gf(k.sonrakiTarih)});
    l.sort(function(x,y){return y.gecikme-x.gecikme}); return l;
  }

  if(fn==='soguyanlar'){
    var l=_kop(DEMO.kisiler.filter(function(k){var f=_gf(k.sonTemas);return akt(k)&&(f===null||f<=-15)}));
    l.forEach(function(k){k.sessizGun=k.sonTemas?-_gf(k.sonTemas):null});
    l.sort(function(x,y){return (y.sessizGun||999)-(x.sessizGun||999)}); return l;
  }

  if(fn==='kisiler'){
    var f=a[0]||{}, l=_kop(DEMO.kisiler);
    if(f.q){var q=f.q.toLocaleLowerCase('tr-TR');
      l=l.filter(function(k){return (k.ad+' '+k.telefon+' '+k.arayis+' '+k.notlar).toLocaleLowerCase('tr-TR').indexOf(q)>-1})}
    if(f.durum==='Aktif')l=l.filter(akt);
    else if(f.durum&&f.durum!=='Hepsi')l=l.filter(function(k){return k.durum===f.durum});
    l.forEach(function(k){k.sessizGun=k.sonTemas?-_gf(k.sonTemas):null});
    l.sort(function(x,y){return String(y.sonTemas).localeCompare(String(x.sonTemas))});
    return l;
  }

  if(fn==='kisiDetay'){
    var k=null; DEMO.kisiler.forEach(function(x){if(x.id===a[0])k=x});
    if(!k)return null;
    var pAd={}; DEMO.portfoyler.forEach(function(p){pAd[p.id]=p.baslik});
    var dok=_kop(DEMO.dokunuslar.filter(function(d){return d.kisiId===a[0]}));
    dok.forEach(function(d){d.portfoyAd=d.portfoyId?(pAd[d.portfoyId]||''):''});
    dok.sort(function(x,y){return String(y.tarih).localeCompare(String(x.tarih))});
    var gos=_kop(DEMO.gosterimler.filter(function(g){return g.kisiId===a[0]}));
    gos.forEach(function(g){g.portfoyAd=pAd[g.portfoyId]||'(silinmiş portföy)'});
    gos.sort(function(x,y){return String(y.tarih).localeCompare(String(x.tarih))});
    return {kisi:_kop(k),dokunuslar:dok,gosterimler:gos};
  }

  if(fn==='kisiKaydet'){
    var k=a[0],i=-1; DEMO.kisiler.forEach(function(x,j){if(x.id===k.id)i=j});
    if(i<0){k.id='k'+Math.floor(Math.random()*99999);k.sonTemas=_g(0);DEMO.kisiler.push(k)}
    else Object.keys(k).forEach(function(n){if(k[n]!==undefined)DEMO.kisiler[i][n]=k[n]});
    return k.id;
  }

  if(fn==='kisiArsivle'){ DEMO.kisiler=DEMO.kisiler.filter(function(k){return k.id!==a[0]}); return true; }

  if(fn==='dokunusEkle'){
    var o=a[0];
    DEMO.dokunuslar.push({id:'d'+Math.random(),kisiId:o.kisiId,portfoyId:o.portfoyId||'',tarih:_simdi(),tur:o.tur,ozet:o.ozet});
    DEMO.kisiler.forEach(function(k){ if(k.id===o.kisiId){
      k.sonTemas=_g(0);
      if(o.sonrakiTarih!==undefined)k.sonrakiTarih=o.sonrakiTarih;
      if(o.sonrakiAdim!==undefined)k.sonrakiAdim=o.sonrakiAdim;
      if(o.durum)k.durum=o.durum;
    }});
    return true;
  }

  if(fn==='portfoyler'){
    var f=a[0]||{}, l=_kop(DEMO.portfoyler);
    if(f.q){var q=f.q.toLocaleLowerCase('tr-TR');
      l=l.filter(function(p){return (p.baslik+' '+p.adres+' '+p.malSahibi+' '+p.notlar).toLocaleLowerCase('tr-TR').indexOf(q)>-1})}
    if(f.durum&&f.durum!=='Hepsi')l=l.filter(function(p){return p.durum===f.durum});
    l.forEach(function(p){
      var g=DEMO.gosterimler.filter(function(x){return x.portfoyId===p.id});
      p.gosterimSayisi=g.length;
      p.sicakSayisi=g.filter(function(x){return x.ilgi==='Sıcak'}).length;
      var so=g.map(function(x){return String(x.tarih)}).sort().pop();
      p.sonGosterim=so||''; p.sessizGun=so?-_gf(so):null;
      p.yetkiKalan=p.yetkiBitis?_gf(p.yetkiBitis):null;
    });
    l.sort(function(x,y){return String(y.sonGosterim).localeCompare(String(x.sonGosterim))});
    return l;
  }

  if(fn==='portfoyDetay'){
    var p=null; DEMO.portfoyler.forEach(function(x){if(x.id===a[0])p=x});
    if(!p)return null;
    p=_kop(p);
    var kb={}; DEMO.kisiler.forEach(function(k){kb[k.id]={ad:k.ad,telefon:k.telefon,durum:k.durum,butce:k.butce}});
    var gos=_kop(DEMO.gosterimler.filter(function(g){return g.portfoyId===a[0]}));
    gos.forEach(function(g){var k=kb[g.kisiId]||{};
      g.kisiAd=k.ad||'(silinmiş kişi)';g.kisiTel=k.telefon||'';g.kisiDurum=k.durum||'';g.kisiButce=k.butce||''});
    gos.sort(function(x,y){return String(y.tarih).localeCompare(String(x.tarih))});
    var kon=_kop(DEMO.dokunuslar.filter(function(d){return d.portfoyId===a[0]}));
    kon.forEach(function(d){d.kisiAd=(kb[d.kisiId]||{}).ad||'—'});
    kon.sort(function(x,y){return String(y.tarih).localeCompare(String(x.tarih))});
    p.yetkiKalan=p.yetkiBitis?_gf(p.yetkiBitis):null;
    return {portfoy:p,gosterimler:gos,konusmalar:kon};
  }

  if(fn==='portfoyKaydet'){
    var p=a[0],i=-1; DEMO.portfoyler.forEach(function(x,j){if(x.id===p.id)i=j});
    if(i<0){p.id='p'+Math.floor(Math.random()*99999);DEMO.portfoyler.push(p)}
    else Object.keys(p).forEach(function(n){if(p[n]!==undefined)DEMO.portfoyler[i][n]=p[n]});
    return p.id;
  }

  if(fn==='portfoyArsivle'){ DEMO.portfoyler=DEMO.portfoyler.filter(function(p){return p.id!==a[0]}); return true; }

  if(fn==='gosterimEkle'){
    var o=a[0], t=o.tarih||_g(0);
    DEMO.gosterimler.push({id:'g'+Math.random(),portfoyId:o.portfoyId,kisiId:o.kisiId,tarih:t,
      ilgi:o.ilgi||'',geriBildirim:o.geriBildirim||'',kaynak:'Elle',disAnahtar:''});
    DEMO.kisiler.forEach(function(k){if(k.id===o.kisiId)k.sonTemas=_g(0)});
    DEMO.dokunuslar.push({id:'d'+Math.random(),kisiId:o.kisiId,portfoyId:o.portfoyId,tarih:_simdi(),
      tur:'Yer gösterimi',ozet:(o.geriBildirim||'Yer gösterimi yapıldı')+(o.ilgi?' ['+o.ilgi+']':'')});
    return true;
  }

  if(fn==='kisiSecenekleri')
    return _kop(DEMO.kisiler).map(function(k){return {id:k.id,ad:k.ad,tip:k.tip}})
      .sort(function(x,y){return String(x.ad).localeCompare(String(y.ad),'tr')});

  if(fn==='portfoySecenekleri')
    return _kop(DEMO.portfoyler).map(function(p){return {id:p.id,baslik:p.baslik}})
      .sort(function(x,y){return String(x.baslik).localeCompare(String(y.baslik),'tr')});

  if(fn==='malSahibiRaporu'){
    var d=_demo('portfoyDetay',[a[0]]); if(!d)return null;
    var gun=Number(a[1]||7), p=d.portfoy;
    var son=d.gosterimler.filter(function(g){var f=_gf(g.tarih);return f!==null&&f>=-gun});
    var t=[];
    t.push('Sayın '+(p.malSahibi||'mülk sahibi')+',');
    t.push('');
    t.push(p.baslik+' için son '+gun+' günün özeti:');
    t.push('');
    if(!son.length){
      t.push('• Bu dönemde yer gösterimi olmadı.');
      t.push('• Portföy ilanlarda aktif olarak yayında.');
    }else{
      t.push('• '+son.length+' yer gösterimi yapıldı.');
      var sic=son.filter(function(g){return g.ilgi==='Sıcak'}).length;
      if(sic)t.push('• '+sic+' kişi ciddi ilgi gösterdi, takipteyiz.');
      var geri=son.filter(function(g){return g.geriBildirim});
      if(geri.length){ t.push(''); t.push('Gelen geri bildirimler:');
        geri.forEach(function(g){t.push('– '+g.geriBildirim)}); }
    }
    t.push('');
    t.push('Bugüne kadar toplam '+d.gosterimler.length+' gösterim yapıldı.');
    if(p.yetkiKalan!==null&&p.yetkiKalan<=30&&p.yetkiKalan>=0)
      t.push('Yetki sözleşmemizin bitimine '+p.yetkiKalan+' gün kaldı.');
    t.push('');
    t.push('Sorularınız için her zaman ulaşabilirsiniz.');
    return {metin:t.join('\n'),malSahibiTel:p.malSahibiTel||'',baslik:p.baslik,gosterimSayisi:son.length};
  }

  if(fn==='hedefDurumu'){
    var yil=String(new Date().getFullYear());
    var kz=DEMO.kisiler.filter(function(k){return k.durum==='Kazanıldı'&&String(k.kapanisTarihi).indexOf(yil)===0});
    var tp=kz.reduce(function(x,k){return x+(+String(k.komisyon).replace(/\D/g,'')||0)},0);
    kz=_kop(kz).sort(function(x,y){return String(y.kapanisTarihi).localeCompare(String(x.kapanisTarihi))});
    return {hedef:DEMO.ayar.hedef,toplam:tp,adet:kz.length,yil:yil,kapanislar:kz};
  }

  return null;
}

function E(id){return document.getElementById(id)}
function kacis(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];})}
function jsAd(s){return kacis(String(s==null?'':s).replace(/['"\\]/g,''))}

var AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
var GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
var DURUMLAR=['Yeni','Görüşülüyor','Yer gösterimi','Teklif','Pazarlık','Kazanıldı','Kaybedildi'];
var TIPLER=['Alıcı','Satıcı','Kiracı','Mülk sahibi','Yatırımcı'];
var TURLER=['Arama','WhatsApp','Ziyaret','Not'];
var P_DURUMLAR=['Yayında','Rezerve','Satıldı','Askıda'];
var P_TIPLER=['Satılık daire','Kiralık daire','Dükkan','Arsa','Villa','Diğer'];
var ILGI=['Sıcak','Orta','Soğuk'];

function p2(n){return n<10?'0'+n:''+n}
function isoArtiGun(g){var d=new Date();d.setDate(d.getDate()+g);return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function okunurTarih(iso){
  if(!iso)return '';
  var p=String(iso).split(' ')[0].split('-');
  if(p.length!==3)return iso;
  return Number(p[2])+' '+AYLAR[Number(p[1])-1];
}
function paraYaz(n){return (Number(n)||0).toLocaleString('tr-TR')}
function telTemiz(t){
  var s=String(t||'').replace(/\D/g,'');
  if(s.length===10)s='90'+s;
  if(s.length===11&&s.charAt(0)==='0')s='90'+s.slice(1);
  return s;
}

var SEC={durum:'Aktif',q:''};
var SECP={durum:'Hepsi',q:''};

  E('tarihYazi').textContent=GUNLER[d.getDay()]+' · '+d.getDate()+' '+AYLAR[d.getMonth()];

function adSor(){
  var ad=prompt('Defter kimin? Adını yaz:');
  if(ad) api('ayarKaydet',{ad:ad}).then(function(){E('kim').textContent=ad});
}

function ekran(hangi){
  DURUM.ekran=hangi;
  [['bugun','Bugun'],['kisiler','Kisiler'],['portfoy','Portfoy'],['hedef','Hedef']].forEach(function(x){
    E('ekran'+x[1]).classList.toggle('gizli',x[0]!==hangi);
    E('nav'+x[1]).classList.toggle('aktif',x[0]===hangi);
  });
  E('fab').classList.toggle('gizli',hangi==='hedef'||hangi==='bugun');
  if(hangi==='bugun')bugunYukle();
  if(hangi==='kisiler')kisilerYukle();
  if(hangi==='portfoy')portfoyYukle();
  if(hangi==='hedef')hedefYukle();
}

function fabTikla(){
  if(DURUM.ekran==='portfoy')portfoyAc(null); else kisiAc(null);
}

/* ---------- BUGÜN ---------- */
function bugunYukle(){
  E('bugunListe').innerHTML='<div class="yukleniyor">yükleniyor…</div>';
  api('bugun').then(function(liste){
    E('navNokta').classList.toggle('gizli',liste.length===0);
    if(!liste.length){
      E('bugunListe').innerHTML='<div class="bos"><div class="baslik disp">Bugün beklemede kimse yok</div>'+
        '<p>Birini aradığında sonraki adımı yazarsan, o gün burada karşına çıkar.</p></div>';
    }else{
      E('bugunListe').innerHTML='<div class="bolum"><h2 class="disp">Bugün konuşulacaklar</h2>'+
        '<span class="cizgi"></span><span class="sayi">'+liste.length+'</span></div>'+
        liste.map(bugunKarti).join('');
    }
  });
  api('soguyanlar').then(function(liste){
    E('soguyanBaslik').classList.toggle('gizli',!liste.length);
    E('soguyanSayi').textContent=liste.length;
    E('soguyanListe').innerHTML=liste.slice(0,20).map(function(k){
      return kisiSatiri(k,'<span class="rozet sari mono">'+(k.sessizGun?k.sessizGun+' gün sessiz':'hiç dokunulmadı')+'</span>');
    }).join('');
  });
}

function bugunKarti(k){
  var gec=Number(k.gecikme)||0;
  var rozet=gec>0?'<span class="rozet kirmizi mono">'+gec+' gün gecikti</span>':'<span class="rozet mono">bugün</span>';
  var tel=telTemiz(k.telefon);
  return '<div class="kart '+(gec>0?'gecikmis':'bugunku')+'">'+
    '<div class="ust"><div><div class="ad disp">'+kacis(k.ad)+'</div>'+
    '<div class="tel">'+kacis(k.telefon||'telefon yok')+'</div></div>'+rozet+'</div>'+
    (k.sonrakiAdim?'<div class="adim"><span class="etiket">Sonraki adım</span>'+kacis(k.sonrakiAdim)+'</div>':'')+
    '<div class="aksiyon">'+
      (tel?'<a href="tel:+'+tel+'">Ara</a><a href="https://wa.me/'+tel+'" target="_blank">WhatsApp</a>':'')+
      '<button class="birincil" onclick="dokunusAc(\''+k.id+'\',\''+jsAd(k.ad)+'\')">Konuştum</button>'+
    '</div>'+
    '<div style="margin-top:8px"><button onclick="kisiAc(\''+k.id+'\')" style="color:var(--muted);font-weight:500;font-size:13px">Kartı aç →</button></div>'+
  '</div>';
}

function kisiSatiri(k,ekRozet){
  return '<div class="kart" onclick="kisiAc(\''+k.id+'\')">'+
    '<div class="ust"><div><div class="ad disp">'+kacis(k.ad)+'</div>'+
    '<div class="tel">'+kacis(k.telefon||'—')+(k.tip?' · '+kacis(k.tip):'')+'</div></div>'+
    (ekRozet||'<span class="rozet '+(k.durum==='Kazanıldı'?'':'gri')+' mono">'+kacis(k.durum||'Yeni')+'</span>')+'</div>'+
    (k.arayis?'<div class="sonnot">'+kacis(k.arayis)+'</div>':'')+
  '</div>';
}

function kisilerYukle(){
  E('durumCipler').innerHTML=['Aktif','Hepsi'].concat(DURUMLAR).map(function(d){
    return '<button class="cip'+(SEC.durum===d?' secili':'')+'" onclick="SEC.durum=\''+d+'\';kisilerYukle()">'+d+'</button>';
  }).join('');

  E('kisiListe').innerHTML='<div class="yukleniyor">yükleniyor…</div>';

function kisiAc(id){
  ac('perdeKisi');
  E('kisiBaslik').textContent=id?'Kişi kartı':'Yeni kişi';
  E('kisiGovde').innerHTML='<div class="yukleniyor">yükleniyor…</div>';
  if(!id){ kisiFormu({},[],[]); return; }
  api('kisiDetay',id).then(function(d){
    if(!d){E('kisiGovde').innerHTML='<div class="bos"><p>Kayıt bulunamadı.</p></div>';return}
    kisiFormu(d.kisi,d.dokunuslar,d.gosterimler);
  });
}

function kisiFormu(k,dokunuslar,gosterimler){

     '<label class="alan"><span>Tip</span><select id="fTip">'+TIPLER.map(function(t){return '<option'+(k.tip===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></label></div>';
  h+='<div class="ikili"><label class="alan"><span>Durum</span><select id="fDurum">'+
     DURUMLAR.map(function(d){return '<option'+((k.durum||'Yeni')===d?' selected':'')+'>'+d+'</option>'}).join('')+'</select></label>'+
     '<label class="alan"><span>Bütçe</span><input id="fButce" value="'+kacis(k.butce)+'" placeholder="7.2M"></label></div>';

  h+='<label class="alan"><span>Nereden geldi</span><input id="fKaynak" value="'+kacis(k.kaynak)+'" placeholder="Portal / tabela / tavsiye"></label>';
  h+='<label class="alan"><span>Aklında kalsın</span><textarea id="fNotlar" placeholder="Eşi Ataşehir&#39;de çalışıyor. Asansörsüz istemiyor.">'+kacis(k.notlar)+'</textarea></label>';
  h+='<div class="ikili"><label class="alan"><span>Sonraki adım</span><input id="fAdim" value="'+kacis(k.sonrakiAdim)+'" placeholder="Teklifi ilet"></label>'+
     '<label class="alan"><span>Ne zaman</span><input id="fTarih" type="date" value="'+kacis(String(k.sonrakiTarih||'').split(' ')[0])+'"></label></div>';
  h+='<div class="ikili"><label class="alan"><span>Komisyon (kapandıysa)</span><input id="fKom" class="mono" inputmode="numeric" value="'+kacis(k.komisyon)+'" placeholder="180000"></label>'+
     '<label class="alan"><span>Kapanış tarihi</span><input id="fKapanis" type="date" value="'+kacis(k.kapanisTarihi)+'"></label></div>';
  h+='<button class="kaydet" onclick="kisiKaydetTikla(\''+(k.id||'')+'\')">'+(yeni?'Kişiyi ekle':'Değişiklikleri kaydet')+'</button>';

  if(!yeni){
    h+='<button class="ikincil" onclick="dokunusAc(\''+k.id+'\',\''+jsAd(k.ad)+'\')">Görüşme ekle</button>';

    h+='<div class="bolum"><h2 class="disp">Gezdiği portföyler</h2><span class="cizgi"></span><span class="sayi">'+gosterimler.length+'</span></div>';
    h+= gosterimler.length
      ? '<div class="kart">'+gosterimler.map(function(g){
          return '<div class="satir"><div class="sol"><b>'+kacis(g.portfoyAd)+'</b>'+
                 '<i>'+okunurTarih(g.tarih)+(g.geriBildirim?' · '+kacis(g.geriBildirim):'')+'</i></div>'+
                 (g.ilgi?'<span class="rozet '+(g.ilgi==='Sıcak'?'':'gri')+' mono">'+kacis(g.ilgi)+'</span>':'')+'</div>';

function kisiKaydetTikla(id){
  var k={id:id||'',ad:E('fAd').value.trim(),telefon:E('fTel').value.trim(),
    eposta:E('fMail').value.trim(),
    tip:E('fTip').value,durum:E('fDurum').value,butce:E('fButce').value.trim(),
    arayis:E('fArayis').value.trim(),kaynak:E('fKaynak').value.trim(),
    notlar:E('fNotlar').value.trim(),sonrakiAdim:E('fAdim').value.trim(),
    sonrakiTarih:E('fTarih').value,komisyon:E('fKom').value.replace(/\D/g,''),
    kapanisTarihi:E('fKapanis').value};
  if(!k.ad){alert('Ad boş kalamaz.');return}

}

function kisiSilTikla(id){

/* ---------- MATBU SENKRON ---------- */
function senkronCubukCiz(){
  var t=DURUM.temel||{};
  if(!t.matbuKurulu){
    E('senkronCubuk').innerHTML='<div class="kart" style="box-shadow:inset 3px 0 0 var(--pine),0 1px 2px rgba(21,26,32,.06)">'+
      '<div class="ad disp" style="font-size:15px">Yetkilerin buraya akabilir</div>'+
      '<div class="sonnot" style="-webkit-line-clamp:3">Matbu Evraklar\'dan çıkardığın yetkilendirme sözleşmeleri ve yer gösterme belgeleri portföy kartlarını kendiliğinden oluşturur.</div>'+
      '<div class="aksiyon"><button class="birincil" onclick="senkronAyarAc()">Bağlantıyı kur</button></div></div>';
    return;
  }
  E('senkronCubuk').innerHTML='<div class="kart"><div class="ust">'+
    '<div><div class="ad disp" style="font-size:15px">Matbu Evraklar bağlı</div>'+
    '<div class="tel">'+kacis(t.matbuDanisman)+(t.sonMatbuSenkron?' · son aktarım '+kacis(t.sonMatbuSenkron):' · henüz aktarılmadı')+'</div></div>'+
    '<button onclick="senkronAyarAc()" style="color:var(--muted);font-size:13px;font-weight:500">Ayar</button></div>'+
    '<div class="aksiyon"><button class="birincil" onclick="senkronCalistir()">Yetkilerimi ve gösterimlerimi aktar</button></div></div>';
}

function senkronAyarAc(){
  var t=DURUM.temel||{};
  E('senkronBaslik').textContent='Matbu Evraklar bağlantısı';
  ac('perdeSenkron');
  var h='';
  h+='<div class="kart"><div class="sonnot" style="-webkit-line-clamp:9;color:var(--ink)">Bu bağlantı Matbu Evraklar\'daki <b>kendi</b> kayıtlarını okur. Yetkilendirme sözleşmelerinden portföy kartı, yer gösterme belgelerinden müşteri ve gösterim kaydı oluşur. Hiçbir şey Matbu tarafına yazılmaz.</div></div>';
  h+='<label class="alan"><span>Matbu servis adresi</span><input id="sUrl" value="'+kacis(t.matbuUrl||'')+'" placeholder="https://script.google.com/macros/s/.../exec"></label>';
  h+='<label class="alan"><span>Erişim anahtarı</span><input id="sAnahtar" value="" placeholder="ofisten aldığın anahtar"></label>';
  h+='<label class="alan"><span>Matbu\'daki adın</span><input id="sDanisman" value="'+kacis(t.matbuDanisman||'')+'" placeholder="Orhan Özazman"></label>';
  h+='<button class="kaydet" onclick="senkronKur()">Bağlantıyı test et ve kaydet</button>';
  if(t.matbuKurulu){
    h+='<div class="bolum"><h2 class="disp">Otomatik</h2><span class="cizgi"></span></div>';
    h+='<div class="kart"><div class="satir"><div class="sol"><b>Her sabah kendiliğinden aktar</b>'+
       '<i>07:00\'de yeni yetki ve gösterimleri çeker</i></div>'+
       '<button onclick="otoDegistir('+(t.otoSenkron?'false':'true')+')" class="cip'+(t.otoSenkron?' secili':'')+'">'+
       (t.otoSenkron?'Açık':'Kapalı')+'</button></div></div>';
  }
  E('senkronGovde').innerHTML=h;
}

function senkronKur(){
  var u=E('sUrl').value.trim(), a=E('sAnahtar').value.trim(), d=E('sDanisman').value.trim();
  if(!u||!a||!d){alert('Üç alanı da doldur.');return}
  E('senkronGovde').innerHTML='<div class="yukleniyor">bağlantı deneniyor…</div>';
  api('matbuKur',u,a,d).then(function(r){
    if(r.hata){alert(r.hata);senkronAyarAc();return}
    api('baslat').then(function(b){
      DURUM.temel=b;
      kapat('perdeSenkron');
      alert('Bağlandı.\n\n'+r.yetki+' yetki, '+r.gosterim+' gösterim kaydı görünüyor.\n\nŞimdi «Aktar» diyebilirsin.');
      portfoyYukle();
    });
  });
}

function otoDegistir(ac){
  api('otomatikSenkron',ac).then(function(){
    api('baslat').then(function(b){DURUM.temel=b;senkronAyarAc()});
  });
}

function senkronCalistir(){
  E('senkronBaslik').textContent='Aktarılıyor';
  ac('perdeSenkron');
  E('senkronGovde').innerHTML='<div class="yukleniyor">Matbu kayıtların okunuyor…</div>';
  api('matbuSenkron').then(function(r){
    if(r.hata){E('senkronGovde').innerHTML='<div class="bos"><div class="baslik disp">Olmadı</div><p>'+kacis(r.hata)+'</p></div>';return}
    DURUM.eslesmeyen=r.eslesmeyen||[];
    api('baslat').then(function(b){DURUM.temel=b});
    api('portfoySecenekleri').then(function(ps){
    DURUM.portfoySecenek=ps;
    E('senkronBaslik').textContent='Aktarım bitti';
    var h='<div class="kart"><div class="sayaclar" style="border-top:0;padding-top:0;margin-top:0">'+
      '<div class="sayac"><b class="mono">'+r.yeniPortfoy+'</b><span>yeni portföy</span></div>'+
      '<div class="sayac"><b class="mono">'+r.yeniKisi+'</b><span>yeni kişi</span></div>'+
      '<div class="sayac"><b class="mono">'+r.yeniGosterim+'</b><span>yeni gösterim</span></div></div></div>';
    if(r.notlar&&r.notlar.length){
      h+='<div class="kart">'+r.notlar.map(function(n){
        return '<div class="iz"><div class="metin">'+kacis(n)+'</div></div>'}).join('')+'</div>';
    }
    if(DURUM.eslesmeyen.length){
      h+='<div class="bolum"><h2 class="disp">Hangi mülk olduğunu bilemedim</h2><span class="cizgi"></span><span class="sayi">'+DURUM.eslesmeyen.length+'</span></div>';
      h+='<div class="kart"><div class="sonnot" style="-webkit-line-clamp:4;color:var(--ink)">Bu gösterimlerin adresi portföylerinden hiçbirine benzemedi. Başkasının portföyünü gezdirmiş olabilirsin ya da adres farklı yazılmıştır. Her birini bağla ya da yeni portföy aç.</div></div>';
      h+=DURUM.eslesmeyen.map(eslesmeyenKarti).join('');
    }
    if(!r.yeniPortfoy&&!r.yeniKisi&&!r.yeniGosterim&&!DURUM.eslesmeyen.length){
      h+='<div class="bos"><div class="baslik disp">Her şey zaten güncel</div><p>Matbu\'da Defter\'e girmemiş yeni kayıt yok.</p></div>';
    }
    h+='<button class="kaydet" onclick="kapat(\'perdeSenkron\');portfoyYukle()">Tamam</button>';
    E('senkronGovde').innerHTML=h;
    });
  });
}

function eslesmeyenKarti(e,i){
  return '<div class="kart" id="esk'+i+'"><div class="ust"><div>'+
    '<div class="ad disp" style="font-size:15px">'+kacis(e.kisiAd)+'</div>'+
    '<div class="tel">'+okunurTarih(e.tarih)+(e.fiyat?' · '+kacis(e.fiyat):'')+'</div></div></div>'+
    '<div class="adim"><span class="etiket">Belgedeki adres</span>'+kacis(e.adres)+'</div>'+
    '<label class="alan" style="margin-top:12px"><span>Hangi portföyün</span>'+
    '<select id="esp'+i+'"><option value="">— seç —</option>'+
    (DURUM.portfoySecenek||[]).map(function(p){
      return '<option value="'+kacis(p.id)+'">'+kacis(p.baslik)+'</option>'}).join('')+
    '</select></label>'+
    '<div class="aksiyon"><button onclick="eslesmeyenYeni('+i+')">Yeni portföy aç</button>'+

function eslesmeyenBagla(i){
  var e=DURUM.eslesmeyen[i], pid=E('esp'+i).value;
  if(!pid){alert('Önce portföyü seç.');return}

    var el=E('esk'+i);
    if(el)el.innerHTML='<div class="ad disp" style="font-size:15px">'+kacis(e.kisiAd)+' bağlandı</div>';
  });
}

function eslesmeyenYeni(i){
  var e=DURUM.eslesmeyen[i];
  api('eslesmeyendenPortfoy',e).then(function(r){
    if(r.hata){alert(r.hata);return}
    var el=E('esk'+i);
    if(el)el.innerHTML='<div class="ad disp" style="font-size:15px">Yeni portföy açıldı</div>';
  });
}

/* ---------- PORTFÖY ---------- */
function portfoyYukle(){
  senkronCubukCiz();
  E('pDurumCipler').innerHTML=['Hepsi'].concat(P_DURUMLAR).map(function(d){
    return '<button class="cip'+(SECP.durum===d?' secili':'')+'" onclick="SECP.durum=\''+d+'\';portfoyYukle()">'+d+'</button>';
  }).join('');
  E('aramaP').value=SECP.q;
  E('portfoyListe').innerHTML='<div class="yukleniyor">yükleniyor…</div>';
  api('portfoyler',{q:SECP.q,durum:SECP.durum}).then(function(liste){
    E('portfoyListe').innerHTML=liste.length?liste.map(portfoyKarti).join('')
      :'<div class="bos"><div class="baslik disp">Portföyün yok</div><p>Sağ alttaki + ile ilk portföyünü ekle.</p></div>';
  });
}

function portfoyKarti(p){
  var uyari='', sinif='';
  if(p.yetkiKalan!==null&&p.yetkiKalan!==''&&Number(p.yetkiKalan)<=30&&Number(p.yetkiKalan)>=0){
    uyari='<span class="rozet kirmizi mono">yetki '+p.yetkiKalan+' gün</span>'; sinif='uyari';
  }else if(p.sessizGun===null||p.sessizGun>=21){
    uyari='<span class="rozet sari mono">'+(p.sessizGun===null?'hiç gösterilmedi':p.sessizGun+' gün gösterim yok')+'</span>'; sinif='uyari';
  }else{
    uyari='<span class="rozet gri mono">'+kacis(p.durum||'Yayında')+'</span>';
  }
  return '<div class="kart '+sinif+'" onclick="portfoyAc(\''+p.id+'\')">'+
    '<div class="ust"><div><div class="ad disp">'+kacis(p.baslik)+'</div>'+
    '<div class="tel">'+kacis(p.adres||'')+(p.fiyat?' · '+kacis(p.fiyat):'')+'</div></div>'+uyari+'</div>'+
    '<div class="sayaclar">'+
      '<div class="sayac"><b class="mono">'+p.gosterimSayisi+'</b><span>gösterim</span></div>'+
      '<div class="sayac"><b class="mono">'+p.sicakSayisi+'</b><span>sıcak ilgi</span></div>'+
      '<div class="sayac"><b class="mono">'+(p.sonGosterim?okunurTarih(p.sonGosterim):'—')+'</b><span>son gösterim</span></div>'+
    '</div></div>';
}

function portfoyAc(id){
  ac('perdePortfoy');
  E('portfoyBaslik').textContent=id?'Portföy':'Yeni portföy';
  E('portfoyGovde').innerHTML='<div class="yukleniyor">yükleniyor…</div>';
  if(!id){ portfoyFormu({},[],[]); return; }
  api('portfoyDetay',id).then(function(d){
    if(!d){E('portfoyGovde').innerHTML='<div class="bos"><p>Kayıt bulunamadı.</p></div>';return}
    portfoyFormu(d.portfoy,d.gosterimler,d.konusmalar);
  });
}

function portfoyFormu(p,gosterimler,konusmalar){
  var yeni=!p.id, h='';
  h+='<label class="alan"><span>Başlık</span><input id="pBaslik" value="'+kacis(p.baslik)+'" placeholder="Yenitepe 2. Etap 3+1"></label>';
  h+='<label class="alan"><span>Adres</span><input id="pAdres" value="'+kacis(p.adres)+'" placeholder="Fikirtepe, Kadıköy"></label>';
  h+='<div class="ikili"><label class="alan"><span>Tip</span><select id="pTip">'+
     P_TIPLER.map(function(t){return '<option'+(p.tip===t?' selected':'')+'>'+t+'</option>'}).join('')+'</select></label>'+
     '<label class="alan"><span>Durum</span><select id="pDurum">'+
     P_DURUMLAR.map(function(d){return '<option'+((p.durum||'Yayında')===d?' selected':'')+'>'+d+'</option>'}).join('')+'</select></label></div>';
  h+='<div class="ikili"><label class="alan"><span>Oda</span><input id="pOda" value="'+kacis(p.oda)+'" placeholder="3+1"></label>'+
     '<label class="alan"><span>m²</span><input id="pM2" class="mono" inputmode="numeric" value="'+kacis(p.m2)+'" placeholder="145"></label></div>';
  h+='<label class="alan"><span>Fiyat</span><input id="pFiyat" value="'+kacis(p.fiyat)+'" placeholder="8.400.000"></label>';
  h+='<div class="ikili"><label class="alan"><span>Mal sahibi</span><input id="pSahip" value="'+kacis(p.malSahibi)+'" placeholder="Murat Demirtaş"></label>'+
     '<label class="alan"><span>Telefonu</span><input id="pSahipTel" class="mono" inputmode="tel" value="'+kacis(p.malSahibiTel)+'"></label></div>';
  h+='<label class="alan"><span>Yetki bitiş tarihi</span><input id="pYetki" type="date" value="'+kacis(p.yetkiBitis)+'"></label>';
  h+='<label class="alan"><span>İlan linki</span><input id="pLink" value="'+kacis(p.ilanLink)+'" placeholder="https://"></label>';
  h+='<label class="alan"><span>Notlar</span><textarea id="pNotlar" placeholder="Fiyat beklentisi piyasanın üstünde. Eylül&#39;e kadar satmazsa kiraya verecek.">'+kacis(p.notlar)+'</textarea></label>';
  h+='<button class="kaydet" onclick="portfoyKaydetTikla(\''+(p.id||'')+'\')">'+(yeni?'Portföyü ekle':'Değişiklikleri kaydet')+'</button>';

  if(!yeni){
    if(p.kaynak||p.pdfLink){
      h+='<div class="kart" style="margin-top:12px"><div class="ust"><div>'+
        '<span class="etiket">Nereden geldi</span>'+kacis(p.kaynak||'Elle eklendi')+
        (p.sonSenkron?'<div class="tel">'+kacis(p.sonSenkron)+'</div>':'')+'</div>'+
        (p.pdfLink?'<a href="'+kacis(p.pdfLink)+'" target="_blank" class="rozet mono" style="text-decoration:none">Sözleşme</a>':'')+
        '</div></div>';
    }
    h+='<button class="ikincil" onclick="gosterimAc(\''+p.id+'\',\''+jsAd(p.baslik)+'\')">Yer gösterimi ekle</button>';
    h+='<button class="ikincil" onclick="raporAc(\''+p.id+'\')">Mal sahibine rapor hazırla</button>';

    var sicak=gosterimler.filter(function(g){return g.ilgi==='Sıcak'}).length;
    h+='<div class="kart" style="margin-top:14px"><div class="sayaclar" style="border-top:0;padding-top:0;margin-top:0">'+
       '<div class="sayac"><b class="mono">'+gosterimler.length+'</b><span>toplam gösterim</span></div>'+
       '<div class="sayac"><b class="mono">'+sicak+'</b><span>sıcak ilgi</span></div>'+
       '<div class="sayac"><b class="mono">'+konusmalar.length+'</b><span>konuşma</span></div></div></div>';

    h+='<div class="bolum"><h2 class="disp">Kimlere gösterdin</h2><span class="cizgi"></span><span class="sayi">'+gosterimler.length+'</span></div>';
    h+= gosterimler.length
      ? gosterimler.map(function(g){
          var tel=telTemiz(g.kisiTel);
          return '<div class="kart"><div class="ust"><div><div class="ad disp" style="font-size:15px">'+kacis(g.kisiAd)+'</div>'+
            '<div class="tel">'+okunurTarih(g.tarih)+(g.kisiButce?' · bütçe '+kacis(g.kisiButce):'')+'</div></div>'+
            (g.ilgi?'<span class="rozet '+(g.ilgi==='Sıcak'?'':'gri')+' mono">'+kacis(g.ilgi)+'</span>':'')+'</div>'+
            (g.geriBildirim?'<div class="adim"><span class="etiket">Ne dedi</span>'+kacis(g.geriBildirim)+'</div>':'')+
            '<div class="aksiyon">'+
              (tel?'<a href="tel:+'+tel+'">Ara</a><a href="https://wa.me/'+tel+'" target="_blank">WhatsApp</a>':'')+
              '<button onclick="kisiAc(\''+g.kisiId+'\')">Kartı aç</button>'+
            '</div></div>';
        }).join('')
      : '<div class="bos"><div class="baslik disp">Henüz kimseye gösterilmedi</div><p>Gösterim ekledikçe burada birikir.</p></div>';

    h+='<div class="bolum"><h2 class="disp">Bu portföy hakkında konuşulanlar</h2><span class="cizgi"></span><span class="sayi">'+konusmalar.length+'</span></div>';
    h+= konusmalar.length
      ? '<div class="kart">'+konusmalar.map(function(d){

        }).join('')+'</div>'
      : '<div class="bos"><p>Bu portföy hakkında henüz konuşma kaydı yok. Görüşme eklerken portföyü seçersen buraya düşer.</p></div>';

function portfoyKaydetTikla(id){
  var p={id:id||'',baslik:E('pBaslik').value.trim(),adres:E('pAdres').value.trim(),
    tip:E('pTip').value,durum:E('pDurum').value,oda:E('pOda').value.trim(),
    m2:E('pM2').value.trim(),fiyat:E('pFiyat').value.trim(),
    malSahibi:E('pSahip').value.trim(),malSahibiTel:E('pSahipTel').value.trim(),
    yetkiBitis:E('pYetki').value,ilanLink:E('pLink').value.trim(),notlar:E('pNotlar').value.trim()};
  if(!p.baslik){alert('Başlık boş kalamaz.');return}
  api('portfoyKaydet',p).then(function(){ kapat('perdePortfoy'); portfoyYukle(); });
}

function portfoySilTikla(id){
  if(!confirm('Bu portföy listenden kaldırılsın mı? Gösterim geçmişi silinmez.'))return;
  api('portfoyArsivle',id).then(function(){ kapat('perdePortfoy'); portfoyYukle(); });
}

/* ---------- YER GÖSTERİMİ ---------- */
function gosterimAc(portfoyId,baslik){
  DURUM.gosterim={portfoyId:portfoyId,kisiId:'',ilgi:'Orta',tarih:isoArtiGun(0)};
  E('gosterimBaslik').textContent=baslik||'Yer gösterimi';
  ac('perdeGosterim');
  E('gosterimGovde').innerHTML='<div class="yukleniyor">kişiler yükleniyor…</div>';
  api('kisiSecenekleri').then(function(liste){
    DURUM.kisiSecenek=liste; gosterimCiz();
  });
}

function gosterimCiz(){
  var g=DURUM.gosterim, h='';
  h+='<label class="alan"><span>Kime gösterdin</span><select id="gKisi" onchange="DURUM.gosterim.kisiId=this.value">'+
     '<option value="">— kişi seç —</option>'+
     (DURUM.kisiSecenek||[]).map(function(k){
       return '<option value="'+kacis(k.id)+'"'+(g.kisiId===k.id?' selected':'')+'>'+kacis(k.ad)+(k.tip?' ('+kacis(k.tip)+')':'')+'</option>';
     }).join('')+'</select></label>';
  h+='<label class="alan"><span>Tarih</span><input id="gTarih" type="date" value="'+kacis(g.tarih)+'"></label>';
  h+='<span class="etiket">İlgi düzeyi</span><div class="cipler" style="margin-bottom:6px">'+
     ILGI.map(function(i){
       return '<button class="cip'+(g.ilgi===i?' secili':'')+'" onclick="gosterimAlanAl();DURUM.gosterim.ilgi=\''+i+'\';gosterimCiz()">'+i+'</button>';
     }).join('')+'</div>';
  h+='<label class="alan"><span>Ne dedi</span><textarea id="gGeri" placeholder="Manzarayı beğendi, mutfağı küçük buldu. Fiyatta 300 bin indirim isterse alırım dedi.">'+kacis(g.geriBildirim||'')+'</textarea></label>';
  h+='<button class="kaydet" onclick="gosterimKaydet()">Gösterimi kaydet</button>';
  E('gosterimGovde').innerHTML=h;
}

function gosterimAlanAl(){
  if(E('gGeri'))DURUM.gosterim.geriBildirim=E('gGeri').value;
  if(E('gTarih'))DURUM.gosterim.tarih=E('gTarih').value;
  if(E('gKisi'))DURUM.gosterim.kisiId=E('gKisi').value;
}

function gosterimKaydet(){
  gosterimAlanAl();
  var g=DURUM.gosterim;
  if(!g.kisiId){alert('Kimi gezdirdiğini seç. Kişi listende yoksa önce Kişiler ekranından ekle.');return}
  api('gosterimEkle',g).then(function(){
    kapat('perdeGosterim');
    portfoyAc(g.portfoyId);
  });
}

/* ---------- MAL SAHİBİ RAPORU ---------- */
function raporAc(portfoyId){
  DURUM.raporPortfoy=portfoyId;
  ac('perdeRapor');
  raporCiz(7);
}

function raporCiz(gun){
  E('raporGovde').innerHTML='<div class="yukleniyor">hazırlanıyor…</div>';
  api('malSahibiRaporu',DURUM.raporPortfoy,gun).then(function(r){
    if(!r){E('raporGovde').innerHTML='<div class="bos"><p>Rapor hazırlanamadı.</p></div>';return}
    var tel=telTemiz(r.malSahibiTel);
    var h='<div class="cipler" style="margin-bottom:6px">'+
      [7,14,30].map(function(g){
        return '<button class="cip'+(gun===g?' secili':'')+'" onclick="raporCiz('+g+')">Son '+g+' gün</button>';
      }).join('')+'</div>';
    h+='<div class="rapor" id="raporMetin">'+kacis(r.metin)+'</div>';
    h+='<div class="aksiyon">'+
       '<button onclick="raporKopyala()">Kopyala</button>'+
       (tel?'<a class="birincil" href="https://wa.me/'+tel+'?text='+encodeURIComponent(r.metin)+'" target="_blank">WhatsApp ile gönder</a>'
           :'<button class="birincil" onclick="alert(\'Mal sahibinin telefonunu portföy kartına ekle.\')">Telefon yok</button>')+
       '</div>';
    h+='<div class="dip">Metni göndermeden önce oku, gerekirse düzelt.</div>';
    E('raporGovde').innerHTML=h;
  });
}

function raporKopyala(){
  var t=E('raporMetin').innerText;
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(t).then(function(){alert('Kopyalandı.')},function(){_kopyaYedek(t)});
  }else _kopyaYedek(t);
}
function _kopyaYedek(t){
  var a=document.createElement('textarea');
  a.value=t; a.style.position='fixed'; a.style.opacity='0';
  document.body.appendChild(a); a.select();
  try{document.execCommand('copy');alert('Kopyalandı.')}catch(e){alert('Kopyalanamadı, metni elle seç.')}
  document.body.removeChild(a);
}

/* ---------- DOKUNUŞ ---------- */
function dokunusAc(kisiId,ad){
  DURUM.dokunus={kisiId:kisiId,tur:'Arama',tarih:'',portfoyId:''};
  E('dokunusBaslik').textContent=ad||'Görüşme';
  ac('perdeDokunus');
  E('dokunusGovde').innerHTML='<div class="yukleniyor">yükleniyor…</div>';
  api('portfoySecenekleri').then(function(l){ DURUM.portfoySecenek=l; dokunusCiz(); });
}

function dokunusCiz(){
  var d=DURUM.dokunus, h='';
  h+='<div class="cipler" style="margin-bottom:4px">'+TURLER.map(function(t){
      return '<button class="cip'+(d.tur===t?' secili':'')+'" onclick="dokunusAlanlariAl();DURUM.dokunus.tur=\''+t+'\';dokunusCiz()">'+t+'</button>';
    }).join('')+'</div>';
  h+='<label class="alan"><span>Ne konuşuldu</span><textarea id="dOzet" placeholder="Bahçelievler&#39;deki daireyi sordu, bütçesini 7M&#39;e çıkarabilirmiş.">'+kacis(d.ozet||'')+'</textarea></label>';
  h+='<label class="alan"><span>Hangi portföy hakkında (varsa)</span><select id="dPortfoy" onchange="DURUM.dokunus.portfoyId=this.value">'+
     '<option value="">— genel görüşme —</option>'+
     (DURUM.portfoySecenek||[]).map(function(p){
       return '<option value="'+kacis(p.id)+'"'+(d.portfoyId===p.id?' selected':'')+'>'+kacis(p.baslik)+'</option>';
     }).join('')+'</select></label>';
  h+='<label class="alan"><span>Sonraki adım</span><input id="dAdim" value="'+kacis(d.adim||'')+'" placeholder="2 yeni daire gönder"></label>';
  h+='<span class="etiket">Ne zaman dönülecek</span>';
  h+='<div class="cipler" style="margin-bottom:4px">'+
     [['Yarın',1],['3 gün',3],['1 hafta',7],['2 hafta',14],['1 ay',30]].map(function(x){
       var iso=isoArtiGun(x[1]);
       return '<button class="cip'+(d.tarih===iso?' secili':'')+'" onclick="dokunusAlanlariAl();DURUM.dokunus.tarih=\''+iso+'\';dokunusCiz()">'+x[0]+'</button>';
     }).join('')+
     '<button class="cip'+(d.tarih===''?' secili':'')+'" onclick="dokunusAlanlariAl();DURUM.dokunus.tarih=\'\';dokunusCiz()">Belirsiz</button></div>';
  h+='<label class="alan"><input id="dTarih" type="date" value="'+kacis(d.tarih||'')+'" onchange="DURUM.dokunus.tarih=this.value"></label>';
  h+='<label class="alan"><span>Durumu güncelle</span><select id="dDurum"><option value="">Değiştirme</option>'+
     DURUMLAR.map(function(x){return '<option>'+x+'</option>'}).join('')+'</select></label>';
  h+='<button class="kaydet" onclick="dokunusKaydet()">Kaydet</button>';
  E('dokunusGovde').innerHTML=h;
}

function dokunusAlanlariAl(){
  if(E('dOzet'))DURUM.dokunus.ozet=E('dOzet').value;
  if(E('dAdim'))DURUM.dokunus.adim=E('dAdim').value;
  if(E('dPortfoy'))DURUM.dokunus.portfoyId=E('dPortfoy').value;
}

function dokunusKaydet(){
  dokunusAlanlariAl();
  var d=DURUM.dokunus;
  var durum=E('dDurum')?E('dDurum').value:'';
  api('dokunusEkle',{kisiId:d.kisiId,portfoyId:d.portfoyId||'',tur:d.tur,ozet:d.ozet||'',
    sonrakiTarih:d.tarih||'',sonrakiAdim:d.adim||'',durum:durum||''}).then(function(){
    kapat('perdeDokunus'); kapat('perdeKisi'); ekran(DURUM.ekran);
  });
}

/* ---------- PORTFÖY ARAMA ---------- */
E('aramaP').addEventListener('input',function(){
  SECP.q=this.value; clearTimeout(DURUM.zp); DURUM.zp=setTimeout(portfoyYukle,280);
});

/* ---------- HEDEF ---------- */
function hedefYukle(){
  api('hedefDurumu').then(function(h){
    E('hedefGiris').value=h.hedef||'';
    E('hedefRakam').textContent=paraYaz(h.toplam)+' ₺';
    var yuzde=h.hedef?Math.min(100,Math.round(h.toplam/h.hedef*100)):0;
    E('hedefAlt').textContent=h.hedef?h.yil+' hedefinin %'+yuzde+'\'i · '+h.adet+' kapanış'
      :h.yil+' · '+h.adet+' kapanış · hedef belirlenmedi';
    E('hedefBar').style.width=yuzde+'%';
    E('kapanisListe').innerHTML=h.kapanislar.length
      ? h.kapanislar.map(function(k){
          return '<div class="kart"><div class="ust"><div><div class="ad disp">'+kacis(k.ad)+'</div>'+
            '<div class="tel">'+okunurTarih(k.kapanisTarihi)+'</div></div>'+
            '<span class="rozet mono">'+paraYaz(k.komisyon)+' ₺</span></div></div>';
        }).join('')
      : '<div class="bos"><div class="baslik disp">Bu yıl henüz kapanış yok</div><p>Bir kişiyi «Kazanıldı» yapıp komisyonu yazdığında burada görünür.</p></div>';
  });
}

function hedefKaydet(){
  api('ayarKaydet',{hedef:E('hedefGiris').value.replace(/\D/g,'')||'0'}).then(hedefYukle);
}

/* ---------- Perde ---------- */
function ac(id){E(id).classList.add('acik');document.body.style.overflow='hidden'}
function kapat(id){E(id).classList.remove('acik');document.body.style.overflow=''}
document.querySelectorAll('.perde').forEach(function(p){
  p.addEventListener('click',function(e){if(e.target===p)kapat(p.id)});
});
</script>

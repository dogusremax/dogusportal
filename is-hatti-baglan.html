<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Is hatti baglantisi</title>
<style>
  *{box-sizing:border-box}
  body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#050A30;color:#fff;margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center}
  .card{background:linear-gradient(160deg,#910B19,#DC1C2E 45%,#FB5160);border-radius:20px;padding:32px;max-width:420px;width:90%;box-shadow:0 12px 40px rgba(0,0,0,.4)}
  h1{font-size:22px;margin:0 0 8px}
  p{font-size:15px;line-height:1.5;margin:8px 0}
  label{font-size:13px;display:block;margin-top:14px}
  input{font:600 16px 'Plus Jakarta Sans',system-ui,sans-serif;padding:12px;border-radius:12px;border:0;width:100%;margin-top:6px}
  button{background:#fff;color:#910B19;font-weight:700;font-size:16px;border:0;border-radius:12px;padding:14px 20px;width:100%;margin-top:16px;cursor:pointer}
  button:disabled{opacity:.6}
  #log{font-size:13px;margin-top:14px;word-break:break-word;opacity:.95;white-space:pre-line}
</style>
</head>
<body>
<div class="card">
  <h1>Is hatti baglantisi</h1>
  <p>0533 038 74 85 numarasi hem telefonda hem asistanda calisacak.</p>
  <p>PIN'i yaz, butona bas, Facebook penceresinde Umut Tokkus hesabini sec ve telefondaki onayi ver.</p>
  <label for="pin">PIN</label>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
  <button id="btn" disabled>Numarayi bagla</button>
  <div id="log">Yukleniyor...</div>
</div>

<script>
// Gizli bilgi yok: app_id ve config_id acik tanimlayicilardir. PIN sayfada saklanmaz.
var APP_ID = '2386105761921849';
var CONFIG_ID = '1568594528364922';
var API_VERSION = 'v23.0';
var WA_SERVICE_URL = "https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec";

var oturum = {};
function log(m){ document.getElementById('log').textContent = m; }
function bekle(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

window.addEventListener('message', function(ev){
  if (!ev.origin || !/facebook\.com$/.test(ev.origin)) return;
  try {
    var d = JSON.parse(ev.data);
    if (d.type === 'WA_EMBEDDED_SIGNUP') {
      if (d.event === 'FINISH' || d.event === 'FINISH_WHATSAPP_BUSINESS_APP_ONBOARDING') {
        oturum.waba_id = d.data.waba_id;
        oturum.phone_number_id = d.data.phone_number_id;
        oturum.event = d.event;
      } else if (d.event === 'CANCEL') {
        log('Iptal edildi. Adim: ' + (d.data && d.data.current_step));
      }
    }
  } catch(e) {}
});

window.fbAsyncInit = function(){
  FB.init({appId: APP_ID, autoLogAppEvents: true, xfbml: true, version: API_VERSION});
  document.getElementById('btn').disabled = false;
  log('Hazir.');
};

async function sunucuyaGonder(pin){
  // waba_id / phone_number_id mesaji girisle ayni anda gelmeyebilir: 15 sn'ye kadar bekle
  for (var i = 0; i < 30 && !(oturum.waba_id && oturum.phone_number_id); i++) await bekle(500);
  if (!oturum.waba_id || !oturum.phone_number_id) { log('Facebook numara bilgisini vermedi. Tekrar dene.'); return; }
  log('Sunucuya gonderiliyor...');
  try {
    var zaman = new AbortController(); setTimeout(function(){ zaman.abort(); }, 90000);
    var r = await fetch(WA_SERVICE_URL + '?cb=' + Date.now(), {
      method: 'POST', redirect: 'follow', signal: zaman.signal,
      body: JSON.stringify({action:'anahtarKaydet', tur:'isHattiBaglan', pin:pin, islem:'baglan',
        code: oturum.code, waba_id: oturum.waba_id, phone_number_id: oturum.phone_number_id})
    });
    var j = await r.json();
    log(JSON.stringify(j, null, 1).replace(/[{}"\[\]]/g,''));
    window.__SONUC = j;
  } catch(e) { log('Sunucu cevap vermedi: ' + e.name); }
  oturum.code = null;
}

document.getElementById('btn').addEventListener('click', function(){
  var pin = document.getElementById('pin').value.trim();
  if (!pin) { log('Once PIN yaz.'); return; }
  document.getElementById('btn').disabled = true;
  log('Facebook penceresi aciliyor...');
  FB.login(function(resp){
    if (resp.authResponse && resp.authResponse.code) {
      oturum.code = resp.authResponse.code;
      sunucuyaGonder(pin).then(function(){ document.getElementById('btn').disabled = false; });
    } else {
      log('Giris tamamlanmadi.');
      document.getElementById('btn').disabled = false;
    }
  }, {
    config_id: CONFIG_ID,
    response_type: 'code',
    override_default_response_type: true,
    extras: { setup: {}, featureType: 'whatsapp_business_app_onboarding', sessionInfoVersion: '3' }
  });
});
</script>
<script async defer crossorigin="anonymous" src="https://connect.facebook.net/tr_TR/sdk.js"></script>
</body>
</html>

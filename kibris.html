<!doctype html>
<html lang="tr" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kuzey Kıbrıs Projeleri · RE/MAX Doğuş</title>
<meta name="description" content="Kuzey Kıbrıs'ta sterlin bazlı, denize yakın konut projeleri. RE/MAX Doğuş ile ücretsiz yatırım danışmanlığı. Türkçe · English · Русский · فارسی · Deutsch · Polski">
<meta property="og:title" content="Denize karşı, sterlinle. · Kuzey Kıbrıs">
<meta property="og:description" content="Bütçenize uygun 3 projeyi 24 saatte size özel çıkaralım. RE/MAX Doğuş Kuzey Kıbrıs Masası.">
<link rel="alternate" hreflang="tr" href="https://dogusportal.com/kibris.html?lang=tr">
<link rel="alternate" hreflang="en" href="https://dogusportal.com/kibris.html?lang=en">
<link rel="alternate" hreflang="ru" href="https://dogusportal.com/kibris.html?lang=ru">
<link rel="alternate" hreflang="fa" href="https://dogusportal.com/kibris.html?lang=fa">
<link rel="alternate" hreflang="de" href="https://dogusportal.com/kibris.html?lang=de">
<link rel="alternate" hreflang="pl" href="https://dogusportal.com/kibris.html?lang=pl">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=PT+Serif:ital@0;1&family=Vazirmatn:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: kıyı şeridi gibi dikey akış — koyu deniz hero (Beşparmak silueti), açık "köpük" zemin üzerinde bölümler, en altta adım adım form; mobilde sabit alt bar */
:root{
  --bg:#F2F6F6; --card:#FFFFFF; --ink:#0D2230; --muted:#557081; --line:#D3E0E3;
  --sea:#0B5D7E; --sea-soft:#DCEDF1; --sun:#E9A23B; --brand:#C8102E;
  --hero:#0A2433; --hero-2:#0E3A50; --hero-fg:#EAF3F5; --ok:#1F8A5B;
  --f-display:"Instrument Serif","PT Serif","Vazirmatn","Times New Roman",Georgia,serif;
  --f-body:"Figtree","Manrope","Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono","Manrope","Vazirmatn",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071520; --card:#0D2231; --ink:#E5EEF1; --muted:#8EA7B4; --line:#1C3A4B;
    --sea:#5BB8DC; --sea-soft:#10334A; --sun:#F2B55C; --brand:#E8455C;
    --hero:#04101A; --hero-2:#0A2A3C; --hero-fg:#EAF3F5; --ok:#3DBB82;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071520; --card:#0D2231; --ink:#E5EEF1; --muted:#8EA7B4; --line:#1C3A4B;
  --sea:#5BB8DC; --sea-soft:#10334A; --sun:#F2B55C; --brand:#E8455C;
  --hero:#04101A; --hero-2:#0A2A3C; --hero-fg:#EAF3F5; --ok:#3DBB82;
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{max-width:100%}
[hidden]{display:none!important}
@media (min-width:860px){body{padding-bottom:0}}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);line-height:1.08;letter-spacing:-.01em}
h2 em{font-style:italic;color:var(--sea)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
p{margin:0}
.lead{color:var(--muted);max-width:60ch;margin-top:12px}
section{padding-block:64px}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Farsça: sağdan sola, harf aralığı yok (bitişik yazıyı bozar), italik yok */
[lang="fa"] *{letter-spacing:0!important}
[lang="fa"] em{font-style:normal!important}
[lang="fa"] h1,[lang="fa"] h2,[lang="fa"] .q,[lang="fa"] .rinfo h3{font-family:"Vazirmatn",var(--f-display);font-weight:700;line-height:1.35}
[lang="fa"] .hero h1{font-size:clamp(2.1rem,8vw,4rem)}
[lang="fa"] h2{font-size:clamp(1.6rem,5vw,2.4rem)}
[lang="ru"] .hero h1,[lang="pl"] .hero h1,[lang="de"] .hero h1{font-size:clamp(2.3rem,8.6vw,4.6rem)}

/* ---------- top bar ---------- */
.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:16px}
.logo{display:flex;align-items:center;gap:10px;color:var(--hero-fg);text-decoration:none;font-weight:700;letter-spacing:.02em;font-size:.95rem;min-width:0}
.logo i{flex:0 0 auto;display:inline-block;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--brand) 0 33%,#fff 0 66%,#1B3A8C 0)}
.logo small{display:block;font-weight:500;opacity:.7;font-size:.72rem;letter-spacing:.06em}
.top-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.top-phone{color:var(--hero-fg);font-family:var(--f-mono);font-size:.8rem;opacity:.85;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:7px 12px;border-radius:999px;direction:ltr}
@media (max-width:520px){.top-phone{display:none}}
.langsel{position:relative}
.langbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);color:var(--hero-fg);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px 6px 8px;font:700 .8rem var(--f-mono);letter-spacing:.06em}
.langbtn::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.8;margin-inline-start:2px}
.langbtn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
.flag{display:inline-block;flex:0 0 auto;width:24px;height:16px;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.langbtn .flag{width:22px;height:15px}
.langmenu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);min-width:180px;z-index:30}
.langmenu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:9px;font:600 .95rem var(--f-body);text-align:start}
.langmenu button:hover,.langmenu button[aria-selected="true"]{background:var(--sea-soft)}
.flag-tr{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 800%22%3E%3Crect width=%221200%22 height=%22800%22 fill=%22%23E30A17%22/%3E%3Ccircle cx=%22425%22 cy=%22400%22 r=%22200%22 fill=%22%23fff%22/%3E%3Ccircle cx=%22475%22 cy=%22400%22 r=%22160%22 fill=%22%23E30A17%22/%3E%3Cpolygon fill=%22%23fff%22 points=%22475.0,400.0 544.1,377.5 544.1,304.9 586.8,363.7 655.9,341.2 613.2,400.0 655.9,458.8 586.8,436.3 544.1,495.1 544.1,422.5%22/%3E%3C/svg%3E")}
.flag-en{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 30%22%3E%3CclipPath id=%22s%22%3E%3Cpath d=%22M0,0v30h60V0z%22/%3E%3C/clipPath%3E%3CclipPath id=%22t%22%3E%3Cpath d=%22M30,15h30v15zv15H0zH0V0zV0h30z%22/%3E%3C/clipPath%3E%3Cg clip-path=%22url%28%23s%29%22%3E%3Cpath d=%22M0,0v30h60V0z%22 fill=%22%23012169%22/%3E%3Cpath d=%22M0,0L60,30M60,0L0,30%22 stroke=%22%23fff%22 stroke-width=%226%22/%3E%3Cpath d=%22M0,0L60,30M60,0L0,30%22 clip-path=%22url%28%23t%29%22 stroke=%22%23C8102E%22 stroke-width=%224%22/%3E%3Cpath d=%22M30,0v30M0,15h60%22 stroke=%22%23fff%22 stroke-width=%2210%22/%3E%3Cpath d=%22M30,0v30M0,15h60%22 stroke=%22%23C8102E%22 stroke-width=%226%22/%3E%3C/g%3E%3C/svg%3E")}
.flag-ru{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 9 6%22%3E%3Crect width=%229%22 height=%226%22 fill=%22%23fff%22/%3E%3Crect y=%222%22 width=%229%22 height=%224%22 fill=%22%230039A6%22/%3E%3Crect y=%224%22 width=%229%22 height=%222%22 fill=%22%23D52B1E%22/%3E%3C/svg%3E")}
.flag-fa{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 7 4%22%3E%3Crect width=%227%22 height=%224%22 fill=%22%23DA0000%22/%3E%3Crect width=%227%22 height=%222.67%22 fill=%22%23fff%22/%3E%3Crect width=%227%22 height=%221.33%22 fill=%22%23239F40%22/%3E%3C/svg%3E")}
.flag-de{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 3%22%3E%3Crect width=%225%22 height=%223%22 fill=%22%23FFCE00%22/%3E%3Crect width=%225%22 height=%222%22 fill=%22%23DD0000%22/%3E%3Crect width=%225%22 height=%221%22 fill=%22%23000%22/%3E%3C/svg%3E")}
.flag-pl{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 5%22%3E%3Crect width=%228%22 height=%225%22 fill=%22%23DC143C%22/%3E%3Crect width=%228%22 height=%222.5%22 fill=%22%23fff%22/%3E%3C/svg%3E")}

/* ---------- hero ---------- */
.hero{position:relative;background:var(--hero) url("assets/kibris/hero5-q.jpg") 60% 50%/cover no-repeat;color:var(--hero-fg);overflow:hidden;padding-top:104px;padding-bottom:84px;min-height:min(92svh,860px);display:flex;align-items:flex-end}
.hero-media{position:absolute;inset:0;z-index:0}
.sound{position:absolute;z-index:3;bottom:22px;inset-inline-end:18px;display:flex;align-items:center;gap:8px;background:rgba(6,22,34,.62);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;font:600 .82rem var(--f-body)}
.sound .ic-on{display:none}
.sound[aria-pressed="true"] .ic-on{display:block}
.sound[aria-pressed="true"] .ic-off{display:none}
.sound[aria-pressed="false"]{animation:nudge 2.4s ease-in-out 1.5s 3}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(233,162,59,0)}50%{box-shadow:0 0 0 8px rgba(233,162,59,.25)}}
.hero-media video{width:100%;height:100%;object-fit:cover;object-position:60% 50%;display:block}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,34,.45) 0%,rgba(6,22,34,0) 30%,rgba(6,22,34,.2) 58%,rgba(6,22,34,.82) 100%)}
.hero .wrap{width:100%}
@media (max-aspect-ratio:1/1){.hero{background-image:url("assets/kibris/hero5-m.jpg");background-position:center}.hero-media video{object-position:center}}
.hero h1,.hero .sub{text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,10vw,5.2rem);line-height:1;letter-spacing:-.015em;max-width:15ch}
.hero h1 em{color:var(--sun);font-style:italic}
.hero .sub{margin-top:18px;font-size:1.08rem;max-width:46ch;color:rgba(234,243,245,.82)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 24px;font-weight:700;font-size:1rem;text-decoration:none;text-align:center;transition:transform .15s ease, box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn-sun{background:var(--sun);color:#1A1205;box-shadow:0 10px 28px -10px rgba(233,162,59,.7)}
.btn-sun:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--hero-fg);border:1px solid rgba(255,255,255,.25)}
.btn-ink{background:var(--ink);color:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:38px;max-width:620px}
.fact{border-top:1px solid rgba(255,255,255,.22);padding-top:10px;min-width:0}
.fact b{display:block;font-family:var(--f-mono);font-size:clamp(1.1rem,4.4vw,1.5rem);color:#fff;font-variant-numeric:tabular-nums}
.fact span{font-size:.78rem;color:rgba(234,243,245,.7);line-height:1.3;display:block;margin-top:2px}
.scene{position:relative;height:190px;margin-top:30px}
@media(min-width:860px){.scene{height:240px;margin-top:10px}}
.scene svg{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
.scene canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.sunball{position:absolute;right:12%;top:8%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD58A,var(--sun) 60%,#C9771C);box-shadow:0 0 80px 20px rgba(233,162,59,.35);animation:rise 2.4s ease-out both}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.scene-label{position:absolute;inset-inline-start:18px;bottom:52%;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;color:rgba(234,243,245,.55);text-transform:uppercase}


/* ---------- ayrıcalıklar ---------- */
.perks-sec{background:var(--card);border-bottom:1px solid var(--line);padding-block:52px}
.av-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:26px}
@media(min-width:860px){.av-grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.av{border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--bg)}
.av b{font-family:var(--f-mono);font-size:clamp(1.3rem,4.5vw,1.7rem);color:var(--sea);line-height:1.1}
.av:nth-child(2) b{color:var(--brand)}
.av h3{font-size:.98rem}
.av p{font-size:.86rem;color:var(--muted)}
.av-cta{margin-top:22px}
@media(max-width:400px){.av-grid{grid-template-columns:1fr}}

/* ---------- reasons ---------- */
.grid4{display:grid;grid-template-columns:1fr;gap:14px;margin-top:30px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reason{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.reason .k{font-family:var(--f-mono);font-size:1.7rem;color:var(--sea);font-variant-numeric:tabular-nums;line-height:1}
.reason h3{font-size:1.08rem}
.reason p{color:var(--muted);font-size:.95rem}
.reason .src{font-size:.72rem;color:var(--muted);opacity:.8;margin-top:auto;padding-top:6px}

/* ---------- regions ---------- */
.regions{background:var(--card);border-block:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:26px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.region-body{display:grid;grid-template-columns:1fr;gap:22px;margin-top:20px;align-items:start}
@media(min-width:760px){.region-body{grid-template-columns:1.1fr .9fr}}
.region-map{background:var(--sea-soft);border-radius:var(--r);padding:12px;min-width:0}
.region-map svg{width:100%;height:auto;display:block;direction:ltr}
.region-map .isl{fill:var(--card);stroke:var(--sea);stroke-width:1.2;stroke-linejoin:round}
.region-map .south{fill:var(--line);stroke:none;opacity:.7}
.region-map .buffer{fill:var(--line);opacity:.45}
.region-map .south-t{font-family:var(--f-mono);font-size:8px;letter-spacing:.18em;fill:var(--muted);opacity:.7;font-weight:400}
.region-map .airport path{fill:var(--muted)}
.region-map .airport text{font-size:9px;font-weight:500}
.region-map .dot{fill:var(--muted);transition:r .2s}
.region-map .dot.on{fill:var(--sun)}
.region-map text{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-weight:600}
.region-map text.on{fill:var(--ink)}
.region-map .sea-t{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;fill:var(--sea);opacity:.7}
.rinfo{min-width:0}
.rinfo h3{font-family:var(--f-display);font-weight:400;font-size:2rem}
.rinfo .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--sea);margin-top:4px}
.rinfo p{color:var(--muted);margin-top:10px}
.fit{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--sea-soft);color:var(--ink);font-weight:600}
.proj{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;font-size:.92rem}
.proj b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);margin-bottom:4px}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:1fr;gap:18px;margin-top:28px}
@media(min-width:860px){.calc{grid-template-columns:.9fr 1.1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field label{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:10px}
.field label output{font-family:var(--f-mono);color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--sea);height:28px}
.big{font-family:var(--f-mono);font-size:clamp(2rem,8vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.big small{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.plan{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.stage .pct{font-family:var(--f-mono);font-size:.8rem;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700}
.stage .what{min-width:0}
.stage .what b{display:block;font-size:.95rem}
.stage .what span{font-size:.8rem;color:var(--muted)}
.stage .amt{font-family:var(--f-mono);text-align:end;font-variant-numeric:tabular-nums;font-size:.95rem}
.stage .amt small{display:block;color:var(--muted);font-size:.72rem}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:18px;background:var(--line)}
.bar i{display:block;height:100%}
.yield{margin-top:20px;padding:16px;border-radius:12px;background:var(--sea-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.yield b{font-family:var(--f-mono);font-size:1.5rem;color:var(--sea)}
.note{font-size:.78rem;color:var(--muted);margin-top:14px}
.calc-cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}

/* ---------- process / faq ---------- */
.steps{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-block:16px;border-top:1px solid var(--line);counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--sea)}
.steps h3{font-size:1.02rem}
.steps p{color:var(--muted);font-size:.93rem;margin-top:3px}
details{border-top:1px solid var(--line);padding-block:4px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding-block:16px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--sea);font-size:1.2rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);padding-bottom:16px;max-width:65ch}
.two{display:grid;grid-template-columns:1fr;gap:40px}
.two>div{min-width:0}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}

/* ---------- lead form ---------- */
.formsec{background:linear-gradient(180deg,var(--hero-2),var(--hero));color:var(--hero-fg)}
.formsec h2 em{color:var(--sun)}
.formsec .lead{color:rgba(234,243,245,.75)}
.fcard{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;margin-top:28px;max-width:620px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.prog{display:flex;gap:5px;margin-bottom:20px}
.prog i{flex:1;height:5px;border-radius:999px;background:var(--line);transition:background .3s}
.prog i.on{background:var(--sea)}
.qhead{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.q{font-family:var(--f-display);font-size:1.75rem;line-height:1.15;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:15px 16px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt span{font-weight:400;font-size:.82rem;color:var(--muted);text-align:end}
.opt:hover{border-color:var(--sea)}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.inp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.inp label{font-size:.85rem;font-weight:600}
.inp input{font:inherit;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.inp input[type=tel]{direction:ltr;text-align:start}
[dir="rtl"] .inp input[type=tel]{text-align:right}
.inp input:focus{border-color:var(--sea);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--muted);margin:6px 0 16px}
.consent input{margin-top:3px;accent-color:var(--sea);width:18px;height:18px;flex:0 0 auto}
.err{color:var(--brand);font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 0;white-space:nowrap}
.submit{flex:1;background:var(--sea);color:var(--bg)}
.done{text-align:center;padding:10px 0}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:1.8rem}
.done p{color:var(--muted);margin-top:8px}
.demo{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:14px}
.perks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px;font-size:.85rem;color:rgba(234,243,245,.8)}
.perks span::before{content:"✓ ";color:var(--sun);font-weight:700}

/* ---------- footer ---------- */
footer{padding-block:36px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer b{color:var(--ink)}
.mono{font-family:var(--f-mono)}

/* ---------- sticky mobile bar ---------- */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;transform:translateY(110%);transition:transform .3s ease}
.sticky.show{transform:none}
.sticky .btn{flex:1;padding:13px 10px;font-size:.95rem}
.btn-wa{background:#1FA855;color:#fff;flex:0 0 auto!important;width:52px;padding:0!important}
@media(min-width:860px){.sticky{display:none}}
</style>
</head>

  why_e:"Why North Cyprus", why_h:"More than a holiday spot: an island with <em>its own demand</em>.",

(function(){
  const c = $("sea"); if(!c) return;
  const x = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w,h,t=0;
  function size(){ const r=c.getBoundingClientRect(); w=c.width=r.width*devicePixelRatio; h=c.height=r.height*devicePixelRatio; }
  size(); addEventListener("resize", size);
  const layers=[{a:6,f:.006,s:.6,c:"rgba(15,90,120,.85)",y:.18},{a:8,f:.009,s:-.9,c:"rgba(11,74,99,.9)",y:.42},{a:5,f:.013,s:1.3,c:"rgba(8,52,72,1)",y:.68}];
  function draw(){
    x.clearRect(0,0,w,h);
    layers.forEach(Ly=>{
      x.beginPath(); x.moveTo(0,h);
      for(let px=0;px<=w;px+=8){ x.lineTo(px, h*Ly.y + Math.sin(px*Ly.f/devicePixelRatio + t*Ly.s*.03)*Ly.a*devicePixelRatio); }
      x.lineTo(w,h); x.closePath(); x.fillStyle=Ly.c; x.fill();
    });
    x.fillStyle="rgba(242,181,92,.35)";
    for(let i=0;i<7;i++){ const yy=h*(.25+i*.1); const ww=(30-i*3+Math.sin(t*.05+i)*6)*devicePixelRatio; x.fillRect(w*.86-ww/2, yy, ww, 2*devicePixelRatio); }
    t++; if(!reduce) requestAnimationFrame(draw);
  }
  draw();
})();

  const can = t => !!v.canPlayType('video/mp4; codecs="'+t+'"');
  const codec = can("av01.0.08M.08") ? "av1" : (can("hvc1.1.6.L120.90") ? "hevc" : "avc");   // en verimli desteklenen format
  const size = portrait ? "m" : (codec==="av1" ? "q" : "d");

  v.poster = "assets/kibris/hero5-" + (portrait ? "m" : "q") + ".jpg";
  v.muted = true; v.loop = true;
  const saveData = navigator.connection && navigator.connection.saveData;

  const start = src => { v.src = src; v.play().catch(()=>{}); };
  fetch(url).then(r=>{ if(!r.ok) throw 0; return r.blob(); })
    .then(b=>start(URL.createObjectURL(b)))
    .catch(()=>start(url));
  const kick=()=>{ if(v.src && v.paused && motionOK) v.play().catch(()=>{}); ["touchstart","scroll","click"].forEach(e=>removeEventListener(e,kick)); };
  ["touchstart","scroll","click"].forEach(e=>addEventListener(e,kick,{passive:true}));
})();

});

    const name = D().regions[r.id].name;
    const b=document.createElement("button"); b.className="tab"; b.setAttribute("role","tab"); b.textContent=name; b.type="button";
    b.onclick=()=>pickRegion(i,true); tabs.appendChild(b);
    dots.insertAdjacentHTML("beforeend",`<g style="cursor:pointer" data-i="${i}"><circle class="dot" cx="${r.x}" cy="${r.y}" r="6"/><text x="${r.x+r.dx}" y="${r.y+r.dy}" text-anchor="${r.a}">${name}</text></g>`);
  });
  dots.querySelectorAll("g").forEach(g=>g.addEventListener("click",()=>pickRegion(+g.dataset.i,true)));
  $("map-sea").textContent = D().dyn.map_sea;
  $("map-south").textContent = D().dyn.map_south;
  pickRegion(regionIdx,false);
}
function pickRegion(i, user){
  regionIdx=i;
  const r=D().regions[REGIONS[i].id];
  if(user) regionChosen = I18N.tr.regions[REGIONS[i].id].name;
  $("tabs").querySelectorAll(".tab").forEach((t,j)=>t.setAttribute("aria-selected", j===i));
  $("dots").querySelectorAll("g").forEach((g,j)=>{ const c=g.querySelector("circle"); c.classList.toggle("on",j===i); c.setAttribute("r", j===i?9:6); g.querySelector("text").classList.toggle("on",j===i); });
  $("rinfo").innerHTML=`<h3>${r.name}</h3><div class="tag">${r.tag}</div><p>${r.text}</p>
    <div class="fit">${r.fit.map(f=>`<span class="chip">${f}</span>`).join("")}</div>
    <div class="proj"><b>${D().dyn.proj}</b>${r.proj}</div>`;
  if(user) track("Bolge",{bolge:regionChosen});
}

/* ================= HESAPLAYICI ================= */
const gbp = n => "£" + Math.round(n).toLocaleString(D().locale);
function calc(){
  const d=D().dyn, p=+$("price").value, m1=+$("m1").value, m2=+$("m2").value, rent=+$("rent").value;
  $("o-price").textContent=gbp(p); $("o-m1").textContent=fill(d.months,{n:m1}); $("o-m2").textContent=m2? fill(d.months,{n:m2}) : d.once; $("o-rent").textContent=gbp(rent);
  const s1=p*.35, s2=p*.45, s3=p*.20;
  $("r-down").innerHTML = gbp(s1) + (L==="tr" ? ` <small>≈ ${(s1*CONFIG.GBP_TL/1e6).toLocaleString("tr-TR",{maximumFractionDigits:1})} milyon TL</small>` : "");
  $("r-s1").textContent=gbp(s1);
  $("r-s2").innerHTML=gbp(s2/m1)+`<small>${d.per_mo}</small>`; $("r-s2l").textContent=fill(d.s2l,{n:m1});
  $("r-s3").innerHTML= m2? gbp(s3/m2)+`<small>${d.per_mo}</small>` : gbp(s3); $("r-s3l").textContent= m2? fill(d.s3l,{n:m2}) : d.s3once;
  const y=rent*12/p*100;
  $("r-yield").textContent=(L==="tr"?"%":"")+y.toLocaleString(D().locale,{maximumFractionDigits:1})+(L==="tr"?"":"%");
  $("r-yl").textContent=" "+fill(d.per_yr,{x:gbp(rent*12)});
}
["price","m1","m2","rent"].forEach(id=>$(id).addEventListener("input",calc));
let calcTouched=false; ["price","m1","m2","rent"].forEach(id=>$(id).addEventListener("change",()=>{ if(!calcTouched){calcTouched=true; track("Hesaplayici");} }));

/* ================= FORM ================= */
const KEYS = ["amac","butce","odeme","zaman","tur","iletisim"];
const ans = {};          // seçilen şıkların index'i
const contact = {ad:"", tel:"", mail:"", kvkk:false};
let step = 0, sent = null;
$("prog").innerHTML = KEYS.map(()=>"<i></i>").join("");
const optLabel = (k,i,lang) => I18N[lang||L].q[k].o[i][0];

function saveContact(){
  if(!$("f-ad")) return;
  contact.ad=$("f-ad").value; contact.tel=$("f-tel").value; contact.mail=$("f-mail").value; contact.kvkk=$("f-kvkk").checked;
}
function render(){
  if(sent){ done(sent); return; }
  const c=D().c, esc=s=>String(s).replace(/"/g,"&quot;");
  $("prog").querySelectorAll("i").forEach((el,i)=>el.classList.toggle("on", i<=step));
  const key = KEYS[step];
  if(key==="iletisim"){
    $("qbox").innerHTML = `<div class="qhead">${c.last} · ${step+1}/${KEYS.length}</div>
      <div class="q">${c.q}</div>
      <div class="inp"><label for="f-ad">${c.name}</label><input id="f-ad" autocomplete="name" placeholder="${esc(c.name_ph)}" value="${esc(contact.ad)}"></div>
      <div class="inp"><label for="f-tel">${c.tel}</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="${esc(c.tel_ph)}" value="${esc(contact.tel)}"></div>
      <div class="inp"><label for="f-mail">${c.mail} <span style="font-weight:400;color:var(--muted)">${c.opt}</span></label><input id="f-mail" type="email" autocomplete="email" placeholder="name@mail.com" value="${esc(contact.mail)}"></div>
      <label class="consent"><input type="checkbox" id="f-kvkk" ${contact.kvkk?"checked":""}><span>${c.consent}</span></label>
      <div class="err" id="f-err" role="alert"></div>`;
    $("fnav").innerHTML = `<button type="button" class="back" id="f-back">${c.back}</button><button type="submit" class="btn submit" id="f-send">${c.submit}</button>`;
    $("f-back").onclick=()=>{saveContact();step--;render();};
    return;
  }
  const q=Q(key);
  $("qbox").innerHTML = `<div class="qhead">${c.qn} ${step+1}/${KEYS.length}</div><div class="q">${q.q}</div>
    <div class="opts">${q.o.map(([t,s],i)=>`<button type="button" class="opt ${ans[key]===i?"sel":""}" data-i="${i}">${t}${s?`<span>${s}</span>`:""}</button>`).join("")}</div>`;
  $("qbox").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    ans[key]=+b.dataset.i; b.classList.add("sel");
    if(step===0) track("FormBasladi",{dil:L});
    setTimeout(()=>{ step++; render(); $("fcard").scrollIntoView({behavior:"smooth",block:"start"}); }, 180);
  });
  $("fnav").innerHTML = step>0 ? `<button type="button" class="back" id="f-back">${c.back}</button><span></span>` : "";
  if(step>0) $("f-back").onclick=()=>{step--;render();};
}

/* sıcaklık puanı — Türkçe şık indexlerine göre, dil bağımsız */
function score(){
  let s=0;
  s += [5,15,22,25][ans.butce]||0;
  s += [35,25,12,2][ans.zaman]||0;
  s += [15,20,10,3][ans.odeme]||0;
  s += [20,15,8][ans.tur]||0;
  return Math.min(100,s);
}

/* telefon: + ile başlıyorsa uluslararası, değilse Türkiye cep numarası */
function normTel(raw){
  const r=String(raw).trim(); let d=r.replace(/\D/g,"");
  if(r.startsWith("+") || r.startsWith("00")){
    if(r.startsWith("00")) d=d.slice(2);
    if(d.startsWith("90")) { d=d.slice(2); return d.length===10 ? "0"+d : null; }
    return d.length>=8 && d.length<=15 ? "+"+d : null;
  }
  if(d.startsWith("90") && d.length===12) d=d.slice(2);
  if(d.startsWith("0")) d=d.slice(1);
  return d.length===10 ? "0"+d : null;
}

$("leadform").addEventListener("submit", async e=>{
  e.preventDefault();
  saveContact();
  const err=$("f-err"), E=D().err, c=D().c;
  const ad=contact.ad.trim(), tel=normTel(contact.tel);
  if(ad.length<3){err.textContent=E.name;$("f-ad").focus();return;}
  if(!tel){err.textContent=E.tel;$("f-tel").focus();return;}
  if(!contact.kvkk){err.textContent=E.kvkk;return;}
  err.textContent="";
  const btn=$("f-send"); btn.disabled=true; btn.textContent=c.sending;
  const payload = {
    ad, tel, mail:contact.mail.trim(), dil:L,
    amac:optLabel("amac",ans.amac,"tr"), butce:optLabel("butce",ans.butce,"tr"), odeme:optLabel("odeme",ans.odeme,"tr"),
    zaman:optLabel("zaman",ans.zaman,"tr"), tur:optLabel("tur",ans.tur,"tr"),
    puan:score(), bolge:regionChosen,
    fiyat_sim: calcTouched? +$("price").value : "", sure_sn: Math.round((Date.now()-t0)/1000), scroll: maxScroll,
    ...SRC, sayfa: location.href.split("?")[0], zaman_damgasi: new Date().toISOString()
  };
  let ok=true;
  if(CONFIG.GAS_URL){
    try{ await fetch(CONFIG.GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    catch(x){ ok=false; }
  }
  if(!ok){ btn.disabled=false; btn.textContent=c.retry; err.textContent=E.net; return; }
  try{ window.fbq && fbq('track','Lead',{content_name:"Kibris", value:payload.puan, dil:L}); }catch(x){}
  sent = payload;
  done(sent);
});

function waLink(p){
  const msg = p ? fill(D().wa,{ad:p.ad, butce:optLabel("butce",ans.butce), amac:optLabel("amac",ans.amac)}) : D().wa0;
  return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

function done(p){
  const T=D().done;
  $("prog").querySelectorAll("i").forEach(i=>i.classList.add("on"));
  const first = (p.ad||"").split(" ")[0];
  $("qbox").innerHTML = `<div class="done">
    <div class="tick">✓</div>
    <div class="q" style="margin-bottom:0">${fill(T.title,{name:first})}</div>
    <p>${fill(T.body,{budget:optLabel("butce",ans.butce), tel:p.tel})}</p>
    <p style="margin-top:16px">${T.nowait}</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <a class="btn" style="background:#1FA855;color:#fff" href="${waLink(p)}" target="_blank" rel="noopener">${T.wa}</a>
      <span class="mono" style="font-size:.85rem;color:var(--muted)">${T.call}</span>
    </div>
    ${CONFIG.GAS_URL?"":`<div class="demo">${T.demo}</div>`}
  </div>`;
  $("fnav").innerHTML="";
}

/* ================= DİLİ UYGULA ================= */
function applyLang(lang, user){
  if(user) saveContact();
  L = lang;
  const d=D();
  document.documentElement.lang = L;
  document.documentElement.dir = d.dir;
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k=el.getAttribute("data-i"); if(d.t[k]!=null) el.innerHTML=d.t[k];
  });
  $("langflag").className = "flag flag-"+L;
  $("langcode").textContent = L.toUpperCase();
  document.querySelectorAll("#langmenu [data-lang]").forEach(b=>b.setAttribute("aria-selected", b.dataset.lang===L));
  $("wa-sticky").href = waLink(sent);
  buildRegions(); calc(); render(); soundLabel();
  try{ localStorage.setItem("kibris_lang", L); }catch(e){}
  if(user){
    try{ const u=new URL(location.href); u.searchParams.set("lang",L); history.replaceState(null,"",u); }catch(e){}
    track("Dil",{dil:L});
  }
}
const langBtn=$("langbtn"), langMenu=$("langmenu");
function menu(open){ langMenu.hidden=!open; langBtn.setAttribute("aria-expanded", open); }
langBtn.addEventListener("click", e=>{ e.stopPropagation(); menu(langMenu.hidden); });
langMenu.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click", ()=>{ menu(false); if(b.dataset.lang!==L) applyLang(b.dataset.lang, true); }));
document.addEventListener("click", e=>{ if(!langMenu.hidden && !$("langsel").contains(e.target)) menu(false); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !langMenu.hidden){ menu(false); langBtn.focus(); } });
applyLang(L, false);

/* ================= ALT BAR ================= */
const sticky=$("sticky"), formSec=$("form");
addEventListener("scroll",()=>{
  const r=formSec.getBoundingClientRect();
  sticky.classList.toggle("show", scrollY>innerHeight*.7 && !(r.top<innerHeight && r.bottom>0));
},{passive:true});

</script>

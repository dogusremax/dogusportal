const NEWS = {"meta": [["forbes", "yatirim", "#1", "Forbes / T-Vine", "https://t-vine.com/forbes-names-north-cyprus-as-best-place-in-world-for-beachfront-property-investment", "2021"], ["hukuk", "yatirim", "UK", "KTTO 2025 · Timeturk", "https://www.ktto.net/wp-content/uploads/2025/12/Rakamlarla-Kuzey-Kibris-Turk-Cumhuriyeti-ve-Yatirim-Ortami-TR-2025-.pdf", "2025"], ["vergi", "yatirim", "10%", "In Your Pocket", "https://www.inyourpocket.com/cyprus/articles/property-investment-in-north-cyprus", "2026"], ["su", "altyapi", "107 km", "bianet", "https://bianet.org/haber/kuzey-kibris-su-temin-projesinin-acilisi-yapildi-168424", "2015"], ["gaz", "altyapi", "97 km", "Alomaliye", "https://www.alomaliye.com/2026/05/23/turkiye-ile-kktc-arasina-97-kilometrelik-dogal-gaz-boru-hatti-geliyor/", "2026"], ["ercan", "altyapi", "10 M", "TRT Haber", "https://www.trthaber.com/foto-galeri/yeni-ercan-havalimani-acildi/58084.html", "2023"], ["deniz", "yasam", "100%", "Euronews / AÇA", "https://www.euronews.com/health/2026/06/17/which-countries-in-europe-have-the-healthiest-beach-lake-and-river-water", "2026"], ["sahil", "yasam", "300", "Yolcu360", "https://yolcu360.com/lokasyonlar/kibris", ""], ["guven", "yasam", "", "", "", ""], ["okul", "yasam", "23", "KTTO 2025 · English School of Kyrenia", "https://www.englishschoolkyrenia.com/about-us", "2025"], ["golf", "yasam", "18", "Golfbreaks", "https://www.golfbreaks.com/en-gb/holidays/north-cyprus/korineum-golf-beach-resort/korineum-golf-course/", ""], ["saglik", "saglik", "", "T-Vine", "https://t-vine.com/north-cyprus-on-the-world-health-tourism-map", "2017"], ["ivf", "saglik", "20.000", "T-Vine", "https://t-vine.com/north-cyprus-on-the-world-health-tourism-map", "2017"], ["sac", "saglik", "", "In Your Pocket", "https://www.inyourpocket.com/cyprus/travelling-to-north-cyprus-for-a-hair-transplant-a_79696f", ""], ["dis", "saglik", "", "T-Vine", "https://t-vine.com/north-cyprus-on-the-world-health-tourism-map", "2017"]], "t": {"tr": {"e": "Kuzey Kıbrıs gündemi", "h": "Ada <em>hızla değişiyor.</em>", "l": "Altyapıdan sağlığa, hukuktan eğitime: Kuzey Kıbrıs'ı yatırım için öne çıkaran gelişmeler, kaynaklarıyla.", "c": {"all": "Tümü", "yatirim": "Yatırım", "altyapi": "Altyapı", "yasam": "Yaşam", "saglik": "Sağlık"}, "src": "Kaynak", "fl": {"forbes": "sıra", "hukuk": "hukuk temeli", "vergi": "kira geliri vergisi", "su": "boru hattı", "gaz": "boru hattı", "ercan": "yolcu / yıl", "deniz": "mükemmel su", "sahil": "gün güneş / yıl", "okul": "üniversite", "golf": "delik", "ivf": "yabancı hasta / yıl"}, "i": {"forbes": ["Forbes: Dünyanın en iyi sahil yatırımı İskele", "Forbes'ta yayımlanan 2021 Küresel Gayrimenkul Araştırması'nda İskele, sahil yatırımında dünyada birinci seçildi. Haberde Kuzey Kıbrıs, Akdeniz yaşamının en iyisini çok daha düşük maliyetle sunan yer olarak anlatıldı."], "hukuk": ["İngiliz hukuku temelli bir sistem", "KKTC'nin hukuk düzeni İngiliz döneminden kalan Anglo-Sakson temellere dayanıyor; şirketler hâlâ 1959 İngiliz Şirketler Yasası'na dayanan Fasıl 113 ile kuruluyor. Avukatlara göre davalar Türkiye'ye kıyasla çok daha hızlı sonuçlanıyor."], "vergi": ["Yatırımcı dostu vergi yapısı", "Bireysel ev sahipleri için kira gelirinde düz %10 vergi uygulanıyor. Hayatta bir kez bir mülkü vergisiz satma hakkı var; eşe ve çocuklara miras pratikte vergisiz geçiyor. Güncel oranları alım öncesi sizin için teyit ediyoruz."], "su": ["Türkiye'den denizin altından su", "2015'te açılan Kıbrıs Su Temin Projesi, Anamur'daki Alaköprü Barajı'ndan Girne'deki Geçitköy Barajı'na 80 km'si denizin altından geçen 107 km'lik bir hatla su taşıyor. Proje, adanın su ihtiyacını 50 yıl karşılayacak şekilde tasarlandı."], "gaz": ["Türkiye–KKTC doğalgaz boru hattı geliyor", "Enerji Bakanı Alparslan Bayraktar'ın açıkladığı 97 km'lik hat Alanya'dan adaya doğalgaz taşıyacak. Hedef 2028; amaç adadaki santralleri sıvı yakıttan daha temiz doğalgaza geçirmek ve enerji arzını güvenceye almak."], "ercan": ["Yeni Ercan Havalimanı: yılda 10 milyon yolcu", "Temmuz 2023'te açılan yeni terminal, eskisinin altı katı büyüklüğünde. 3.100 metrelik yeni pist her tip yolcu uçağının inişine uygun. İstanbul'dan uçuş yaklaşık bir buçuk saat."], "deniz": ["Avrupa'nın en temiz yüzme suları", "Avrupa Çevre Ajansı'nın 2025 sezonu raporunda Kıbrıs, yüzme alanlarının %100'ü 'mükemmel' sınıfında yer alarak Avrupa'da birinci oldu. Ölçümler adanın güneyindeki istasyonlarda yapılıyor; kuzey kıyıları aynı denize açılıyor."], "sahil": ["Uzun ve bakir sahil şeridi", "Yılda ortalama 300 gün güneş alan adada Girne'nin koylarından İskele'nin kilometrelerce kumsalına ve Karpaz'ın Altın Kum plajına uzanan, büyük bölümü hâlâ bakir bir kıyı var."], "guven": ["Sakin ve güvenli ada yaşamı", "Küçük ve birbirini tanıyan bir toplum, sakin bir yaşam temposu. Kuzey Kıbrıs; aileler, emekliler ve uzaktan çalışanlar için huzurlu bir yaşam sunmasıyla biliniyor."], "okul": ["Üniversiteler ve uluslararası diploma", "KKTC'de 23 üniversitede 100 binden fazla öğrenci okuyor. Girne'deki English School of Kyrenia gibi okullar IGCSE, A-Level ve Uluslararası Bakalorya (IB) diplomasıyla 40'tan fazla milletten 1.200'ü aşkın öğrenciye eğitim veriyor."], "golf": ["Golf turizmi: Korineum", "2007'de Esentepe'de açılan Korineum, adanın kuzeyindeki ilk 18 delikli golf sahası. Her delikten dağ ve deniz manzarası görülüyor; zemin yaz ortasında bile yıl boyu oynanabilir durumda."], "saglik": ["Gelişmiş sağlık merkezleri", "Üniversite hastaneleri ileri görüntüleme ve tedavi imkânlarıyla hem adada yaşayanlara hem yurt dışından gelen hastalara hizmet veriyor. Kardiyoloji, onkoloji ve fizik tedavi öne çıkan alanlar arasında."], "ivf": ["Tüp bebekte bilinen bir adres", "Kuzey Kıbrıs, tüp bebek tedavisiyle uluslararası tanınırlık kazandı. Habere göre ada yılda yaklaşık 20.000 yabancı hastaya sağlık hizmeti veriyor (2017 tahmini)."], "sac": ["Saç ekimi", "Saç ekimi için gelen hastalar tedaviyi tatille birleştiriyor. Tedavi maliyetleri gelişmiş ülkelere göre belirgin şekilde daha düşük; Ercan'a Londra ve İstanbul'dan doğrudan uçuş var."], "dis": ["Diş ve protez merkezleri", "Diş hekimliği, adanın sağlık turizminde yerleşik alanlardan biri. İmplant ve protez tedavileri için yurt dışından gelen hasta sayısı her yıl artıyor."]}}, "en": {"e": "North Cyprus news", "h": "An island <em>on the move.</em>", "l": "From infrastructure to healthcare, law to education: the developments that make North Cyprus stand out for investors, with sources.", "c": {"all": "All", "yatirim": "Investment", "altyapi": "Infrastructure", "yasam": "Living", "saglik": "Health"}, "src": "Source", "fl": {"forbes": "rank", "hukuk": "legal roots", "vergi": "rental income tax", "su": "pipeline", "gaz": "pipeline", "ercan": "passengers / yr", "deniz": "excellent water", "sahil": "sunny days / yr", "okul": "universities", "golf": "holes", "ivf": "foreign patients / yr"}, "i": {"forbes": ["Forbes: Iskele named world's best beachfront buy", "In the 2021 Global Property Survey reported by Forbes, Iskele ranked first in the world for beachfront investment. The piece described North Cyprus as the best of the Mediterranean at a fraction of the cost."], "hukuk": ["A legal system rooted in English law", "North Cyprus's legal order rests on Anglo-Saxon foundations from the British era; companies are still formed under Chapter 113, based on the 1959 British Companies Law. Lawyers say cases conclude far faster than in Türkiye."], "vergi": ["An investor-friendly tax structure", "Individual landlords pay a flat 10% tax on rental income. There is a once-in-a-lifetime tax-free sale of one property, and inheritance to a spouse or children is effectively tax-free. We confirm current rates for you before you buy."], "su": ["Water piped under the sea from Türkiye", "Opened in 2015, the Cyprus Water Supply Project carries water 107 km from Alaköprü Dam in Anamur to Geçitköy Dam in Kyrenia, 80 km of it under the sea. It was designed to meet the island's water needs for 50 years."], "gaz": ["A Türkiye–North Cyprus gas pipeline is coming", "Announced by Energy Minister Alparslan Bayraktar, the 97 km line will carry natural gas from Alanya to the island. The target is 2028, to switch power plants from liquid fuel to cleaner gas and secure supply."], "ercan": ["New Ercan Airport: 10 million passengers a year", "Opened in July 2023, the new terminal is six times the size of the old one. The new 3,100 m runway takes every type of passenger jet. The flight from Istanbul takes about an hour and a half."], "deniz": ["Europe's cleanest bathing waters", "In the European Environment Agency's report on the 2025 season, Cyprus ranked first in Europe with 100% of bathing sites rated 'excellent'. Monitoring stations are in the south of the island; the northern coast opens onto the same sea."], "sahil": ["A long, unspoilt coastline", "With around 300 days of sunshine a year, the island has a coastline running from Kyrenia's coves to Iskele's long sandy beaches and Karpas's Golden Beach, much of it still unspoilt."], "guven": ["A calm, safe island life", "A small community where people know each other, and a relaxed pace of life. North Cyprus is known for offering families, retirees and remote workers a peaceful place to live."], "okul": ["Universities and international diplomas", "More than 100,000 students study at 23 universities in North Cyprus. Schools such as the English School of Kyrenia teach 1,200+ students from 40+ nationalities to IGCSE, A-Level and International Baccalaureate (IB) diplomas."], "golf": ["Golf tourism: Korineum", "Opened in Esentepe in 2007, Korineum is the first 18-hole course in North Cyprus. Every hole has mountain and sea views, and the course stays playable year-round, even in midsummer."], "saglik": ["Advanced medical centres", "University hospitals with advanced imaging and treatment serve both residents and patients from abroad. Cardiology, oncology and physiotherapy are among the leading fields."], "ivf": ["A known name in IVF", "North Cyprus has gained an international reputation for IVF treatment. According to the report, the island treats about 20,000 foreign patients a year (2017 estimate)."], "sac": ["Hair transplants", "Hair transplant patients combine treatment with a holiday. Costs are significantly lower than in other developed countries, with direct flights to Ercan from London and Istanbul."], "dis": ["Dental and prosthetic clinics", "Dentistry is one of the established fields of the island's health tourism. Each year more patients come from abroad for implants and prosthetics."]}}, "ru": {"e": "Новости Северного Кипра", "h": "Остров <em>быстро меняется.</em>", "l": "От инфраструктуры до медицины, от права до образования: что выделяет Северный Кипр для инвесторов — с источниками.", "c": {"all": "Все", "yatirim": "Инвестиции", "altyapi": "Инфраструктура", "yasam": "Жизнь", "saglik": "Здоровье"}, "src": "Источник", "fl": {"forbes": "место", "hukuk": "правовая основа", "vergi": "налог на аренду", "su": "трубопровод", "gaz": "трубопровод", "ercan": "пассажиров / год", "deniz": "отличная вода", "sahil": "солнечных дней / год", "okul": "университета", "golf": "лунок", "ivf": "иностр. пациентов / год"}, "i": {"forbes": ["Forbes: Искеле — лучшая в мире покупка у моря", "В Глобальном обзоре недвижимости 2021 года, о котором писал Forbes, Искеле занял первое место в мире по инвестициям у моря. Северный Кипр назван лучшим в Средиземноморье за малую часть цены."], "hukuk": ["Правовая система на основе английского права", "Правопорядок Северного Кипра опирается на англосаксонские основы британской эпохи; компании и сейчас создаются по Главе 113, основанной на британском Законе о компаниях 1959 года. По словам юристов, дела решаются гораздо быстрее, чем в Турции."], "vergi": ["Налоги, удобные для инвестора", "Частные владельцы платят фиксированный налог 10% с дохода от аренды. Один раз в жизни можно продать объект без налога, а наследство супругу и детям фактически не облагается. Актуальные ставки мы уточняем перед покупкой."], "su": ["Вода из Турции по дну моря", "Открытый в 2015 году проект водоснабжения доставляет воду на 107 км от плотины Алакёпрю в Анамуре до плотины Гечиткёй в Кирении, из них 80 км по дну моря. Проект рассчитан на обеспечение острова водой на 50 лет."], "gaz": ["Газопровод Турция — Северный Кипр", "Объявленная министром энергетики Алпарсланом Байрактаром линия длиной 97 км доставит газ из Аланьи на остров. Цель — 2028 год: перевести электростанции с жидкого топлива на более чистый газ."], "ercan": ["Новый аэропорт Эрджан: 10 млн пассажиров в год", "Новый терминал, открытый в июле 2023 года, в шесть раз больше прежнего. Новая полоса длиной 3100 м принимает любые пассажирские самолёты. Перелёт из Стамбула — около полутора часов."], "deniz": ["Самые чистые воды для купания в Европе", "В отчёте Европейского агентства по окружающей среде за сезон 2025 года Кипр занял первое место в Европе: 100% мест для купания оценены как «отличные». Станции мониторинга находятся на юге острова; северное побережье выходит в то же море."], "sahil": ["Длинное нетронутое побережье", "Около 300 солнечных дней в году и побережье от бухт Кирении до длинных пляжей Искеле и Золотого пляжа Карпаса — во многом всё ещё нетронутое."], "guven": ["Спокойная и безопасная жизнь", "Небольшое сообщество, где люди знают друг друга, и неторопливый ритм жизни. Северный Кипр известен как спокойное место для семей, пенсионеров и удалённых работников."], "okul": ["Университеты и международные дипломы", "Более 100 000 студентов учатся в 23 университетах Северного Кипра. Такие школы, как English School of Kyrenia, обучают более 1200 учеников из 40+ стран по программам IGCSE, A-Level и IB."], "golf": ["Гольф-туризм: Korineum", "Открытое в Эсентепе в 2007 году, Korineum — первое поле на 18 лунок на Северном Кипре. С каждой лунки видны горы и море, а играть можно круглый год."], "saglik": ["Современные медицинские центры", "Университетские клиники с передовой диагностикой и лечением принимают и жителей острова, и пациентов из-за рубежа. Ведущие направления — кардиология, онкология и физиотерапия."], "ivf": ["Известное направление ЭКО", "Северный Кипр получил международную известность благодаря ЭКО. По данным источника, остров ежегодно принимает около 20 000 иностранных пациентов (оценка 2017 года)."], "sac": ["Пересадка волос", "Пациенты совмещают пересадку волос с отдыхом. Стоимость заметно ниже, чем в других развитых странах; в Эрджан есть прямые рейсы из Лондона и Стамбула."], "dis": ["Стоматология и протезирование", "Стоматология — одно из устоявшихся направлений медицинского туризма острова. С каждым годом всё больше пациентов приезжают за имплантами и протезами."]}}, "fa": {"e": "اخبار قبرس شمالی", "h": "جزیره‌ای <em>در حال تحول.</em>", "l": "از زیرساخت تا سلامت، از حقوق تا آموزش: تحولاتی که قبرس شمالی را برای سرمایه‌گذاران برجسته می‌کند، همراه با منبع.", "c": {"all": "همه", "yatirim": "سرمایه‌گذاری", "altyapi": "زیرساخت", "yasam": "زندگی", "saglik": "سلامت"}, "src": "منبع", "fl": {"forbes": "رتبه", "hukuk": "ریشهٔ حقوقی", "vergi": "مالیات اجاره", "su": "خط لوله", "gaz": "خط لوله", "ercan": "مسافر در سال", "deniz": "آب عالی", "sahil": "روز آفتابی در سال", "okul": "دانشگاه", "golf": "حفره", "ivf": "بیمار خارجی در سال"}, "i": {"forbes": ["فوربس: ایسکله بهترین خرید ساحلی جهان", "در نظرسنجی جهانی املاک ۲۰۲۱ که فوربس منتشر کرد، ایسکله رتبهٔ نخست جهان در سرمایه‌گذاری ساحلی را گرفت. قبرس شمالی بهترینِ مدیترانه با کسری از هزینه توصیف شد."], "hukuk": ["نظام حقوقی بر پایهٔ حقوق انگلیسی", "نظم حقوقی قبرس شمالی بر پایه‌های آنگلوساکسونِ دوران بریتانیا است؛ شرکت‌ها هنوز طبق فصل ۱۱۳، برگرفته از قانون شرکت‌های بریتانیا ۱۹۵۹، ثبت می‌شوند. به گفتهٔ وکلا پرونده‌ها بسیار سریع‌تر از ترکیه به نتیجه می‌رسند."], "vergi": ["ساختار مالیاتی مناسب سرمایه‌گذار", "مالکان حقیقی ۱۰٪ مالیات ثابت بر درآمد اجاره می‌پردازند. یک بار در عمر می‌توان یک ملک را بدون مالیات فروخت و ارث به همسر و فرزندان عملاً بدون مالیات است. نرخ‌های روز را پیش از خرید برایتان تأیید می‌کنیم."], "su": ["آب از ترکیه از زیر دریا", "پروژهٔ تأمین آب قبرس که در ۲۰۱۵ افتتاح شد، آب را با خطی ۱۰۷ کیلومتری، که ۸۰ کیلومترش زیر دریاست، از سد آلاکوپرو در آنامور به سد گچیت‌کوی در گیرنه می‌رساند. این پروژه برای تأمین آب جزیره تا ۵۰ سال طراحی شده است."], "gaz": ["خط لولهٔ گاز ترکیه–قبرس شمالی در راه است", "این خط ۹۷ کیلومتری که آلپ‌ارسلان بایراکتار، وزیر انرژی، اعلام کرد گاز طبیعی را از آلانیا به جزیره می‌برد. هدف سال ۲۰۲۸ است تا نیروگاه‌ها از سوخت مایع به گاز پاک‌تر منتقل شوند."], "ercan": ["فرودگاه جدید ارجان: ۱۰ میلیون مسافر در سال", "ترمینال جدید که در ژوئیهٔ ۲۰۲۳ افتتاح شد، شش برابر ترمینال قبلی است. باند جدید ۳۱۰۰ متری برای همهٔ هواپیماهای مسافربری مناسب است. پرواز از استانبول حدود یک ساعت و نیم است."], "deniz": ["پاک‌ترین آب‌های شنای اروپا", "در گزارش آژانس محیط زیست اروپا برای فصل ۲۰۲۵، قبرس با «عالی» بودن ۱۰۰٪ محل‌های شنا رتبهٔ نخست اروپا را گرفت. ایستگاه‌های پایش در جنوب جزیره‌اند؛ ساحل شمالی رو به همان دریاست."], "sahil": ["خط ساحلی طولانی و بکر", "جزیره با حدود ۳۰۰ روز آفتابی در سال، ساحلی دارد که از خلیج‌های گیرنه تا سواحل شنی ایسکله و ساحل طلایی کارپاس امتداد دارد و بخش بزرگی از آن هنوز بکر است."], "guven": ["زندگی آرام و امن جزیره", "جامعه‌ای کوچک که مردم یکدیگر را می‌شناسند و ریتم آرام زندگی. قبرس شمالی برای خانواده‌ها، بازنشستگان و دورکاران به آرامش شناخته می‌شود."], "okul": ["دانشگاه‌ها و مدارک بین‌المللی", "بیش از ۱۰۰ هزار دانشجو در ۲۳ دانشگاه قبرس شمالی تحصیل می‌کنند. مدارسی مانند English School of Kyrenia بیش از ۱۲۰۰ دانش‌آموز از بیش از ۴۰ ملیت را با برنامه‌های IGCSE، A-Level و IB آموزش می‌دهند."], "golf": ["گردشگری گلف: کورینئوم", "کورینئوم که در ۲۰۰۷ در اسنتپه افتتاح شد، نخستین زمین گلف ۱۸ حفره‌ای قبرس شمالی است. از هر حفره منظرهٔ کوه و دریا پیداست و زمین در تمام سال قابل بازی است."], "saglik": ["مراکز درمانی پیشرفته", "بیمارستان‌های دانشگاهی با تصویربرداری و درمان پیشرفته به ساکنان و بیماران خارجی خدمت می‌دهند. قلب، انکولوژی و فیزیوتراپی از حوزه‌های برجسته‌اند."], "ivf": ["مقصدی شناخته‌شده برای آی‌وی‌اف", "قبرس شمالی در درمان آی‌وی‌اف شهرت بین‌المللی یافته است. طبق گزارش، جزیره سالانه حدود ۲۰ هزار بیمار خارجی را درمان می‌کند (برآورد ۲۰۱۷)."], "sac": ["کاشت مو", "بیماران کاشت مو درمان را با تعطیلات همراه می‌کنند. هزینه‌ها به‌طور محسوسی کمتر از دیگر کشورهای توسعه‌یافته است و پرواز مستقیم از لندن و استانبول به ارجان وجود دارد."], "dis": ["مراکز دندانپزشکی و پروتز", "دندانپزشکی از حوزه‌های جاافتادهٔ گردشگری سلامت جزیره است. هر سال بیماران بیشتری برای ایمپلنت و پروتز از خارج می‌آیند."]}}, "de": {"e": "Nachrichten aus Nordzypern", "h": "Eine Insel <em>im Aufbruch.</em>", "l": "Von Infrastruktur bis Gesundheit, von Recht bis Bildung: was Nordzypern für Investoren hervorhebt – mit Quellen.", "c": {"all": "Alle", "yatirim": "Investition", "altyapi": "Infrastruktur", "yasam": "Leben", "saglik": "Gesundheit"}, "src": "Quelle", "fl": {"forbes": "Rang", "hukuk": "Rechtsgrundlage", "vergi": "Steuer auf Mieten", "su": "Pipeline", "gaz": "Pipeline", "ercan": "Passagiere / Jahr", "deniz": "exzellentes Wasser", "sahil": "Sonnentage / Jahr", "okul": "Universitäten", "golf": "Löcher", "ivf": "ausl. Patienten / Jahr"}, "i": {"forbes": ["Forbes: Iskele weltbester Kauf am Strand", "In der von Forbes berichteten Global Property Survey 2021 belegte Iskele weltweit Platz eins für Strandinvestitionen. Nordzypern wurde als das Beste des Mittelmeers zu einem Bruchteil der Kosten beschrieben."], "hukuk": ["Ein Rechtssystem auf englischer Grundlage", "Die Rechtsordnung Nordzyperns beruht auf angelsächsischen Grundlagen aus britischer Zeit; Firmen werden noch nach Kapitel 113 gegründet, das auf dem britischen Companies Law von 1959 basiert. Laut Anwälten werden Verfahren deutlich schneller entschieden als in der Türkei."], "vergi": ["Investorenfreundliche Steuern", "Private Vermieter zahlen pauschal 10 % Steuer auf Mieteinnahmen. Einmal im Leben ist ein steuerfreier Verkauf einer Immobilie möglich, und Erbschaften an Ehepartner und Kinder sind praktisch steuerfrei. Aktuelle Sätze prüfen wir vor dem Kauf für Sie."], "su": ["Wasser aus der Türkei unter dem Meer", "Das 2015 eröffnete Wasserprojekt leitet Wasser über 107 km vom Alaköprü-Damm in Anamur zum Geçitköy-Damm bei Kyrenia, 80 km davon unter dem Meer. Es soll den Wasserbedarf der Insel für 50 Jahre decken."], "gaz": ["Gaspipeline Türkei–Nordzypern kommt", "Die von Energieminister Alparslan Bayraktar angekündigte 97-km-Leitung soll Erdgas von Alanya auf die Insel bringen. Ziel ist 2028: Kraftwerke von Flüssigbrennstoff auf saubereres Gas umstellen."], "ercan": ["Neuer Flughafen Ercan: 10 Mio. Passagiere pro Jahr", "Das im Juli 2023 eröffnete Terminal ist sechsmal so groß wie das alte. Die neue 3.100-m-Piste eignet sich für alle Passagierflugzeuge. Der Flug ab Istanbul dauert etwa anderthalb Stunden."], "deniz": ["Europas sauberste Badegewässer", "Im Bericht der Europäischen Umweltagentur zur Saison 2025 lag Zypern mit 100 % „ausgezeichneten“ Badestellen auf Platz eins in Europa. Die Messstationen liegen im Süden der Insel; die Nordküste grenzt an dasselbe Meer."], "sahil": ["Lange, unberührte Küste", "Mit rund 300 Sonnentagen im Jahr reicht die Küste von den Buchten Kyrenias über Iskeles lange Sandstrände bis zum Golden Beach der Karpaz – vieles davon noch unberührt."], "guven": ["Ruhiges, sicheres Inselleben", "Eine kleine Gemeinschaft, in der man sich kennt, und ein entspanntes Lebenstempo. Nordzypern ist als ruhiger Wohnort für Familien, Ruheständler und Remote-Arbeiter bekannt."], "okul": ["Universitäten und internationale Abschlüsse", "Über 100.000 Studierende lernen an 23 Universitäten in Nordzypern. Schulen wie die English School of Kyrenia führen über 1.200 Schüler aus mehr als 40 Nationen zu IGCSE, A-Level und IB-Abschlüssen."], "golf": ["Golftourismus: Korineum", "Korineum, 2007 in Esentepe eröffnet, ist der erste 18-Loch-Platz in Nordzypern. Von jedem Loch blickt man auf Berge und Meer; gespielt wird ganzjährig."], "saglik": ["Moderne medizinische Zentren", "Universitätskliniken mit moderner Bildgebung und Therapie versorgen Einwohner und Patienten aus dem Ausland. Kardiologie, Onkologie und Physiotherapie gehören zu den führenden Bereichen."], "ivf": ["Eine bekannte Adresse für IVF", "Nordzypern hat sich mit IVF-Behandlungen international einen Namen gemacht. Laut Bericht behandelt die Insel jährlich rund 20.000 ausländische Patienten (Schätzung 2017)."], "sac": ["Haartransplantation", "Patienten verbinden die Haartransplantation mit Urlaub. Die Kosten liegen deutlich unter denen anderer Industrieländer; es gibt Direktflüge nach Ercan aus London und Istanbul."], "dis": ["Zahn- und Prothetikzentren", "Zahnmedizin ist ein etablierter Bereich des Gesundheitstourismus der Insel. Jedes Jahr kommen mehr Patienten aus dem Ausland für Implantate und Prothesen."]}}, "pl": {"e": "Wiadomości z Cypru Północnego", "h": "Wyspa, która <em>szybko się zmienia.</em>", "l": "Od infrastruktury po zdrowie, od prawa po edukację: co wyróżnia Cypr Północny dla inwestorów — ze źródłami.", "c": {"all": "Wszystko", "yatirim": "Inwestycje", "altyapi": "Infrastruktura", "yasam": "Życie", "saglik": "Zdrowie"}, "src": "Źródło", "fl": {"forbes": "miejsce", "hukuk": "podstawa prawna", "vergi": "podatek od najmu", "su": "rurociąg", "gaz": "rurociąg", "ercan": "pasażerów / rok", "deniz": "doskonała woda", "sahil": "dni słońca / rok", "okul": "uczelni", "golf": "dołków", "ivf": "zagr. pacjentów / rok"}, "i": {"forbes": ["Forbes: Iskele najlepszą inwestycją przy plaży na świecie", "W Global Property Survey 2021, o którym pisał Forbes, Iskele zajęło pierwsze miejsce na świecie w inwestycjach przy plaży. Cypr Północny opisano jako to, co najlepsze na Morzu Śródziemnym, za ułamek ceny."], "hukuk": ["System prawny oparty na prawie angielskim", "Porządek prawny Cypru Północnego opiera się na anglosaskich podstawach z czasów brytyjskich; spółki nadal zakłada się według Rozdziału 113, opartego na brytyjskim Companies Law z 1959 r. Według prawników sprawy kończą się znacznie szybciej niż w Turcji."], "vergi": ["Przyjazne inwestorom podatki", "Prywatni właściciele płacą stały 10% podatek od najmu. Raz w życiu można sprzedać nieruchomość bez podatku, a spadek dla małżonka i dzieci jest praktycznie wolny od podatku. Aktualne stawki potwierdzamy przed zakupem."], "su": ["Woda z Turcji po dnie morza", "Otwarty w 2015 r. projekt dostarcza wodę 107-kilometrowym rurociągiem z zapory Alaköprü w Anamurze do zapory Geçitköy w Kyrenii, z czego 80 km biegnie pod morzem. Zaprojektowano go na 50 lat zaopatrzenia wyspy."], "gaz": ["Nadchodzi gazociąg Turcja–Cypr Północny", "Ogłoszona przez ministra energii Alparslana Bayraktara 97-kilometrowa linia ma dostarczać gaz z Alanyi na wyspę. Cel to 2028 r.: przestawienie elektrowni z paliwa płynnego na czystszy gaz."], "ercan": ["Nowe lotnisko Ercan: 10 mln pasażerów rocznie", "Otwarty w lipcu 2023 r. terminal jest sześć razy większy od starego. Nowy pas o długości 3100 m przyjmuje każdy samolot pasażerski. Lot ze Stambułu trwa około półtorej godziny."], "deniz": ["Najczystsze kąpieliska w Europie", "W raporcie Europejskiej Agencji Środowiska za sezon 2025 Cypr zajął pierwsze miejsce w Europie — 100% kąpielisk oceniono jako „doskonałe”. Stacje pomiarowe są na południu wyspy; północne wybrzeże leży nad tym samym morzem."], "sahil": ["Długie, dzikie wybrzeże", "Około 300 słonecznych dni w roku i wybrzeże od zatok Kyrenii po długie plaże Iskele i Złotą Plażę Karpasu — w dużej części wciąż dzikie."], "guven": ["Spokojne i bezpieczne życie na wyspie", "Mała społeczność, w której ludzie się znają, i spokojne tempo życia. Cypr Północny słynie jako spokojne miejsce dla rodzin, emerytów i osób pracujących zdalnie."], "okul": ["Uczelnie i międzynarodowe dyplomy", "Ponad 100 000 studentów uczy się na 23 uczelniach Cypru Północnego. Szkoły takie jak English School of Kyrenia kształcą ponad 1200 uczniów z 40+ krajów w programach IGCSE, A-Level i IB."], "golf": ["Turystyka golfowa: Korineum", "Otwarte w Esentepe w 2007 r. Korineum to pierwsze 18-dołkowe pole na Cyprze Północnym. Z każdego dołka widać góry i morze, a grać można przez cały rok."], "saglik": ["Nowoczesne centra medyczne", "Szpitale uniwersyteckie z nowoczesną diagnostyką i leczeniem przyjmują mieszkańców i pacjentów z zagranicy. Wiodące dziedziny to kardiologia, onkologia i fizjoterapia."], "ivf": ["Znany adres in vitro", "Cypr Północny zyskał międzynarodową renomę w leczeniu in vitro. Według źródła wyspa przyjmuje rocznie około 20 000 zagranicznych pacjentów (szacunek z 2017 r.)."], "sac": ["Przeszczep włosów", "Pacjenci łączą przeszczep włosów z urlopem. Koszty są wyraźnie niższe niż w innych krajach rozwiniętych, a do Ercan latają bezpośrednie loty z Londynu i Stambułu."], "dis": ["Stomatologia i protetyka", "Stomatologia to jedna z ugruntowanych dziedzin turystyki medycznej wyspy. Co roku więcej pacjentów przyjeżdża z zagranicy po implanty i protezy."]}}}};

  try { const s = localStorage.getItem("kibris_lang"); if (LANGS.includes(s)) return s; } catch(e){}

    const p = String(l).slice(0,2).toLowerCase();
    if (LANGS.includes(p)) return p;

  return "tr";
}

/* ================= DENİZ ANİMASYONU ================= */
(function(){
  const c = $("sea"); if(!c) return;
  const x = c.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let w,h,t=0;
  function size(){ const r=c.getBoundingClientRect(); w=c.width=r.width*devicePixelRatio; h=c.height=r.height*devicePixelRatio; }
  size(); addEventListener("resize", size);
  const layers=[{a:6,f:.006,s:.6,c:"rgba(15,90,120,.85)",y:.18},{a:8,f:.009,s:-.9,c:"rgba(11,74,99,.9)",y:.42},{a:5,f:.013,s:1.3,c:"rgba(8,52,72,1)",y:.68}];
  function draw(){
    x.clearRect(0,0,w,h);
    layers.forEach(Ly=>{
      x.beginPath(); x.moveTo(0,h);
      for(let px=0;px<=w;px+=8){ x.lineTo(px, h*Ly.y + Math.sin(px*Ly.f/devicePixelRatio + t*Ly.s*.03)*Ly.a*devicePixelRatio); }
      x.lineTo(w,h); x.closePath(); x.fillStyle=Ly.c; x.fill();
    });
    x.fillStyle="rgba(242,181,92,.35)";
    for(let i=0;i<7;i++){ const yy=h*(.25+i*.1); const ww=(30-i*3+Math.sin(t*.05+i)*6)*devicePixelRatio; x.fillRect(w*.86-ww/2, yy, ww, 2*devicePixelRatio); }
    t++; if(!reduce) requestAnimationFrame(draw);
  }
  draw();
})();

/* ================= HERO VİDEO + SES ================= */
const v=$("herovid"), sbtn=$("soundbtn");
let soundOn=false, motionOK=true;
(function(){
  if(!v) return;
  const portrait = matchMedia("(max-aspect-ratio: 1/1)").matches;
  const can = t => !!v.canPlayType('video/mp4; codecs="'+t+'"');
  const codec = can("av01.0.08M.08") ? "av1" : (can("hvc1.1.6.L120.90") ? "hevc" : "avc");   // en verimli desteklenen format
  const size = portrait ? "m" : (codec==="av1" ? "q" : "d");
  const url = "assets/kibris/hero5-" + size + "-" + codec + ".mp4";
  v.poster = "assets/kibris/hero5-" + (portrait ? "m" : "q") + ".jpg";
  v.muted = true; v.loop = true;
  const saveData = navigator.connection && navigator.connection.saveData;
  if (matchMedia("(prefers-reduced-motion: reduce)").matches || saveData) { motionOK=false; v.src=url; v.preload="none"; return; }
  // Videonun tamamını önce indir, sonra oynat: oynarken hiç takılma/bulanıklaşma olmaz
  const start = src => { v.src = src; v.play().catch(()=>{}); };
  fetch(url).then(r=>{ if(!r.ok) throw 0; return r.blob(); })
    .then(b=>start(URL.createObjectURL(b)))
    .catch(()=>start(url));
  const kick=()=>{ if(v.src && v.paused && motionOK) v.play().catch(()=>{}); ["touchstart","scroll","click"].forEach(e=>removeEventListener(e,kick)); };
  ["touchstart","scroll","click"].forEach(e=>addEventListener(e,kick,{passive:true}));
})();
function soundLabel(){ $("soundlbl").textContent = soundOn ? D().dyn.snd_off : D().dyn.snd_on; sbtn.setAttribute("aria-pressed", soundOn); }
sbtn.addEventListener("click", ()=>{
  soundOn=!soundOn;
  v.muted=!soundOn; v.volume=1;
  if(soundOn){ v.play().catch(()=>{ soundOn=false; v.muted=true; soundLabel(); }); track("Ses",{dil:L}); }
  else if(!motionOK) v.pause();
  soundLabel();
});
document.addEventListener("visibilitychange",()=>{ if(document.hidden) v.pause(); else if(motionOK || soundOn) v.play().catch(()=>{}); });

let regionIdx = 4, regionChosen = "";
function buildRegions(){
  const tabs=$("tabs"), dots=$("dots");
  tabs.innerHTML=""; dots.innerHTML="";
  REGIONS.forEach((r,i)=>{
    const name = D().regions[r.id].name;
    const b=document.createElement("button"); b.className="tab"; b.setAttribute("role","tab"); b.textContent=name; b.type="button";

  $("map-sea").textContent = D().dyn.map_sea;
  $("map-south").textContent = D().dyn.map_south;
  pickRegion(regionIdx,false);
}
function pickRegion(i, user){
  regionIdx=i;
  const r=D().regions[REGIONS[i].id];
  if(user) regionChosen = I18N.tr.regions[REGIONS[i].id].name;
  $("tabs").querySelectorAll(".tab").forEach((t,j)=>t.setAttribute("aria-selected", j===i));

}

function drawTour(){
  const ch=D().ch.tour, data=CHARTS.data.tour, est=CHARTS.data.tourEst;
  const first=data[0][1], last=data[data.length-1][1];
  chartShell("tour",{t:ch.t,s:ch.s,kv:fmtM(last),k:ch.k,d:fill(ch.d,{x:fmtN(last/first,1)}),n:ch.n,
    table:`<tr><th>${D().ch.yr}</th><th></th></tr>`+data.map(([y,v])=>`<tr><td>${y}</td><td>${est.includes(y)?"~":""}${fmtN(v)}</td></tr>`).join("")});
  const box=$("pl-tour"), W=box.clientWidth||600, H=MOB()?210:250, m={t:22,r:6,b:24,l:34};
  const s=svgEl(W,H), iw=W-m.l-m.r, ih=H-m.t-m.b, max=3e6;
  const slots=data.length+1, bw=iw/slots, y=v=>m.t+ih-(v/max)*ih;
  [0,1e6,2e6,3e6].forEach(v=>{add(s,"line",{x1:m.l,x2:W-m.r,y1:y(v),y2:y(v),class:"gl"});add(s,"text",{x:m.l-6,y:y(v)+3,"text-anchor":"end"},v?v/1e6+"M":"0");});
  let slot=0;
  data.forEach(([yr,v],i)=>{
    if(i>0 && yr-data[i-1][0]>1){ const gx=m.l+slot*bw+bw/2; add(s,"text",{x:gx,y:m.t+ih-6,"text-anchor":"middle"},"···"); slot++; }
    const x=m.l+slot*bw+bw*0.18, w=bw*0.64, top=y(v), isLast=i===data.length-1, isEst=est.includes(yr);
    const g=add(s,"g",{class:"bar-h"});
    const r=Math.min(4,w/2), h=m.t+ih-top;
    add(g,"path",{d:`M${x},${m.t+ih}V${top+r}Q${x},${top} ${x+r},${top}H${x+w-r}Q${x+w},${top} ${x+w},${top+r}V${m.t+ih}Z`,fill:"var(--c1)","fill-opacity":isLast?1:(isEst?0.45:0.7),class:"bm"});
    add(g,"rect",{x:m.l+slot*bw,y:m.t,width:bw,height:ih,fill:"transparent"});
    if(isLast) add(s,"text",{x:x+w/2,y:top-6,"text-anchor":"middle",class:"vl"},fmtM(v));
    if(yr===2020) add(s,"text",{x:x+w/2,y:top-6,"text-anchor":"middle"},ch.dip);
    const show=!MOB()||yr%5===0||isLast||yr===2019;
    if(show) add(s,"text",{x:x+w/2,y:H-6,"text-anchor":"middle"},MOB()?"'"+String(yr).slice(2):yr);
    const cx=x+w/2;
    g.addEventListener("pointerenter",()=>tip("tour",cx,top,`${isEst?"~":""}${fmtN(v)}<small>${yr}${isEst?" · "+ch.est:""}</small>`));
    g.addEventListener("pointerleave",()=>untip("tour"));
    slot++;
  });
  box.appendChild(s);
}

function linePath(pts){return pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+","+p[1].toFixed(1)).join("");}
function drawProp(){
  const ch=D().ch.prop, d=CHARTS.data.prop;

  const labs=d.lab.map(s=>{const [y,mm]=s.split("-");return mf.format(new Date(+y,+mm-1,15));});
  const pct=Math.round((d.apt[d.apt.length-1]/d.apt[0]-1)*100);
  chartShell("prop",{t:ch.t,s:ch.s,kv:"+"+pct+"%",k:ch.k,d:ch.d,n:ch.n,
    legend:`<div class="ch-legend"><span><i style="background:var(--c1)"></i>${ch.apt}</span><span><i style="background:var(--c2)"></i>${ch.house}</span></div>`,
    table:`<tr><th></th><th>${ch.apt}</th><th>${ch.house}</th></tr>`+labs.map((l,i)=>`<tr><td>${l}</td><td>£${fmtN(d.apt[i])}</td><td>£${fmtN(d.house[i])}</td></tr>`).join("")});
  const box=$("pl-prop"), W=box.clientWidth||420, H=MOB()?200:220, m={t:16,r:58,b:24,l:40};
  const s=svgEl(W,H), iw=W-m.l-m.r, ih=H-m.t-m.b, lo=400, hi=1400;
  const x=i=>m.l+i*(iw/(labs.length-1)), y=v=>m.t+ih-((v-lo)/(hi-lo))*ih;

  labs.forEach((l,i)=>{ if(!MOB()||i%2===0||i===labs.length-1) add(s,"text",{x:x(i),y:H-6,"text-anchor":"middle"},l); });
  const series=[["apt","var(--c1)"],["house","var(--c2)"]];

  $("r-s3").innerHTML= m2? gbp(s3/m2)+`<small>${d.per_mo}</small>` : gbp(s3); $("r-s3l").textContent= m2? fill(d.s3l,{n:m2}) : d.s3once;
  const y=rent*12/p*100;
  $("r-yield").textContent=(L==="tr"?"%":"")+y.toLocaleString(D().locale,{maximumFractionDigits:1})+(L==="tr"?"":"%");
  $("r-yl").textContent=" "+fill(d.per_yr,{x:gbp(rent*12)});
}

const KEYS = ["amac","butce","odeme","zaman","tur","iletisim"];
const ans = {};          // seçilen şıkların index'i
const contact = {ad:"", tel:"", mail:"", kvkk:false};
let step = 0, sent = null;
$("prog").innerHTML = KEYS.map(()=>"<i></i>").join("");
const optLabel = (k,i,lang) => I18N[lang||L].q[k].o[i][0];

function saveContact(){
  if(!$("f-ad")) return;
  contact.ad=$("f-ad").value; contact.tel=$("f-tel").value; contact.mail=$("f-mail").value; contact.kvkk=$("f-kvkk").checked;
}
function render(){
  if(sent){ done(sent); return; }
  const c=D().c, esc=s=>String(s).replace(/"/g,"&quot;");
  $("prog").querySelectorAll("i").forEach((el,i)=>el.classList.toggle("on", i<=step));
  const key = KEYS[step];
  if(key==="iletisim"){
    $("qbox").innerHTML = `<div class="qhead">${c.last} · ${step+1}/${KEYS.length}</div>
      <div class="q">${c.q}</div>
      <div class="inp"><label for="f-ad">${c.name}</label><input id="f-ad" autocomplete="name" placeholder="${esc(c.name_ph)}" value="${esc(contact.ad)}"></div>
      <div class="inp"><label for="f-tel">${c.tel}</label><input id="f-tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="${esc(c.tel_ph)}" value="${esc(contact.tel)}"></div>
      <div class="inp"><label for="f-mail">${c.mail} <span style="font-weight:400;color:var(--muted)">${c.opt}</span></label><input id="f-mail" type="email" autocomplete="email" placeholder="name@mail.com" value="${esc(contact.mail)}"></div>
      <label class="consent"><input type="checkbox" id="f-kvkk" ${contact.kvkk?"checked":""}><span>${c.consent}</span></label>
      <div class="err" id="f-err" role="alert"></div>`;
    $("fnav").innerHTML = `<button type="button" class="back" id="f-back">${c.back}</button><button type="submit" class="btn submit" id="f-send">${c.submit}</button>`;
    $("f-back").onclick=()=>{saveContact();step--;render();};
    return;
  }
  const q=Q(key);
  $("qbox").innerHTML = `<div class="qhead">${c.qn} ${step+1}/${KEYS.length}</div><div class="q">${q.q}</div>
    <div class="opts">${q.o.map(([t,s],i)=>`<button type="button" class="opt ${ans[key]===i?"sel":""}" data-i="${i}">${t}${s?`<span>${s}</span>`:""}</button>`).join("")}</div>`;
  $("qbox").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    ans[key]=+b.dataset.i; b.classList.add("sel");
    if(step===0) track("FormBasladi",{dil:L});
    setTimeout(()=>{ step++; render(); $("fcard").scrollIntoView({behavior:"smooth",block:"start"}); }, 180);
  });
  $("fnav").innerHTML = step>0 ? `<button type="button" class="back" id="f-back">${c.back}</button><span></span>` : "";
  if(step>0) $("f-back").onclick=()=>{step--;render();};
}

/* sıcaklık puanı — Türkçe şık indexlerine göre, dil bağımsız */
function score(){
  let s=0;
  s += [5,15,22,25][ans.butce]||0;
  s += [35,25,12,2][ans.zaman]||0;
  s += [15,20,10,3][ans.odeme]||0;
  s += [20,15,8][ans.tur]||0;
  return Math.min(100,s);
}

/* telefon: + ile başlıyorsa uluslararası, değilse Türkiye cep numarası */
function normTel(raw){
  const r=String(raw).trim(); let d=r.replace(/\D/g,"");
  if(r.startsWith("+") || r.startsWith("00")){
    if(r.startsWith("00")) d=d.slice(2);
    if(d.startsWith("90")) { d=d.slice(2); return d.length===10 ? "0"+d : null; }
    return d.length>=8 && d.length<=15 ? "+"+d : null;
  }
  if(d.startsWith("90") && d.length===12) d=d.slice(2);
  if(d.startsWith("0")) d=d.slice(1);
  return d.length===10 ? "0"+d : null;
}

$("leadform").addEventListener("submit", async e=>{
  e.preventDefault();
  saveContact();
  const err=$("f-err"), E=D().err, c=D().c;
  const ad=contact.ad.trim(), tel=normTel(contact.tel);
  if(ad.length<3){err.textContent=E.name;$("f-ad").focus();return;}
  if(!tel){err.textContent=E.tel;$("f-tel").focus();return;}
  if(!contact.kvkk){err.textContent=E.kvkk;return;}
  err.textContent="";
  const btn=$("f-send"); btn.disabled=true; btn.textContent=c.sending;
  const payload = {
    ad, tel, mail:contact.mail.trim(), dil:L,
    amac:optLabel("amac",ans.amac,"tr"), butce:optLabel("butce",ans.butce,"tr"), odeme:optLabel("odeme",ans.odeme,"tr"),
    zaman:optLabel("zaman",ans.zaman,"tr"), tur:optLabel("tur",ans.tur,"tr"),
    puan:score(), bolge:regionChosen,
    fiyat_sim: calcTouched? +$("price").value : "", sure_sn: Math.round((Date.now()-t0)/1000), scroll: maxScroll,
    ...SRC, sayfa: location.href.split("?")[0], zaman_damgasi: new Date().toISOString()
  };
  let ok=true;
  if(CONFIG.GAS_URL){
    try{ await fetch(CONFIG.GAS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)}); }
    catch(x){ ok=false; }
  }
  if(!ok){ btn.disabled=false; btn.textContent=c.retry; err.textContent=E.net; return; }
  try{ window.fbq && fbq('track','Lead',{content_name:"Kibris", value:payload.puan, dil:L}); }catch(x){}
  sent = payload;
  done(sent);
});

function waLink(p){
  const msg = p ? fill(D().wa,{ad:p.ad, butce:optLabel("butce",ans.butce), amac:optLabel("amac",ans.amac)}) : D().wa0;
  return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
}

function done(p){
  const T=D().done;
  $("prog").querySelectorAll("i").forEach(i=>i.classList.add("on"));
  const first = (p.ad||"").split(" ")[0];
  $("qbox").innerHTML = `<div class="done">
    <div class="tick">✓</div>
    <div class="q" style="margin-bottom:0">${fill(T.title,{name:first})}</div>
    <p>${fill(T.body,{budget:optLabel("butce",ans.butce), tel:p.tel})}</p>
    <p style="margin-top:16px">${T.nowait}</p>
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:14px">
      <a class="btn" style="background:#1FA855;color:#fff" href="${waLink(p)}" target="_blank" rel="noopener">${T.wa}</a>
      <span class="mono" style="font-size:.85rem;color:var(--muted)">${T.call}</span>
    </div>
    ${CONFIG.GAS_URL?"":`<div class="demo">${T.demo}</div>`}
  </div>`;
  $("fnav").innerHTML="";
}

const PIC={acente:'<path d="M16 11a4 4 0 10-8 0"/><circle cx="12" cy="6" r="3"/><path d="M3 21v-2a4 4 0 014-4h2M21 21v-2a4 4 0 00-4-4h-2"/><path d="M9 17l3 3 3-3"/>',sunum:'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/><path d="M7 12l3-3 2 2 4-4"/>'};
let pType=null;
function renderPartners(){
  const p=D().pt; $("pt-e").textContent=p.e; $("pt-h").innerHTML=p.h; $("pt-l").textContent=p.l;
  [["acente",p.a],["sunum",p.s]].forEach(([k,o])=>{

function openPartner(k,keep){
  const p=D().pt, f=p.f, esc=s=>String(s).replace(/"/g,"&quot;"); pType=k;
  const prev={}; if(keep) $("pform").querySelectorAll("[id]").forEach(e=>prev[e.id]=e.type==="checkbox"?e.checked:e.value);
  $("pm-title").textContent=(k==="acente"?p.a:p.s).t;
  $("pm-x").setAttribute("aria-label",f.close);
  const inp=(id,lab,type="text",opt)=>`<div class="inp"><label for="${id}">${lab}${opt?` <span style="font-weight:400;color:var(--muted)">${f.opt}</span>`:""}</label><input id="${id}" type="${type}"${type==="tel"?' inputmode="tel"':""}></div>`;
  $("pform").innerHTML = inp("pf-name",f.name) + inp("pf-firm",k==="acente"?f.firm_a:f.firm_s) +
    (k==="acente" ? inp("pf-city",f.city) : `<div class="inp"><label for="pf-size">${f.size}</label><select id="pf-size">${f.sizes.map(s=>`<option>${s}</option>`).join("")}</select></div>`+inp("pf-when",f.when,"text",1)) +
    inp("pf-tel",f.tel,"tel") + inp("pf-mail",f.mail,"email",1) +
    `<div class="inp"><label for="pf-note">${f.note} <span style="font-weight:400;color:var(--muted)">${f.opt}</span></label><textarea id="pf-note"></textarea></div>
     <label class="consent"><input type="checkbox" id="pf-kvkk"><span>${f.kvkk}</span></label>
     <div class="err" id="pf-err" role="alert"></div>
     <button type="submit" class="btn submit" id="pf-send" style="width:100%">${f.send}</button>`;
  for(const id in prev){ const e=$(id); if(e){ if(e.type==="checkbox") e.checked=prev[id]; else e.value=prev[id]; } }
  $("pmodal").hidden=false; document.body.style.overflow="hidden";
  if(!keep){ setTimeout(()=>{const n=$("pf-name"); if(n) n.focus();},50); track("IsbirligiAc",{tip:k}); }
}
function closePartner(){ $("pmodal").hidden=true; document.body.style.overflow=""; pType=null; }

/* ================= DİLİ UYGULA ================= */
function applyLang(lang, user){
  if(user) saveContact();
  L = lang;
  const d=D();
  document.documentElement.lang = L;
  document.documentElement.dir = d.dir;
  document.title = d.title;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const k=el.getAttribute("data-i"); if(d.t[k]!=null) el.innerHTML=d.t[k];
  });
  $("langflag").className = "flag flag-"+L;
  $("langcode").textContent = L.toUpperCase();
  document.querySelectorAll("#langmenu [data-lang]").forEach(b=>b.setAttribute("aria-selected", b.dataset.lang===L));
  $("wa-sticky").href = waLink(sent);
  { const sl=SEAL[L]||SEAL.en; $("seal-ring").textContent=sl[0]; $("seal-l1").textContent=sl[1]; $("seal-l2").textContent=sl[2]; document.querySelector(".seal").setAttribute("aria-label",sl[1]+" "+sl[2]); } fitSeal();
  buildRegions(); renderPartners(); renderNews(); renderCharts(); renderGuide(); calc(); render(); soundLabel();
  try{ localStorage.setItem("kibris_lang", L); }catch(e){}
  if(user){
    try{ const u=new URL(location.href); u.searchParams.set("lang",L); history.replaceState(null,"",u); }catch(e){}
    track("Dil",{dil:L});
  }
}
const langBtn=$("langbtn"), langMenu=$("langmenu");
function menu(open){ langMenu.hidden=!open; langBtn.setAttribute("aria-expanded", open); }
langBtn.addEventListener("click", e=>{ e.stopPropagation(); menu(langMenu.hidden); });
langMenu.querySelectorAll("[data-lang]").forEach(b=>b.addEventListener("click", ()=>{ menu(false); if(b.dataset.lang!==L) applyLang(b.dataset.lang, true); }));
document.addEventListener("click", e=>{ if(!langMenu.hidden && !$("langsel").contains(e.target)) menu(false); });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && !langMenu.hidden){ menu(false); langBtn.focus(); } });
applyLang(L, false);

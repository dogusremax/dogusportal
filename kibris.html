<link rel="alternate" hreflang="de" href="https://dogusportal.com/kibris.html?lang=de">

<style>
/* Layout: kıyı şeridi gibi dikey akış — koyu deniz hero (Beşparmak silueti), açık "köpük" zemin üzerinde bölümler, en altta adım adım form; mobilde sabit alt bar */
:root{
  --bg:#F2F6F6; --card:#FFFFFF; --ink:#0D2230; --muted:#557081; --line:#D3E0E3;
  --sea:#0B5D7E; --sea-soft:#DCEDF1; --sun:#E9A23B; --brand:#C8102E;
  --hero:#0A2433; --hero-2:#0E3A50; --hero-fg:#EAF3F5; --ok:#1F8A5B;
  --f-display:"Instrument Serif","PT Serif","Vazirmatn","Times New Roman",Georgia,serif;
  --f-body:"Figtree","Manrope","Vazirmatn",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono","Manrope","Vazirmatn",ui-monospace,Menlo,Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#071520; --card:#0D2231; --ink:#E5EEF1; --muted:#8EA7B4; --line:#1C3A4B;
    --sea:#5BB8DC; --sea-soft:#10334A; --sun:#F2B55C; --brand:#E8455C;
    --hero:#04101A; --hero-2:#0A2A3C; --hero-fg:#EAF3F5; --ok:#3DBB82;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#071520; --card:#0D2231; --ink:#E5EEF1; --muted:#8EA7B4; --line:#1C3A4B;
  --sea:#5BB8DC; --sea-soft:#10334A; --sun:#F2B55C; --brand:#E8455C;
  --hero:#04101A; --hero-2:#0A2A3C; --hero-fg:#EAF3F5; --ok:#3DBB82;
  color-scheme:dark;
}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-bottom:84px}
img{max-width:100%}
[hidden]{display:none!important}
@media (min-width:860px){body{padding-bottom:0}}
.wrap{max-width:1080px;margin:0 auto;padding-inline:18px}
h1,h2,h3{text-wrap:balance;margin:0}
h2{font-family:var(--f-display);font-weight:400;font-size:clamp(2rem,6vw,2.9rem);line-height:1.08;letter-spacing:-.01em}
h2 em{font-style:italic;color:var(--sea)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;display:block}
p{margin:0}
.lead{color:var(--muted);max-width:60ch;margin-top:12px}
section{padding-block:64px}
a{color:inherit}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:6px}
.ltr{direction:ltr;unicode-bidi:isolate;display:inline-block}

/* Farsça: sağdan sola, harf aralığı yok (bitişik yazıyı bozar), italik yok */
[lang="fa"] *{letter-spacing:0!important}
[lang="fa"] em{font-style:normal!important}
[lang="fa"] h1,[lang="fa"] h2,[lang="fa"] .q,[lang="fa"] .rinfo h3{font-family:"Vazirmatn",var(--f-display);font-weight:700;line-height:1.35}
[lang="fa"] .hero h1{font-size:clamp(2.1rem,8vw,4rem)}
[lang="fa"] h2{font-size:clamp(1.6rem,5vw,2.4rem)}
[lang="ru"] .hero h1,[lang="pl"] .hero h1,[lang="de"] .hero h1{font-size:clamp(2.3rem,8.6vw,4.6rem)}

/* ---------- top bar ---------- */
.top{position:absolute;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5}
.top .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:16px}
.logo{display:flex;align-items:center;gap:10px;color:var(--hero-fg);text-decoration:none;font-weight:700;letter-spacing:.02em;font-size:.95rem;min-width:0}
.logo i{flex:0 0 auto;display:inline-block;width:26px;height:26px;border-radius:50%;background:conic-gradient(var(--brand) 0 33%,#fff 0 66%,#1B3A8C 0)}
.logo small{display:block;font-weight:500;opacity:.7;font-size:.72rem;letter-spacing:.06em}
.top-right{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.top-phone{color:var(--hero-fg);font-family:var(--f-mono);font-size:.8rem;opacity:.85;text-decoration:none;border:1px solid rgba(255,255,255,.25);padding:7px 12px;border-radius:999px;direction:ltr}
@media (max-width:520px){.top-phone{display:none}}
.langsel{position:relative}
.langbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);color:var(--hero-fg);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px 6px 8px;font:700 .8rem var(--f-mono);letter-spacing:.06em}
.langbtn::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.8;margin-inline-start:2px}
.langbtn[aria-expanded="true"]{background:rgba(255,255,255,.2)}
.flag{display:inline-block;flex:0 0 auto;width:24px;height:16px;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.18)}
.langbtn .flag{width:22px;height:15px}
.langmenu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);list-style:none;margin:0;padding:6px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);min-width:180px;z-index:30}
.langmenu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:9px;font:600 .95rem var(--f-body);text-align:start}
.langmenu button:hover,.langmenu button[aria-selected="true"]{background:var(--sea-soft)}
.flag-tr{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1200 800%22%3E%3Crect width=%221200%22 height=%22800%22 fill=%22%23E30A17%22/%3E%3Ccircle cx=%22425%22 cy=%22400%22 r=%22200%22 fill=%22%23fff%22/%3E%3Ccircle cx=%22475%22 cy=%22400%22 r=%22160%22 fill=%22%23E30A17%22/%3E%3Cpolygon fill=%22%23fff%22 points=%22475.0,400.0 544.1,377.5 544.1,304.9 586.8,363.7 655.9,341.2 613.2,400.0 655.9,458.8 586.8,436.3 544.1,495.1 544.1,422.5%22/%3E%3C/svg%3E")}
.flag-en{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 30%22%3E%3CclipPath id=%22s%22%3E%3Cpath d=%22M0,0v30h60V0z%22/%3E%3C/clipPath%3E%3CclipPath id=%22t%22%3E%3Cpath d=%22M30,15h30v15zv15H0zH0V0zV0h30z%22/%3E%3C/clipPath%3E%3Cg clip-path=%22url%28%23s%29%22%3E%3Cpath d=%22M0,0v30h60V0z%22 fill=%22%23012169%22/%3E%3Cpath d=%22M0,0L60,30M60,0L0,30%22 stroke=%22%23fff%22 stroke-width=%226%22/%3E%3Cpath d=%22M0,0L60,30M60,0L0,30%22 clip-path=%22url%28%23t%29%22 stroke=%22%23C8102E%22 stroke-width=%224%22/%3E%3Cpath d=%22M30,0v30M0,15h60%22 stroke=%22%23fff%22 stroke-width=%2210%22/%3E%3Cpath d=%22M30,0v30M0,15h60%22 stroke=%22%23C8102E%22 stroke-width=%226%22/%3E%3C/g%3E%3C/svg%3E")}
.flag-ru{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 9 6%22%3E%3Crect width=%229%22 height=%226%22 fill=%22%23fff%22/%3E%3Crect y=%222%22 width=%229%22 height=%224%22 fill=%22%230039A6%22/%3E%3Crect y=%224%22 width=%229%22 height=%222%22 fill=%22%23D52B1E%22/%3E%3C/svg%3E")}
.flag-fa{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 7 4%22%3E%3Crect width=%227%22 height=%224%22 fill=%22%23DA0000%22/%3E%3Crect width=%227%22 height=%222.67%22 fill=%22%23fff%22/%3E%3Crect width=%227%22 height=%221.33%22 fill=%22%23239F40%22/%3E%3C/svg%3E")}
.flag-de{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 3%22%3E%3Crect width=%225%22 height=%223%22 fill=%22%23FFCE00%22/%3E%3Crect width=%225%22 height=%222%22 fill=%22%23DD0000%22/%3E%3Crect width=%225%22 height=%221%22 fill=%22%23000%22/%3E%3C/svg%3E")}
.flag-pl{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 5%22%3E%3Crect width=%228%22 height=%225%22 fill=%22%23DC143C%22/%3E%3Crect width=%228%22 height=%222.5%22 fill=%22%23fff%22/%3E%3C/svg%3E")}


/* ---------- ödüllü projeler rozeti ---------- */
.seal{position:absolute;z-index:4;top:calc(70px + env(safe-area-inset-top,0px));inset-inline-end:14px;width:104px;display:block;text-decoration:none;filter:drop-shadow(0 12px 16px rgba(0,0,0,.45)) drop-shadow(0 2px 2px rgba(0,0,0,.3));transform:rotate(8deg);transition:transform .3s ease;animation:sealin 1s cubic-bezier(.2,1.3,.4,1) .4s both}
.seal:hover{transform:rotate(2deg) scale(1.04)}
@keyframes sealin{from{opacity:0;transform:translateY(-30px) rotate(30deg) scale(1.3)}to{opacity:1;transform:rotate(8deg) scale(1)}}
@media(min-width:860px){.seal{width:150px;top:calc(88px + env(safe-area-inset-top,0px));inset-inline-end:44px}}
.seal svg{width:100%;height:auto;display:block;overflow:visible}
.seal .s-t{font:800 11.5px var(--f-mono);letter-spacing:3px;fill:#4A3008;text-transform:uppercase}
.seal .s-star{font-size:9px;fill:#6E4A0C;letter-spacing:2px}
.seal .s-n{font:800 17px "Figtree","Manrope","Vazirmatn",sans-serif;fill:#3B2604;letter-spacing:.6px}
.seal .s-n2{font:800 13px "Figtree","Manrope","Vazirmatn",sans-serif;fill:#3B2604;letter-spacing:1.6px}
.seal .s-y{font:700 7px var(--f-mono);fill:#4A3008;letter-spacing:1.6px;opacity:.85}
.seal .s-shine{animation:sshine 5s ease-in-out 1.6s infinite}
@keyframes sshine{0%{transform:skewX(-20deg) translateX(0)}35%,100%{transform:skewX(-20deg) translateX(320px)}}
@media (prefers-reduced-motion: reduce){.seal .s-shine{display:none}}
@media(max-width:520px){.hero h1{max-width:11ch}}
/* ---------- hero ---------- */
.hero{position:relative;background:var(--hero) url("assets/kibris/hero5-q.jpg") 60% 50%/cover no-repeat;color:var(--hero-fg);overflow:hidden;padding-top:104px;padding-bottom:84px;min-height:min(92svh,860px);display:flex;align-items:flex-end}
.hero-media{position:absolute;inset:0;z-index:0}
.sound{position:absolute;z-index:3;bottom:22px;inset-inline-end:18px;display:flex;align-items:center;gap:8px;background:rgba(6,22,34,.62);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:9px 14px;font:600 .82rem var(--f-body)}
.sound .ic-on{display:none}
.sound[aria-pressed="true"] .ic-on{display:block}
.sound[aria-pressed="true"] .ic-off{display:none}
.sound[aria-pressed="false"]{animation:nudge 2.4s ease-in-out 1.5s 3}
@keyframes nudge{0%,100%{box-shadow:0 0 0 0 rgba(233,162,59,0)}50%{box-shadow:0 0 0 8px rgba(233,162,59,.25)}}
.hero-media video{width:100%;height:100%;object-fit:cover;object-position:60% 50%;display:block}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,22,34,.45) 0%,rgba(6,22,34,0) 30%,rgba(6,22,34,.2) 58%,rgba(6,22,34,.82) 100%)}
.hero .wrap{width:100%}
@media (max-aspect-ratio:1/1){.hero{background-image:url("assets/kibris/hero5-m.jpg");background-position:center}.hero-media video{object-position:center}}
.hero h1,.hero .sub{text-shadow:0 1px 12px rgba(0,0,0,.35)}
.hero .wrap{position:relative;z-index:2}
.hero h1{font-family:var(--f-display);font-weight:400;font-size:clamp(2.6rem,10vw,5.2rem);line-height:1;letter-spacing:-.015em;max-width:15ch}
.hero h1 em{color:var(--sun);font-style:italic}
.hero .sub{margin-top:18px;font-size:1.08rem;max-width:46ch;color:rgba(234,243,245,.82)}
.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:15px 24px;font-weight:700;font-size:1rem;text-decoration:none;text-align:center;transition:transform .15s ease, box-shadow .15s ease}
.btn:active{transform:scale(.98)}
.btn-sun{background:var(--sun);color:#1A1205;box-shadow:0 10px 28px -10px rgba(233,162,59,.7)}
.btn-sun:hover{transform:translateY(-1px)}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--hero-fg);border:1px solid rgba(255,255,255,.25)}
.btn-ink{background:var(--ink);color:var(--bg)}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:38px;max-width:620px}
.fact{border-top:1px solid rgba(255,255,255,.22);padding-top:10px;min-width:0}
.fact b{display:block;font-family:var(--f-mono);font-size:clamp(1.1rem,4.4vw,1.5rem);color:#fff;font-variant-numeric:tabular-nums}
.fact span{font-size:.78rem;color:rgba(234,243,245,.7);line-height:1.3;display:block;margin-top:2px}
.scene{position:relative;height:190px;margin-top:30px}
@media(min-width:860px){.scene{height:240px;margin-top:10px}}
.scene svg{position:absolute;inset:auto 0 0 0;width:100%;height:100%}
.scene canvas{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%}
.sunball{position:absolute;right:12%;top:8%;width:74px;height:74px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#FFD58A,var(--sun) 60%,#C9771C);box-shadow:0 0 80px 20px rgba(233,162,59,.35);animation:rise 2.4s ease-out both}
@keyframes rise{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.scene-label{position:absolute;inset-inline-start:18px;bottom:52%;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.12em;color:rgba(234,243,245,.55);text-transform:uppercase}


/* ---------- ayrıcalıklar ---------- */
.perks-sec{position:relative;background:radial-gradient(120% 140% at 85% 0%,#123F57 0%,#0A2433 55%,#071A26 100%);color:#EAF3F5;padding-block:72px;overflow:hidden}
.perks-sec::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(233,162,59,.55),transparent) top/100% 1px no-repeat}
.perks-sec .eyebrow{color:#E9C27A}
.perks-sec h2{color:#F4F8F9;max-width:20ch}
.perks-sec h2 em{color:#E9C27A}
.av-grid{display:grid;grid-template-columns:1fr;margin-top:36px;border-top:1px solid rgba(233,194,122,.22)}
@media(min-width:900px){.av-grid{grid-template-columns:repeat(4,minmax(0,1fr));border-top:0}}
.av{display:grid;grid-template-columns:auto 1fr;gap:16px;padding:22px 0;border-bottom:1px solid rgba(233,194,122,.22);min-width:0}
@media(min-width:900px){.av{grid-template-columns:1fr;gap:14px;padding:4px 26px 0;border-bottom:0;border-inline-start:1px solid rgba(233,194,122,.22)}.av:first-child{border-inline-start:0;padding-inline-start:0}}
.av-ic{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#E9C27A;border:1px solid rgba(233,194,122,.45);background:rgba(233,194,122,.06)}
.av-k{display:block;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#E9C27A;margin-bottom:6px}
.av h3{font-family:var(--f-display);font-weight:400;font-size:1.45rem;line-height:1.15;color:#F4F8F9}
.av p{font-size:.88rem;color:rgba(234,243,245,.68);margin-top:8px;line-height:1.55}
.av-cta{margin-top:34px}
.btn-gold{background:transparent;color:#F4F8F9;border:1px solid #E9C27A;padding:14px 26px}
.btn-gold:hover{background:rgba(233,194,122,.12)}
[lang="fa"] .av h3{font-family:"Vazirmatn",var(--f-display);font-weight:600;font-size:1.15rem}
/* ---------- reasons ---------- */
.grid4{display:grid;grid-template-columns:1fr;gap:14px;margin-top:30px}
@media(min-width:640px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.reason{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:8px;min-width:0}
.reason .k{font-family:var(--f-mono);font-size:1.7rem;color:var(--sea);font-variant-numeric:tabular-nums;line-height:1}
.reason h3{font-size:1.08rem}
.reason p{color:var(--muted);font-size:.95rem}
.reason .src{font-size:.72rem;color:var(--muted);opacity:.8;margin-top:auto;padding-top:6px}


/* ---------- gündem ---------- */
.news{padding-block:64px;background:var(--card);border-top:1px solid var(--line)}
.ngrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media(min-width:680px){.ngrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1000px){.ngrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.ncard{border:1px solid var(--line);border-radius:var(--r);padding:20px;background:var(--bg);display:flex;flex-direction:column;gap:10px;min-width:0}
.ncard.feat{background:linear-gradient(160deg,#0E3A50,#0A2433);border-color:transparent;color:#EAF3F5}
@media(min-width:680px){.ncard.feat{grid-column:span 2}}
.ntop{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ntag{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--sea-soft);color:var(--sea)}
.ncard[data-c="saglik"] .ntag{background:color-mix(in srgb,#2E9E6B 14%,transparent);color:#2E9E6B}
.ncard[data-c="altyapi"] .ntag{background:color-mix(in srgb,var(--sun) 18%,transparent);color:#B7791F}
.ncard[data-c="yatirim"] .ntag{background:color-mix(in srgb,var(--brand) 12%,transparent);color:var(--brand)}
.ncard.feat .ntag{background:rgba(233,194,122,.15);color:#E9C27A}
.ndate{font-family:var(--f-mono);font-size:.7rem;color:var(--muted)}
.ncard.feat .ndate{color:rgba(234,243,245,.6)}
.nfig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.nfig b{font-family:var(--f-mono);font-size:1.7rem;line-height:1;color:var(--sea);font-variant-numeric:tabular-nums;direction:ltr}
.ncard.feat .nfig b{color:#E9C27A;font-size:2.4rem}
.nfig span{font-size:.78rem;color:var(--muted)}
.ncard.feat .nfig span{color:rgba(234,243,245,.65)}
.ncard h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.15}
.ncard.feat h3{font-size:clamp(1.5rem,4vw,2rem)}
.ncard p{font-size:.9rem;color:var(--muted);line-height:1.55}
.ncard.feat p{color:rgba(234,243,245,.78);max-width:62ch}
.nsrc{margin-top:auto;font-size:.74rem;color:var(--muted);padding-top:6px;border-top:1px dashed var(--line)}
.nsrc a{color:inherit;text-underline-offset:2px}
.ncard.feat .nsrc{color:rgba(234,243,245,.6);border-color:rgba(234,243,245,.2)}
.nmore{grid-column:1/-1;justify-self:center;margin-top:6px;background:transparent;border:1px solid var(--ink);color:var(--ink);border-radius:999px;padding:12px 24px;font-weight:700}
.nmore:hover{background:var(--ink);color:var(--bg)}
[lang="fa"] .ncard h3{font-family:"Vazirmatn",var(--f-display);font-weight:600;font-size:1.08rem}


/* ---------- rakamlar / grafikler ---------- */
:root{--c1:#0A6F98;--c2:#C77A12;--grid:#E3ECEE}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c1:#3890B8;--c2:#BE7E28;--grid:#173447}}
:root[data-theme="dark"]{--c1:#3890B8;--c2:#BE7E28;--grid:#173447}
.stats{padding-block:64px}
.cgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px}
@media(min-width:900px){.cgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.cbox-wide{grid-column:1/-1}}
.cbox{margin:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0;position:relative}
.ch-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap}
.ch-title h3{font-size:1.02rem}
.ch-title p{font-size:.8rem;color:var(--muted);margin-top:2px}
.ch-kpi{text-align:end}
.ch-kpi b{display:block;font-family:var(--f-mono);font-size:clamp(1.5rem,5vw,2rem);line-height:1;color:var(--ink);font-variant-numeric:tabular-nums;direction:ltr}
.ch-kpi span{font-size:.74rem;color:var(--muted)}
.ch-kpi em{display:block;font-style:normal;font-size:.78rem;color:var(--sea);font-weight:600;margin-top:4px}
.ch-legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:.78rem;color:var(--muted)}
.ch-legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-inline-end:6px}
.ch-plot{position:relative;margin-top:10px;direction:ltr}
.ch-plot svg{display:block;width:100%;overflow:visible}
.ch-plot text{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.ch-plot .gl{stroke:var(--grid);stroke-width:1}
.ch-plot .vl{fill:var(--ink);font-weight:700;font-size:11px}
.ch-tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font:600 .78rem var(--f-body);padding:7px 10px;border-radius:8px;white-space:nowrap;transform:translate(-50%,-110%);opacity:0;transition:opacity .12s;z-index:2}
.ch-tip small{display:block;font-weight:400;opacity:.75}
.ch-foot{margin-top:12px;font-size:.72rem;color:var(--muted);line-height:1.5}
.ch-foot a{color:inherit}
.ch-foot details{margin-top:6px;border:0;padding:0}
.ch-foot summary{padding:0;font-weight:600;display:inline-flex;cursor:pointer;color:var(--sea)}
.ch-foot summary::after{content:none}
.ch-foot table{width:100%;border-collapse:collapse;margin-top:8px;font-family:var(--f-mono);font-size:.74rem;direction:ltr}
.ch-foot td,.ch-foot th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:end}
.ch-foot th:first-child,.ch-foot td:first-child{text-align:start}
.bar-h:hover rect.bm{opacity:.85}
/* ---------- karpaz ---------- */
.karpaz{background:linear-gradient(170deg,#0A2433 0%,#0E3A50 60%,#12506B 100%);color:#EAF3F5;padding-block:70px;overflow:hidden}
.kz{display:grid;grid-template-columns:1fr;gap:26px}
@media(min-width:900px){.kz{grid-template-columns:1fr 1fr;align-items:center}}
.karpaz .eyebrow{color:#E9C27A}
.karpaz h2{color:#F4F8F9}
.karpaz h2 em{color:#E9C27A}
.kz-p{color:rgba(234,243,245,.8);margin-top:14px;max-width:52ch}
.kz-facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:24px}
.kz-facts div{border-top:1px solid rgba(233,194,122,.35);padding-top:10px;min-width:0}
.kz-facts b{display:block;font-family:var(--f-mono);font-size:clamp(1.15rem,4vw,1.6rem);color:#E9C27A;direction:ltr;text-align:start}
.kz-facts span{font-size:.74rem;color:rgba(234,243,245,.65);line-height:1.3;display:block;margin-top:3px}
.kz-map{border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -30px rgba(0,0,0,.6);min-width:0}
.kz-map svg{display:block;width:100%;height:auto}
.kz-l{font:600 5px var(--f-body);fill:#F4F8F9;letter-spacing:.02em;paint-order:stroke;stroke:#0A2433;stroke-width:1.6px;stroke-linejoin:round}
#kz-altin{fill:#E9C27A;font-size:6px}
.kz-pulse{transform-origin:523.6px 27.8px;animation:kzp 2.4s ease-out infinite}
@keyframes kzp{from{transform:scale(.6);opacity:1}to{transform:scale(2);opacity:0}}
.kz-blocks{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:640px){.kz-blocks{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:900px){.kz-blocks{grid-column:1/-1;grid-template-columns:repeat(4,minmax(0,1fr))}}
.kz-blocks div{background:rgba(255,255,255,.05);border:1px solid rgba(233,194,122,.2);border-radius:14px;padding:18px;min-width:0}
.kz-blocks h3{font-family:var(--f-display);font-weight:400;font-size:1.3rem;color:#F4F8F9}
.kz-blocks p{font-size:.86rem;color:rgba(234,243,245,.72);margin-top:6px}
.kz-why{grid-column:1/-1;font-size:.95rem;color:#F4F8F9;border-inline-start:2px solid #E9C27A;padding-inline-start:14px}
[lang="fa"] .kz-blocks h3{font-family:"Vazirmatn",var(--f-display);font-weight:600;font-size:1.05rem}


/* ---------- basında biz ---------- */
.press{background:#FBFBF9;color:#121417;border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:16px;min-width:0;border:1px solid #121417;box-shadow:6px 6px 0 #121417}
@media(min-width:680px){.press.feat{grid-column:span 2;padding:30px}}
.pr-top{display:flex;justify-content:space-between;gap:12px;border-top:3px solid #121417;border-bottom:1px solid #121417;padding-block:7px;font:700 .68rem var(--f-mono);letter-spacing:.18em}
.pr-body{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:680px){.press.feat .pr-body{grid-template-columns:auto 1fr;gap:30px;align-items:center}}
.pr-rank{display:none}
.pr-rank b{font-family:"Instrument Serif","PT Serif",Georgia,serif;font-weight:400;font-size:clamp(5rem,16vw,8.5rem);line-height:.85;letter-spacing:-.04em;color:#121417;direction:ltr}
.pr-rank span{font:600 .72rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:#5A5F66;margin-top:8px;max-width:22ch}
.pr-txt{min-width:0;border-inline-start:1px solid #121417;padding-inline-start:20px}
@media(max-width:679px){.pr-txt{border-inline-start:0;padding-inline-start:0;border-top:1px solid #C9CCD0;padding-top:14px}}
.press h3{font-family:"Instrument Serif","PT Serif",Georgia,serif;font-weight:400;font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.08;color:#121417}
.press blockquote{margin:14px 0 0;font-family:"Instrument Serif","PT Serif",Georgia,serif;font-style:italic;font-size:1.2rem;line-height:1.3;color:#B0201B}
.pr-meta{font-size:.76rem;color:#5A5F66;margin-top:12px;line-height:1.45}
.pr-link{display:inline-block;margin-top:12px;font-weight:700;font-size:.85rem;color:#121417;text-decoration:none;border-bottom:2px solid #121417;padding-bottom:1px}
.pr-link:hover{color:#B0201B;border-color:#B0201B}
[lang="fa"] .press h3,[lang="fa"] .press blockquote{font-family:"Vazirmatn",serif;font-style:normal;font-weight:600;font-size:1.15rem}


/* ---------- dergi kapağı ---------- */
.mag{position:relative;width:100%;max-width:340px;aspect-ratio:3/4;justify-self:center;border-radius:6px;overflow:hidden;color:#fff;background:#0A2433;box-shadow:0 22px 40px -18px rgba(0,0,0,.55),0 0 0 1px rgba(0,0,0,.25);display:flex;flex-direction:column;padding:16px 16px 14px;direction:ltr}
.mag-bg{position:absolute;inset:0;background:url("assets/kibris/hero5-m.jpg") center 60%/cover no-repeat;z-index:0}
.mag-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,16,26,.15) 0%,rgba(5,16,26,0) 30%,rgba(5,16,26,.15) 55%,rgba(5,16,26,.85) 100%)}
.mag>*:not(.mag-bg):not(.mag-bar){position:relative;z-index:1}
.mag-bar{z-index:1}
.mag-iss{display:flex;justify-content:space-between;font:700 .56rem var(--f-mono);letter-spacing:.16em;opacity:.9}
.mag-name{font-family:"Instrument Serif","PT Serif",Georgia,serif;font-size:clamp(4.6rem,22vw,6.4rem);line-height:.82;letter-spacing:-.03em;text-align:center;margin-top:4px;text-shadow:0 2px 18px rgba(0,0,0,.25)}
.mag-lines{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:7px;max-width:55%}
.mag-lines li{font:700 .7rem/1.2 var(--f-body);text-transform:uppercase;letter-spacing:.04em;text-shadow:0 1px 8px rgba(0,0,0,.5);border-top:2px solid #E9A23B;padding-top:4px}
.mag-story{margin-top:auto;display:flex;flex-direction:column}
.mag-kick{font:700 .62rem var(--f-mono);letter-spacing:.12em;text-transform:uppercase;background:#C8102E;align-self:flex-start;padding:3px 7px;margin-bottom:6px}
.mag-story b{font-family:"Instrument Serif","PT Serif",Georgia,serif;font-weight:400;font-size:clamp(4rem,18vw,5.4rem);line-height:.8;color:#E9A23B}
.mag-story strong{font-family:"Instrument Serif","PT Serif",Georgia,serif;font-weight:400;font-size:clamp(2rem,9vw,2.6rem);line-height:1;margin-top:2px}
.mag-story em{font-style:normal;font:600 .82rem/1.25 var(--f-body);max-width:70%;margin-top:4px;opacity:.95}
.mag-bar{position:absolute;right:14px;bottom:14px;display:flex;align-items:flex-end;gap:5px}
.mag-bar i{display:block;width:34px;height:20px;background:repeating-linear-gradient(90deg,#fff 0 1px,transparent 1px 3px,#fff 3px 5px,transparent 5px 6px);opacity:.85}
.mag-bar span{font:700 .7rem var(--f-mono)}
[lang="fa"] .mag-lines li,[lang="fa"] .mag-story em,[lang="fa"] .mag-kick,[lang="fa"] .mag-iss{font-family:"Vazirmatn",var(--f-body);letter-spacing:0;text-transform:none;direction:rtl;text-align:right}
@media(min-width:680px){.press.feat .pr-body{grid-template-columns:minmax(240px,320px) 1fr}}

/* ---------- regions ---------- */
.regions{background:var(--card);border-block:1px solid var(--line)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-top:26px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--sea);border-color:var(--sea);color:var(--bg)}
.region-body{display:grid;grid-template-columns:1fr;gap:22px;margin-top:20px;align-items:start}
@media(min-width:760px){.region-body{grid-template-columns:1.1fr .9fr}}
.region-map{background:var(--sea-soft);border-radius:var(--r);padding:12px;min-width:0}
.region-map svg{width:100%;height:auto;display:block;direction:ltr}
.region-map .isl{fill:var(--card);stroke:var(--sea);stroke-width:1.2;stroke-linejoin:round}
.region-map .south{fill:var(--line);stroke:none;opacity:.7}
.region-map .buffer{fill:var(--line);opacity:.45}
.region-map .south-t{font-family:var(--f-mono);font-size:8px;letter-spacing:.18em;fill:var(--muted);opacity:.7;font-weight:400}
.region-map .airport path{fill:var(--muted)}
.region-map .airport text{font-size:9px;font-weight:500}
.region-map .dot{fill:var(--muted);transition:r .2s}
.region-map .dot.on{fill:var(--sun)}
.region-map text{font-family:var(--f-body);font-size:11px;fill:var(--muted);font-weight:600}
.region-map text.on{fill:var(--ink)}
.region-map .sea-t{font-family:var(--f-mono);font-size:9px;letter-spacing:.2em;fill:var(--sea);opacity:.7}
.rinfo{min-width:0}
.rinfo h3{font-family:var(--f-display);font-weight:400;font-size:2rem}
.rinfo .tag{font-family:var(--f-mono);font-size:.75rem;color:var(--sea);margin-top:4px}
.rinfo p{color:var(--muted);margin-top:10px}
.fit{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.chip{font-size:.8rem;padding:5px 10px;border-radius:999px;background:var(--sea-soft);color:var(--ink);font-weight:600}
.proj{margin-top:16px;border-top:1px dashed var(--line);padding-top:12px;font-size:.92rem}
.proj b{display:block;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-mono);margin-bottom:4px}


/* ---------- rehber ---------- */
.guide{padding-block:64px}
.gchips{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}
.gchip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem}
.gchip[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ggrid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:20px}
@media(min-width:640px){.ggrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:980px){.ggrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.gcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;grid-template-columns:auto 1fr;gap:14px;min-width:0}
.gcard .gi{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea)}
.gcard[data-c="doga"] .gi{background:color-mix(in srgb,#2E9E6B 14%,transparent);color:#2E9E6B}
.gcard[data-c="sehir"] .gi{background:color-mix(in srgb,var(--sun) 18%,transparent);color:#B7791F}
.gcard .gr{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.gcard h3{font-family:var(--f-display);font-weight:400;font-size:1.35rem;line-height:1.15;margin-top:2px}
.gcard p{font-size:.88rem;color:var(--muted);margin-top:6px}
[lang="fa"] .gcard h3,[lang="fa"] .turtle h3{font-family:"Vazirmatn",var(--f-display);font-weight:600;font-size:1.1rem}
.turtle{margin-top:28px;border-radius:20px;padding:26px;background:linear-gradient(160deg,#0E3A50,#0A2433);color:#EAF3F5;display:grid;grid-template-columns:1fr;gap:22px}
@media(min-width:900px){.turtle{grid-template-columns:.9fr 1.1fr;padding:34px}}
.turtle .eyebrow{color:#E9C27A}
.turtle h3{font-family:var(--f-display);font-weight:400;font-size:clamp(1.7rem,5vw,2.3rem);line-height:1.1}
.turtle h3 em{color:#E9C27A}
.turtle .tp{color:rgba(234,243,245,.75);margin-top:10px;font-size:.95rem}
.turtle ul{margin:14px 0 0;padding:0;list-style:none;display:grid;gap:8px}
.turtle li{font-size:.86rem;color:rgba(234,243,245,.8);padding-inline-start:18px;position:relative}
.turtle li::before{content:"";position:absolute;inset-inline-start:0;top:.55em;width:7px;height:7px;border-radius:50%;background:#E9C27A}
.tl{min-width:0}
.tl-months{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));font-family:var(--f-mono);font-size:.62rem;color:rgba(234,243,245,.55);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px;direction:ltr}
.tl-months span{text-align:center;overflow:hidden;white-space:nowrap}
.tl-months span.now{color:#E9C27A;font-weight:700}
.tl-row{margin-bottom:14px}
.tl-track{position:relative;height:14px;border-radius:999px;background:rgba(255,255,255,.08);direction:ltr}
.tl-bar{position:absolute;top:0;bottom:0;border-radius:999px}
.tl-now{position:absolute;top:-4px;bottom:-4px;width:2px;background:#E9C27A;opacity:.8}
.tl-lab{display:flex;justify-content:space-between;gap:10px;margin-top:6px;font-size:.8rem}
.tl-lab b{font-weight:700}
.tl-lab span{color:rgba(234,243,245,.6);text-align:end}

/* ---------- calculator ---------- */
.calc{display:grid;grid-template-columns:1fr;gap:18px;margin-top:28px}
@media(min-width:860px){.calc{grid-template-columns:.9fr 1.1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;min-width:0}
.field{display:flex;flex-direction:column;gap:8px;margin-bottom:20px}
.field label{font-weight:600;font-size:.92rem;display:flex;justify-content:space-between;gap:10px}
.field label output{font-family:var(--f-mono);color:var(--sea);font-variant-numeric:tabular-nums;white-space:nowrap}
input[type=range]{width:100%;accent-color:var(--sea);height:28px}
.big{font-family:var(--f-mono);font-size:clamp(2rem,8vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1.1;color:var(--ink)}
.big small{font-size:.9rem;color:var(--muted);font-family:var(--f-body)}
.plan{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.stage{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.stage .pct{font-family:var(--f-mono);font-size:.8rem;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--sea-soft);color:var(--sea);font-weight:700}
.stage .what{min-width:0}
.stage .what b{display:block;font-size:.95rem}
.stage .what span{font-size:.8rem;color:var(--muted)}
.stage .amt{font-family:var(--f-mono);text-align:end;font-variant-numeric:tabular-nums;font-size:.95rem}
.stage .amt small{display:block;color:var(--muted);font-size:.72rem}
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;margin-top:18px;background:var(--line)}
.bar i{display:block;height:100%}
.yield{margin-top:20px;padding:16px;border-radius:12px;background:var(--sea-soft);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.yield b{font-family:var(--f-mono);font-size:1.5rem;color:var(--sea)}
.note{font-size:.78rem;color:var(--muted);margin-top:14px}
.calc-cta{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}

/* ---------- process / faq ---------- */
.steps{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:0;counter-reset:s}
.steps li{display:grid;grid-template-columns:44px 1fr;gap:14px;padding-block:16px;border-top:1px solid var(--line);counter-increment:s}
.steps li::before{content:counter(s);font-family:var(--f-display);font-size:2rem;line-height:1;color:var(--sea)}
.steps h3{font-size:1.02rem}
.steps p{color:var(--muted);font-size:.93rem;margin-top:3px}
details{border-top:1px solid var(--line);padding-block:4px}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{list-style:none;cursor:pointer;padding-block:16px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--f-mono);color:var(--sea);font-size:1.2rem;line-height:1}
details[open] summary::after{content:"–"}
details p{color:var(--muted);padding-bottom:16px;max-width:65ch}
.two{display:grid;grid-template-columns:1fr;gap:40px}
.two>div{min-width:0}
@media(min-width:860px){.two{grid-template-columns:1fr 1fr}}


/* ---------- iş birlikleri ---------- */
.partners{padding-block:64px;background:var(--card);border-top:1px solid var(--line)}
.ptgrid{display:grid;grid-template-columns:1fr;gap:14px;margin-top:26px}
@media(min-width:860px){.ptgrid{grid-template-columns:1fr 1fr}}
.pcard{border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:14px;min-width:0;background:linear-gradient(160deg,#0E3A50,#0A2433);color:#EAF3F5}
.pcard.alt{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.pc-ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:rgba(233,194,122,.14);color:#E9C27A}
.pcard.alt .pc-ic{background:var(--sea-soft);color:var(--sea)}
.pcard h3{font-family:var(--f-display);font-weight:400;font-size:clamp(1.6rem,4.5vw,2.1rem);line-height:1.1}
.pcard p{font-size:.95rem;color:rgba(234,243,245,.78)}
.pcard.alt p{color:var(--muted)}
.pcard ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pcard li{font-size:.9rem;padding-inline-start:22px;position:relative}
.pcard li::before{content:"✓";position:absolute;inset-inline-start:0;color:#E9C27A;font-weight:800}
.pcard.alt li::before{color:var(--sea)}
.pc-cta{margin-top:auto;align-self:flex-start;border:0;border-radius:999px;padding:14px 22px;font-weight:700;background:#E9A23B;color:#1A1205;text-align:start}
.pcard.alt .pc-cta{background:var(--ink);color:var(--bg)}
[lang="fa"] .pcard h3,[lang="fa"] .pm-box h3{font-family:"Vazirmatn",var(--f-display);font-weight:700;font-size:1.3rem}
.pmodal{position:fixed;inset:0;z-index:50;background:rgba(5,16,26,.6);display:grid;place-items:end center;padding:0}
@media(min-width:640px){.pmodal{place-items:center;padding:20px}}
.pm-box{position:relative;background:var(--card);color:var(--ink);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:24px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:640px){.pm-box{border-radius:20px;padding:28px}}
.pm-box h3{font-family:var(--f-display);font-weight:400;font-size:1.7rem;padding-inline-end:36px;margin-bottom:16px}
.pm-x{position:absolute;top:14px;inset-inline-end:14px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:.95rem}
.pm-box select,.pm-box textarea{font:inherit;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.pm-box textarea{min-height:80px;resize:vertical}
.pm-ok{text-align:center;padding:20px 0}
.pm-ok .tick{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:1.6rem}

/* ---------- lead form ---------- */
.formsec{background:linear-gradient(180deg,var(--hero-2),var(--hero));color:var(--hero-fg)}
.formsec h2 em{color:var(--sun)}
.formsec .lead{color:rgba(234,243,245,.75)}
.fcard{background:var(--card);color:var(--ink);border-radius:20px;padding:24px;margin-top:28px;max-width:620px;box-shadow:0 30px 60px -30px rgba(0,0,0,.5)}
.prog{display:flex;gap:5px;margin-bottom:20px}
.prog i{flex:1;height:5px;border-radius:999px;background:var(--line);transition:background .3s}
.prog i.on{background:var(--sea)}
.qhead{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
.q{font-family:var(--f-display);font-size:1.75rem;line-height:1.15;margin:6px 0 18px}
.opts{display:grid;gap:10px}
.opt{text-align:start;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);padding:15px 16px;border-radius:12px;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:10px}
.opt span{font-weight:400;font-size:.82rem;color:var(--muted);text-align:end}
.opt:hover{border-color:var(--sea)}
.opt.sel{border-color:var(--sea);background:var(--sea-soft)}
.inp{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.inp label{font-size:.85rem;font-weight:600}
.inp input{font:inherit;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.inp input[type=tel]{direction:ltr;text-align:start}
[dir="rtl"] .inp input[type=tel]{text-align:right}
.inp input:focus{border-color:var(--sea);outline:none}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.8rem;color:var(--muted);margin:6px 0 16px}
.consent input{margin-top:3px;accent-color:var(--sea);width:18px;height:18px;flex:0 0 auto}
.err{color:var(--brand);font-size:.85rem;min-height:1.2em;margin-bottom:8px}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:18px}
.back{background:none;border:0;color:var(--muted);font-weight:600;padding:10px 0;white-space:nowrap}
.submit{flex:1;background:var(--sea);color:var(--bg)}
.done{text-align:center;padding:10px 0}
.done .tick{width:64px;height:64px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;background:var(--ok);color:#fff;font-size:1.8rem}
.done p{color:var(--muted);margin-top:8px}
.demo{font-family:var(--f-mono);font-size:.7rem;color:var(--muted);margin-top:14px}
.perks{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:18px;font-size:.85rem;color:rgba(234,243,245,.8)}
.perks span::before{content:"✓ ";color:var(--sun);font-weight:700}

/* ---------- footer ---------- */
footer{padding-block:36px;font-size:.85rem;color:var(--muted)}
footer .wrap{display:flex;flex-direction:column;gap:6px}
footer b{color:var(--ink)}
.mono{font-family:var(--f-mono)}

/* ---------- sticky mobile bar ---------- */
.sticky{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;transform:translateY(110%);transition:transform .3s ease}
.sticky.show{transform:none}
.sticky .btn{flex:1;padding:13px 10px;font-size:.95rem}
.btn-wa{background:#1FA855;color:#fff;flex:0 0 auto!important;width:52px;padding:0!important}
@media(min-width:860px){.sticky{display:none}}
</style>
</head>

en:{
 title:"North Cyprus Homes · RE/MAX Doğuş", locale:"en-GB", dir:"ltr",
 t:{
  av_e:"The RE/MAX Doğuş advantage", av_h:"Same price. <em>Stronger negotiating power.</em>", av1_k:"List price", av1_h:"Sold at the developer's list price", av1_p:"Our prices are the developers' official list prices. No intermediary mark-up is added.", av2_k:"0% commission", av2_h:"No commission from you", av2_p:"As a buyer, you pay us no service fee and no commission.", av3_k:"Special discount", av3_h:"Special agreements with developers", av3_p:"Thanks to our special agreements with partner developers, we can secure a discount just for you.", av4_k:"Your own plan", av4_h:"Personalised payment plan", av4_p:"Beyond the standard plan, we negotiate a down payment and instalment structure that fits your budget with the developer on your behalf.", av_cta:"Request my personal offer →", 
  logo_sub:"NORTH CYPRUS DESK", phone:"+90 216 315 15 15",
  hero_eyebrow:"Kyrenia · Iskele · Esentepe · Famagusta",
  h1:"Facing the sea, <em>in sterling.</em>",
  hero_sub:"North Cyprus homes with a 35% down payment, interest-free instalments and rental income in pounds sterling. We'll pick 3 projects for you within 24 hours.",
  cta1:"Find my project →", cta2:"Calculate a payment plan",
  f1b:"~1.5 h", f1:"Istanbul–Ercan flight time", f2:"Prices and rents in pounds sterling", f3b:"35%", f3:"down payment, then interest-free instalments",
  scene:"Five Finger Mountains · Kyrenia coast",
  why_e:"Why North Cyprus", why_h:"More than a holiday spot: an island with <em>its own demand</em>.",
  why_l:"Housing demand in Cyprus comes from three sources: university students, year-round tourism and foreigners who move to the island to live. That keeps rental income from being seasonal.",
  r1_h:"New university places this year alone", r1_p:"The number of places allocated to North Cyprus universities in Turkey's 2026 university admissions guide. Every new semester brings new demand for rentals.", r1_s:"Source: 2026 YKS quota guide",
  r2_h:"Universities, plus METU and ITU campuses", r2_p:"Besides the 16 universities in the guide, the METU Northern Cyprus, ITU-TRNC and ASBÜ campuses are on the island.", r2_s:"Source: 2026 YKS guide",
  r3_h:"Bought in sterling, rented in sterling", r3_p:"Project prices and the rental market are quoted in pounds sterling, so your savings sit apart from local currency swings.", r3_s:"Payments follow the currency in your contract",
  r4_k:"✓", r4_h:"Foreigners can own property", r4_p:"Foreign buyers can acquire residential property in North Cyprus with a purchase permit. The limit depends on your nationality, and we check the current rules for you before you buy.", r4_s:"Immovable Property Acquisition (Aliens) Law",
  reg_e:"Get to know the regions", reg_h:"Which coast suits <em>you</em>?",
  calc_e:"Payment plan simulator", calc_h:"Down payment, instalments, handover: <em>see the numbers</em>.",
  calc_l:"Most of our partner developers use the same structure: a down payment at signing, interest-free instalments until handover, and the rest after handover. Move the sliders to see your own numbers.",
  l_price:"Apartment price", l_m1:"Instalments until handover", l_m2:"Instalments after handover", l_rent:"Expected monthly rent",
  pay_e:"Due at signing", st1_b:"Down payment", st1_s:"At contract signing", st2_b:"Construction period", st3_b:"After handover", y_l:"Gross annual rental yield",
  note:"Plan ratios are an example based on Döveç Construction's standard plan and vary by developer and project. Rent is your own estimate. Title deed fees, VAT and stamp duty are not included.",
  calc_cta:"Send me projects for this budget",
  pr_e:"Buying process", pr_h:"From Istanbul to <em>title deed</em> in five steps.",
  s1_h:"Free first consultation", s1_p:"We listen to your budget, goal and preferred area, then send you 3 suitable projects with price lists.",
  s2_h:"Viewing trip", s2_p:"If you like, we tour the projects together on the island. If not, we show you the apartment live on a video call.",
  s3_h:"Reservation and contract", s3_p:"The unit is reserved, the sales contract is signed and registered at the Land Registry together with stamp duty.",
  s4_h:"Purchase permit", s4_p:"For foreign buyers, a lawyer applies for the Council of Ministers permit. Your payment plan continues in the meantime.",
  s5_h:"Handover and title deed", s5_p:"Key handover, then title deed transfer. If you wish, we continue with our local partners for letting and management.",
  faq_e:"FAQ", faq_h:"Your <em>questions</em>, answered",
  q1_q:"What do the title deed types mean, and which is safe?", q1_a:"Title deeds in North Cyprus differ by the land's history: Turkish title (Turkish Cypriot property from before 1974), exchange title (eşdeğer) and allocation title (tahsis). For every project we suggest, we state the land's title type in writing and have it checked by a lawyer.",
  q2_q:"How many properties can I buy as a foreigner?", q2_a:"North Cyprus limits the number of homes a foreigner can buy, and the limit depends on nationality. The limits have changed several times in recent years, so we confirm the current limit for your case before you buy.",
  q3_q:"Which currency do I pay in?", q3_a:"Most projects are priced in pounds sterling and paid in the currency stated in the contract. Instalments are interest-free, so currency risk only applies when you convert your own money.",
  q4_q:"How much are the extra costs?", q4_a:"They include stamp duty, title deed fees, VAT and the foreign buyer permit fee. We send a line-by-line cost table for each project as a PDF.",
  q5_q:"Can I buy without seeing the property?", q5_a:"Yes. We can run the whole process remotely with live video tours, floor plans and construction progress photos. Most clients still prefer to see it in person after reserving, and we organise the trip.",
  q6_q:"Why work with an office in Istanbul?", q6_a:"You can meet us in person, we go through the contract with you, and after the sale you still have a contact in Istanbul. Prices from the 4 Cyprus developers we partner with are the same as buying directly from the developer.",
  form_e:"30-second match", form_h:"Let us <em>pick 3 projects</em> for you.",
  form_l:"Answer five short questions. Our Cyprus consultant will get back to you within 24 hours with price lists and payment plans.",
  pk1:"Free and non-binding", pk2:"No spam", pk3:"No commission",
  addr:"Nuhoğlu Yenitepe Sitesi 2. Etap, Fikirtepe / Kadıköy, Istanbul, Türkiye",
  disc:"Payment plans on this page are examples; final prices and terms are subject to the developer's current price list and the sales contract. Each RE/MAX office is independently owned and operated.",
  sticky:"Show matching projects"
 },

ru:{
 title:"Северный Кипр · RE/MAX Doğuş", locale:"ru-RU", dir:"ltr",
 t:{
  av_e:"Преимущества RE/MAX Doğuş", av_h:"Та же цена. <em>Сильнее переговорная позиция.</em>", av1_k:"Прайс-лист", av1_h:"Продажа по прайс-листу застройщика", av1_p:"Наши цены — официальные прайс-листы застройщиков. Никаких посреднических наценок.", av2_k:"0% комиссии", av2_h:"Без комиссии для вас", av2_p:"Покупатель не платит нам ни за услуги, ни комиссию.", av3_k:"Спецскидка", av3_h:"Особые соглашения с застройщиками", av3_p:"Благодаря особым соглашениям с застройщиками-партнёрами мы можем получить для вас персональную скидку.", av4_k:"Ваш план", av4_h:"Индивидуальный план оплаты", av4_p:"Помимо стандартного плана, мы согласуем с застройщиком первый взнос и рассрочку под ваш бюджет.", av_cta:"Получить персональное предложение →", 
  logo_sub:"СЕВЕРНЫЙ КИПР", phone:"+90 216 315 15 15",
  hero_eyebrow:"Кирения · Искеле · Эсентепе · Фамагуста",
  h1:"Вид на море, <em>цена в фунтах.</em>",
  hero_sub:"Северный Кипр: первый взнос 35%, рассрочка без процентов и доход от аренды в фунтах стерлингов. Подберём для вас 3 проекта за 24 часа.",
  cta1:"Подобрать проект →", cta2:"Рассчитать план оплаты",
  f1b:"~1,5 ч", f1:"перелёт Стамбул–Эрджан", f2:"Цены и аренда в фунтах стерлингов", f3b:"35%", f3:"первый взнос, далее рассрочка без процентов",
  scene:"Горы Пентадактилос · побережье Кирении",
  why_e:"Почему Северный Кипр", why_h:"Не просто курорт, а остров <em>с собственным спросом</em>.",
  why_l:"Спрос на жильё на Кипре держится на трёх источниках: студенты университетов, круглогодичный туризм и иностранцы, которые переезжают на остров жить. Поэтому доход от аренды не сезонный.",
  r1_h:"новых мест для студентов только в этом году", r1_p:"Столько мест выделено университетам Северного Кипра в турецком справочнике приёма на 2026 год. Каждый новый семестр — это новый спрос на аренду.", r1_s:"Источник: справочник квот YKS 2026",
  r2_h:"университетов, а также кампусы METU и ITU", r2_p:"Кроме 16 университетов из справочника, на острове работают кампусы METU Northern Cyprus, ITU-TRNC и ASBÜ.", r2_s:"Источник: справочник YKS 2026",
  r3_h:"Покупка в фунтах, аренда в фунтах", r3_p:"Цены проектов и рынок аренды выражены в фунтах стерлингов, поэтому ваши сбережения не зависят от колебаний местной валюты.", r3_s:"Платежи — в валюте договора",
  r4_k:"✓", r4_h:"Иностранцы могут владеть недвижимостью", r4_p:"Иностранные покупатели приобретают жильё на Северном Кипре по разрешению на покупку. Лимит зависит от гражданства, и перед покупкой мы проверяем для вас действующие правила.", r4_s:"Закон о приобретении недвижимости иностранцами",
  reg_e:"Знакомство с регионами", reg_h:"Какое побережье подходит <em>вам</em>?",
  calc_e:"Симулятор плана оплаты", calc_h:"Первый взнос, рассрочка, сдача: <em>в цифрах</em>.",
  calc_l:"У большинства наших застройщиков-партнёров схема одинакова: первый взнос при подписании, беспроцентная рассрочка до сдачи и остаток после сдачи. Двигайте ползунки и смотрите свои цифры.",
  l_price:"Цена квартиры", l_m1:"Рассрочка до сдачи", l_m2:"Рассрочка после сдачи", l_rent:"Ожидаемая аренда в месяц",
  pay_e:"К оплате при подписании", st1_b:"Первый взнос", st1_s:"При подписании договора", st2_b:"Период строительства", st3_b:"После сдачи", y_l:"Валовая годовая доходность аренды",
  note:"Пропорции плана — пример по стандартному плану Döveç; они зависят от застройщика и проекта. Аренда — ваша собственная оценка. Пошлина за титул, НДС и гербовый сбор не включены.",
  calc_cta:"Пришлите проекты под этот бюджет",
  pr_e:"Процесс покупки", pr_h:"Из Стамбула до <em>титула</em> за пять шагов.",
  s1_h:"Бесплатная первая консультация", s1_p:"Узнаём ваш бюджет, цель и желаемый регион и присылаем 3 подходящих проекта с прайс-листами.",
  s2_h:"Ознакомительная поездка", s2_p:"По желанию вместе осматриваем проекты на острове; если нет — показываем квартиру вживую по видеосвязи.",
  s3_h:"Бронирование и договор", s3_p:"Квартира бронируется, подписывается договор купли-продажи, который регистрируется в Земельном управлении вместе с уплатой гербового сбора.",
  s4_h:"Разрешение на покупку", s4_p:"Для иностранных покупателей разрешение Совета министров оформляет адвокат. План оплаты в это время продолжается.",
  s5_h:"Сдача и титул", s5_p:"Передача ключей, затем переоформление титула. По желанию продолжаем с местными партнёрами по аренде и управлению.",
  faq_e:"Частые вопросы", faq_h:"Ответы на <em>ваши вопросы</em>",
  q1_q:"Что означают типы титулов и какой из них надёжен?", q1_a:"Титулы на Северном Кипре различаются по истории земли: турецкий титул (собственность киприотов-турок до 1974 года), эквивалентный (eşdeğer) и титул распределения (tahsis). По каждому предлагаемому проекту мы письменно указываем тип титула земли и проверяем его у адвоката.",
  q2_q:"Сколько объектов я могу купить как иностранец?", q2_a:"На Северном Кипре действует лимит на количество жилья для иностранца, и он зависит от гражданства. За последние годы лимиты несколько раз менялись, поэтому перед покупкой мы подтверждаем актуальный лимит для вашего случая.",
  q3_q:"В какой валюте я плачу?", q3_a:"Большинство проектов оцениваются в фунтах стерлингов и оплачиваются в валюте, указанной в договоре. Рассрочка беспроцентная; валютный риск возникает только в момент, когда вы конвертируете свои деньги.",

  r2_h:"uczelni oraz kampusy METU i ITU", r2_p:"Oprócz 16 uczelni z przewodnika na wyspie działają kampusy METU Northern Cyprus, ITU-TRNC i ASBÜ.", r2_s:"Źródło: przewodnik YKS 2026",
  r3_h:"Kupujesz w funtach, wynajmujesz w funtach", r3_p:"Ceny inwestycji i rynek najmu są wyrażone w funtach szterlingach, więc Twoje oszczędności nie zależą od wahań lokalnej waluty.", r3_s:"Płatności w walucie umowy",
  r4_k:"✓", r4_h:"Obcokrajowcy mogą kupować nieruchomości", r4_p:"Zagraniczni nabywcy kupują mieszkania na Cyprze Północnym na podstawie zezwolenia na zakup. Limit zależy od obywatelstwa; przed zakupem sprawdzamy dla Ciebie aktualne przepisy.", r4_s:"Ustawa o nabywaniu nieruchomości przez cudzoziemców",

  calc_l:"U większości naszych deweloperów partnerskich plan wygląda podobnie: wpłata przy podpisaniu umowy, raty bez odsetek do odbioru, reszta po odbiorze. Przesuń suwaki i zobacz swoje liczby.",
  l_price:"Cena mieszkania", l_m1:"Raty do odbioru", l_m2:"Raty po odbiorze", l_rent:"Oczekiwany czynsz miesięczny",
  pay_e:"Płatne przy podpisaniu", st1_b:"Wpłata własna", st1_s:"Przy podpisaniu umowy", st2_b:"Okres budowy", st3_b:"Po odbiorze", y_l:"Roczna stopa zwrotu z najmu brutto",
  note:"Proporcje planu to przykład oparty na standardowym planie Döveç; zależą od dewelopera i projektu. Czynsz to Twoja szacunkowa kwota. Opłaty za akt własności, VAT i opłata skarbowa nie są wliczone.",

  s1_h:"Bezpłatna pierwsza konsultacja", s1_p:"Poznajemy Twój budżet, cel i preferowany region i wysyłamy 3 pasujące projekty z cennikami.",
  s2_h:"Wyjazd na oglądanie", s2_p:"Jeśli chcesz, oglądamy projekty razem na wyspie; jeśli nie, pokazujemy mieszkanie na żywo podczas wideorozmowy.",
  s3_h:"Rezerwacja i umowa", s3_p:"Lokal zostaje zarezerwowany, podpisujesz umowę sprzedaży, którą rejestrujemy w urzędzie ksiąg wieczystych wraz z opłatą skarbową.",
  s4_h:"Zezwolenie na zakup", s4_p:"Dla nabywców zagranicznych o zgodę Rady Ministrów występuje prawnik. W tym czasie plan płatności biegnie dalej.",
  s5_h:"Odbiór i akt własności", s5_p:"Przekazanie kluczy, a następnie przeniesienie aktu własności. Jeśli chcesz, kontynuujemy z lokalnymi partnerami w zakresie najmu i zarządzania.",
  faq_e:"Częste pytania", faq_h:"Odpowiedzi na <em>Twoje pytania</em>",
  q1_q:"Co oznaczają rodzaje aktów własności i który jest bezpieczny?", q1_a:"Akty własności na Cyprze Północnym różnią się w zależności od historii gruntu: tytuł turecki (własność Turków cypryjskich sprzed 1974 r.), tytuł ekwiwalentny (eşdeğer) i tytuł przydziałowy (tahsis). Dla każdego proponowanego projektu podajemy na piśmie rodzaj tytułu gruntu i zlecamy jego weryfikację prawnikowi.",
  q2_q:"Ile nieruchomości mogę kupić jako obcokrajowiec?", q2_a:"Cypr Północny ogranicza liczbę mieszkań, które może kupić obcokrajowiec, w zależności od obywatelstwa. Limity kilkakrotnie zmieniano w ostatnich latach, dlatego przed zakupem potwierdzamy aktualny limit w Twoim przypadku.",
  q3_q:"W jakiej walucie płacę?", q3_a:"Większość projektów jest wyceniana w funtach szterlingach i opłacana w walucie wskazanej w umowie. Raty są nieoprocentowane; ryzyko walutowe pojawia się tylko w chwili, gdy wymieniasz własne pieniądze.",
  q4_q:"Ile wynoszą dodatkowe koszty?", q4_a:"To m.in. opłata skarbowa, opłata za akt własności, VAT i opłata za zezwolenie dla nabywcy zagranicznego. Dla każdego projektu wysyłamy szczegółową tabelę kosztów w PDF.",
  q5_q:"Czy mogę kupić bez oglądania nieruchomości?", q5_a:"Tak. Cały proces można prowadzić zdalnie dzięki wideoprezentacjom na żywo, rzutom mieszkań i zdjęciom postępu budowy. Większość klientów i tak woli obejrzeć mieszkanie na miejscu po rezerwacji; wyjazd organizujemy my.",
  q6_q:"Dlaczego warto współpracować z biurem w Stambule?", q6_a:"Spotykasz się z nami osobiście, razem omawiamy umowę, a po zakupie nadal masz kontakt w Stambule. Ceny 4 naszych deweloperów partnerskich na Cyprze są takie same jak przy zakupie bezpośrednio u dewelopera.",
  form_e:"Dopasowanie w 30 sekund", form_h:"Pozwól nam <em>wybrać 3 projekty</em> dla Ciebie.",
  form_l:"Odpowiedz na pięć krótkich pytań. Nasz doradca ds. Cypru skontaktuje się z Tobą w ciągu 24 godzin z cennikami i planami płatności.",

  sticky:"Pokaż pasujące projekty"

const GUIDE = {"tr": {"e": "Kıbrıs rehberi", "h": "Ev almadan önce <em>adayı tanıyın.</em>", "l": "Yaşayacağınız ya da kiraya vereceğiniz bölgenin çevresinde neler var? Tarih, doğa ve deniz; adanın görülmesi gereken yerleri.", "c": {"all": "Tümü", "tarih": "Tarih", "doga": "Doğa & deniz", "sehir": "Şehir"}, "i": {"girnekale": ["Girne Kalesi ve Batık Gemi Müzesi", "Girne", "Limanın ucundaki Venedik kalesi. İçinde yaklaşık 2.300 yıllık bir ticaret gemisinin kalıntıları sergileniyor; bilinen en eski batıklardan biri."], "bellapais": ["Bellapais Manastırı", "Girne", "Beşparmakların eteğinde 13. yüzyıldan kalma Gotik manastır. İlkbaharda müzik festivaline ev sahipliği yapıyor, köy kahvelerinden Girne manzarası açılıyor."], "hilarion": ["St. Hilarion Kalesi", "Girne", "Beşparmak Dağları'nın sivri kayaları üzerine kurulu Bizans kalesi. Zirveden tüm Girne kıyısı, havanın açık olduğu günlerde Toroslar görünür."], "salamis": ["Salamis Antik Kenti", "Gazimağusa", "Adanın en büyük antik kenti. Roma tiyatrosu, sütunlu jimnazyum ve hamamlar denizin hemen kıyısında."], "magusa": ["Gazimağusa Surları ve Othello Kalesi", "Gazimağusa", "Venedik surlarıyla çevrili eski şehir. Gotik katedralden dönüştürülen Lala Mustafa Paşa Camii ve Othello Kalesi aynı yürüyüşte."], "lefkosa": ["Büyük Han ve Selimiye Camii", "Lefkoşa", "1572'de Osmanlılar tarafından yapılan Büyük Han bugün kafeler ve el sanatları atölyeleriyle dolu. Hemen yanında Gotik katedralden dönüştürülen Selimiye Camii."], "karpaz": ["Karpaz ve Altın Kum", "Karpaz", "Adanın en bakir ucu. Kilometrelerce uzanan Altın Kum plajı, serbest dolaşan yaban eşekleri ve Apostolos Andreas Manastırı."], "kantara": ["Kantara Kalesi", "İskele", "Karpaz'ın girişinde, iki denizi birden gören dağ kalesi. Gün batımı için adanın en iyi noktalarından."], "alagadi": ["Alagadi Kaplumbağa Plajı", "Esentepe", "Girne ile Esentepe arasında, deniz kaplumbağalarının yumurtladığı koruma altındaki plaj. Gündüz denize girilir, sezonda geceleri kapalıdır."], "soli": ["Soli ve Vuni Antik Kentleri", "Güzelyurt", "Batı kıyısında mozaik zeminli bazilika ve tepeye kurulu saray kalıntıları. Kalabalıktan uzak bir antik keşif."]}, "t": {"e": "Doğanın takvimi", "h": "Kaplumbağaların <em>doğum mevsimi</em>", "p": "Kuzey Kıbrıs kıyıları, Caretta caretta ve yeşil deniz kaplumbağalarının Akdeniz'deki önemli yuvalama alanlarından. Yaz gecelerinde dişiler kumsala çıkıp yumurtluyor, yaklaşık 50–60 gün sonra yavrular denize koşuyor.", "r": [["Yuvalama", "Dişiler gece kumsala çıkıp yumurtlar"], ["Yavruların çıkışı", "Yumurtalardan 50–60 gün sonra"], ["Plaj gece kapalı", "Sezonda 20:00–08:00 arası, gönüllü turlar hariç"]], "tips": ["Gece gözlem turları gönüllülerle yapılır, kontenjan sınırlı; birkaç hafta önceden kayıt gerekir.", "Beyaz ışık ve flaş kullanılmaz; ekipler kırmızı ışık kullanır.", "Kumdaki işaretli yuvalara basmayın, şemsiyeyi yuvaların uzağına kurun."]}}, "en": {"e": "Cyprus guide", "h": "Get to know the island <em>before you buy.</em>", "l": "What's around the area where you'll live or rent out? History, nature and the sea: the places worth seeing on the island.", "c": {"all": "All", "tarih": "History", "doga": "Nature & sea", "sehir": "City"}, "i": {"girnekale": ["Kyrenia Castle & Shipwreck Museum", "Kyrenia", "A Venetian castle at the end of the harbour. Inside are the remains of a roughly 2,300-year-old merchant ship, one of the oldest known wrecks."], "bellapais": ["Bellapais Abbey", "Kyrenia", "A 13th-century Gothic abbey at the foot of the Five Finger Mountains. It hosts a music festival every spring, and the village cafés look out over Kyrenia."], "hilarion": ["St. Hilarion Castle", "Kyrenia", "A Byzantine castle built on the jagged rocks of the Five Finger Mountains. From the top you see the whole Kyrenia coast, and the Taurus Mountains on clear days."], "salamis": ["Salamis Ancient City", "Famagusta", "The island's largest ancient city: a Roman theatre, a colonnaded gymnasium and baths right by the sea."], "magusa": ["Famagusta Walls & Othello Castle", "Famagusta", "An old town ringed by Venetian walls. The Lala Mustafa Pasha Mosque, a converted Gothic cathedral, and Othello Castle are on the same walk."], "lefkosa": ["Büyük Han & Selimiye Mosque", "Nicosia", "Built by the Ottomans in 1572, the Büyük Han is now full of cafés and craft workshops. Next door is the Selimiye Mosque, a converted Gothic cathedral."], "karpaz": ["Karpas & Golden Beach", "Karpas", "The island's most unspoilt tip: the kilometres-long Golden Beach, free-roaming wild donkeys and the Apostolos Andreas Monastery."], "kantara": ["Kantara Castle", "Iskele", "A mountain castle at the gateway to the Karpas that overlooks two seas at once. One of the best sunset spots on the island."], "alagadi": ["Alagadi Turtle Beach", "Esentepe", "A protected beach between Kyrenia and Esentepe where sea turtles lay their eggs. Open for swimming by day, closed at night during the season."], "soli": ["Soli & Vouni Ancient Sites", "Güzelyurt", "On the west coast: a basilica with mosaic floors and the ruins of a hilltop palace. An ancient discovery away from the crowds."]}, "t": {"e": "Nature's calendar", "h": "The turtles' <em>hatching season</em>", "p": "North Cyprus's beaches are among the Mediterranean's key nesting sites for loggerhead and green sea turtles. On summer nights the females come ashore to lay eggs, and about 50–60 days later the hatchlings race to the sea.", "r": [["Nesting", "Females come ashore at night to lay eggs"], ["Hatching", "50–60 days after the eggs are laid"], ["Beach closed at night", "20:00–08:00 in season, except volunteer tours"]], "tips": ["Night watches run with volunteers and places are limited; book a few weeks ahead.", "No white light or flash; the teams use red light.", "Don't step on marked nests, and set up umbrellas well away from them."]}}, "ru": {"e": "Путеводитель по Кипру", "h": "Узнайте остров <em>до покупки.</em>", "l": "Что находится рядом с местом, где вы будете жить или сдавать жильё? История, природа и море: места, которые стоит увидеть.", "c": {"all": "Все", "tarih": "История", "doga": "Природа и море", "sehir": "Город"}, "i": {"girnekale": ["Киренийский замок и Музей кораблекрушений", "Кирения", "Венецианский замок у входа в гавань. Внутри — остатки торгового судна возрастом около 2300 лет, одного из древнейших известных кораблекрушений."], "bellapais": ["Аббатство Беллапаис", "Кирения", "Готическое аббатство XIII века у подножия гор Пентадактилос. Каждую весну здесь проходит музыкальный фестиваль, а из деревенских кафе открывается вид на Кирению."], "hilarion": ["Замок Святого Илариона", "Кирения", "Византийский замок на острых скалах гор Пентадактилос. С вершины видно всё побережье Кирении, а в ясную погоду — горы Тавр."], "salamis": ["Античный город Саламин", "Фамагуста", "Крупнейший античный город острова: римский театр, гимнасий с колоннадой и термы у самого моря."], "magusa": ["Стены Фамагусты и замок Отелло", "Фамагуста", "Старый город в кольце венецианских стен. Мечеть Лала Мустафа-паши, бывший готический собор, и замок Отелло — на одной прогулке."], "lefkosa": ["Бюйюк Хан и мечеть Селимие", "Никосия", "Построенный османами в 1572 году Бюйюк Хан сегодня полон кафе и ремесленных мастерских. Рядом — мечеть Селимие, бывший готический собор."], "karpaz": ["Карпас и Золотой пляж", "Карпас", "Самая нетронутая часть острова: многокилометровый Золотой пляж, свободно гуляющие дикие ослы и монастырь Апостола Андрея."], "kantara": ["Замок Кантара", "Искеле", "Горный замок у въезда на Карпас, с которого видны сразу два моря. Одно из лучших мест острова для заката."], "alagadi": ["Черепаший пляж Алагади", "Эсентепе", "Охраняемый пляж между Киренией и Эсентепе, где морские черепахи откладывают яйца. Днём можно купаться, ночью в сезон пляж закрыт."], "soli": ["Античные Соли и Вуни", "Гюзельюрт", "На западном побережье: базилика с мозаичными полами и руины дворца на холме. Античные открытия вдали от толп."]}, "t": {"e": "Календарь природы", "h": "Сезон <em>рождения черепах</em>", "p": "Пляжи Северного Кипра — одни из важнейших в Средиземноморье мест гнездования логгерхедов и зелёных черепах. Летними ночами самки выходят на берег откладывать яйца, а через 50–60 дней черепашата бегут к морю.", "r": [["Гнездование", "Самки ночью выходят на берег откладывать яйца"], ["Вылупление", "Через 50–60 дней после кладки"], ["Пляж закрыт ночью", "В сезон с 20:00 до 08:00, кроме туров с волонтёрами"]], "tips": ["Ночные наблюдения проходят с волонтёрами, мест мало; записывайтесь за несколько недель.", "Белый свет и вспышка запрещены; команды используют красный свет.", "Не наступайте на отмеченные гнёзда и ставьте зонты подальше от них."]}}, "fa": {"e": "راهنمای قبرس", "h": "پیش از خرید، <em>جزیره را بشناسید.</em>", "l": "اطراف جایی که زندگی می‌کنید یا اجاره می‌دهید چه چیزهایی هست؟ تاریخ، طبیعت و دریا: دیدنی‌های جزیره.", "c": {"all": "همه", "tarih": "تاریخ", "doga": "طبیعت و دریا", "sehir": "شهر"}, "i": {"girnekale": ["قلعهٔ گیرنه و موزهٔ کشتی غرق‌شده", "گیرنه", "قلعه‌ای ونیزی در انتهای بندر. درون آن بقایای یک کشتی تجاری حدوداً ۲۳۰۰ ساله، از قدیمی‌ترین کشتی‌های غرق‌شدهٔ شناخته‌شده، به نمایش گذاشته شده است."], "bellapais": ["صومعهٔ بلاپایس", "گیرنه", "صومعه‌ای گوتیک از قرن سیزدهم در دامنهٔ کوه‌های پنج‌انگشت. هر بهار میزبان جشنوارهٔ موسیقی است و از کافه‌های روستا منظرهٔ گیرنه پیداست."], "hilarion": ["قلعهٔ سنت هیلاریون", "گیرنه", "قلعه‌ای بیزانسی بر صخره‌های تیز کوه‌های پنج‌انگشت. از بالای آن کل ساحل گیرنه و در روزهای صاف کوه‌های توروس دیده می‌شود."], "salamis": ["شهر باستانی سالامیس", "فاماگوستا", "بزرگ‌ترین شهر باستانی جزیره: تئاتر رومی، ورزشگاه ستون‌دار و حمام‌ها درست کنار دریا."], "magusa": ["باروهای فاماگوستا و قلعهٔ اتللو", "فاماگوستا", "شهری قدیمی در حلقهٔ باروهای ونیزی. مسجد لاله مصطفی پاشا، که پیش‌تر کلیسای جامع گوتیک بود، و قلعهٔ اتللو در یک مسیر پیاده‌روی‌اند."], "lefkosa": ["بیوک هان و مسجد سلیمیه", "نیکوزیا", "بیوک هان که عثمانی‌ها در ۱۵۷۲ ساختند، امروز پر از کافه و کارگاه صنایع دستی است. کنار آن مسجد سلیمیه قرار دارد که پیش‌تر کلیسای جامع گوتیک بود."], "karpaz": ["کارپاس و ساحل طلایی", "کارپاس", "بکرترین بخش جزیره: ساحل طلایی به طول چند کیلومتر، الاغ‌های وحشی آزاد و صومعهٔ آپوستولوس آندریاس."], "kantara": ["قلعهٔ کانتارا", "ایسکله", "قلعه‌ای کوهستانی در ورودی کارپاس که هم‌زمان دو دریا را می‌بیند؛ از بهترین نقاط جزیره برای غروب."], "alagadi": ["ساحل لاک‌پشت‌های آلاگادی", "اسنتپه", "ساحلی حفاظت‌شده میان گیرنه و اسنتپه که لاک‌پشت‌های دریایی در آن تخم می‌گذارند. روزها شنا آزاد است و در فصل تخم‌گذاری شب‌ها بسته است."], "soli": ["شهرهای باستانی سولی و وونی", "گوزلیورت", "در ساحل غربی: کلیسایی با کف موزاییکی و ویرانه‌های کاخی بر بالای تپه؛ کشفی باستانی دور از شلوغی."]}, "t": {"e": "تقویم طبیعت", "h": "فصل <em>تولد لاک‌پشت‌ها</em>", "p": "سواحل قبرس شمالی از مهم‌ترین محل‌های لانه‌سازی لاک‌پشت‌های کارتا کارتا و لاک‌پشت سبز در مدیترانه‌اند. شب‌های تابستان ماده‌ها برای تخم‌گذاری به ساحل می‌آیند و حدود ۵۰ تا ۶۰ روز بعد بچه‌ها به سوی دریا می‌دوند.", "r": [["لانه‌سازی", "ماده‌ها شب‌ها برای تخم‌گذاری به ساحل می‌آیند"], ["بیرون آمدن بچه‌ها", "۵۰ تا ۶۰ روز پس از تخم‌گذاری"], ["ساحل شب‌ها بسته", "در فصل از ۲۰:۰۰ تا ۰۸:۰۰، به‌جز تورهای داوطلبان"]], "tips": ["تماشای شبانه با داوطلبان انجام می‌شود و ظرفیت محدود است؛ چند هفته زودتر ثبت‌نام کنید.", "نور سفید و فلاش ممنوع است؛ گروه‌ها از نور قرمز استفاده می‌کنند.", "روی لانه‌های علامت‌گذاری‌شده پا نگذارید و چتر را دور از آن‌ها نصب کنید."]}}, "de": {"e": "Zypern-Guide", "h": "Lernen Sie die Insel kennen, <em>bevor Sie kaufen.</em>", "l": "Was gibt es rund um den Ort, an dem Sie wohnen oder vermieten werden? Geschichte, Natur und Meer: die Orte, die man gesehen haben sollte.", "c": {"all": "Alle", "tarih": "Geschichte", "doga": "Natur & Meer", "sehir": "Stadt"}, "i": {"girnekale": ["Burg Kyrenia & Schiffswrackmuseum", "Kyrenia", "Eine venezianische Burg am Ende des Hafens. Darin liegen die Reste eines rund 2.300 Jahre alten Handelsschiffs, eines der ältesten bekannten Wracks."], "bellapais": ["Abtei Bellapais", "Kyrenia", "Eine gotische Abtei aus dem 13. Jahrhundert am Fuß des Pentadaktylos-Gebirges. Jedes Frühjahr findet hier ein Musikfestival statt; die Dorfcafés blicken auf Kyrenia."], "hilarion": ["Burg St. Hilarion", "Kyrenia", "Eine byzantinische Burg auf den zackigen Felsen des Pentadaktylos. Vom Gipfel sieht man die ganze Küste von Kyrenia, an klaren Tagen sogar das Taurusgebirge."], "salamis": ["Antike Stadt Salamis", "Famagusta", "Die größte antike Stadt der Insel: römisches Theater, Gymnasion mit Säulenhalle und Thermen direkt am Meer."], "magusa": ["Stadtmauern von Famagusta & Othello-Burg", "Famagusta", "Eine Altstadt im Ring venezianischer Mauern. Die Lala-Mustafa-Pascha-Moschee, eine umgewandelte gotische Kathedrale, und die Othello-Burg liegen auf einem Spaziergang."], "lefkosa": ["Büyük Han & Selimiye-Moschee", "Nikosia", "Der 1572 von den Osmanen erbaute Büyük Han ist heute voller Cafés und Kunsthandwerk. Nebenan steht die Selimiye-Moschee, eine umgewandelte gotische Kathedrale."], "karpaz": ["Karpaz & Golden Beach", "Karpaz", "Die ursprünglichste Spitze der Insel: der kilometerlange Golden Beach, frei laufende Wildesel und das Kloster Apostolos Andreas."], "kantara": ["Burg Kantara", "Iskele", "Eine Bergburg am Tor zur Karpaz, von der aus man zwei Meere zugleich sieht. Einer der schönsten Orte der Insel für den Sonnenuntergang."], "alagadi": ["Schildkrötenstrand Alagadi", "Esentepe", "Ein geschützter Strand zwischen Kyrenia und Esentepe, an dem Meeresschildkröten ihre Eier ablegen. Tagsüber zum Baden offen, in der Saison nachts gesperrt."], "soli": ["Antike Stätten Soli & Vouni", "Güzelyurt", "An der Westküste: eine Basilika mit Mosaikböden und die Ruinen eines Palastes auf einem Hügel. Antike Entdeckungen abseits des Trubels."]}, "t": {"e": "Kalender der Natur", "h": "Die <em>Schlupfzeit</em> der Schildkröten", "p": "Die Strände Nordzyperns gehören zu den wichtigsten Nistplätzen der Unechten Karettschildkröte und der Suppenschildkröte im Mittelmeer. In Sommernächten kommen die Weibchen zur Eiablage an Land, rund 50–60 Tage später laufen die Jungtiere ins Meer.", "r": [["Eiablage", "Weibchen kommen nachts zur Eiablage an Land"], ["Schlupf", "50–60 Tage nach der Eiablage"], ["Strand nachts gesperrt", "In der Saison 20:00–08:00 Uhr, außer bei Freiwilligentouren"]], "tips": ["Nachtbeobachtungen finden mit Freiwilligen statt, die Plätze sind begrenzt; einige Wochen vorher anmelden.", "Kein weißes Licht und kein Blitz; die Teams nutzen Rotlicht.", "Nicht auf markierte Nester treten und Sonnenschirme weit davon entfernt aufstellen."]}}, "pl": {"e": "Przewodnik po Cyprze", "h": "Poznaj wyspę, <em>zanim kupisz.</em>", "l": "Co jest w okolicy miejsca, w którym zamieszkasz lub które wynajmiesz? Historia, przyroda i morze: miejsca, które warto zobaczyć.", "c": {"all": "Wszystko", "tarih": "Historia", "doga": "Przyroda i morze", "sehir": "Miasto"}, "i": {"girnekale": ["Zamek w Kyrenii i Muzeum Wraku", "Kyrenia", "Wenecki zamek na końcu portu. Wewnątrz szczątki statku handlowego sprzed około 2300 lat, jednego z najstarszych znanych wraków."], "bellapais": ["Opactwo Bellapais", "Kyrenia", "Gotyckie opactwo z XIII wieku u stóp gór Pentadaktylos. Co wiosnę odbywa się tu festiwal muzyczny, a z wiejskich kawiarni widać Kyrenię."], "hilarion": ["Zamek św. Hilariona", "Kyrenia", "Bizantyjski zamek na postrzępionych skałach gór Pentadaktylos. Ze szczytu widać całe wybrzeże Kyrenii, a w pogodne dni góry Taurus."], "salamis": ["Starożytne miasto Salamis", "Famagusta", "Największe starożytne miasto wyspy: rzymski teatr, gimnazjon z kolumnadą i łaźnie tuż przy morzu."], "magusa": ["Mury Famagusty i zamek Otella", "Famagusta", "Stare miasto otoczone weneckimi murami. Meczet Lala Mustafy Paszy, dawna gotycka katedra, i zamek Otella na jednym spacerze."], "lefkosa": ["Büyük Han i meczet Selimiye", "Nikozja", "Zbudowany przez Osmanów w 1572 roku Büyük Han jest dziś pełen kawiarni i pracowni rękodzieła. Obok stoi meczet Selimiye, dawna gotycka katedra."], "karpaz": ["Karpas i Złota Plaża", "Karpas", "Najdziksza część wyspy: wielokilometrowa Złota Plaża, swobodnie wędrujące dzikie osły i klasztor Apostolosa Andreasa."], "kantara": ["Zamek Kantara", "Iskele", "Górski zamek u wrót Karpasu, z którego widać jednocześnie dwa morza. Jedno z najlepszych miejsc na wyspie na zachód słońca."], "alagadi": ["Plaża żółwi Alagadi", "Esentepe", "Chroniona plaża między Kyrenią a Esentepe, na której żółwie morskie składają jaja. W dzień można się kąpać, w sezonie nocą jest zamknięta."], "soli": ["Starożytne Soli i Vouni", "Güzelyurt", "Na zachodnim wybrzeżu: bazylika z mozaikowymi posadzkami i ruiny pałacu na wzgórzu. Starożytne odkrycia z dala od tłumów."]}, "t": {"e": "Kalendarz przyrody", "h": "Sezon <em>narodzin żółwi</em>", "p": "Plaże Cypru Północnego należą do najważniejszych w basenie Morza Śródziemnego miejsc lęgowych żółwia karetta i żółwia zielonego. Letnimi nocami samice wychodzą na brzeg, by złożyć jaja, a po około 50–60 dniach młode biegną do morza.", "r": [["Składanie jaj", "Samice nocą wychodzą na brzeg, by złożyć jaja"], ["Wylęg", "50–60 dni po złożeniu jaj"], ["Plaża zamknięta nocą", "W sezonie 20:00–08:00, poza wycieczkami z wolontariuszami"]], "tips": ["Nocne obserwacje odbywają się z wolontariuszami, liczba miejsc jest ograniczona; zapisz się kilka tygodni wcześniej.", "Białe światło i flesz są zakazane; zespoły używają czerwonego światła.", "Nie stawaj na oznaczonych gniazdach i rozstawiaj parasole z dala od nich."]}}};

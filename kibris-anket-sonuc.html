<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anket cevapları</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f8;margin:0;padding:16px;color:#0b1f4b}.w{max-width:600px;margin:auto}.c{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}input{width:100%;padding:12px;font-size:16px;border:1px solid #ccd;border-radius:10px;box-sizing:border-box}button{background:#DC1C2E;color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700;width:100%;margin-top:10px}.s{font-size:13px;color:#667}.big{display:flex;gap:10px}.big div{flex:1;background:#f4f5f8;border-radius:12px;padding:12px;text-align:center}.big b{display:block;font-size:26px}.r{display:flex;justify-content:space-between;gap:10px;border-top:1px solid #eee;padding:8px 0;font-size:14.5px}.r span{color:#667}.r b{text-align:right}.not{background:#f4f5f8;border-radius:10px;padding:10px;margin-top:8px;font-size:14px;white-space:pre-line}</style></head><body><div class="w">
<div class="c" id="kapi"><b>Anket cevapları</b><div class="s">Danışman Takip PIN'inizle girin. Umut Bey hepsini, danışmanlar kendi misafirlerinin cevaplarını görür.</div><input id="pin" type="password" placeholder="PIN"><button id="gir">Göster</button><div id="h" class="s" style="color:#DC1C2E"></div></div>
<div id="ana" style="display:none"><div class="c"><div class="big"><div><b id="n">0</b>cevap</div><div><b id="o">-</b>ort. puan</div><div><b id="y">0</b>yatırım düşünen</div></div><div class="s" id="son" style="margin-top:8px"></div></div><div id="ls"></div></div></div>
<script>var S='https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec';
var $=function(i){return document.getElementById(i)};$('pin').value=localStorage.getItem('kb_pin')||'';
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
var YT={yakinda:'Evet, yakında',arastiriyorum:'Araştırıyor',hayir:'Şimdilik hayır'};
function sat(a,b){return b?'<div class="r"><span>'+a+'</span><b>'+esc(b)+'</b></div>':''}
function yukle(){fetch(S,{method:'POST',redirect:'follow',body:JSON.stringify({action:'lansman',islem:'anketCevaplar',pin:$('pin').value.trim()})}).then(function(r){return r.text()}).then(function(t){var r;try{r=JSON.parse(t)}catch(e){r={ok:false,error:'Bağlanılamadı'}}
if(!r.ok){$('h').textContent=r.error;return}localStorage.setItem('kb_pin',$('pin').value.trim());$('kapi').style.display='none';$('ana').style.display='';
var L=r.liste,top=0,say=0,yat=0;L.forEach(function(x){var p=(x.cevap.puan||[]).filter(Boolean);if(p.length){top+=p.reduce(function(a,b){return a+b},0)/p.length;say++}if(x.cevap.yatirim==='yakinda')yat++});
$('n').textContent=L.length;$('o').textContent=say?(top/say).toFixed(1):'-';$('y').textContent=yat;
$('ls').innerHTML=L.length?L.map(function(x){var c=x.cevap,p=c.puan||[];return '<div class="c"><b>'+esc(x.ad)+'</b> <span class="s">· '+esc(x.danisman)+' · '+new Date(x.zaman).toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span>'+
sat('Genel memnuniyet',p[0]?p[0]+' / 5':'')+sat('Sunum ve soru-cevap',p[1]?p[1]+' / 5':'')+sat('Mekan ve ikramlar',p[2]?p[2]+' / 5':'')+sat('Kıbrıs yatırımı',YT[c.yatirim]||c.yatirim)+sat('Beğendiği proje',(c.proje||[]).join(', '))+sat('Bütçe',c.butce)+sat('İletişim tercihi',c.ilet)+(c.not?'<div class="not">'+esc(c.not)+'</div>':'')+'</div>'}).join(''):'<div class="c">Henüz dolduran yok.</div>';
$('son').textContent='Güncellendi '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}).catch(function(){$('h').textContent='Bağlantı hatası'})}
$('gir').onclick=yukle;if($('pin').value)yukle();setInterval(function(){if(!document.hidden&&$('ana').style.display==='')yukle()},30000);</script></body></html>

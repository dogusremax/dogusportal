<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache"><title>Aylık Performans Görselleri · RE/MAX Doğuş</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#0b0f2a;color:#fff;min-height:100vh}
  .top{display:flex;align-items:center;gap:14px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
  .top img{height:30px}
  .top h1{font-size:16px;font-weight:700;flex:1}
  select,button{font:600 13px 'Plus Jakarta Sans',sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
  select{background:#161c44;color:#fff}
  button{background:#DC1C2E;color:#fff}
  button.ghost{background:rgba(255,255,255,.1)}
  button:disabled{opacity:.4;cursor:default}
  .status{padding:10px 20px;font-size:12px;color:rgba(255,255,255,.6)}
  .panel{margin:0 20px 6px;background:#111738;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:14px 16px}
  .panel-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  .panel-head b{font-size:14px}.panel-head span{flex:1;font-size:12px;color:rgba(255,255,255,.5);min-width:200px}
  .panel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .ovr{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border-radius:10px;padding:8px 10px}
  .ovr label{font-size:11px;font-weight:700;color:rgba(255,255,255,.6);width:78px;flex:0 0 78px;text-transform:uppercase;letter-spacing:.5px}
  .ovr select{flex:1;min-width:110px;padding:7px 8px;font-size:12px}
  .ovr input{width:78px;padding:7px 8px;border-radius:8px;border:0;background:#161c44;color:#fff;font:600 12px 'Plus Jakarta Sans',sans-serif}
  .ovr .off{width:auto;padding:7px 9px;background:rgba(255,255,255,.1);font-size:11px}
  .ovr .off.on{background:#DC1C2E}
  .grid{display:flex;flex-wrap:wrap;gap:18px;padding:20px;justify-content:center}
  .card{display:flex;flex-direction:column;gap:8px;align-items:center}
  .card small{font-size:11px;color:rgba(255,255,255,.5)}
  .slide{width:420px!important;height:560px!important;min-height:560px;max-height:560px;position:relative;overflow:hidden;border-radius:4px;flex:0 0 420px;-webkit-mask-image:-webkit-radial-gradient(white,black)}
  .slide *{max-width:none}
  .slide img{-webkit-user-drag:none;pointer-events:none}
  .sans{font-family:'Plus Jakarta Sans',sans-serif}
  @media(max-width:480px){.grid{padding:12px;gap:10px}.card{width:100%;height:470px;overflow:hidden;justify-content:flex-start}.card .slide{transform:scale(.8);transform-origin:top center;margin-bottom:-112px}}
</style>
</head>
<body>
<div class="top">
  <img src="assets/dogus-logo.png" alt="Doğuş">
  <a href="performans.html" style="color:rgba(255,255,255,.6);text-decoration:none;font-size:13px">‹ Geri</a><h1 id="ttl">Aylık Performans Görselleri</h1>
  <select id="ay"></select>
  <button class="ghost" onclick="load()">Yenile</button>
  <button id="sharebtn" onclick="shareAll()" disabled style="background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af);display:none">Instagram'da paylaş</button>
  <button id="zipbtn" onclick="downloadAll()" disabled>Tümünü indir (ZIP)</button>
</div>
<div class="status" id="status">Yükleniyor…</div>
<div class="panel" id="panel" style="display:none">
  <div class="panel-head"><b>Elle düzenle</b><span>Otomatik sıralamayı istediğin gibi değiştir; boş bırakılanlar otomatik kalır.</span><button class="ghost" onclick="resetOvr()">Sıfırla</button><button onclick="applyOvr()">Uygula</button></div>
  <div class="panel-grid" id="panel-grid"></div>
</div>
<div class="grid" id="grid"></div>

<script>
// ==== AYARLAR ====
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec"; // Danışman Takip web app
const KEY = "dogus-performans";
const TEL = "0216 315 15 15";

const NAVY="#050A30", RED="#DC1C2E", REDD="#910B19", CORAL="#FB5160", LB="#F6F3F1";
const RGRAD=`linear-gradient(160deg,${REDD} 0%,${RED} 45%,${CORAL} 100%)`;
const MONTHS=["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
let DATA=null, TOTAL=6;
const SET=(new URLSearchParams(location.search).get('set')||'puan'); // 'puan' | 'birinci'

const photo=id=>`assets/ekip/${id}.png`;
const cut=(id,h,w)=>`<div style="width:${w||Math.round(h*0.7)}px;height:${h}px;flex:0 0 auto;"><img src="${photo(id)}" style="width:100%;height:100%;object-fit:cover;object-position:top center;display:block;" onerror="this.style.visibility='hidden'"></div>`;
const circ=(id,s,ring)=>`<div style="width:${s}px;height:${s}px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid ${ring};overflow:hidden;flex:0 0 ${s}px;position:relative;"><img src="${photo(id)}" style="position:absolute;left:50%;top:6%;transform:translateX(-50%);height:130%;width:auto;" onerror="this.style.display='none'"></div>`;
const logo=(right)=>`<img src="assets/dogus-logo.png" style="position:absolute;top:30px;${right?'right':'left'}:32px;width:110px;z-index:12;">`;
const progress=()=>`<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;"><div style="flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;"><div style="height:100%;width:__PCT__%;background:#fff;border-radius:2px;"></div></div><span class="sans" style="font-size:11px;color:rgba(255,255,255,.55);font-weight:500;">__N__/__T__</span></div>`;
const arrow=()=>`<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
const wm=(t,c)=>`<div class="sans" style="position:absolute;top:-50px;left:18px;font-size:${t.length>1?350:380}px;font-weight:800;line-height:1;color:${c};letter-spacing:-16px;">${t}</div>`;

const nameTag=(r,n,big)=>`<div class="sans" style="display:flex;align-items:center;gap:6px;padding:${big?'7px 12px':'5px 10px'};background:rgba(5,10,48,.88);border:1px solid rgba(255,255,255,.14);border-radius:20px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);"><span style="width:${big?20:17}px;height:${big?20:17}px;border-radius:50%;background:${CORAL};color:#fff;font-size:${big?11:10}px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:0 0 auto;">${n}</span><span style="font-size:${big?12:10.5}px;font-weight:700;color:#fff;">${r.name}</span></div>`;
function pillsFor(r){
  const p=[];
  p.push(`${r.aktifGun} aktif gün`);
  if(r.kapanis>0)p.push(`${r.kapanis} kapanış`);
  if(r.hedefBonus>0)p.push(`Hedef bonusu +${r.hedefBonus}`);
  if(r.counts.gosterim>0&&p.length<3)p.push(`${r.counts.gosterim} gösterim`);
  if(r.counts.sosyal_medya>0&&p.length<3)p.push(`${r.counts.sosyal_medya} içerik`);
  return p.slice(0,3);
}

function podium(idx,r,red){
  const ptc=red?NAVY:CORAL;
  const ph=pillsFor(r).map(p=>`<span class="sans" style="display:inline-block;font-size:12px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;margin:0 6px 6px 0;">${p}</span>`).join('');
  return `<div class="slide" style="background:${red?RGRAD:NAVY};">
${wm(String(idx),red?'rgba(255,255,255,.10)':'rgba(255,255,255,.06)')}${logo(false)}
<div style="position:absolute;right:-6px;bottom:-6px;width:260px;height:440px;overflow:hidden;clip-path:inset(0);">${cut(r.id,440,260)}</div>
<div style="position:absolute;left:36px;width:170px;bottom:60px;z-index:5;">
<div class="sans" style="font-size:${r.first.length>9||r.last.length>9?32:40}px;font-weight:700;letter-spacing:-1.4px;color:#fff;line-height:1.02;margin-bottom:8px;">${r.first}<br>${r.last}</div>
<div style="display:flex;align-items:baseline;gap:4px;margin-bottom:14px;"><span class="sans" style="font-size:48px;font-weight:700;letter-spacing:-2px;color:${ptc};line-height:1;">${r.puan}</span><span class="sans" style="font-size:13px;color:rgba(255,255,255,.6);font-weight:500;">puan</span></div>
<div style="width:200px;">${ph}</div></div>${arrow()}${progress()}</div>`;
}


const fmtTL=n=>{n=n||0;if(n>=1e6)return '₺'+(n/1e6).toLocaleString('tr-TR',{maximumFractionDigits:1})+' M';if(n>=1e3)return '₺'+Math.round(n/1e3).toLocaleString('tr-TR')+' B';return '₺'+Math.round(n).toLocaleString('tr-TR');};
function catSlide(r,label,valueHtml,sub,red){
  const ptc=red?NAVY:CORAL;
  return `<div class="slide" style="background:${red?RGRAD:NAVY};">
<div class="sans" style="position:absolute;top:-50px;left:10px;font-size:340px;font-weight:800;line-height:1;color:${red?'rgba(255,255,255,.10)':'rgba(255,255,255,.06)'};letter-spacing:-12px;">1</div>${logo(false)}
<div style="position:absolute;right:-6px;bottom:-6px;width:260px;height:440px;overflow:hidden;clip-path:inset(0);">${cut(r.id,440,260)}</div>
<div style="position:absolute;left:36px;width:190px;bottom:60px;z-index:5;">
<div class="sans" style="display:inline-block;background:${red?NAVY:CORAL};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 11px;border-radius:8px;margin-bottom:12px;">${label}</div>
<div class="sans" style="font-size:${r.first.length>9||r.last.length>9?28:34}px;font-weight:700;letter-spacing:-1.2px;color:#fff;line-height:1.02;margin-bottom:10px;">${r.first}<br>${r.last}</div>
<div class="sans" style="font-size:40px;font-weight:700;letter-spacing:-1.5px;color:${ptc};line-height:1;white-space:nowrap;">${valueHtml}</div>
<div class="sans" style="font-size:12px;color:rgba(255,255,255,.65);margin-top:8px;">${sub}</div></div>${arrow()}${progress()}</div>`;
}
function bestBy(arr,f){const c=arr.filter(x=>f(x)>0);if(!c.length)return null;return c.slice().sort((a,b)=>f(b)-f(a)||b.puan-a.puan)[0];}
function bestAll(arr,f){const c=arr.filter(x=>f(x)>0);if(!c.length)return [];const m=Math.max(...c.map(f));return c.filter(x=>f(x)===m).sort((a,b)=>b.puan-a.puan).slice(0,3);}
function catSlideMulti(ws,label,valueHtml,sub,red){
  const ptc=red?NAVY:CORAL, n=ws.length, h=n===2?270:245, w=n===2?180:135;
  const figs=ws.map((r,k)=>`<div style="position:relative;margin:0 ${n===2?-8:-6}px;z-index:${k===1?2:1};">${cut(r.id,h,w)}</div>`).join('');
  const tags=ws.map(r=>`<div class="sans" style="padding:5px 9px;background:rgba(5,10,48,.9);border:1px solid rgba(255,255,255,.14);border-radius:12px;font-size:10.5px;font-weight:700;color:#fff;white-space:nowrap;">${r.name}</div>`).join('');
  return `<div class="slide" style="background:${red?RGRAD:NAVY};">
<div class="sans" style="position:absolute;top:-50px;left:10px;font-size:340px;font-weight:800;line-height:1;color:${red?'rgba(255,255,255,.10)':'rgba(255,255,255,.06)'};letter-spacing:-12px;">1</div>${logo(false)}
<div style="position:absolute;left:32px;right:32px;top:92px;z-index:5;">
<div class="sans" style="display:inline-block;background:${red?NAVY:CORAL};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 11px;border-radius:8px;margin-bottom:10px;">${label} · ${n} KİŞİ</div>
<div class="sans" style="font-size:48px;font-weight:700;letter-spacing:-1.5px;color:${ptc};line-height:1;white-space:nowrap;">${valueHtml}</div>
<div class="sans" style="font-size:12px;color:rgba(255,255,255,.65);margin-top:6px;">${sub} · berabere</div></div>
<div style="position:absolute;left:0;right:0;bottom:44px;height:${h+14}px;overflow:hidden;display:flex;justify-content:center;align-items:flex-end;">${figs}</div>
<div style="position:absolute;left:0;right:0;bottom:56px;z-index:6;display:flex;justify-content:center;gap:6px;flex-wrap:wrap;padding:0 12px;">${tags}</div>
${arrow()}${progress()}</div>`;
}
function catAny(ws,label,val,sub,red){return ws.length===1?catSlide(ws[0],label,val,sub,red):catSlideMulti(ws,label,val,sub,red);}
function ctaSlide(d){
  return `<div class="slide" style="background:${RGRAD};">${wm('D','rgba(255,255,255,.08)')}${logo(true)}
<div style="position:absolute;left:36px;right:36px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;">
<h2 class="sans" style="font-size:36px;font-weight:700;letter-spacing:-1.2px;color:#fff;margin:0 0 14px;line-height:1.05;">Bu ay<br>podyumda<br>kim olacak?</h2>
<p class="sans" style="font-size:14px;line-height:1.55;color:rgba(255,255,255,.9);margin:0 0 24px;">Her ay yeni sıralama. Sürpriz hediyeler.<br>Kazanan bir ekibin parçası olmak istiyorsan bize yaz.</p>
<div><div class="sans" style="display:inline-flex;padding:13px 34px;background:${LB};color:${REDD};font-weight:700;font-size:14px;border-radius:28px;">Ekibimize katıl →</div></div>
<p class="sans" style="font-size:12px;color:#fff;margin:22px 0 0;letter-spacing:.4px;">RE/MAX DOĞUŞ • ${TEL}</p></div></div>`;
}
const catTag=(rs,lbl,big)=>`<div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:3px;padding:${big?'7px 12px':'5px 8px'};max-width:${big?160:140}px;background:rgba(220,28,46,.92);border:1px solid rgba(255,255,255,.14);border-radius:14px;white-space:nowrap;box-shadow:0 6px 16px rgba(0,0,0,.35);"><span style="font-size:9px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.8);">${lbl.toUpperCase()} 1.</span><span style="font-size:${big?12:10}px;font-weight:700;color:#fff;white-space:normal;text-align:center;line-height:1.15;">${rs.map(r=>r.name).join(' · ')}</span></div>`;
function build(d){
  const s=d.siralama, top=s.slice(0,3);
  { let rank=0,prev=null; s.forEach(r=>{ if(r.puan!==prev){rank++;prev=r.puan;} r._rank=rank; }); }
  const slides=[];
  const F=d.force||{},H=d.hide||{};
  const fC=x=>x.ciro||0, fI=x=>x.kapanis||0, fS=x=>(x.counts&&x.counts.sosyal_medya)||0;
  const wCiro=H.ciro?[]:(F.ciro?[F.ciro]:bestAll(s,fC)), wIslem=H.islem?[]:(F.islem?[F.islem]:bestAll(s,fI)), wSosyal=H.sosyal?[]:(F.sosyal?[F.sosyal]:bestAll(s,fS));
  const bCiro=wCiro[0]||null, bIslem=wIslem[0]||null, bSosyal=wSosyal[0]||null;
  if(SET==='birinci'){
    // kapak: tanıtım (fotoğrafsız, isimsiz)
    const ico={ciro:'<path d="M6 4h9a4 4 0 0 1 0 8H8M5 10h9M5 14h9M8 4v16"/>',islem:'<path d="M20 6 9 17l-5-5"/>',sosyal:'<rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"/>'};
    const cats=[['AYIN CİRO BİRİNCİSİ','En yüksek hizmet bedeli','ciro'],['AYIN İŞLEM BİRİNCİSİ','En çok kapanan işlem','islem'],['SOSYAL MEDYA BİRİNCİSİ','En çok içerik üreten','sosyal']];
    const cards=cats.map((c,i)=>`<div style="display:flex;align-items:center;gap:14px;padding:14px 16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:16px;backdrop-filter:blur(4px);">
<div style="width:44px;height:44px;border-radius:13px;background:${RGRAD};display:flex;align-items:center;justify-content:center;flex:0 0 44px;box-shadow:0 8px 18px rgba(220,28,46,.35);"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ico[c[2]]}</svg></div>
<div style="flex:1;"><div class="sans" style="font-size:11px;font-weight:800;letter-spacing:1.6px;color:${CORAL};">${c[0]}</div><div class="sans" style="font-size:13px;color:rgba(255,255,255,.7);margin-top:2px;">${c[1]}</div></div>
<div class="sans" style="width:34px;height:34px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:rgba(255,255,255,.6);">?</div></div>`).join('');
    slides.push(`<div class="slide" style="background:${NAVY};">
<div style="position:absolute;inset:0;background:radial-gradient(120% 60% at 80% 110%,rgba(220,28,46,.45),transparent 60%);"></div>
${wm('1','rgba(255,255,255,.06)')}${logo(true)}
<div style="position:absolute;left:32px;right:32px;top:96px;"><div class="sans" style="display:inline-block;background:${RGRAD};color:#fff;font-size:26px;font-weight:700;letter-spacing:-.6px;padding:8px 16px;border-radius:10px;line-height:1.1;box-shadow:0 8px 20px rgba(0,0,0,.25);">${d.ayAdi} Ayı</div><h1 class="sans" style="font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-1.2px;color:#fff;margin:8px 0 0;">Şampiyonları</h1>
<p class="sans" style="font-size:13px;color:rgba(255,255,255,.6);margin:10px 0 0;line-height:1.5;">${d.ayAdi} ayında üç kategoride zirveye çıkan danışmanlarımız.</p></div>
<div style="position:absolute;left:32px;right:32px;bottom:74px;display:flex;flex-direction:column;gap:10px;">${cards}</div>
<div class="sans" style="position:absolute;left:32px;bottom:40px;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.5);display:flex;align-items:center;gap:8px;">KAYDIR <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="rgba(255,255,255,.5)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>`);
    if(bCiro)slides.push(catAny(wCiro,'AYIN CİRO BİRİNCİSİ',fmtTL(bCiro.ciro),`${d.ayAdi} ayı brüt hizmet bedeli`,true));
    if(bIslem)slides.push(catAny(wIslem,'AYIN İŞLEM BİRİNCİSİ',`${bIslem.kapanis} <span style="font-size:18px;letter-spacing:0;color:rgba(255,255,255,.7)">işlem</span>`,`${d.ayAdi} ayında kapanan işlem`,false));
    if(bSosyal)slides.push(catAny(wSosyal,'SOSYAL MEDYA BİRİNCİSİ',`${bSosyal.counts.sosyal_medya} <span style="font-size:18px;letter-spacing:0;color:rgba(255,255,255,.7)">içerik</span>`,`${d.ayAdi} ayında paylaşılan içerik`,true));
    slides.push(ctaSlide(d));
    TOTAL=slides.length;
    return slides.map((h,i)=>h.replace(/__PCT__/g,String(((i+1)/TOTAL)*100)).replace(/__N__/g,String(i+1)).replace(/__T__/g,String(TOTAL)));
  }
  // kapak: tanıtım (fotoğrafsız, isimsiz) — podyum grafiği
  const pod=(n,h,col,txt)=>`<div style="display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;"><div class="sans" style="width:46px;height:46px;border-radius:50%;border:2px dashed rgba(255,255,255,.45);display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;color:rgba(255,255,255,.75);">?</div><div style="width:100%;height:${h}px;border-radius:14px 14px 0 0;background:${col};display:flex;align-items:flex-start;justify-content:center;padding-top:12px;box-shadow:0 -10px 30px rgba(0,0,0,.25);"><span class="sans" style="font-size:40px;font-weight:800;color:${txt};line-height:1;letter-spacing:-2px;">${n}</span></div></div>`;
  slides.push(`<div class="slide" style="background:${RGRAD};">${wm('D','rgba(255,255,255,.08)')}${logo(true)}
<div style="position:absolute;left:32px;right:32px;top:96px;"><div class="sans" style="display:inline-block;background:${NAVY};color:#fff;font-size:26px;font-weight:700;letter-spacing:-.6px;padding:8px 16px;border-radius:10px;line-height:1.1;box-shadow:0 8px 20px rgba(0,0,0,.25);">${d.ayAdi} Ayı</div><h1 class="sans" style="font-size:38px;font-weight:800;line-height:1.05;letter-spacing:-1.2px;color:#fff;margin:8px 0 0;">Performans<br>Sıralaması</h1>
<p class="sans" style="font-size:13px;color:rgba(255,255,255,.8);margin:10px 0 0;line-height:1.5;">Aktivite, istikrar, hedef ve kapanış puanlarıyla ayın ilk üçü.</p></div>
<div style="position:absolute;left:32px;right:32px;bottom:64px;display:flex;align-items:flex-end;gap:8px;">${pod(2,110,'rgba(5,10,48,.55)','rgba(255,255,255,.85)')}${pod(1,160,NAVY,CORAL)}${pod(3,84,'rgba(5,10,48,.45)','rgba(255,255,255,.85)')}</div>
<div style="position:absolute;left:32px;right:32px;bottom:60px;height:4px;background:rgba(5,10,48,.7);border-radius:2px;"></div>
<div class="sans" style="position:absolute;left:32px;bottom:30px;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.75);display:flex;align-items:center;gap:8px;">KAYDIR <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="rgba(255,255,255,.75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
</div>`);
  s.filter(r=>r._rank<=3).forEach((r,i)=>slides.push(podium(r._rank,r,i%2===1)));
  const rows=s.map((r,i)=>{const t=(r._rank||i+1)<=3,w=Math.round(r.puan/Math.max(1,s[0].puan)*100);return `<div style="display:flex;align-items:center;gap:12px;padding:${s.length>7?3:6}px 0;border-bottom:1px solid rgba(255,255,255,.08);">
<span class="sans" style="width:16px;font-size:13px;font-weight:700;color:${t?CORAL:'rgba(255,255,255,.4)'};">${r._rank||i+1}</span>${circ(r.id,s.length>7?26:30,t?CORAL:'rgba(255,255,255,.25)')}
<div style="flex:1;"><div style="display:flex;justify-content:space-between;margin-bottom:3px;"><span class="sans" style="font-size:13px;font-weight:${t?700:500};color:#fff;">${r.name}</span><span class="sans" style="font-size:13px;font-weight:700;color:${t?CORAL:'rgba(255,255,255,.6)'};">${r.puan}</span></div>
<div style="height:3px;background:rgba(255,255,255,.1);border-radius:2px;"><div style="width:${w}%;height:100%;background:${t?CORAL:'rgba(255,255,255,.35)'};border-radius:2px;"></div></div></div></div>`}).join('');
  slides.push(`<div class="slide" style="background:${NAVY};">${logo(false)}<div style="position:absolute;left:32px;right:48px;top:78px;bottom:62px;">
<h2 class="sans" style="font-size:30px;font-weight:700;letter-spacing:-.9px;color:#fff;margin:0 0 8px;line-height:1.1;">${d.ayAdi} sıralaması</h2>${rows}</div>${arrow()}${progress()}</div>`);
  slides.push(ctaSlide(d));
  TOTAL=slides.length;
  return slides.map((h,i)=>h.replace(/__PCT__/g,String(((i+1)/TOTAL)*100)).replace(/__N__/g,String(i+1)).replace(/__T__/g,String(TOTAL)));
}


// ==== ELLE DÜZENLEME ====
let OVR={p1:'',p2:'',p3:'',pts1:'',pts2:'',pts3:'',ciro:'',ciroV:'',islem:'',islemV:'',sosyal:'',sosyalV:'',hideCiro:false,hideIslem:false,hideSosyal:false};
function buildPanel(){
  const opts=(sel)=>'<option value="">— otomatik —</option>'+DATA.siralama.map(r=>`<option value="${r.id}" ${sel===r.id?'selected':''}>${r.name}</option>`).join('');
  const row=(lbl,key,vkey,ph,hideKey)=>`<div class="ovr"><label>${lbl}</label><select id="o-${key}">${opts(OVR[key])}</select><input id="o-${vkey}" placeholder="${ph}" value="${OVR[vkey]}">${hideKey?`<button class="off ${OVR[hideKey]?'on':''}" onclick="OVR.${hideKey}=!OVR.${hideKey};buildPanel()">${OVR[hideKey]?'Gizli':'Göster'}</button>`:''}</div>`;
  document.getElementById('panel-grid').innerHTML=SET==='birinci'?(row('Ciro','ciro','ciroV','₺','hideCiro')+row('İşlem','islem','islemV','adet','hideIslem')+row('S.Medya','sosyal','sosyalV','adet','hideSosyal')):(row('1.','p1','pts1','puan')+row('2.','p2','pts2','puan')+row('3.','p3','pts3','puan'));
  document.getElementById('panel').style.display='block';
}
function readPanel(){['p1','p2','p3','ciro','islem','sosyal'].forEach(k=>{const e=document.getElementById('o-'+k);if(e)OVR[k]=e.value;});['pts1','pts2','pts3','ciroV','islemV','sosyalV'].forEach(k=>{const e=document.getElementById('o-'+k);if(e)OVR[k]=e.value.trim();});}
function applyOvr(){readPanel();render(applyOverrides(DATA));}
function resetOvr(){OVR={p1:'',p2:'',p3:'',pts1:'',pts2:'',pts3:'',ciro:'',ciroV:'',islem:'',islemV:'',sosyal:'',sosyalV:'',hideCiro:false,hideIslem:false,hideSosyal:false};buildPanel();render(DATA);}
function applyOverrides(d){
  const base=d.siralama.map(r=>JSON.parse(JSON.stringify(r)));
  const byId=id=>base.find(r=>r.id===id);
  const picked=[OVR.p1,OVR.p2,OVR.p3];
  let ordered=[];
  if(picked.some(Boolean)){
    const auto=base.filter(r=>!picked.includes(r.id));
    for(let i=0;i<3;i++){let r=picked[i]?byId(picked[i]):auto.shift();if(r){const v=parseInt(OVR['pts'+(i+1)]);if(!isNaN(v))r.puan=v;ordered.push(r);}}
    ordered=ordered.concat(auto);
  } else {
    ordered=base;for(let i=0;i<3;i++){const v=parseInt(OVR['pts'+(i+1)]);if(!isNaN(v)&&ordered[i])ordered[i].puan=v;}
  }
  const o={...d,siralama:ordered,force:{}};
  const num=x=>parseFloat(String(x).replace(/[^\d.,]/g,'').replace(',','.'));
  if(OVR.ciro){const r=byId(OVR.ciro);if(r){o.force.ciro=r;const v=num(OVR.ciroV);if(!isNaN(v))r.ciro=v;}}
  if(OVR.islem){const r=byId(OVR.islem);if(r){o.force.islem=r;const v=parseInt(OVR.islemV);if(!isNaN(v))r.kapanis=v;}}
  if(OVR.sosyal){const r=byId(OVR.sosyal);if(r){o.force.sosyal=r;const v=parseInt(OVR.sosyalV);if(!isNaN(v))r.counts.sosyal_medya=v;}}
  o.hide={ciro:OVR.hideCiro,islem:OVR.hideIslem,sosyal:OVR.hideSosyal};
  return o;
}
function fillMonths(){
  const sel=document.getElementById('ay'),now=new Date();
  for(let i=1;i<=12;i++){const d=new Date(now.getFullYear(),now.getMonth()-i,1);const v=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');const o=document.createElement('option');o.value=v;o.textContent=MONTHS[d.getMonth()]+' '+d.getFullYear();sel.appendChild(o);}
  const q=new URLSearchParams(location.search).get('ay'); if(q)sel.value=q;
  sel.onchange=load;
}

async function load(){
  const ay=document.getElementById('ay').value, st=document.getElementById('status'), grid=document.getElementById('grid');
  st.textContent='Danışman Takip\'ten veri çekiliyor…'; grid.innerHTML=''; document.getElementById('zipbtn').disabled=true; document.body.removeAttribute('data-ready');
  try{
    const res=await fetch(`${APPS_SCRIPT_URL}?action=aylik&ay=${ay}&k=${KEY}`); DATA=await res.json();
    if(DATA.error)throw new Error(DATA.error);
    if(!DATA.hasData){st.textContent=`${DATA.ayAdi} ${DATA.yil} için kayıt bulunamadı.`;return;}
    buildPanel();
    await render(DATA);
  }catch(e){st.textContent='Hata: '+e.message;}
}

async function render(d){
  const st=document.getElementById('status'), grid=document.getElementById('grid');
  document.body.removeAttribute('data-ready'); document.getElementById('zipbtn').disabled=true;
  const slides=build(d);
  grid.innerHTML=slides.map((h,i)=>`<div class="card">${h}<small>${i+1}/${slides.length}</small><button class="ghost" onclick="downloadOne(${i})">PNG indir</button></div>`).join('');
  await Promise.all([...grid.querySelectorAll('img')].map(im=>im.complete?1:new Promise(r=>{im.onload=im.onerror=r;})));
  await document.fonts.ready;
  st.textContent=`${d.ayAdi} ${d.yil} · ${d.siralama.length} danışman · 1. ${d.siralama[0].name} (${d.siralama[0].puan} p)`+(d.force?' · elle düzenlendi':'');
  document.getElementById('zipbtn').disabled=false; document.body.setAttribute('data-ready','1');
  const sb=document.getElementById('sharebtn'); if(navigator.canShare){sb.style.display='inline-block';sb.disabled=false;}
}
async function shareAll(){
  const st=document.getElementById('status'),n=document.querySelectorAll('.slide').length,files=[];
  for(let i=0;i<n;i++){st.textContent=`Hazırlanıyor ${i+1}/${n}…`;const b=await renderPng(i);files.push(new File([b],`${DATA.ay}_${i+1}.png`,{type:'image/png'}));}
  if(!navigator.canShare||!navigator.canShare({files})){st.textContent='Bu tarayıcı dosya paylaşımını desteklemiyor; ZIP indir.';return;}
  try{await navigator.share({files,title:`${DATA.ayAdi} ${DATA.yil} · RE/MAX Doğuş`});st.textContent='Paylaşım menüsü açıldı → Instagram\'ı seç.';}catch(e){st.textContent='Paylaşım iptal edildi.';}
}
async function renderPng(i){
  const el=document.querySelectorAll('.slide')[i];
  const c=await html2canvas(el,{scale:1080/420,width:420,height:560,backgroundColor:null,useCORS:true,logging:false});
  return new Promise(r=>c.toBlob(r,'image/png'));
}
async function downloadOne(i){const b=await renderPng(i);saveBlob(b,`${DATA.ay}_${SET}_slide_${i+1}.png`);}
async function downloadAll(){
  const st=document.getElementById('status'),zip=new JSZip(),n=document.querySelectorAll('.slide').length;
  for(let i=0;i<n;i++){st.textContent=`Üretiliyor ${i+1}/${n}…`;zip.file(`slide_${i+1}.png`,await renderPng(i));}
  saveBlob(await zip.generateAsync({type:'blob'}),`${SET==='birinci'?'birinciler':'performans'}_${DATA.ay}.zip`); st.textContent='ZIP indirildi ✓';
}
function saveBlob(b,name){const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000);}

document.getElementById('ttl').textContent=SET==='birinci'?'Ayın Şampiyonları — Görseller':'Performans Sıralaması — Görseller';
fillMonths(); load();
</script>

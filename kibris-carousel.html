<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kıbrıs Yatırım Karuseli · RE/MAX Doğuş</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#0b0f2a;color:#fff;min-height:100vh}
  .top{display:flex;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.08);flex-wrap:wrap}
  .top img{height:30px}
  .top h1{font-size:16px;font-weight:700;flex:1;min-width:160px}
  select,button{font:600 13px 'Plus Jakarta Sans',sans-serif;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
  select{background:#161c44;color:#fff}
  button{background:#DC1C2E;color:#fff}
  button.ghost{background:rgba(255,255,255,.1);color:#fff}
  .status{padding:10px 20px;font-size:12px;color:rgba(255,255,255,.6)}
  .grid{display:flex;flex-wrap:wrap;gap:18px;padding:20px;justify-content:center}
  .card{display:flex;flex-direction:column;gap:8px;align-items:center}
  .card small{font-size:11px;color:rgba(255,255,255,.5)}
  .slide{width:420px!important;height:560px!important;min-height:560px;max-height:560px;position:relative;overflow:hidden;border-radius:4px;flex:0 0 420px;-webkit-mask-image:-webkit-radial-gradient(white,black)}
  body.story .slide{height:747px!important;min-height:747px;max-height:747px}
  .slide *{max-width:none}
  .slide img{-webkit-user-drag:none;pointer-events:none}
  .sans{font-family:'Plus Jakarta Sans',sans-serif}
  @media(max-width:480px){
    .grid{padding:12px;gap:10px}
    .card{width:100%;height:470px;overflow:hidden;justify-content:flex-start}
    .card .slide{transform:scale(.8);transform-origin:top center;margin-bottom:-112px}
    body.story .card{height:620px}
    body.story .card .slide{margin-bottom:-149px}
  }
</style>
</head>
<body>
<div class="top">
  <img src="https://raw.githubusercontent.com/dogusremax/dogusportal/main/assets/dogus-logo.png" crossorigin="anonymous" alt="Doğuş">
  <h1>Kuzey Kıbrıs · Yatırım Öncesi 5 Kontrol</h1>
  <select id="fmt" onchange="setFmt()">
    <option value="feed">Karusel (3:4)</option>
    <option value="story">Story (9:16)</option>
  </select>
  <button class="ghost" onclick="render()">Yenile</button>
  <button id="zipbtn" onclick="downloadAll()">Tümünü indir (ZIP)</button>
</div>
<div class="status" id="status">Hazır. Görsellere tıklayarak tek tek PNG indirebilirsin.</div>
<div class="grid" id="grid"></div>

<script>
const NAVY="#050A30", RED="#DC1C2E", REDD="#910B19", CORAL="#FB5160", LB="#F6F3F1";
const RGRAD=`linear-gradient(160deg,${REDD} 0%,${RED} 45%,${CORAL} 100%)`;
const TEL="0216 315 15 15";
const LOGO="https://raw.githubusercontent.com/dogusremax/dogusportal/main/assets/dogus-logo.png";
let STORY=false, TOTAL=7;

const logo=(right)=>`<img src="${LOGO}" crossorigin="anonymous" style="position:absolute;top:30px;${right?'right':'left'}:32px;width:110px;z-index:12;">`;
const wm=(t,c)=>`<div class="sans" style="position:absolute;top:-50px;left:18px;font-size:${STORY?440:380}px;font-weight:800;line-height:1;color:${c};letter-spacing:-16px;">${t}</div>`;
const arrow=()=>`<div style="position:absolute;right:0;top:0;bottom:0;width:48px;z-index:9;display:flex;align-items:center;justify-content:center;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="rgba(255,255,255,.55)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;
const progress=()=>`<div style="position:absolute;bottom:0;left:0;right:0;padding:16px 28px 20px;z-index:10;display:flex;align-items:center;gap:10px;"><div style="flex:1;height:3px;background:rgba(255,255,255,.18);border-radius:2px;overflow:hidden;"><div style="height:100%;width:__PCT__%;background:#fff;border-radius:2px;"></div></div><span class="sans" style="font-size:11px;color:rgba(255,255,255,.55);font-weight:500;">__N__/__T__</span></div>`;
const kaydir=(op)=>`<div class="sans" style="position:absolute;left:32px;bottom:${STORY?60:34}px;font-size:11px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,${op});display:flex;align-items:center;gap:8px;z-index:10;">KAYDIR <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="rgba(255,255,255,${op})" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></div>`;

const ICO={
  kocan:'<path d="M6 2h9l5 5v15H6z"/><path d="M15 2v5h5"/><circle cx="12" cy="13" r="2.5"/><path d="M12 15.5V19"/>',
  firma:'<path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-6h6v6"/>',
  belge:'<path d="M20 6 9 17l-5-5"/>',
  para:'<circle cx="12" cy="12" r="9"/><path d="M15 9h-4a1.5 1.5 0 0 0 0 3h2a1.5 1.5 0 0 1 0 3H9"/><path d="M12 7v10"/>',
  cikis:'<path d="M3 17l6-6 4 4 7-8"/><path d="M14 7h6v6"/>'
};
const icon=(k,size,bg)=>`<div style="width:${size}px;height:${size}px;border-radius:${Math.round(size*0.3)}px;background:${bg};display:flex;align-items:center;justify-content:center;flex:0 0 ${size}px;box-shadow:0 8px 18px rgba(0,0,0,.28);"><svg viewBox="0 0 24 24" width="${Math.round(size*0.5)}" height="${Math.round(size*0.5)}" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICO[k]}</svg></div>`;

const ITEMS=[
  {k:'kocan', kisa:'Koçan tipi ve tapu araştırması', et:'KONTROL 1',  bas:'Önce koçana bak,<br>projeye sonra',
   ozet:'KKTC’de her tapu aynı ağırlıkta değil. Koçanın tipi; satış kolaylığını, kredi ve devir sürecini, kısacası yatırımın geleceğini belirler.',
   pills:['Koçan tipi nedir?','Üzerinde ipotek var mı?','Avukat araştırması şart']},
  {k:'firma', kisa:'Müteahhitin teslim geçmişi', et:'KONTROL 2',  bas:'Projeyi değil,<br>firmayı alıyorsun',
   ozet:'Teslim geçmişi olmayan bir firmanın cazip fiyatı, çoğu zaman riskin fiyatıdır. Geçmiş projeler bugün ne durumda, ona bak.',
   pills:['Kaç proje teslim etmiş?','Zamanında mı teslim?','Arsa firmanın mı?']},
  {k:'belge', kisa:'Sözleşmenin tapuya tescili', et:'KONTROL 3',  bas:'Sözleşmeni<br>tescil ettir',
   ozet:'Satış sözleşmesinin Tapu Dairesi’ne kaydı, mülkü üçüncü kişilere karşı koruyan en kritik adımdır. Yasal süre kaçarsa koruma da kaçar.',
   pills:['Tapu’ya tescil','Alım izni süreci','Ödeme–teslim uyumu']},
  {k:'para',  kisa:'Fiyat değil, toplam maliyet', et:'KONTROL 4',  bas:'Fiyat başka,<br>maliyet başka',
   ozet:'Listedeki rakam işin yarısı. Bütçeni sözleşme fiyatına göre değil, kapıdan girene kadarki toplam maliyete göre kur.',
   pills:['KDV ve devir harcı','Altyapı, trafo, aidat','Avukat ve masraflar']},
  {k:'cikis', kisa:'Kira getirisi ve çıkış planı', et:'KONTROL 5',  bas:'Girişi değil,<br>çıkışı planla',
   ozet:'Satması kolay olmayan mülk kâğıt üstünde kazandırır. Kiralanabilirliği ve ikinci el hareketliliği baştan sor.',
   pills:['Sezonluk mu, 12 ay mı?','İkinci el hareketli mi?','Gerçekçi getiri']}
];

function coverSlide(){
  const rows=ITEMS.map(it=>`<div style="display:flex;align-items:center;gap:${STORY?14:11}px;padding:${STORY?9:7}px 12px;background:rgba(5,10,48,.28);border:1px solid rgba(255,255,255,.16);border-radius:12px;">
${icon(it.k,STORY?34:28,'rgba(5,10,48,.85)')}
<div class="sans" style="flex:1;font-size:${STORY?14:12.5}px;font-weight:600;color:#fff;line-height:1.25;">${it.kisa}</div></div>`).join('');
  return `<div class="slide" style="background:${RGRAD};">${wm('5','rgba(255,255,255,.10)')}${logo(true)}
<div style="position:absolute;left:32px;right:32px;top:${STORY?104:90}px;bottom:${STORY?92:60}px;display:flex;flex-direction:column;justify-content:space-between;">
<div>
<div class="sans" style="display:inline-block;background:${NAVY};color:#fff;font-size:22px;font-weight:700;letter-spacing:-.6px;padding:8px 16px;border-radius:10px;line-height:1.1;box-shadow:0 8px 20px rgba(0,0,0,.25);">Kuzey Kıbrıs</div>
<h1 class="sans" style="font-size:${STORY?42:38}px;font-weight:800;line-height:1.05;letter-spacing:-1.2px;color:#fff;margin:8px 0 0;">Yatırım öncesi<br>5 kritik kontrol</h1>
<p class="sans" style="font-size:${STORY?15:13}px;color:rgba(255,255,255,.85);margin:10px 0 0;line-height:1.5;">Bunları atlayan yatırımcı, sorununu büyütüyor.</p>
</div>
<div style="display:flex;flex-direction:column;gap:${STORY?9:6}px;">${rows}</div>
</div>
${kaydir('.85')}</div>`;
}

function itemSlide(it,i){
  const red=i%2===1;
  const chip=red?NAVY:CORAL;
  const pills=it.pills.map(p=>`<span class="sans" style="display:inline-block;font-size:${STORY?13:12}px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.14);color:#fff;margin:0 6px 6px 0;">${p}</span>`).join('');
  return `<div class="slide" style="background:${red?RGRAD:NAVY};">
${wm(String(i+1),red?'rgba(255,255,255,.10)':'rgba(255,255,255,.06)')}${logo(false)}
<div style="position:absolute;right:${STORY?34:28}px;bottom:${STORY?130:96}px;opacity:.9;">${icon(it.k,STORY?96:78,red?'rgba(5,10,48,.55)':'rgba(255,255,255,.10)')}</div>
<div style="position:absolute;left:36px;right:${STORY?60:56}px;top:${STORY?150:112}px;z-index:5;">
<div class="sans" style="display:inline-block;background:${chip};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 11px;border-radius:8px;margin-bottom:12px;">${it.et}</div>
<div class="sans" style="font-size:${STORY?36:32}px;font-weight:700;letter-spacing:-1.2px;color:#fff;line-height:1.05;margin-bottom:14px;">${it.bas}</div>
<p class="sans" style="font-size:${STORY?15:13.5}px;line-height:1.6;color:rgba(255,255,255,.8);margin:0 0 ${STORY?24:18}px;">${it.ozet}</p>
<div style="max-width:${STORY?330:280}px;">${pills}</div></div>
${arrow()}${progress()}</div>`;
}

function ctaSlide(){
  return `<div class="slide" style="background:${RGRAD};">${wm('D','rgba(255,255,255,.08)')}${logo(true)}
<div style="position:absolute;left:36px;right:36px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;">
<h2 class="sans" style="font-size:${STORY?38:32}px;font-weight:700;letter-spacing:-1.2px;color:#fff;margin:0 0 14px;line-height:1.05;">Kıbrıs’ta<br>doğru soruyla<br>başla</h2>
<p class="sans" style="font-size:${STORY?14.5:12.5}px;line-height:1.6;color:rgba(255,255,255,.92);margin:0 0 20px;">Adanın en köklü ve en prestijli <b style="font-weight:800;">4 ana şirketi</b> ile RE/MAX Doğuş olarak tam yetkili iş ortaklığı anlaşması yaptık. Size özel ödeme planları ve projeleri yerinde görmek için bizi hemen arayabilirsiniz.<br><br>Proje seçiminden koçan kontrolüne, ödeme planından çıkış stratejisine kadar süreci birlikte planlıyoruz.</p>
<div><div class="sans" style="display:inline-flex;padding:13px 34px;background:${LB};color:${REDD};font-weight:700;font-size:14px;border-radius:28px;">Hemen arayın</div></div>
<p class="sans" style="font-size:12px;color:#fff;margin:22px 0 0;letter-spacing:.4px;">RE/MAX DOĞUŞ • ${TEL}</p></div></div>`;
}

function build(){
  const slides=[coverSlide(), ...ITEMS.map((it,i)=>itemSlide(it,i)), ctaSlide()];
  TOTAL=slides.length;
  return slides.map((h,i)=>h.replace(/__PCT__/g,String(((i+1)/TOTAL)*100)).replace(/__N__/g,String(i+1)).replace(/__T__/g,String(TOTAL)));
}

function render(){
  const g=document.getElementById('grid'); g.innerHTML='';
  build().forEach((html,i)=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=html+`<small>Slayt ${i+1} · indirmek için tıkla</small>`;
    c.querySelector('.slide').onclick=()=>shot(c.querySelector('.slide'),`kibris-5-kontrol-${i+1}.png`);
    g.appendChild(c);
  });
  document.getElementById('status').textContent=`${TOTAL} slayt hazır · ${STORY?'1080×1920 story':'1080×1440 karusel'}`;
}
function setFmt(){STORY=document.getElementById('fmt').value==='story';document.body.classList.toggle('story',STORY);render();}

async function canvasOf(el){
  return html2canvas(el,{scale:1080/420,useCORS:true,allowTaint:false,backgroundColor:null,logging:false,width:420,height:STORY?747:560});
}
async function shot(el,name){
  const s=document.getElementById('status'); s.textContent='Görsel hazırlanıyor…';
  try{const cv=await canvasOf(el);const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name;a.click();s.textContent='İndirildi: '+name;}
  catch(e){s.textContent='Hata: '+e.message;}
}
async function downloadAll(){
  const s=document.getElementById('status'); const btn=document.getElementById('zipbtn'); btn.disabled=true;
  try{
    const zip=new JSZip(), els=[...document.querySelectorAll('.slide')];
    for(let i=0;i<els.length;i++){
      s.textContent=`Görseller hazırlanıyor… ${i+1}/${els.length}`;
      const cv=await canvasOf(els[i]);
      zip.file(`kibris-5-kontrol-${i+1}.png`, cv.toDataURL('image/png').split(',')[1], {base64:true});
    }
    const blob=await zip.generateAsync({type:'blob'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`kibris-5-kontrol-${STORY?'story':'karusel'}.zip`;a.click();
    s.textContent='ZIP indirildi.';
  }catch(e){s.textContent='Hata: '+e.message;}
  btn.disabled=false;
}
render();
</script>
</body>
</html>

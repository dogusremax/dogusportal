const COUNCIL_FEE_TL = 35447;

function fmt(n) {
  return n.toLocaleString("en-GB", { minimumFractionDigits: 0, maximumFractionDigits: 0 });
}

const phaseColors = ["#003DA5", "#1a5fd0", "#CC0000"];

function App() {
  const [lang, setLang] = useState("tr");
  const [priceRaw, setPriceRaw] = useState("");
  const [openItem, setOpenItem] = useState(null);
  const [showEmailModal, setShowEmailModal] = useState(false);
  const [email, setEmail] = useState("");
  const [sending, setSending] = useState(false);
  const [sent, setSent] = useState(false);
  const [sendError, setSendError] = useState("");
  const t = translations[lang];

  const price = useMemo(() => {
    const cleaned = priceRaw.replace(/[^0-9]/g, "");
    return cleaned ? parseInt(cleaned, 10) : 0;
  }, [priceRaw]);

  const handlePriceChange = (e) => {
    const raw = e.target.value.replace(/[^0-9]/g, "");
    if (raw) {
      setPriceRaw(parseInt(raw, 10).toLocaleString("en-GB"));
    } else {
      setPriceRaw("");
    }
  };

  const stampDuty = price * 0.005;
  const titleDeed1 = price * 0.03;
  const titleDeed2 = price * 0.03;
  const vat = price * 0.05;
  const percentTotal = stampDuty + titleDeed1 + titleDeed2 + vat;
  const ratio = price > 0 ? ((percentTotal / price) * 100).toFixed(2) : "0";

  const phases = price > 0 ? [
    { label: t.phase1, color: phaseColors[0], items: [
      { name: t.stampDuty, rate: t.stampDutyRate, time: t.stampDutyTime, val: `£${fmt(stampDuty)}` },
      { name: t.titleDeed1, rate: t.titleDeed1Rate, time: t.titleDeed1Time, val: `£${fmt(titleDeed1)}` },
      { name: t.councilFee, rate: null, time: t.councilFeeTime, val: `${fmt(COUNCIL_FEE_TL)} TL`, note: t.councilFeeNote || null },
    ]},
    { label: t.phase2, color: phaseColors[1], items: [
      { name: t.titleDeed2, rate: t.titleDeed2Rate, time: t.titleDeed2Time, val: `£${fmt(titleDeed2)}` },
    ]},
    { label: t.phase3, color: phaseColors[2], items: [
      { name: t.vat, rate: t.vatRate, time: t.vatTime, val: `£${fmt(vat)}` },
      { name: t.trafo, rate: null, time: t.trafoTime, val: t.toBeDetermined, note: t.trafoNote },
      { name: t.lawyer, rate: null, time: t.lawyerTime, val: t.toBeDetermined, note: t.lawyerNote },
    ]},
  ] : [];

  const handleSendPdf = async () => {
    if (!email || !email.includes("@")) return;
    setSending(true);
    setSendError("");
    try {
      const payload = {
        email,
        lang,
        price,
        stampDuty,
        titleDeed1,
        titleDeed2,
        vat,
        councilFeeTL: COUNCIL_FEE_TL,
        percentTotal,
        ratio,
      };
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXlY4CxiKTUXJ5tuVbXw55xW_f3kzZ-RoFRs2kDgNXSctDP0iIwl8ExlwBqKZiEVUt/exec";
      const params = new URLSearchParams(payload).toString();
      const img = new Image();
      img.onload = () => {};
      img.onerror = () => {};
      img.src = SCRIPT_URL + "?" + params;
      setSent(true);
      setTimeout(() => {
        setShowEmailModal(false);
        setSent(false);
        setEmail("");
      }, 2500);
    } catch (err) {
      setSendError(lang === "tr" ? "Gönderilemedi. Tekrar deneyin." : "Failed to send. Please try again.");
    } finally {
      setSending(false);
    }
  };

  return (
    <div style={{
      minHeight: "100vh",
      background: "linear-gradient(160deg, #f0f4fa 0%, #e8edf6 100%)",
      fontFamily: "'Inter', 'Segoe UI', system-ui, sans-serif",
      color: "#1a1a2e",
    }}>
      {/* Header */}
      <div style={{
        background: "linear-gradient(135deg, #003DA5 0%, #001f5c 100%)",
        padding: "20px 20px 22px",
        position: "relative",
        overflow: "hidden",
      }}>
        <div style={{
          position: "absolute", top: -60, right: -40,
          width: 200, height: 200, borderRadius: "50%",
          background: "rgba(255,255,255,0.03)",
        }} />

        <div style={{
          display: "flex", justifyContent: "space-between", alignItems: "center",
          maxWidth: 700, margin: "0 auto", position: "relative", zIndex: 1,
        }}>
          <div style={{ display: "flex", alignItems: "center", gap: 16 }}>
            <img
              src={LOGO}
              alt="RE/MAX Doğuş"
              style={{ height: 44, objectFit: "contain", filter: "drop-shadow(0 2px 4px rgba(0,0,0,0.3))" }}
            />
            <div>
              <h1 style={{
                color: "#fff", fontSize: 17, fontWeight: 700,
                margin: 0, letterSpacing: "-0.2px",
              }}>{t.title}</h1>
              <p style={{
                color: "rgba(255,255,255,0.6)", fontSize: 12,
                margin: "2px 0 0", fontWeight: 400,
              }}>{t.subtitle}</p>
            </div>
          </div>

          <button
            onClick={() => setLang(lang === "tr" ? "en" : "tr")}
            style={{
              background: "rgba(255,255,255,0.1)",
              border: "1px solid rgba(255,255,255,0.2)",
              color: "#fff", borderRadius: 8,
              padding: "7px 12px", fontSize: 12,
              cursor: "pointer", fontWeight: 500,
              transition: "all 0.2s",
            }}
            onMouseOver={(e) => e.target.style.background = "rgba(255,255,255,0.18)"}
            onMouseOut={(e) => e.target.style.background = "rgba(255,255,255,0.1)"}
          >{t.langBtn}</button>
        </div>
      </div>

      <div style={{ maxWidth: 700, margin: "0 auto", padding: "20px 16px 40px" }}>
        {/* Price Input */}
        <div style={{
          background: "#fff",
          borderRadius: 14,
          padding: "22px",
          boxShadow: "0 2px 12px rgba(0,61,165,0.06)",
          marginBottom: 20,
          border: "1px solid rgba(0,61,165,0.08)",
        }}>
          <label style={{
            display: "block", fontSize: 12, fontWeight: 700,
            color: "#003DA5", marginBottom: 8,
            textTransform: "uppercase", letterSpacing: "1px",
          }}>{t.priceLabel}</label>
          <div style={{ position: "relative" }}>
            <span style={{
              position: "absolute", left: 16, top: "50%",
              transform: "translateY(-50%)",
              fontSize: 24, fontWeight: 800, color: "#003DA5", opacity: 0.7,
            }}>£</span>
            <input
              type="text"
              inputMode="numeric"
              value={priceRaw}
              onChange={handlePriceChange}
              placeholder={t.pricePlaceholder}
              style={{
                width: "100%", boxSizing: "border-box",
                padding: "16px 16px 16px 44px",
                fontSize: 28, fontWeight: 800,
                border: "2px solid #e0e6f0",
                borderRadius: 10, outline: "none",
                color: "#1a1a2e",
                transition: "border-color 0.2s",
                background: "#fafbfe",
                letterSpacing: "-0.5px",
              }}
              onFocus={(e) => e.target.style.borderColor = "#003DA5"}
              onBlur={(e) => e.target.style.borderColor = "#e0e6f0"}
            />
          </div>
        </div>

        {/* Cost Breakdown */}
        {price > 0 && (
          <>
            <h2 style={{
              fontSize: 13, fontWeight: 800, color: "#003DA5",
              textTransform: "uppercase", letterSpacing: "1.2px",
              margin: "28px 0 14px", paddingLeft: 2,
            }}>{t.costTableTitle}</h2>

            {phases.map((phase, pi) => (
              <div key={pi} style={{ marginBottom: 14 }}>
                <div style={{
                  display: "flex", alignItems: "center", gap: 8,
                  marginBottom: 8, paddingLeft: 2,
                }}>
                  <div style={{
                    width: 24, height: 24, borderRadius: "50%",
                    background: phase.color,
                    color: "#fff", display: "flex",
                    alignItems: "center", justifyContent: "center",
                    fontSize: 12, fontWeight: 800,
                  }}>{pi + 1}</div>
                  <span style={{
                    fontSize: 12, fontWeight: 800,
                    color: phase.color,
                    letterSpacing: "0.5px",
                    textTransform: "uppercase",
                  }}>{phase.label}</span>
                </div>

                <div style={{
                  background: "#fff", borderRadius: 12,
                  overflow: "hidden",
                  boxShadow: "0 1px 6px rgba(0,0,0,0.04)",
                  border: "1px solid rgba(0,61,165,0.06)",
                }}>
                  {phase.items.map((item, ii) => {
                    const itemKey = `${pi}-${ii}`;
                    const isOpen = openItem === itemKey;
                    const handleSendPdf = async () => {
    if (!email || !email.includes("@")) return;
    setSending(true);
    setSendError("");
    try {
      const payload = {
        email,
        lang,
        price,
        stampDuty,
        titleDeed1,
        titleDeed2,
        vat,
        councilFeeTL: COUNCIL_FEE_TL,
        percentTotal,
        ratio,
      };
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxXlY4CxiKTUXJ5tuVbXw55xW_f3kzZ-RoFRs2kDgNXSctDP0iIwl8ExlwBqKZiEVUt/exec";
      const params = new URLSearchParams(payload).toString();
      const img = new Image();
      img.onload = () => {};
      img.onerror = () => {};
      img.src = SCRIPT_URL + "?" + params;
      setSent(true);
      setTimeout(() => {
        setShowEmailModal(false);
        setSent(false);
        setEmail("");
      }, 2500);
    } catch (err) {
      setSendError(lang === "tr" ? "Gönderilemedi. Tekrar deneyin." : "Failed to send. Please try again.");
    } finally {
      setSending(false);
    }
  };

  return (
                    <div key={ii} style={{
                      borderBottom: ii < phase.items.length - 1 ? "1px solid #f0f2f7" : "none",
                    }}>
                      <div
                        onClick={() => setOpenItem(isOpen ? null : itemKey)}
                        style={{
                          padding: "14px 16px",
                          cursor: "pointer",
                          transition: "background 0.15s",
                          background: isOpen ? "#f8faff" : "transparent",
                        }}
                        onMouseOver={(e) => { if (!isOpen) e.currentTarget.style.background = "#fafbfe"; }}
                        onMouseOut={(e) => { if (!isOpen) e.currentTarget.style.background = "transparent"; }}
                      >
                        <div style={{
                          display: "flex", justifyContent: "space-between",
                          alignItems: "center",
                        }}>
                          <div style={{ flex: 1, paddingRight: 12 }}>
                            <div style={{
                              fontSize: 14, fontWeight: 600, color: "#1a1a2e",
                              display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap",
                            }}>
                              <span style={{
                                fontSize: 10, color: isOpen ? "#003DA5" : "#bbb",
                                transition: "transform 0.2s, color 0.2s",
                                transform: isOpen ? "rotate(90deg)" : "rotate(0deg)",
                                display: "inline-block",
                              }}>▶</span>
                              {item.name}
                              {item.rate && (
                                <span style={{
                                  background: "#eef2ff", color: "#003DA5",
                                  fontSize: 10, fontWeight: 800,
                                  padding: "2px 8px", borderRadius: 20,
                                  letterSpacing: "0.3px",
                                }}>{item.rate}</span>
                              )}
                            </div>
                          </div>
                          <div style={{
                            fontSize: 16, fontWeight: 800,
                            color: item.val === t.toBeDetermined ? "#bbb" : "#1a1a2e",
                            fontStyle: item.val === t.toBeDetermined ? "italic" : "normal",
                            whiteSpace: "nowrap",
                          }}>{item.val}</div>
                        </div>
                      </div>
                      {isOpen && (
                        <div style={{
                          padding: "0 16px 14px 34px",
                          background: "#f8faff",
                          animation: "fadeIn 0.2s ease",
                        }}>
                          <div style={{
                            fontSize: 12, color: "#556", lineHeight: 1.6,
                            borderLeft: `2px solid ${phase.color}`,
                            paddingLeft: 10,
                          }}>
                            <div style={{ fontWeight: 600, color: "#444", marginBottom: 2 }}>
                              {lang === "tr" ? "Ödeme Zamanı" : "Payment Time"}
                            </div>
                            {item.time}
                            {item.note && (
                              <div style={{ marginTop: 4, fontStyle: "italic", color: "#888", fontSize: 11 }}>
                                {item.note}
                              </div>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                    );
                  })}
                </div>
              </div>
            ))}

            {/* Visual Timeline */}
            <div style={{
              display: "flex", alignItems: "center",
              margin: "20px 8px", gap: 0,
            }}>
              {phases.map((phase, pi) => (
                <div key={pi} style={{
                  display: "flex", alignItems: "center",
                  flex: pi < phases.length - 1 ? 1 : 0,
                }}>
                  <div style={{
                    width: 12, height: 12, borderRadius: "50%",
                    background: phase.color, flexShrink: 0,
                    boxShadow: `0 0 0 3px ${phase.color}22`,
                  }} />
                  {pi < phases.length - 1 && (
                    <div style={{
                      height: 2, flex: 1,
                      background: `linear-gradient(90deg, ${phaseColors[pi]}, ${phaseColors[pi + 1]})`,
                    }} />
                  )}
                </div>
              ))}
            </div>

            {/* Total Card */}
            <div style={{
              background: "linear-gradient(135deg, #003DA5 0%, #001f5c 100%)",
              borderRadius: 14, padding: "20px",
              color: "#fff", marginTop: 6,
              position: "relative", overflow: "hidden",
            }}>
              <div style={{
                position: "absolute", top: -30, right: -30,
                width: 120, height: 120, borderRadius: "50%",
                background: "rgba(255,255,255,0.04)",
              }} />
              <div style={{
                display: "flex", justifyContent: "space-between",
                alignItems: "center", marginBottom: 14,
              }}>
                <span style={{ fontSize: 12, fontWeight: 600, opacity: 0.7, textTransform: "uppercase", letterSpacing: "0.5px" }}>
                  {t.totalPercent}
                </span>
                <span style={{ fontSize: 28, fontWeight: 900, letterSpacing: "-1px" }}>
                  £{fmt(percentTotal)}
                </span>
              </div>
              <div style={{
                height: 1, background: "rgba(255,255,255,0.12)",
                margin: "0 0 14px",
              }} />
              <div style={{
                display: "flex", justifyContent: "space-between",
                alignItems: "center",
              }}>
                <span style={{ fontSize: 12, fontWeight: 600, opacity: 0.7, textTransform: "uppercase", letterSpacing: "0.5px" }}>
                  {t.totalRatio}
                </span>
                <span style={{
                  fontSize: 22, fontWeight: 900,
                  background: "rgba(255,255,255,0.12)",
                  padding: "4px 16px", borderRadius: 8,
                }}>%{ratio}</span>
              </div>
            </div>

            {/* Breakdown Bar */}
            <div style={{
              marginTop: 14, background: "#fff",
              borderRadius: 12, padding: "14px 16px",
              boxShadow: "0 1px 6px rgba(0,0,0,0.04)",
              border: "1px solid rgba(0,61,165,0.06)",
            }}>
              <div style={{
                display: "flex", height: 8, borderRadius: 4,
                overflow: "hidden", gap: 2,
              }}>
                <div style={{ flex: 0.5, background: "#6b8cce", borderRadius: "4px 0 0 4px" }} />
                <div style={{ flex: 3, background: "#003DA5" }} />
                <div style={{ flex: 3, background: "#1a5fd0" }} />
                <div style={{ flex: 5, background: "#CC0000", borderRadius: "0 4px 4px 0" }} />
              </div>
              <div style={{
                display: "flex", justifyContent: "space-between",
                marginTop: 10, flexWrap: "wrap", gap: "4px 12px",
              }}>
                {[
                  { c: "#6b8cce", l: t.stampDuty, r: "0.5%" },
                  { c: "#003DA5", l: t.titleDeed1, r: "3%" },
                  { c: "#1a5fd0", l: t.titleDeed2, r: "3%" },
                  { c: "#CC0000", l: t.vat, r: "5%" },
                ].map((x, i) => (
                  <div key={i} style={{
                    display: "flex", alignItems: "center", gap: 5,
                  }}>
                    <div style={{
                      width: 8, height: 8, borderRadius: 2,
                      background: x.c, flexShrink: 0,
                    }} />
                    <span style={{
                      fontSize: 10, color: "#777", fontWeight: 600,
                    }}>{x.l} ({x.r})</span>
                  </div>
                ))}
              </div>
            </div>

            {/* Send PDF Button */}
            <button
              onClick={() => { setShowEmailModal(true); setSent(false); setSendError(""); }}
              style={{
                width: "100%",
                marginTop: 18,
                padding: "14px",
                background: "linear-gradient(135deg, #CC0000 0%, #a00 100%)",
                color: "#fff",
                border: "none",
                borderRadius: 12,
                fontSize: 15,
                fontWeight: 700,
                cursor: "pointer",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 8,
                boxShadow: "0 4px 14px rgba(204,0,0,0.25)",
                transition: "transform 0.15s, box-shadow 0.15s",
              }}
              onMouseOver={(e) => { e.currentTarget.style.transform = "translateY(-1px)"; e.currentTarget.style.boxShadow = "0 6px 20px rgba(204,0,0,0.3)"; }}
              onMouseOut={(e) => { e.currentTarget.style.transform = "translateY(0)"; e.currentTarget.style.boxShadow = "0 4px 14px rgba(204,0,0,0.25)"; }}
            >
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                <path d="M21.5 12H16l-3 9L9 3l-3 9H1.5" />
              </svg>
              {t.sendPdf}
            </button>

            {/* Disclaimer */}
            <p style={{
              fontSize: 10, color: "#aaa", textAlign: "center",
              margin: "14px 0 0", lineHeight: 1.5,
              fontStyle: "italic",
            }}>{t.disclaimer}</p>
          </>
        )}

        {/* Email Modal */}
        {showEmailModal && (
          <div style={{
            position: "fixed", top: 0, left: 0, right: 0, bottom: 0,
            background: "rgba(0,15,40,0.6)",
            backdropFilter: "blur(4px)",
            display: "flex", alignItems: "center", justifyContent: "center",
            zIndex: 1000, padding: 16,
          }}
          onClick={(e) => { if (e.target === e.currentTarget) setShowEmailModal(false); }}
          >
            <div style={{
              background: "#fff",
              borderRadius: 18,
              padding: "28px 24px",
              maxWidth: 420,
              width: "100%",
              boxShadow: "0 20px 60px rgba(0,0,0,0.25)",
              position: "relative",
            }}>
              {/* Close button */}
              <button
                onClick={() => setShowEmailModal(false)}
                style={{
                  position: "absolute", top: 14, right: 14,
                  background: "none", border: "none",
                  fontSize: 20, color: "#bbb", cursor: "pointer",
                  width: 32, height: 32, borderRadius: "50%",
                  display: "flex", alignItems: "center", justifyContent: "center",
                }}
                onMouseOver={(e) => e.target.style.color = "#666"}
                onMouseOut={(e) => e.target.style.color = "#bbb"}
              >×</button>

              {/* Icon */}
              <div style={{
                width: 52, height: 52, borderRadius: 14,
                background: "linear-gradient(135deg, #003DA5, #001f5c)",
                display: "flex", alignItems: "center", justifyContent: "center",
                margin: "0 auto 16px",
              }}>
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                  <rect x="2" y="4" width="20" height="16" rx="2" />
                  <path d="M22 4L12 13L2 4" />
                </svg>
              </div>

              <h3 style={{
                textAlign: "center", fontSize: 18, fontWeight: 700,
                color: "#1a1a2e", margin: "0 0 6px",
              }}>{t.modalTitle}</h3>
              <p style={{
                textAlign: "center", fontSize: 12, color: "#888",
                margin: "0 0 22px", lineHeight: 1.5,
              }}>{t.modalDesc}</p>

              {/* Summary pill */}
              <div style={{
                background: "#f0f4fa", borderRadius: 10,
                padding: "12px 14px", marginBottom: 18,
                display: "flex", justifyContent: "space-between",
                alignItems: "center",
              }}>
                <span style={{ fontSize: 12, color: "#556", fontWeight: 600 }}>
                  {lang === "tr" ? "Satış Bedeli" : "Sale Price"}
                </span>
                <span style={{ fontSize: 16, fontWeight: 800, color: "#003DA5" }}>
                  £{fmt(price)}
                </span>
              </div>

              {sent ? (
                <div style={{
                  textAlign: "center", padding: "24px 0",
                }}>
                  <div style={{
                    width: 56, height: 56, borderRadius: "50%",
                    background: "#e8f5e9", display: "flex",
                    alignItems: "center", justifyContent: "center",
                    margin: "0 auto 12px",
                  }}>
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#2e7d32" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M20 6L9 17l-5-5" />
                    </svg>
                  </div>
                  <p style={{ fontSize: 15, fontWeight: 700, color: "#2e7d32", margin: 0 }}>
                    {t.sentMsg}
                  </p>
                  <p style={{ fontSize: 12, color: "#888", margin: "6px 0 0" }}>{email}</p>
                </div>
              ) : (
                <>
                  <label style={{
                    display: "block", fontSize: 11, fontWeight: 700,
                    color: "#003DA5", marginBottom: 6,
                    textTransform: "uppercase", letterSpacing: "0.8px",
                  }}>{t.emailLabel}</label>
                  <input
                    type="email"
                    value={email}
                    onChange={(e) => setEmail(e.target.value)}
                    placeholder={t.emailPlaceholder}
                    style={{
                      width: "100%", boxSizing: "border-box",
                      padding: "13px 14px",
                      fontSize: 15, fontWeight: 500,
                      border: "2px solid #e0e6f0",
                      borderRadius: 10, outline: "none",
                      color: "#1a1a2e",
                      transition: "border-color 0.2s",
                      marginBottom: 6,
                    }}
                    onFocus={(e) => e.target.style.borderColor = "#003DA5"}
                    onBlur={(e) => e.target.style.borderColor = "#e0e6f0"}
                    onKeyDown={(e) => { if (e.key === "Enter") handleSendPdf(); }}
                  />
                  {sendError && (
                    <p style={{ fontSize: 12, color: "#d32f2f", margin: "4px 0 0" }}>{sendError}</p>
                  )}

                  <div style={{
                    display: "flex", gap: 10, marginTop: 16,
                  }}>
                    <button
                      onClick={() => setShowEmailModal(false)}
                      style={{
                        flex: 1, padding: "12px",
                        background: "#f0f2f7", color: "#666",
                        border: "none", borderRadius: 10,
                        fontSize: 14, fontWeight: 600,
                        cursor: "pointer",
                      }}
                    >{t.cancelBtn}</button>
                    <button
                      onClick={handleSendPdf}
                      disabled={sending || !email.includes("@")}
                      style={{
                        flex: 2, padding: "12px",
                        background: sending || !email.includes("@")
                          ? "#ccc"
                          : "linear-gradient(135deg, #003DA5, #001f5c)",
                        color: "#fff",
                        border: "none", borderRadius: 10,
                        fontSize: 14, fontWeight: 700,
                        cursor: sending || !email.includes("@") ? "not-allowed" : "pointer",
                        transition: "opacity 0.2s",
                      }}
                    >{sending ? t.sendingBtn : t.sendBtn}</button>
                  </div>
                </>
              )}
            </div>
          </div>
        )}

        {/* Empty State */}
        {price === 0 && (
          <div style={{
            textAlign: "center", padding: "48px 24px",
            color: "#aaa",
          }}>
            <div style={{ fontSize: 44, marginBottom: 12, opacity: 0.6 }}>🏠</div>
            <p style={{ fontSize: 13, margin: 0 }}>{t.enterPrice}</p>
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>

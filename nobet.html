<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b1a3a">
<title>Nöbet · RE/MAX Doğuş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0b1a3a; --navy2:#122a5c; --ink:#0a0f1f; --paper:#f6f7fb;
  --red:#e11a2c; --gold:#e4b35c; --line:rgba(255,255,255,.12);
  --ok:#22c55e; --warn:#f59e0b; --wk:rgba(228,179,92,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Bricolage Grotesque",system-ui,-apple-system,sans-serif;
  background:radial-gradient(120% 80% at 50% 0%,var(--navy2) 0%,var(--navy) 45%,var(--ink) 100%) fixed;
  color:#fff;-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(24px + env(safe-area-inset-bottom));
}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,#ff4b5c,var(--red));
  display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 8px 20px rgba(225,26,44,.35)}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em;line-height:1}
header small{display:block;color:#aab4cc;font-weight:500;font-size:12px;margin-top:3px}

.card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
label.sm{font-size:12px;color:#aab4cc;font-weight:500;display:block;margin-bottom:6px}

input,select,button{font-family:inherit;font-size:16px}
input[type=password]{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;letter-spacing:.4em;text-align:center;font-size:22px}
select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;appearance:none;-webkit-appearance:none}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month b{font-size:20px;font-weight:800;flex:1;text-align:center}
.nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;font-size:20px;cursor:pointer}

.btn{width:100%;padding:15px;border:0;border-radius:14px;font-weight:800;font-size:16px;cursor:pointer;color:#fff;
  background:linear-gradient(145deg,#ff4b5c,var(--red));box-shadow:0 10px 24px rgba(225,26,44,.35);transition:transform .08s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.08);box-shadow:none;border:1px solid var(--line);font-weight:700}
.btn.danger{background:rgba(225,26,44,.15);color:#ff8a94;border:1px solid rgba(225,26,44,.4);box-shadow:none;font-weight:700}
.btn:disabled{opacity:.45;pointer-events:none}
.btns{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.btns .full{grid-column:1/-1}

.people{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.chip{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer;user-select:none}
.chip input{width:18px;height:18px;accent-color:var(--red)}
.chip.off{opacity:.4;text-decoration:line-through}

.anchor{font-size:13px;color:#aab4cc;margin-top:8px}
.anchor b{color:var(--gold)}

table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.wk td{background:var(--wk)}
td.d{font-family:"IBM Plex Mono",monospace;font-size:13px;white-space:nowrap;width:74px;color:#d7deee}
td.d span{color:#8a94ad;font-size:11px;margin-left:4px}
td select{padding:7px 8px;font-size:14px;border-radius:8px}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stat{font-size:12px;padding:4px 8px;border-radius:999px;background:rgba(0,0,0,.3);border:1px solid var(--line);color:#d7deee}
.stat b{color:var(--gold)}

#status{font-size:14px;min-height:20px;color:#aab4cc;margin-top:10px;font-weight:500}
#status.ok,#evStatus.ok{color:var(--ok)} #status.err,#evStatus.err{color:#ff8a94} #status.busy,#evStatus.busy{color:var(--warn)}
.hide{display:none!important}
.tabs{display:flex;gap:6px;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{flex:1;padding:10px;border:0;border-radius:10px;background:transparent;color:#aab4cc;font-weight:700;font-size:15px;cursor:pointer}
.tabs button.on{background:linear-gradient(145deg,#ff4b5c,var(--red));color:#fff;box-shadow:0 6px 16px rgba(225,26,44,.35)}
.f{display:grid;gap:10px}
.f input[type=text],.f input[type=date],.f input[type=time],.f textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff;font-size:16px;font-family:inherit;color-scheme:dark}
.f textarea{height:70px;margin:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:#d7deee;font-size:13px;font-weight:600;cursor:pointer}
.seg button.on{background:rgba(228,179,92,.18);border-color:var(--gold);color:var(--gold)}
.sw{display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:10px;background:rgba(0,0,0,.25);border:1px solid var(--line);font-size:14px;font-weight:500}
.sw input{width:20px;height:20px;accent-color:var(--red)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.cal .h{font-size:10px;color:#8a94ad;text-align:center;padding:2px 0 4px;font-weight:700;text-transform:uppercase}
.cal .c{min-height:58px;border-radius:9px;background:rgba(0,0,0,.28);border:1px solid var(--line);padding:4px 3px;font-size:10.5px;line-height:1.15;overflow:hidden}
.cal .c.wk{background:var(--wk)}
.cal .c.today{border-color:var(--gold)}
.cal .c b{display:block;font-family:"IBM Plex Mono",monospace;font-size:11px;color:#d7deee;margin-bottom:3px}
.cal .c .nm{display:block;font-weight:700;word-break:break-word}
.cal .c.empty{opacity:.25}
.cal .c.ofis .nm{color:#8a94ad;font-weight:500}
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calhead a{color:var(--gold);font-size:13px;font-weight:700;text-decoration:none}
.tm{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.tm .n{flex:1;min-width:0}.tm .n small{display:block;color:#8a94ad;font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tm button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;cursor:pointer;font-size:14px}
.tm button.x{color:#ff8a94}
textarea{width:100%;height:110px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#d7deee;font-family:"IBM Plex Mono",monospace;font-size:12px;padding:10px;margin-top:8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">N</div>
    <div><h1>Nöbet Takvimi</h1><small>RE/MAX Doğuş · tek tuşla Google Takvim</small></div><button onclick="resetApp()" style="position:absolute;top:16px;right:16px;background:none;border:1px solid rgba(255,255,255,0.3);color:#fff;padding:6px 14px;border-radius:8px;font-size:13px;cursor:pointer">Çıkış ↺</button>
  </header>

  <!-- PIN -->
  <div class="card" id="pinCard">
    <label class="sm">Broker PIN</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="6" autocomplete="off">
    <div style="height:10px"></div>
    <button class="btn" onclick="login()">Giriş</button>
    <div id="pinMsg" style="color:#ff8a94;font-size:13px;margin-top:8px"></div>
  </div>

  <!-- APP -->
  <div id="app" class="hide">
    <div class="tabs">
      <button class="on" id="tabN" onclick="showTab('N')">Nöbet</button>
      <button id="tabE" onclick="showTab('E')">Etkinlik</button>
    </div>

    <div id="paneE" class="hide">
      <div class="card f">
        <div>
          <label class="sm">Tür</label>
          <div class="seg" id="evType">
            <button class="on" onclick="setType(this,'Ofis Toplantısı')">Ofis Toplantısı</button>
            <button onclick="setType(this,'Eğitim')">Eğitim</button>
            <button onclick="setType(this,'Doğum Günü')">Doğum günü</button>
            <button onclick="setType(this,'')">Diğer</button>
          </div>
        </div>
        <div><label class="sm">Başlık</label><input type="text" id="evTitle" placeholder="Ofis Toplantısı"></div>
        <div><label class="sm">Tarih</label><input type="date" id="evDate"></div>
        <label class="sw">Tüm gün <input type="checkbox" id="evAll" onchange="$('evTimes').classList.toggle('hide',this.checked)"></label>
        <div class="two" id="evTimes">
          <div><label class="sm">Başlangıç</label><input type="time" id="evStart" value="10:00"></div>
          <div><label class="sm">Bitiş</label><input type="time" id="evEnd" value="11:00"></div>
        </div>
        <div>
          <label class="sm">Konum</label>
          <div class="seg" id="evLocSeg">
            <button class="on" onclick="setLoc(this,'ofis')">Ofis</button>
            <button onclick="setLoc(this,'custom')">Başka yer</button>
            <button onclick="setLoc(this,'none')">Yok</button>
          </div>
          <input type="text" id="evLoc" class="hide" placeholder="Adres" style="margin-top:8px">
        </div>
        <div>
          <label class="sm">Davetliler</label>
          <div class="seg" style="margin-bottom:6px"><button onclick="allPeople(true)">Herkes</button><button onclick="allPeople(false)">Hiçbiri</button></div>
          <div class="people" id="evPeople"></div>
        </div>
        <div>
          <label class="sm">Hatırlatma</label>
          <div class="seg" id="evRem">
            <button onclick="setRem(this,0)">Yok</button>
            <button onclick="setRem(this,60)">1 saat</button>
            <button class="on" onclick="setRem(this,720)">12 saat</button>
            <button onclick="setRem(this,1440)">1 gün</button>
          </div>
        </div>
        <div><label class="sm">Not</label><textarea id="evDesc" placeholder="İsteğe bağlı açıklama"></textarea></div>
        <label class="sw">Davetlilere e-posta gitsin <input type="checkbox" id="evNotify" checked></label>
        <button class="btn" id="evBtn" onclick="sendEvent()">Takvime ekle</button>
        <div id="evStatus" style="font-size:14px;min-height:20px;color:#aab4cc;font-weight:500"></div>
      </div>
    </div>

    <div id="paneN">
    <div class="card">
      <div class="month">
        <button class="nav" onclick="shiftMonth(-1)">‹</button>
        <b id="monthLabel"></b>
        <button class="nav" onclick="shiftMonth(1)">›</button>
      </div>
      <div class="anchor" id="anchor">Son nöbet okunuyor…</div>
    </div>

    <div class="card">
      <label class="sm">Bu ay nöbete girecekler</label>
      <div class="people" id="people"></div>
      <div style="height:10px"></div>
      <label class="sm">Ayın ilk günü kim başlasın</label>
      <select id="startSel"></select>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between">
        <label class="sm" style="margin:0">Ekip listesi</label>
        <button class="btn ghost" style="width:auto;padding:7px 12px;font-size:13px" onclick="toggleTeam()">Düzenle</button>
      </div>
      <div id="teamBox" class="hide" style="margin-top:10px">
        <div id="teamList"></div>
        <div style="height:8px"></div>
        <div class="row">
          <input type="text" id="nName" placeholder="Ad Soyad" class="grow" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff">
        </div>
        <div style="height:6px"></div>
        <div class="row">
          <input type="email" id="nMail" placeholder="e-posta (birden fazlaysa virgülle)" class="grow" style="padding:10px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.3);color:#fff">
          <button class="btn" style="width:auto;padding:10px 14px" onclick="addMember()">Ekle</button>
        </div>
        <div style="height:10px"></div>
        <button class="btn ghost" onclick="saveTeam()">Ekibi kaydet</button>
      </div>
    </div>

    <div class="card">
      <div class="btns">
        <button class="btn full" onclick="buildPlan()">Plan oluştur</button>
        <button class="btn ghost full" onclick="readCalendar()">Takvimden oku</button>
      </div>
      <div id="status"></div>
      <textarea id="siteBox" class="hide" readonly></textarea>
    </div>

    <div class="card hide" id="planCard">
      <table><tbody id="planBody"></tbody></table>
      <div class="stats" id="stats"></div>
      <div style="height:12px"></div>
      <div class="btns">
        <button class="btn full" id="sendBtn" onclick="sendPlan()">Takvime gönder</button>
        <button class="btn danger full" onclick="clearMonth()">Bu ayın nöbetlerini sil</button>
      </div>
    </div>

    <div class="card hide" id="calCard">
      <div class="calhead">
        <label class="sm" style="margin:0" id="calTitle">Takvimdeki hali</label>
        <a id="gcalLink" href="#" target="_blank" rel="noopener">Google Takvim'de aç ↗</a>
      </div>
      <div class="cal" id="calGrid"></div>
    </div>
    </div><!-- /paneN -->
  </div>
</div>

<script>
/* ====== AYARLAR ====== */
const API = "https://script.google.com/macros/s/AKfycbzDMpgNZAhXFZfCbp3iuUxNAJwjq8pB2xt86eluuj2JPNU-J2sfeCHUsG1m0OrJjo7RvA/exec";   // /exec ile biten URL
const PIN_LEN = 4;

let TEAM = [];   // sunucudan yüklenir (Ekip kartından yönetilir)
const OFFICE = "Ofis";
/* ===================== */

const AY = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN = ["Paz","Pzt","Sal","Çar","Per","Cum","Cmt"];
let pin="", cur=new Date(), plan=[], lastDuty=null, prevCounts={};
cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);   // varsayılan: gelecek ay

const $ = id=>document.getElementById(id);
const pad = n=>String(n).padStart(2,"0");
const ymd = d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const firstDay = ()=>new Date(cur.getFullYear(),cur.getMonth(),1);
const lastDay  = ()=>new Date(cur.getFullYear(),cur.getMonth()+1,0);
const byName = n=>TEAM.find(t=>t.name===n);

function setStatus(msg,cls){ const s=$("status"); s.className=cls||""; s.innerHTML=(cls==="busy"?'<span class="spin"></span>':"")+msg; }

async function api(body){
  body.pin=pin;
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
  const j=await r.json();
  if(!j.ok) throw new Error(j.error||"Hata");
  return j;
}

/* ---- giriş ---- */
$("pin").addEventListener("input",e=>{ if(e.target.value.length>=PIN_LEN) login(); });
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
async function login(){
  pin=$("pin").value.trim(); $("pinMsg").textContent="";
  try{
    const t=await api({action:"team_get"}); TEAM=t.team;
    sessionStorage.setItem("nobet_pin",pin);
    $("pinCard").classList.add("hide"); $("app").classList.remove("hide");
    renderPeople(); renderMonth();
  }catch(e){ $("pinMsg").textContent=e.message==="Hatalı PIN"?"PIN yanlış.":"Bağlantı hatası: "+e.message; }
}
function resetApp(){sessionStorage.clear();localStorage.clear();plan=[];location.reload();}
if(sessionStorage.getItem("nobet_pin")){ $("pin").value=sessionStorage.getItem("nobet_pin"); login(); }

/* ---- ekip ---- */
function renderPeople(){
  $("people").innerHTML=TEAM.map((t,i)=>`<label class="chip" id="chip${i}"><input type="checkbox" checked data-i="${i}" onchange="toggleP(${i})">${t.name}</label>`).join("");
  $("startSel").innerHTML=TEAM.map(t=>`<option>${t.name}</option>`).join("");
}
function toggleP(i){ const c=$("chip"+i); c.classList.toggle("off",!c.querySelector("input").checked); const b=pickStart(); if(b) $("startSel").value=b; }
function activeTeam(){ return TEAM.filter((t,i)=>$("chip"+i).querySelector("input").checked); }

/* ---- ekip yönetimi ---- */
function toggleTeam(){ $("teamBox").classList.toggle("hide"); renderTeam(); }
function renderTeam(){
  $("teamList").innerHTML=TEAM.map((t,i)=>`<div class="tm">
    <div class="n">${t.name}<small>${t.emails.join(", ")||"e-posta yok"}</small></div>
    <button onclick="moveM(${i},-1)" ${i===0?"disabled":""}>↑</button>
    <button onclick="moveM(${i},1)" ${i===TEAM.length-1?"disabled":""}>↓</button>
    <button class="x" onclick="delM(${i})">✕</button></div>`).join("")||'<div style="color:#8a94ad;font-size:13px">Liste boş.</div>';
}
function addMember(){
  const name=$("nName").value.trim(), mails=$("nMail").value.split(",").map(s=>s.trim()).filter(Boolean);
  if(!name){ setStatus("Ad Soyad gerekli.","err"); return; }
  if(!mails.length||mails.some(m=>!/^\S+@\S+\.\S+$/.test(m))){ setStatus("Geçerli bir e-posta gir.","err"); return; }
  if(TEAM.some(t=>t.name.toLowerCase()===name.toLowerCase())){ setStatus("Bu isim zaten listede.","err"); return; }
  TEAM.push({name,emails:mails}); $("nName").value=""; $("nMail").value="";
  renderTeam(); renderPeople(); setStatus(`${name} eklendi — "Ekibi kaydet" ile kalıcı yap.`,"ok");
}
function delM(i){ if(!confirm(`${TEAM[i].name} listeden çıkarılsın mı?`)) return; TEAM.splice(i,1); renderTeam(); renderPeople(); }
function moveM(i,d){ const j=i+d; [TEAM[i],TEAM[j]]=[TEAM[j],TEAM[i]]; renderTeam(); renderPeople(); }
async function saveTeam(){
  setStatus("Ekip kaydediliyor…","busy");
  try{ const j=await api({action:"team_set",team:TEAM}); TEAM=j.team; renderTeam(); renderPeople(); setStatus("Ekip kaydedildi.","ok"); }
  catch(e){ setStatus(e.message,"err"); }
}

/* ---- takvim görünümü ---- */
const PAL={};
function colorFor(n){ if(n===OFFICE) return null; if(!PAL[n]){ const i=TEAM.findIndex(t=>t.name===n); PAL[n]=`hsl(${(i*47+10)%360} 70% 62%)`; } return PAL[n]; }
function renderCal(map,title){
  const y=cur.getFullYear(), m=cur.getMonth(), days=lastDay().getDate();
  const off=(firstDay().getDay()+6)%7;             // Pazartesi başlangıç
  const today=ymd(new Date());
  let html=["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(g=>`<div class="h">${g}</div>`).join("");
  for(let i=0;i<off;i++) html+=`<div class="c empty"></div>`;
  for(let d=1;d<=days;d++){
    const date=ymd(new Date(y,m,d)), dow=new Date(y,m,d).getDay(), n=map[date];
    const cls=["c",(dow===0||dow===6)?"wk":"",date===today?"today":"",!n?"empty":"",n===OFFICE?"ofis":""].join(" ");
    const col=n&&colorFor(n);
    html+=`<div class="${cls}"><b>${d}</b>${n?`<span class="nm" style="${col?`color:${col}`:""}">${n.split(" ")[0]}</span>`:""}</div>`;
  }
  $("calGrid").innerHTML=html;
  $("calTitle").textContent=title||"Takvimdeki hali";
  $("gcalLink").href=`https://calendar.google.com/calendar/r/month/${y}/${m+1}/1`;
  $("calCard").classList.remove("hide");
  $("calCard").scrollIntoView({behavior:"smooth",block:"start"});
}
async function showCalendar(title){
  const j=await api({action:"list",from:ymd(firstDay()),to:ymd(lastDay())});
  const map={}; j.items.forEach(it=>map[it.date]=it.name);
  renderCal(map,title); return j.items.length;
}

/* ---- etkinlik sekmesi ---- */
const OFFICE_ADDR="RE/MAX Doğuş, Dumlupınar, Özen Sk. Nuhoğlu Yenitepe Sitesi 2.Etap A Blok D:2, 34720 Kadıköy/İstanbul";
let evLocMode="ofis", evRemMin=720, evKind="Ofis Toplantısı";
function showTab(t){
  $("paneN").classList.toggle("hide",t!=="N"); $("paneE").classList.toggle("hide",t!=="E");
  $("tabN").classList.toggle("on",t==="N"); $("tabE").classList.toggle("on",t==="E");
  if(t==="E"){ renderEvPeople(); if(!$("evDate").value) $("evDate").value=ymd(new Date()); }
}
function segOn(container,btn){ [...container.querySelectorAll("button")].forEach(b=>b.classList.remove("on")); btn.classList.add("on"); }
function setType(b,kind){
  segOn($("evType"),b); evKind=kind;
  $("evTitle").placeholder=kind||"Etkinlik adı"; $("evTitle").value=kind;
  if(kind==="Doğum Günü"){ $("evAll").checked=true; $("evTimes").classList.add("hide"); $("evTitle").value=""; $("evTitle").placeholder="Ad Soyad — Doğum Günü"; setLoc($("evLocSeg").children[2],"none"); allPeople(true); }
  else { $("evAll").checked=false; $("evTimes").classList.remove("hide"); setLoc($("evLocSeg").children[0],"ofis"); if(kind==="Ofis Toplantısı") allPeople(true); }
  if(kind==="Ofis Toplantısı"){ $("evStart").value="10:00"; $("evEnd").value="11:30"; }
  if(kind==="Eğitim"){ $("evStart").value="11:00"; $("evEnd").value="13:00"; }
}
function setLoc(b,mode){ segOn($("evLocSeg"),b); evLocMode=mode; $("evLoc").classList.toggle("hide",mode!=="custom"); }
function setRem(b,m){ segOn($("evRem"),b); evRemMin=m; }
function renderEvPeople(){
  $("evPeople").innerHTML=TEAM.map((t,i)=>`<label class="chip"><input type="checkbox" data-i="${i}" ${i<TEAM.length?"checked":""}>${t.name}</label>`).join("");
}
function allPeople(on){ if(!$("evPeople").children.length) renderEvPeople(); $("evPeople").querySelectorAll("input").forEach(c=>c.checked=on); }
async function sendEvent(){
  const s=$("evStatus"), title=$("evTitle").value.trim()||$("evTitle").placeholder, date=$("evDate").value;
  if(!date){ s.className="err"; s.textContent="Tarih seç."; return; }
  if(!title||title==="Etkinlik adı"){ s.className="err"; s.textContent="Başlık yaz."; return; }
  const allDay=$("evAll").checked;
  if(!allDay && $("evEnd").value<=$("evStart").value){ s.className="err"; s.textContent="Bitiş saati başlangıçtan sonra olmalı."; return; }
  const emails=[]; $("evPeople").querySelectorAll("input:checked").forEach(c=>emails.push(...TEAM[+c.dataset.i].emails));
  const location=evLocMode==="ofis"?OFFICE_ADDR:evLocMode==="custom"?$("evLoc").value.trim():"";
  const colorId=evKind==="Doğum Günü"?"5":evKind==="Eğitim"?"10":evKind==="Ofis Toplantısı"?"9":"7";
  const d=new Date(date+"T12:00:00");
  if(!confirm(`"${title}"\n${d.getDate()} ${AY[d.getMonth()]} ${d.getFullYear()} ${allDay?"(tüm gün)":$("evStart").value+"–"+$("evEnd").value}\n${emails.length} davetli${$("evNotify").checked&&emails.length?" · e-posta gidecek":""}\n\nTakvime eklensin mi?`)) return;
  $("evBtn").disabled=true; s.className="busy"; s.innerHTML='<span class="spin"></span>Takvime ekleniyor…';
  try{
    const j=await api({action:"event",ev:{title,date,allDay,start:$("evStart").value,end:$("evEnd").value,location,description:$("evDesc").value.trim(),emails,remindMin:evRemMin,colorId,notify:$("evNotify").checked}});
    s.className="ok"; s.innerHTML=`✓ Eklendi${j.attendees?`, ${j.attendees} kişiye davet gitti`:""}. <a href="${j.link}" target="_blank" style="color:var(--gold)">Takvimde aç ↗</a>`;
    $("evTitle").value=evKind; $("evDesc").value="";
  }catch(e){ s.className="err"; s.textContent="Hata: "+e.message; }
  $("evBtn").disabled=false;
}

/* ---- ay ---- */
function shiftMonth(n){ cur=new Date(cur.getFullYear(),cur.getMonth()+n,1); renderMonth(); }
async function renderMonth(){
  $("monthLabel").textContent=`${AY[cur.getMonth()]} ${cur.getFullYear()}`;
  plan=[]; $("planCard").classList.add("hide"); $("siteBox").classList.add("hide"); $("calCard").classList.add("hide"); setStatus("");
  $("anchor").textContent="Son nöbet okunuyor…"; lastDuty=null;
  try{
    const prev=new Date(cur.getFullYear(),cur.getMonth()-1,1), prevEnd=new Date(cur.getFullYear(),cur.getMonth(),0);
    const [j,pl]=await Promise.all([api({action:"last",before:ymd(firstDay())}), api({action:"list",from:ymd(prev),to:ymd(prevEnd)})]);
    lastDuty=j.last; prevCounts={}; pl.items.forEach(it=>{ if(it.name!==OFFICE) prevCounts[it.name]=(prevCounts[it.name]||0)+1; });
    if(lastDuty){
      const d=new Date(lastDuty.date+"T12:00:00");
      const best=pickStart();
      const pc=Object.entries(prevCounts).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`${k.split(" ")[0]} ${v}`).join(" · ");
      $("anchor").innerHTML=`Önceki son nöbet: <b>${lastDuty.name}</b> · ${d.getDate()} ${AY[d.getMonth()]}`+(pc?`<br>Geçen ay: ${pc}`:"")+(best?`<br>Dengeli başlangıç: <b>${best}</b>`:"");
      if(best) $("startSel").value=best;
    } else $("anchor").textContent="Önceki ayda nöbet bulunamadı — başlangıç kişisini seç.";
  }catch(e){ $("anchor").textContent="Takvim okunamadı: "+e.message; }
}

/* ---- dengeli başlangıç seçimi ---- */
// Her olası başlangıç için ayı simüle eder; geçen ay + bu ay toplamı en dengeli olanı seçer.
// Önceki ayın son kişisiyle ilk gün aynı olamaz.
function simulate(act,s){ const n=act.length, days=lastDay().getDate(), c={}; act.forEach(t=>c[t.name]=0);
  for(let i=0;i<days;i++) c[act[(s+i)%n].name]++; return c; }
function pickStart(){
  const act=activeTeam(); if(act.length<3) return null;
  let best=null, bestScore=Infinity;
  for(let s=0;s<act.length;s++){
    if(lastDuty && act[s].name===lastDuty.name) continue;
    const c=simulate(act,s);
    const tot=act.map(t=>(prevCounts[t.name]||0)+c[t.name]);
    const mean=tot.reduce((a,b)=>a+b,0)/tot.length;
    const score=tot.reduce((a,b)=>a+(b-mean)**2,0);
    if(score<bestScore-1e-9){ bestScore=score; best=act[s].name; }
  }
  return best;
}

/* ---- plan ---- */
// Kaydırmalı rotasyon: her gün bir sonraki kişi, her hafta bir kişi daha kayar.
// Kimse üst üste gün tutmaz, kimse ay içinde aynı haftanın gününe iki kez düşmez.
function buildPlan(){
  const act=activeTeam(); if(act.length<3){ setStatus("En az 3 kişi seçilmeli.","err"); return; }
  let s=act.findIndex(t=>t.name===$("startSel").value); if(s<0) s=0;
  const n=act.length, days=lastDay().getDate(); plan=[];
  for(let i=0;i<days;i++){
    const d=new Date(cur.getFullYear(),cur.getMonth(),i+1);
    plan.push({date:ymd(d), name:act[(s+i)%n].name});
  }
  renderPlan(); setStatus(`${days} gün planlandı. Satırları elle değiştirebilirsin.`,"ok");
  previewCal();
}
function renderPlan(){
  const opts=[OFFICE,...TEAM.map(t=>t.name)];
  $("planBody").innerHTML=plan.map((p,i)=>{
    const d=new Date(p.date+"T12:00:00"), wk=d.getDay()===0||d.getDay()===6;
    return `<tr class="${wk?"wk":""}"><td class="d">${pad(d.getDate())} ${AY[d.getMonth()].slice(0,3)}<span>${GUN[d.getDay()]}</span></td>
      <td><select onchange="plan[${i}].name=this.value;stats();previewCal()">${opts.map(o=>`<option ${o===p.name?"selected":""}>${o}</option>`).join("")}</select></td></tr>`;
  }).join("");
  $("planCard").classList.remove("hide"); stats();
}
function previewCal(){ const map={}; plan.forEach(p=>map[p.date]=p.name); renderCal(map,"Önizleme (henüz takvime yazılmadı)"); }
function stats(){
  const c={}; plan.forEach(p=>c[p.name]=(c[p.name]||0)+1);
  let warn=0; for(let i=1;i<plan.length;i++) if(plan[i].name===plan[i-1].name && plan[i].name!==OFFICE) warn++;
  $("stats").innerHTML=Object.entries(c).map(([k,v])=>`<span class="stat">${k.split(" ")[0]} <b>${v}</b>${k!==OFFICE&&prevCounts[k]!=null?`<small style="color:#8a94ad"> (geçen ay ${prevCounts[k]})</small>`:""}</span>`).join("")
    +(warn?`<span class="stat" style="color:#ff8a94">⚠ ${warn} ardışık gün</span>`:"");
}

async function readCalendar(){
  setStatus("Takvim okunuyor…","busy");
  try{
    const j=await api({action:"list",from:ymd(firstDay()),to:ymd(lastDay())});
    if(!j.items.length){ setStatus("Bu ayda takvimde nöbet yok.","err"); return; }
    const m={}; j.items.forEach(it=>m[it.date]=it.name);
    const days=lastDay().getDate(); plan=[];
    for(let i=0;i<days;i++){ const d=ymd(new Date(cur.getFullYear(),cur.getMonth(),i+1)); plan.push({date:d,name:m[d]||OFFICE}); }
    renderPlan(); setStatus(`Takvimden ${j.items.length} nöbet okundu.`,"ok");
    const map={}; j.items.forEach(it=>map[it.date]=it.name); renderCal(map,"Takvimdeki hali");
  }catch(e){ setStatus(e.message,"err"); }
}

async function sendPlan(){
  if(!plan.length) return;
  if(!confirm(`${AY[cur.getMonth()]} ayı için ${plan.length} nöbet takvime yazılacak.\nAynı günlerdeki eski nöbetler sessizce silinir, yenileri davetiyeli gider.\nDevam?`)) return;
  $("sendBtn").disabled=true; setStatus("Takvime yazılıyor… (≈1 dk)","busy");
  try{
    const body=plan.map(p=>({date:p.date,name:p.name,emails:p.name===OFFICE?[]:(byName(p.name)||{}).emails||[]}));
    const j=await api({action:"create",plan:body,replace:true});
    setStatus(`✓ ${j.created} nöbet takvime eklendi, davetler gönderildi. yenifikirtepeburada.com nöbetçi kartı otomatik güncellenir.`,"ok");
    try{ await showCalendar(`Takvime yazıldı — ${AY[cur.getMonth()]} ${cur.getFullYear()}`); setStatus(`✓ ${j.created} nöbet takvime eklendi, davetler gönderildi.`,"ok"); }catch(_){}
  }catch(e){ setStatus("Hata: "+e.message,"err"); }
  $("sendBtn").disabled=false;
}

async function clearMonth(){
  if(!confirm(`${AY[cur.getMonth()]} ${cur.getFullYear()} nöbetlerinin tamamı silinecek (danışmanlara iptal maili gitmez). Emin misin?`)) return;
  setStatus("Siliniyor…","busy");
  try{ const j=await api({action:"clear",from:ymd(firstDay()),to:ymd(lastDay())}); setStatus(`${j.deleted} nöbet silindi.`,"ok"); plan=[]; $("planCard").classList.add("hide"); renderCal({},"Takvim boş"); }
  catch(e){ setStatus(e.message,"err"); }
}

// yenifikirtepeburada.com nöbetçi kartı için yapıştırılacak satırlar
function copySite(){
  if(!plan.length){ setStatus("Önce plan oluştur veya takvimden oku.","err"); return; }
  const txt=plan.map(p=>`"${p.date}":"${p.name}",`).join("\n");
  const b=$("siteBox"); b.value=txt; b.classList.remove("hide");
  navigator.clipboard?.writeText(txt).then(()=>setStatus("Site satırları kopyalandı.","ok"),()=>setStatus("Aşağıdan kopyala.","ok"));
}

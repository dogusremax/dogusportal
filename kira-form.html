<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050A30">
<meta name="robots" content="noindex">
<title>Kira Sözleşmesi Bilgi Formu — RE/MAX Doğuş</title>
<link rel="icon" href="assets/dogus-logo.png">
<style>
:root{
  --lacivert:#050A30; --lacivert2:#0E1A5C; --kirmizi:#DC1C2E; --kirmizi2:#A5101F; --yesil:#0A7D5A;
  --zemin:#EEF1F7; --kart:#FFFFFF; --yazi:#141B34; --soluk:#6A7389; --cizgi:#E2E6EF; --dolgu:#F5F7FB;
  --golge:0 1px 2px rgba(5,10,48,.04),0 8px 24px rgba(5,10,48,.07);
}
@media (prefers-color-scheme:dark){
  :root{ --zemin:#0A0F1F; --kart:#131A30; --yazi:#E9EEF8; --soluk:#95A0B7; --cizgi:#232C48; --dolgu:#1A2240;
         --golge:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35); }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--zemin);color:var(--yazi);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;
  padding:0 16px calc(100px + env(safe-area-inset-bottom))}
.wrap{max-width:620px;margin:0 auto}
.ust{position:relative;overflow:hidden;color:#fff;margin:0 -16px 18px;
  padding:calc(18px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 26px 26px;
  background:radial-gradient(120% 140% at 100% 0%,#1B2A7A 0%,var(--lacivert2) 35%,var(--lacivert) 100%);
  box-shadow:0 10px 30px rgba(5,10,48,.25)}
.ust::after{content:"";position:absolute;right:-40px;bottom:-60px;width:200px;height:200px;border-radius:50%;
  background:radial-gradient(circle,rgba(220,28,46,.35),transparent 70%);pointer-events:none}
.ust .logo{height:40px;width:auto;display:block;margin-bottom:18px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.ust .marka{font-size:11px;letter-spacing:.18em;opacity:.7;font-weight:700;text-transform:uppercase}
.ust h1{font-size:26px;font-weight:700;margin:4px 0 6px;letter-spacing:-.02em}
.ust p{margin:0;font-size:13.5px;opacity:.8;line-height:1.5;position:relative;z-index:1}
.kart{background:var(--kart);border:1px solid var(--cizgi);border-radius:20px;padding:18px;margin-bottom:14px;box-shadow:var(--golge)}
.grup{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;margin:22px 2px 10px}
.grup::before{content:"";width:4px;height:18px;border-radius:3px;background:var(--kirmizi)}
.alan{display:block;margin-bottom:14px}
.alan:last-child{margin-bottom:0}
.alan .ad{display:block;font-size:13px;font-weight:700;margin-bottom:6px}
.alan .ad i{color:var(--kirmizi);font-style:normal}
.alan .ipucu{display:block;font-size:12px;color:var(--soluk);margin-bottom:7px;line-height:1.45}
input,textarea{width:100%;font-family:inherit;font-size:16px;color:var(--yazi);background:var(--dolgu);
  border:1.5px solid transparent;border-radius:13px;padding:13px 14px;outline:none;
  transition:border-color .15s,background .15s,box-shadow .15s;-webkit-appearance:none;appearance:none}
input::placeholder,textarea::placeholder{color:#A3AABB}
input:focus,textarea:focus{border-color:var(--kirmizi);background:var(--kart);box-shadow:0 0 0 4px rgba(220,28,46,.10)}
input.hata{border-color:var(--kirmizi);background:rgba(220,28,46,.05)}
textarea{min-height:84px;resize:vertical}
.secim{display:flex;gap:10px}
.secim label{flex:1;margin:0;cursor:pointer}
.secim input{display:none}
.secim span{display:block;text-align:center;background:var(--dolgu);border:1.5px solid transparent;border-radius:13px;
  padding:13px;font-size:15px;font-weight:700;transition:all .15s}
.secim input:checked+span{border-color:var(--kirmizi);background:rgba(220,28,46,.08);color:var(--kirmizi)}
.alan.hata .secim span{border-color:var(--kirmizi)}
.belge{border:1.5px dashed var(--cizgi);background:var(--dolgu);border-radius:16px;padding:14px;text-align:center}
.belge .btnler{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#tara{position:fixed;inset:0;z-index:999;background:#000;display:none;align-items:center;justify-content:center}
#tara.acik{display:flex}
#taraVid{width:100%;height:100%;object-fit:cover;display:block}
.taracerceve{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:88vw;max-width:540px;
  aspect-ratio:1.585/1;border:2px solid rgba(255,255,255,.9);border-radius:14px;
  box-shadow:0 0 0 100vmax rgba(0,0,0,.5);pointer-events:none}
.taracerceve.a4{width:74vw;max-width:430px;aspect-ratio:.707;border-radius:6px}
.tarakose{position:absolute;width:26px;height:26px;border:4px solid #FFC400}
.tarakose.tl{top:-2px;left:-2px;border-right:none;border-bottom:none;border-radius:14px 0 0 0}
.tarakose.tr{top:-2px;right:-2px;border-left:none;border-bottom:none;border-radius:0 14px 0 0}
.tarakose.bl{bottom:-2px;left:-2px;border-right:none;border-top:none;border-radius:0 0 0 14px}
.tarakose.br{bottom:-2px;right:-2px;border-left:none;border-top:none;border-radius:0 0 14px 0}
.taraipucu{position:absolute;left:0;right:0;top:calc(22px + env(safe-area-inset-top,0px));color:#fff;
  text-align:center;font-size:15px;font-weight:700;line-height:1.45;
  text-shadow:0 1px 5px rgba(0,0,0,.95);padding:0 18px}
.tarabar{position:absolute;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom));
  display:flex;align-items:center;justify-content:space-around;padding:0 18px}
.tarabtn{background:rgba(255,255,255,.16);color:#fff;border:none;border-radius:12px;padding:12px 16px;
  font:inherit;font-weight:700;cursor:pointer}
.tarashot{width:74px;height:74px;border-radius:50%;background:#fff;border:5px solid rgba(255,255,255,.5);
  cursor:pointer;padding:0}
.tarashot:active{transform:scale(.94)}
.tarauyari{position:absolute;left:16px;right:16px;bottom:calc(118px + env(safe-area-inset-bottom));
  background:rgba(220,28,46,.96);color:#fff;border-radius:13px;padding:13px;font-size:14px;line-height:1.5;display:none}
.tarauyari.acik{display:block}
.tarauyari .dgm{display:flex;gap:8px;margin-top:11px}
.tarauyari .dgm button{flex:1;border:none;border-radius:10px;padding:11px;font:inherit;font-weight:700;cursor:pointer}
.tarauyari .yine{background:rgba(255,255,255,.22);color:#fff}
.tarauyari .tekrar{background:#fff;color:var(--kirmizi2)}
.belge input[type=file]{display:none}
.belge .btn{display:inline-flex;align-items:center;gap:8px;background:var(--kart);border:1.5px solid var(--cizgi);
  border-radius:12px;padding:11px 14px;font-weight:700;font-size:14px;cursor:pointer;color:var(--yazi);box-shadow:0 2px 6px rgba(5,10,48,.05)}
.onizleme{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:center}
.onizleme .oge{position:relative;width:88px;height:88px;border-radius:12px;overflow:hidden;border:1px solid var(--cizgi);background:var(--zemin)}
.onizleme img{width:100%;height:100%;object-fit:cover;display:block}
.onizleme .pdf{display:flex;align-items:center;justify-content:center;height:100%;font-size:26px}
.onizleme .sil{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.65);color:#fff;border:none;
  width:22px;height:22px;border-radius:50%;font-size:14px;line-height:1;cursor:pointer}
.onizleme .yuk{position:absolute;inset:0;background:rgba(5,10,48,.55);color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:700}
.kvkk{font-size:12px;color:var(--soluk);line-height:1.6;max-height:130px;overflow:auto;
  background:var(--dolgu);border-radius:13px;padding:12px}
.onay{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;line-height:1.45;cursor:pointer}
.onay input{width:21px;height:21px;flex:0 0 21px;margin:1px 0 0;padding:0;accent-color:var(--kirmizi);-webkit-appearance:auto;appearance:auto}
.altbar{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--kart) 88%,transparent);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--cizgi);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));z-index:9}
.altbar .ic{max-width:620px;margin:0 auto}
button.ana{width:100%;border:none;border-radius:14px;padding:16px;font-family:inherit;font-weight:700;font-size:16px;
  color:#fff;background:linear-gradient(135deg,var(--kirmizi2),var(--kirmizi));cursor:pointer;
  box-shadow:0 8px 20px rgba(220,28,46,.28);transition:transform .1s}
button.ana:active{transform:scale(.985)}
button.ana:disabled{opacity:.5;cursor:not-allowed}
.durum{text-align:center;padding:50px 20px;color:var(--soluk);font-size:14px;line-height:1.6}
.bitti{text-align:center;padding:38px 16px}
.bitti .tik{width:70px;height:70px;border-radius:50%;background:rgba(10,125,90,.12);color:var(--yesil);
  display:flex;align-items:center;justify-content:center;font-size:35px;margin:0 auto 16px}
.bitti h2{margin:0 0 8px;font-size:22px}
.bitti p{color:var(--soluk);font-size:14px;line-height:1.6;margin:0}
.devam{background:rgba(10,125,90,.10);border:1px solid rgba(10,125,90,.3);color:var(--yesil);
  border-radius:11px;padding:11px 12px;font-size:13px;line-height:1.5;margin-bottom:12px;
  display:flex;gap:10px;align-items:flex-start}
.devam button{margin-left:auto;background:transparent;border:1px solid rgba(10,125,90,.45);color:var(--yesil);
  border-radius:9px;padding:6px 10px;font:inherit;font-size:12px;font-weight:700;cursor:pointer;flex:0 0 auto}
.uyari{background:rgba(220,28,46,.08);border:1px solid rgba(220,28,46,.25);color:var(--kirmizi);
  border-radius:13px;padding:11px;font-size:13px;line-height:1.5;margin-bottom:12px;display:none}
.onizbar{background:#FFC400;color:#16203A;border-radius:0;margin:0 -16px 0;padding:10px 16px;font-size:13px;text-align:center}
.oniztab{display:flex;gap:6px;justify-content:center;margin-top:8px}
.oniztab a{flex:1;max-width:130px;padding:7px 8px;border-radius:9px;background:rgba(5,10,48,.1);color:#16203A;text-decoration:none;font-weight:700}
.oniztab a.aktif{background:#050A30;color:#fff}
.mini{font-size:12px;color:var(--soluk);text-align:center;margin:14px 0 0;line-height:1.6}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="durum" id="durum">Form yükleniyor…</div>
</div>

<div class="altbar" id="altbar" style="display:none"><div class="ic">
  <button class="ana" id="gonder">Formu gönder</button>
</div></div>

<script>
/* dogus-whatsapp benzeri: tek arka uç adresi */
var API = 'https://script.google.com/macros/s/AKfycbyMU_jau9MsWaYq-nT56GRZRtQrTxjaPlh5qgMifmMbX09jt3U8kVj7lhANx8zieDMqNA/exec';

var token = new URLSearchParams(location.search).get('k') || '';
/* Önizleme: kira-form.html?onizle=kiraci | sahip | kefil — linksiz, süresiz; hiçbir şey kaydedilmez */
/* Danışmanın istemediği belgeler: &x=kimlikArka,findeks — formda gösterilmez */
var HARIC = (new URLSearchParams(location.search).get('x') || '').split(',').filter(Boolean);
var ONIZLE = token ? '' : (new URLSearchParams(location.search).get('onizle') || '');
var TANIM = null, BELGELER = {}, gonderiliyor = false;
var $ = function (id) { return document.getElementById(id); };

/* ---------- yükleme ---------- */
if (ONIZLE) { onizlemeAc(ONIZLE); }
else if (!token) { $('durum').textContent = 'Bağlantı eksik görünüyor. Danışmanınızdan yeni bağlantı isteyin.'; }
else {
  fetch(API + '?action=form&k=' + encodeURIComponent(token))
    .then(function (r) { return r.json(); })
    .then(function (d) { d.ok ? ciz(d) : mesajGoster(d.gonderildi ? 'tamam' : 'hata', d.hata); })
    .catch(function () { $('durum').textContent = 'Bağlantı kurulamadı. İnternetinizi kontrol edip sayfayı yenileyin.'; });
}

function onizlemeAc(rol) {
  fetch(API + '?action=alanlar')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok || !j.alanlar[rol]) { $('durum').textContent = 'Önizleme açılamadı: rol kiraci, sahip ya da kefil olmalı.'; return; }
      ciz({ ok: true, rol: rol, rolAdi: (j.roller || {})[rol] || rol, dosyaNo: 'ÖNİZLEME', adres: '',
            alanlar: j.alanlar[rol], kvkk: j.kvkk, ofisTel: '0216 315 15 15' });
      var bar = document.createElement('div');
      bar.className = 'onizbar';
      bar.innerHTML = '<b>Önizleme</b> — gönderilen hiçbir şey kaydedilmez' +
        '<div class="oniztab">' + ['kiraci', 'sahip', 'kefil'].map(function (r) {
          return '<a href="?onizle=' + r + '"' + (r === rol ? ' class="aktif"' : '') + '>' + ((j.roller || {})[r] || r) + '</a>';
        }).join('') + '</div>';
      $('wrap').insertBefore(bar, $('wrap').firstChild);
    })
    .catch(function () { $('durum').textContent = 'Bağlantı kurulamadı. Sayfayı yenileyin.'; });
}

function mesajGoster(tip, metin) {
  $('altbar').style.display = 'none';
  $('wrap').innerHTML = '<div class="ust"><img class="logo" src="assets/dogus-logo.png" alt="RE/MAX Doğuş" style="margin:0"></div>' + (tip === 'tamam'
    ? '<div class="bitti"><div class="tik">✓</div><h2>Formunuz bize ulaştı</h2><p></p></div>'
    : '<div class="durum"></div>');
  ($('wrap').querySelector('p') || $('wrap').querySelector('.durum')).textContent = metin || '';
}

/* ---------- formu çiz ---------- */
function ciz(d) {
  if (HARIC.length) {
    var kalan = d.alanlar.filter(function (a) { return !(a.belge && HARIC.indexOf(a.k) > -1); });
    /* içi boşalan grup başlıklarını at */
    d.alanlar = kalan.filter(function (a, i) { return !a.grup || (kalan[i + 1] && !kalan[i + 1].grup); });
  }
  TANIM = d;
  var h = '<div class="ust"><img class="logo" src="assets/dogus-logo.png" alt="RE/MAX Doğuş"><div class="marka">RE/MAX Doğuş</div>' +
    '<h1>' + d.rolAdi + ' Bilgi Formu</h1>' +
    '<p>' + (d.adres ? d.adres + ' için kira sözleşmesi hazırlanıyor. ' : '') +
    'Bilgilerinizi doldurup belgelerinizi yükleyin, sözleşmeyi biz hazırlayalım.</p></div>';
  h += '<div class="uyari" id="uyari"></div>';

  var kartAcik = false;
  d.alanlar.forEach(function (a) {
    if (a.grup) {
      h += (kartAcik ? '</div>' : '') + '<div class="grup">' + a.grup + '</div><div class="kart">';
      kartAcik = true; return;
    }
    if (!kartAcik) { h += '<div class="kart">'; kartAcik = true; }
    var zor = a.z ? ' <i>*</i>' : '';
    var gizli = a.ko ? ' style="display:none"' : '';
    var baslik = '<span class="ad">' + a.e + zor + '</span>';
    if (!a.belge && a.tip !== 'secim') baslik = '<label for="a_' + a.k + '">' + baslik + '</label>';
    h += '<div class="alan" id="fld_' + a.k + '"' + gizli + '>' + baslik;
    if (a.a) h += '<span class="ipucu">' + a.a + '</span>';
    if (a.tip === 'secim') {
      h += '<div class="secim">';
      (a.sec || []).forEach(function (s) {
        h += '<label><input type="radio" name="s_' + a.k + '" value="' + s + '"><span>' + s + '</span></label>';
      });
      h += '</div>';
    } else if (a.belge) {
      h += '<div class="belge">' +
             '<input type="file" id="a_' + a.k + '"' +
               ' accept="' + (a.kimlik || a.resim ? 'image/*' : 'image/*,application/pdf') + '" capture="environment" multiple>' +
             '<div class="btnler">' +
               (a.kimlik ? '<span class="btn" data-tara="' + a.k + '">📷 Kimliği tara</span>'
                : a.belgeTara ? '<span class="btn" data-tara="' + a.k + '">📷 Belgeyi tara</span>' : '') +
               '<span class="btn" onclick="document.getElementById(\'a_' + a.k + '\').click()">' +
                 (a.kimlik || a.belgeTara ? '🖼️ Galeriden seç' : '📷 Fotoğraf çek veya dosya seç') +
               '</span>' +
             '</div>' +
             '<div class="onizleme" id="o_' + a.k + '"></div>' +
           '</div>';
    } else if (a.tip === 'uzunmetin') {
      h += '<textarea id="a_' + a.k + '" autocapitalize="words"></textarea>';
    } else {
      var tip = a.tip === 'tarih' ? 'date' : a.tip === 'mail' ? 'email' : a.tip === 'tel' ? 'tel' : 'text';
      var mod = a.tip === 'para' || a.tip === 'iban' || a.tip === 'tc' ? ' inputmode="numeric"' : (a.tip === 'tel' ? ' inputmode="tel"' : '');
      var bas = a.tip === 'iban' ? ' value="TR"' : '';
      var buyuk = (a.tip === 'metin' || a.tip === 'isim') ? ' autocapitalize="words"'
                : (a.tip === 'mail' || a.tip === 'iban' || a.tip === 'tc') ? ' autocapitalize="off"' : '';
      h += '<input type="' + tip + '" id="a_' + a.k + '"' + mod + bas + buyuk + '>';
    }
    h += '</div>';
  });
  h += '</div>';

  h += '<div class="grup">Kişisel verileriniz</div><div class="kart">' +
       '<div class="kvkk">' + d.kvkk + '</div>' +
       '<label class="onay"><input type="checkbox" id="kvkk">' +
       '<span>Aydınlatma metnini okudum, bilgilerimin ve belgelerimin kira sözleşmesinin hazırlanması amacıyla işlenmesine onay veriyorum.</span></label>' +
       '</div>' +
       '<p class="mini">Sorunuz olursa danışmanınıza ya da ' + (d.ofisTel || '') + ' numarasına ulaşabilirsiniz.<br>Dosya no: ' + d.dosyaNo + '</p>';

  $('wrap').innerHTML = h;
  $('altbar').style.display = 'block';

  d.alanlar.forEach(function (a) {
    if (!a.k) return;
    if (a.tip === 'secim') {
      Array.prototype.forEach.call(document.getElementsByName('s_' + a.k), function (r) {
        r.addEventListener('change', function () { kosulUygula(); yerelYaz(); });
      });
      return;
    }
    var el = $('a_' + a.k);
    if (a.belge) { BELGELER[a.k] = []; el.addEventListener('change', function (e) { dosyaEkle(a.k, e.target.files); e.target.value = ''; }); }
    else if (a.tip === 'tel') el.addEventListener('input', function (e) { e.target.value = telBicim(e.target.value); });
    else if (a.tip === 'isim') {
      el.addEventListener('input', function (e) { canliBicim(e.target, isimCanli); });
      el.addEventListener('blur',  function (e) { e.target.value = isimBicim(e.target.value); });
    }
    else if (a.tip === 'iban') el.addEventListener('input', function (e) { e.target.value = ibanBicim(e.target.value); });
    else if (a.tip === 'para') el.addEventListener('input', function (e) { e.target.value = paraBicim(e.target.value); });
    else if (a.tip === 'tc') el.addEventListener('input', function (e) { e.target.value = (e.target.value || '').replace(/\D/g, '').slice(0, 11); });
    else if (a.tip === 'uzunmetin') {
      el.addEventListener('input', function (e) { canliBicim(e.target, function (v) { return basBuyukCanli(v, true); }); });
      el.addEventListener('blur',  function (e) { e.target.value = basBuyuk(e.target.value, true); });
    }
    else if (!a.tip || a.tip === 'metin') {
      el.addEventListener('input', function (e) { canliBicim(e.target, function (v) { return basBuyukCanli(v, true); }); });
      el.addEventListener('blur',  function (e) { e.target.value = basBuyuk(e.target.value, true); });
    }
  });
  Array.prototype.forEach.call($('wrap').querySelectorAll('input, textarea'), function (el) {
    if (el.type === 'file' || el.id === 'kvkk') return;
    el.addEventListener(el.type === 'radio' ? 'change' : 'input', yerelYazGecikmeli);
  });
  Array.prototype.forEach.call(document.querySelectorAll('[data-tara]'), function (b) {
    b.onclick = function () {
      var k = b.dataset.tara, ad = '', a4 = false;
      (TANIM.alanlar || []).forEach(function (x) { if (x.k === k) { ad = x.e; a4 = !!x.belgeTara; } });
      taraAc(k, ad, a4);
    };
  });
  if (yereliUygula()) devamSeridi();
  kosulUygula();
  $('gonder').onclick = gonder;
}

/* ---------- kimlik tarayıcı: kart çerçevesi + kalite kontrolü ---------- */
var _taraAlan = null, _taraAkis = null, _taraYon = 'environment';

function taraKur() {
  if ($('tara')) return;
  var d = document.createElement('div');
  d.id = 'tara';
  d.innerHTML =
    '<video id="taraVid" playsinline autoplay muted></video>' +
    '<div class="taracerceve"><i class="tarakose tl"></i><i class="tarakose tr"></i>' +
      '<i class="tarakose bl"></i><i class="tarakose br"></i></div>' +
    '<div class="taraipucu" id="taraIpucu">Kimliği çerçeveye oturtun</div>' +
    '<div class="tarauyari" id="taraUyari"><span id="taraUyariMetin"></span>' +

/* Çerçevenin içini kırp, kaliteyi ölç, gerekirse uyar */
function taraCek() {
  var v = $('taraVid'), cer = document.querySelector('#tara .taracerceve');
  if (!v || !v.videoWidth) return;
  var rv = v.getBoundingClientRect(), rc = cer.getBoundingClientRect();
  var ol = Math.max(rv.width / v.videoWidth, rv.height / v.videoHeight);
  var kx = (v.videoWidth * ol - rv.width) / 2, ky = (v.videoHeight * ol - rv.height) / 2;
  var sx = ((rc.left - rv.left) + kx) / ol, sy = ((rc.top - rv.top) + ky) / ol;
  var sw = rc.width / ol, sh = rc.height / ol;
  var en = 1600, o = Math.min(1, en / Math.max(sw, sh));
  var c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * o)); c.height = Math.max(1, Math.round(sh * o));
  c.getContext('2d').drawImage(v, sx, sy, sw, sh, 0, 0, c.width, c.height);

  var sorun = kaliteSorunu(c);
  var kullan = function () {
    c.toBlob(function (blob) {
      var alan = _taraAlan;
      taraKapat();
      if (!blob) { uyar('Fotoğraf alınamadı, tekrar deneyin.'); return; }
      var ad = (alan || 'belge') + '-' + Date.now() + '.jpg';
      var dosya;
      try { dosya = new File([blob], ad, { type: 'image/jpeg' }); }
      catch (e) { dosya = blob; dosya.name = ad; }
      dosyaYukle(alan, dosya);   /* kalite zaten tarayıcıda soruldu */
    }, 'image/jpeg', 0.9);
  };
  if (!sorun) { kullan(); return; }

/* Bulanıklık (Laplace varyansı) ve aydınlık ölçümü */
function kaliteSorunu(kaynak) {
  try {
    var g = 360, oran = g / kaynak.width;
    var k = document.createElement('canvas');
    k.width = g; k.height = Math.max(1, Math.round(kaynak.height * oran));
    var ctx = k.getContext('2d');
    ctx.drawImage(kaynak, 0, 0, k.width, k.height);
    var d = ctx.getImageData(0, 0, k.width, k.height).data;
    var gri = new Float32Array(k.width * k.height), top = 0;
    for (var i = 0, p = 0; i < d.length; i += 4, p++) {
      gri[p] = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      top += gri[p];
    }
    var ort = top / gri.length;
    if (ort < 55)  return 'Fotoğraf çok karanlık. Işığı iyi olan bir yerde tekrar çekin.';
    if (ort > 225) return 'Fotoğrafta parlama var. Işığı yandan alacak şekilde tekrar çekin.';
    var tp = 0, n = 0;
    for (var y = 1; y < k.height - 1; y++) {
      for (var x = 1; x < k.width - 1; x++) {
        var m = y * k.width + x;
        var l = 4 * gri[m] - gri[m - 1] - gri[m + 1] - gri[m - k.width] - gri[m + k.width];
        tp += l * l; n++;
      }
    }
    var varyans = n ? tp / n : 0;
    if (varyans < 120) return 'Fotoğraf bulanık görünüyor. Telefonu sabit tutup yazılar netleşince çekin.';
    return '';
  } catch (e) { return ''; }
}

/* Küçük önizleme — tarayıcıda saklamak için */
function kucukResim(dataUrl) {

    if (!dataUrl || dataUrl.indexOf('data:image') !== 0) { coz(''); return; }
    var img = new Image();
    img.onload = function () {
      var en = 180, o = Math.min(1, en / Math.max(img.width, img.height));
      var c = document.createElement('canvas');

      c.height = Math.max(1, Math.round(img.height * o));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);

/* Galeriden seçilen kimlik fotoğrafını da ölç, kötüyse sor */
function galeriKontrol(f) {
  return new Promise(function (coz) {
    if ((f.type || '').indexOf('image') !== 0) { coz(''); return; }
    var fr = new FileReader();
    fr.onload = function () {
      var img = new Image();
      img.onload = function () {
        var en = 1200, o = Math.min(1, en / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width * o));
        c.height = Math.max(1, Math.round(img.height * o));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        coz(kaliteSorunu(c));
      };
      img.onerror = function () { coz(''); };
      img.src = fr.result;
    };
    fr.onerror = function () { coz(''); };
    fr.readAsDataURL(f);
  });
}

function dosyaEkle(alan, dosyalar) {
  if (kimlikAlaniMi(alan)) {

    Array.prototype.forEach.call(dosyalar, function (f) {
      sira = sira.then(function () {
        return galeriKontrol(f).then(function (sorun) {

          dosyaYukle(alan, f);

    });
    return;
  }
  Array.prototype.forEach.call(dosyalar, function (f) { dosyaYukle(alan, f); });
}

function dosyaYukle(alan, f) {
  (function () {
    if (f.size > 20 * 1024 * 1024) { uyar('Dosya 20MB\'dan büyük olamaz: ' + f.name); return; }
    var kayit = { ad: f.name, tur: f.type || 'image/jpeg', link: '', durum: 'yukleniyor', onizleme: '' };
    BELGELER[alan].push(kayit);
    kucult(f).then(function (o) {

      if (ONIZLE) return { ok: true, link: '' };   /* önizlemede Drive'a yüklenmez */
      return fetch(API, { method: 'POST', body: new URLSearchParams({
        action: 'belgeYukle',
        data: JSON.stringify({ token: token, alan: alan, tur: o.tur, icerik: o.base64 })
      }) }).then(function (r) { return r.json(); });
    }).then(function (c) {
      kayit.durum = c && c.ok ? 'tamam' : 'hata';
      kayit.link = (c && c.link) || '';
      if (!(c && c.ok)) uyar('Belge yüklenemedi, tekrar deneyin.');
      belgeleriCiz(alan);
      kucukResim(kayit.onizleme).then(function (k) { kayit.kucuk = k; yerelYaz(); });
    }).catch(function () { kayit.durum = 'hata'; belgeleriCiz(alan); uyar('Belge yüklenemedi, tekrar deneyin.'); });
    belgeleriCiz(alan);
  })();

/* Fotoğrafı en fazla 1600px'e küçült — yükleme hızlanır, kalite bozulmaz */
function kucult(f) {
  return new Promise(function (coz) {
    if ((f.type || '').indexOf('pdf') > -1) {
      var fr = new FileReader();
      fr.onload = function () { coz({ base64: fr.result.split(',')[1], tur: 'application/pdf', onizleme: '' }); };
      fr.readAsDataURL(f);
      return;
    }
    var fr2 = new FileReader();
    fr2.onload = function () {
      var img = new Image();
      img.onload = function () {
        var en = 1600, o = Math.min(1, en / Math.max(img.width, img.height));
        var c = document.createElement('canvas');
        c.width = Math.round(img.width * o); c.height = Math.round(img.height * o);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', 0.88);

      };
      img.onerror = function () { coz({ base64: fr2.result.split(',')[1], tur: f.type || 'image/jpeg', onizleme: fr2.result }); };
      img.src = fr2.result;

}

/* ---------- gönder ---------- */

  }) }).then(function (r) { return r.json(); }).then(function (c) {

    } else {

  for (var i = 0; i < liste.length; i++) { if (liste[i].k === a.ko.k) { kaynak = liste[i]; break; } }

function kosulUygula() {

function tcKontrol(v) {
  var tc = String(v || '').replace(/\D/g, '');

  var t = 0, tek = 0, cift = 0;

  if ((tek * 7 - cift) % 10 !== Number(tc.charAt(9))) return 'numara hatalı görünüyor';
  if ((t + Number(tc.charAt(9))) % 10 !== Number(tc.charAt(10))) return 'numara hatalı görünüyor';
  return '';
}
/* Anlık biçimlendirme: uzunluk değişmez, imleç yerinde kalır */
function canliBicim(el, fn) {

function isimCanli(v) {

function basBuyukCanli(v, herKelime) {

  if (!s) return '';

}
function isimBicim(v) {

    .split(' ').map(function (p) {

function telBicim(v) {

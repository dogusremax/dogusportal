<script>window.ILAN={"kod":"ornekremax","tarih":"2026-10-20T07:25:33.977Z","kisa":false,"danisman":{"id":"umut","ad":"Umut Tokkuş","tel":"0532 472 41 48","foto":"umut","unvan":"Broker / Owner"},"ilan":{"baslik":"Erenköy Sahilinde Haydar Ertan Koru Evleri’nde Benzeri Zor Bulunan Satılık Lüks 5+1 Bahçe Dubleksi","islem":"Satılık","tip":"Daire","fiyat":125000000,"para":"TRY","il":"İstanbul","ilce":"Kadıköy","mahalle":"Caddebostan Mah.","ozellik":[["m² (Brüt)","250"],["m² (Net)","200"],["Bina Yapım Yılı","2007"],["Oda Sayısı","5+1"],["Bulunduğu Kat","Bahçe Katı"],["Kat Sayısı","4"],["Isıtma","Doğalgaz (Kombi)"],["Banyo Sayısı","3"],["Balkon","Var"],["Tuvalet Sayısı","4+"],["Eşyalı","Hayır"],["Kullanım Durumu","Boş"],["Krediye Uygun","Evet"],["Yapının Durumu","2.EL"],["Aidat (TL)","16.000"],["Asansör","Var"],["Mutfak","Kapalı"],["Otopark","Açık & Kapalı Otopark"],["Tapu Durumu","Kat Mülkiyetli Tapu"]],"aciklama":"ERENKÖY SAHİLİNDE HAYDAR ERTAN KORU EVLERİ’NDE BENZERİ ZOR BULUNAN SATILIK SÜPER LÜKS 5+1 BAHÇE DUBLEKSİ\n\nErenköy’ün en prestijli adreslerinden Galip Paşa Sokak’ta, sahile ilk parselde konumlanan Haydar Ertan Koru Evleri’nde, tamamen yenilenen bu eşsiz 5+1 bahçe dubleksi, seçkin bir yaşamın tüm ayrıcalıklarını bir araya getiriyor.\nBirgen İnşaat kalitesiyle 2007 yılında inşa edilen, yalnızca 3 bloktan oluşan butik ve seçkin site, konumu, mimarisi ve yaşam kalitesiyle bölgenin en değerli projeleri arasında yer almaktadır.\n250 m² brüt, 200 m² net kullanım alanına sahip olan ters dubleks daire, baştan sona en üst kalite malzemeler kullanılarak yeniden tasarlanarak komple yenilendi.\nÜst Kat\nYaşam alanı olarak planlanan üst katta;\n• Son derece geniş ve ferah salon\n• Gazlı şömine\n• Özel tasarım TV ünitesi\n• Geniş açık balkon\n• Misafir WC\n• Ebeveyn banyolu geniş yatak odası\n• Ferah giriş holü\nbulunmaktadır.\nAlt Kat\nDinlenme alanı olarak tasarlanan alt katta ise;\n• Geniş ebeveyn süiti\n• Özel olarak yeniden tasarlanmış lüks ebeveyn banyosu\n• Büyük giyinme odası\n• Çalışma, oturma veya misafir odası olarak kullanılabilecek çok amaçlı oda\n• Ebeveyn banyolu üçüncü geniş yatak odası\n• Kiler\nyer almaktadır.\nDünya Markalarının Tercih Edildiği Premium Mutfak\nBu özel dairenin mutfağında estetik ve fonksiyonellik dünyanın en seçkin markalarıyla buluşuyor.\n• Wolf kuzine tipi ocak\n• Wolf ankastre fırın\n• Wolf davlumbaz\n• Miele ankastre bulaşık makinesi\n• Sub-Zero gardırop tipi çelik buzdolabı\n• İthal özel tasarım mutfak dolapları\nKonforu Tamamlayan Ayrıcalıklar\n• Teras dahil tüm dairede yerden ısıtma sistemi\n• İthal masif ahşap parkeler\n• Elektrikli panjur sistemi\n• Uzaktan kumandalı güneşlikler\n• Tüm pencerelerde sineklik\n• Yaklaşık 60 m² özel kullanım terası ve bahçesi\n• Özel peyzaj düzenlemesi\n• Terasta otomatik tente\n• Daireye ait 3 m² özel depo alanı\n• Biri açık, biri kapalı olmak üzere 2 adet özel otopark\nSeçkin Site Yaşamı\nHaydar Ertan Koru Evleri, güvenlik, huzur ve sosyal yaşamı bir araya getiren örnek projelerden biridir.\nSite içerisinde;\n• 7 gün 24 saat güvenlik\n• Apartman görevlisi\n• Jeneratör\n• Güney cephede, ağaçların doğal gölgesinde kalan açık yüzme havuzu\n• Bakımlı peyzaj alanları\n• Huzurlu ve seçkin komşuluk yaşamı\nbulunmaktadır.\nErenköy sahiline birkaç adım mesafede yer alan bu özel daire; Bağdat Caddesi’nin seçkin restoranlarına, kafelerine, sosyal yaşam alanlarına ve ulaşım noktalarına yürüyerek ulaşabileceğiniz benzersiz bir konuma sahiptir.\nBu niteliklerde, bu konumda ve bu kalite seviyesinde bir bahçe dubleksi piyasada son derece nadir bulunmaktadır.","fotolar":["https://i.remax.com.tr/photos/35/1441635/L/162c9d2df3e2435198ebd46ee6b62808.webp","https://i.remax.com.tr/photos/35/1441635/L/489abbaccfa1414496880b8541f93180.webp","https://i.remax.com.tr/photos/35/1441635/L/fd7c2ebc818c4660ae851140db924875.webp","https://i.remax.com.tr/photos/35/1441635/L/1e2a7911599b49cb811c5d6909501154.webp","https://i.remax.com.tr/photos/35/1441635/L/dd7e792073f04cbfb1ef1857df499954.webp

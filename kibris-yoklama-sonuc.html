<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lansman yoklama sonucu | RE/MAX Doğuş</title>
<link rel="icon" type="image/png" href="assets/dogus-logo.png">
<meta name="theme-color" content="#050A30">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Umut, 24 Kas 2026: yoklama sonucunu net sayılarla ve sade listeyle görmek istiyor. Veri: kibris-yoklama.html ile aynı
   (lansman yoklamaAl, Danışman Takip PIN'i; Umut tüm listeyi, danışman yalnız kendininkini görür). ?demo=1 örnek veri. */
:root{--navy:#050A30;--navy2:#0C1450;--red:#DC1C2E;--gold:#E9C27A;--mist:#B9BEDC;--ink:#0E1330;--sand:#F7F4EE;--line:#E9E1D4;--ok:#14653a;--fb:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--navy)}
body{font-family:var(--fb);background:radial-gradient(800px 480px at 90% -10%,rgba(220,28,46,.28),transparent 60%),linear-gradient(170deg,var(--navy),var(--navy2) 120%);color:#fff;line-height:1.45;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:24px 16px 60px}
.lg img{height:30px;width:auto;display:block}
.ey{margin-top:26px;font-size:11px;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
h1{font-size:clamp(26px,7vw,32px);font-weight:800;letter-spacing:-.02em;line-height:1.1;margin-top:8px}
.card{margin-top:16px;background:#fff;color:var(--ink);border-radius:18px;padding:16px}
.pin{display:flex;gap:10px;margin-top:10px}
.pin input{flex:1;min-width:0;font:inherit;font-size:26px;letter-spacing:.4em;text-align:center;padding:10px 14px;border-radius:12px;border:1.5px solid #E2DDD3}
.btn{font:inherit;font-size:16px;font-weight:800;border:0;border-radius:40px;padding:13px 22px;background:var(--red);color:#fff;cursor:pointer}
.err{color:var(--red);font-size:14px;font-weight:600;margin-top:10px;min-height:1.2em}
.sayi{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.sayi div{border:1px solid rgba(233,194,122,.32);border-radius:16px;padding:14px 14px 12px;background:rgba(255,255,255,.05)}
.sayi b{display:block;font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em}
.sayi span{display:block;font-size:13px;color:var(--mist);margin-top:6px}
.sayi .b1 b{color:var(--gold)}
.sayi .tam{grid-column:1/-1;display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sayi .tam b{font-size:28px}
.sayi .tam span{margin:0}
h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
table{width:100%;border-collapse:collapse;font-size:15px}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#4A5070;text-align:right;font-weight:700;padding:0 0 8px}
th:first-child,td:first-child{text-align:left}
td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-weight:700}
td:first-child{font-weight:700}
td small{display:block;font-weight:500;font-size:12px;color:#4A5070}
td.z{color:#9AA0B8;font-weight:500}
.sek{display:flex;gap:8px;margin:0 0 4px;flex-wrap:wrap}
.sek button{font:inherit;font-size:14px;font-weight:700;padding:8px 14px;border-radius:30px;border:1.5px solid var(--line);background:var(--sand);color:var(--ink);cursor:pointer}
.sek button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.k{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.k:first-child{border-top:0}
.k .ad{flex:1;min-width:0;font-weight:700;font-size:15.5px}
.k .ad small{display:block;font-weight:500;font-size:12.5px;color:#4A5070}
.rz{font-size:12px;font-weight:800;padding:5px 10px;border-radius:20px;white-space:nowrap}
.rz.g{background:#E3F4EA;color:var(--ok)}
.rz.a0{background:#eef0f5;color:#68738a}.rz.a1{background:#FFF4D6;color:#8a6100}.rz.a2{background:#E4EEFF;color:#1b4fb0}.rz.a3{background:#E3F4EA;color:var(--ok)}.k{flex-wrap:wrap}.rz.o{background:#FDECEE;color:var(--red)}
.not{font-size:13px;color:#4A5070;margin-top:12px}
.top{display:flex;justify-content:space-between;gap:8px;margin-top:6px;padding:12px;border-radius:12px;background:var(--navy);color:#fff;font-weight:800;font-size:14.5px}
.top span b{color:var(--gold);font-size:17px;margin-right:3px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
 <div class="lg"><img src="davetiye/dogus-logo.png" alt="RE/MAX Doğuş"></div>
 <div class="ey">Kuzey Kıbrıs Lansmanı · 22 Kasım</div>
 <h1>Yoklama sonucu</h1>

 <div class="card" id="kapi">
  <b>Giriş</b>
  <div class="pin"><input id="pin" type="password" inputmode="numeric" maxlength="6" autocomplete="off" placeholder="••••" aria-label="Danışman Takip PIN'i"><button class="btn" id="gir" type="button">Giriş</button></div>
  <div class="err" id="hata" role="alert"></div>
 </div>

 <div id="ana" hidden>
  <div class="sayi">
   <div class="b1"><b id="nG">0</b><span>lansmana gelen</span></div>
   <div class="b1"><b id="nO">0</b><span>oyuna katılan</span></div>
  </div>

  <h2>Lansmana gelenler</h2>
  <div class="card">
   <div id="liste"></div>
   <div class="top" id="top"></div>
  </div>
  <p class="not" style="color:#B9BEDC"><span id="son">Canlı</span> · danışmanlar kaydettikçe sayılar kendiliğinden yenilenir.</p>
 </div>
</main>
<script>
(function(){
 var SERVIS='https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec';
 var q=new URLSearchParams(location.search), DEMO=q.get('demo');
 var $=function(id){return document.getElementById(id);};
 var pin='';
 function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){return null;}}
 function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
 function demo(){
  function d(ad,dn,k){return {id:ad,ad:ad,danisman:dn,durum:'teyit',durumYazi:'',kisiler:k.map(function(x,i){return {k:ad+i,ad:x[0],geldi:x[1],oyun:x[2],islendi:x[3]!==false};})};}
  return {ok:true,broker:true,ek:[{k:'ek1',ad:'Örnek Misafir',danisman:'Danışman C',geldi:true,oyun:false}],liste:[
   d('a','Danışman A',[['Ayşe Örnek',true,true],['Mehmet Örnek',true,false]]),
   d('b','Danışman A',[['Fatma Örnek',false,false]]),
   d('c','Danışman B',[['Ali Örnek',true,true]]),
   d('e','Danışman B',[['Zeynep Örnek',false,false,false],['Can Örnek',false,false,false]]),
   d('f','Danışman C',[['Hasan Örnek',true,false]])]};
 }
 function istek(){
  if(DEMO) return Promise.resolve(demo());
  function al(islem){return fetch(SERVIS,{method:'POST',redirect:'follow',body:JSON.stringify({action:'lansman',islem:islem,pin:pin})}).then(function(r){return r.text();})
   .then(function(t){try{return JSON.parse(t);}catch(e){return {ok:false,error:'Şu an bağlanılamadı, birazdan tekrar deneyin.'};}})
   .catch(function(){return {ok:false,error:'Bağlantı hatası, tekrar deneyin.'};});}
  /* Anket durumu (gönderildi / açtı / doldurdu) ayrı uçtan gelir; gelmezse liste yine görünür. */
  return al('yoklamaAl').then(function(r){ if(!r.ok) return r;
   return al('anketDurum').then(function(d){ r.durum=(d&&d.ok)?d.liste:[]; return r; }); });
 }
  function anketRozet(t){
  if(!t) return '';
  if(t.doldurdu) return '<span class="rz a3">Anketi doldurdu</span>';
  if(t.acildi) return '<span class="rz a2">Anketi açtı</span>';
  if(t.gonderildi) return '<span class="rz a1">Anket gönderildi</span>';
  return '<span class="rz a0">Anket gitmedi</span>';
 }
 function ciz(){
  /* Aynı ad + danışman iki kayıt olarak girilmişse tek kişi sayılır; işaretler birleşir. */
  var say={};
  function anahtar(ad,dn){return String(ad).toLocaleLowerCase('tr').replace(/\s+/g,' ').trim()+'|'+dn;}
  function topla(ad,dn,x){var k=anahtar(ad,dn),o=say[k]||(say[k]={ad:ad,dn:dn,g:false,o:false});
   if(x.geldi||x.oyun)o.g=true; if(x.oyun)o.o=true;}
  var dm={}; (veri.durum||[]).forEach(function(x){dm[anahtar(x.ad,x.danisman)]=x;});
  veri.liste.forEach(function(d){d.kisiler.forEach(function(x){topla(x.ad,d.danisman,x);});});
  (veri.ek||[]).forEach(function(x){topla(x.ad,x.danisman,x);});
  var l=Object.keys(say).map(function(k){return say[k];}).filter(function(x){return x.g;});
  l.sort(function(a,b){return a.ad.localeCompare(b.ad,'tr');});
  var G=l.length,O=l.filter(function(x){return x.o;}).length;
  $('nG').textContent=G;$('nO').textContent=O;
  $('top').innerHTML='<span><b>'+G+'</b>lansmana gelen</span><span><b>'+O+'</b>oyuna katılan</span>';
  $('liste').innerHTML=l.length?l.map(function(s){
   return '<div class="k"><div class="ad">'+esc(s.ad)+'<small>'+esc(s.dn)+'</small></div>'+(s.o?'<span class="rz o">Oyuna katıldı</span>':'')+anketRozet(dm[anahtar(s.ad,s.dn)])+'</div>';}).join(''):'<p class="not">Henüz kimse işaretlenmedi.</p>';
 }
 var veri=null;
 function giris(p){
  p=String(p||'').trim(); if(!DEMO&&!/^\d{4,6}$/.test(p)){$('hata').textContent='PIN 4-6 haneli olmalı.';return;}
  pin=p; $('gir').disabled=true; $('hata').textContent='Kontrol ediliyor…';
  istek().then(function(r){
   $('gir').disabled=false;
   if(!r.ok){$('hata').textContent=r.error||'Giriş yapılamadı.';$('pin').value='';ls('kb_pin',null);return;}
   if(!DEMO)ls('kb_pin',pin); veri=r; $('kapi').hidden=true; $('ana').hidden=false; ciz(); guncelle(true);
  });
 }
 /* Canlı: danışman kaydettikçe sayılar kendiliğinden yenilenir (20 sn'de bir, sayfa açıkken). */
 var tmr=null;
 function guncelle(bas){
  if(DEMO||!pin)return; if(tmr&&bas)return;
  tmr=setInterval(function(){
   if(document.hidden)return;
   istek().then(function(r){if(r&&r.ok){veri=r;ciz();$('son').textContent='Güncellendi '+new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}});
  },20000);
 }
 $('gir').onclick=function(){giris($('pin').value);};
 $('pin').addEventListener('keydown',function(e){if(e.key==='Enter')giris(this.value);});
 $('pin').addEventListener('input',function(){if(this.value.length===6)giris(this.value);});
 if(DEMO)giris('0000'); else {var k=ls('kb_pin'); if(k)giris(k);}
})();
</script>
</body>
</html>

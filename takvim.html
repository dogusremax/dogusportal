<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#003DA5">
<title>Ofis Takvimi · RE/MAX Doğuş</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/app-ikon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --mavi:#003DA5; --kirmizi:#DC1C2E; --ink:#131a26; --dim:#68738a; --line:#e4e8f0; --bg:#f4f6fa; --kart:#fff;
  --c-kirmizi:#DC1C2E; --c-mavi:#2563eb; --c-yesil:#16a34a; --c-mor:#7c3aed; --c-turuncu:#ea580c;
  --c-pembe:#db2777; --c-sari:#ca8a04; --c-turkuaz:#0891b2; --c-gri:#64748b;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font-family:'Inter',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.wrap{max-width:720px;margin:0 auto;padding:14px 16px}
header{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
header a.geri{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;color:var(--ink);text-decoration:none;flex:none}
header h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:22px;white-space:nowrap;letter-spacing:-.02em;line-height:1.05}
header small{display:block;color:var(--dim);font-size:12.5px;font-weight:500;margin-top:3px}
.ben{margin-left:auto;display:flex;gap:6px;align-items:center}
.ben select{max-width:150px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:13px;font-weight:600}
.avatar{position:relative;width:48px;height:48px;border-radius:50%;flex:none;background:linear-gradient(135deg,#003DA5,#4f7fd8);display:grid;place-items:center;color:#fff;font-family:'Archivo',sans-serif;font-weight:800;font-size:19px;box-shadow:0 0 0 3px #fff,0 4px 14px rgba(0,61,165,.25);overflow:hidden;cursor:pointer}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.giris{max-width:400px;margin:0 auto;padding:60px 20px 20px;display:flex;flex-direction:column;gap:12px;text-align:center}
.giris .logo{height:40px;margin:0 auto 4px}
.giris h2{font-family:'Archivo',sans-serif;font-weight:800;font-size:24px;letter-spacing:-.02em}
.giris p{color:var(--dim);font-size:13.5px}
.kimler{position:relative;text-align:left;margin-top:8px}
.kimSec{display:flex;align-items:center;gap:12px;width:100%;background:#fff;border:1px solid var(--line);border-radius:14px;padding:9px 14px 9px 9px;font-size:16px;font-weight:600;box-shadow:0 2px 10px rgba(19,26,38,.05)}
.kimSec .ok{margin-left:auto;color:var(--dim)}
.kimler img{width:40px;height:40px;flex:none;border-radius:50%;object-fit:cover;object-position:center top;background:#eef1f6}
.kimListe{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;max-height:340px;overflow-y:auto;z-index:20;box-shadow:0 16px 40px rgba(19,26,38,.16);padding:5px}
.kimListe button{display:flex;align-items:center;gap:12px;width:100%;border-radius:10px;padding:7px 9px;font-size:15px;text-align:left}
.kimListe button:hover,.kimListe button.on{background:#eef3fc}
.kimListe small{display:block;font-weight:400;color:var(--dim);font-size:11.5px}
.giris input{font:700 26px 'Inter',sans-serif;text-align:center;letter-spacing:10px;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;width:100%}
.giris input:focus{outline:2px solid var(--mavi);border-color:transparent}
.giris .btn{background:var(--mavi);color:#fff;padding:15px;font-size:15.5px}
.giris .btn:disabled{opacity:.6}
.giris .hata{color:var(--kirmizi);font-size:13px;min-height:18px}
.giris .hata.bekle{color:var(--dim)}
.kim{min-width:0}
.kim small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ikonbtn{color:var(--ink);text-decoration:none;width:38px;height:38px;border-radius:10px;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:17px;flex:none}

.nobet{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-left:4px solid var(--kirmizi);border-radius:16px;padding:12px 14px;margin-bottom:16px}
.nobet span{font-size:12.5px;color:var(--dim);font-weight:600}
.nobet b{display:block;font-family:'Archivo',sans-serif;font-size:18px;font-weight:800;letter-spacing:-.01em;margin-top:1px}
.nobet .nikon{margin-left:auto;display:flex;gap:8px;align-self:center}
.nfoto{width:52px;height:52px;border-radius:50%;flex:none;background:#f0f3f8;display:grid;place-items:center;font-size:22px;overflow:hidden}
.bugunkutu{margin:-4px 0 16px}
.bugunkutu h3{font-family:'Archivo',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:baseline;gap:8px;margin:0 2px 8px}
.bugunkutu h3 small{font-family:'Inter';font-size:12px;color:var(--dim);font-weight:500}
.bugunkutu .ygun{font-size:12.5px;font-weight:700;color:var(--dim);margin:10px 2px 6px}
.bugunkutu .olay{box-shadow:0 2px 10px rgba(19,26,38,.04)}
.bugunkutu .bos{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;font-size:13.5px}
.nfoto img{width:100%;height:100%;object-fit:cover;display:block}
.nfoto.fig{width:84px;height:80px;border-radius:0;background:none;overflow:visible;align-self:flex-end;margin:-10px 0 -12px -6px}
.nfoto.fig img{height:100%;width:100%;object-fit:contain;object-position:center bottom}
.arac{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:12px}
.sekme{display:flex;background:#e9edf4;border-radius:11px;padding:3px}
.sekme button{padding:7px 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--dim)}
.sekme button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ay{display:flex;align-items:center;gap:2px}
.ay b{font-family:'Archivo',sans-serif;font-size:18px;font-weight:800;white-space:nowrap;padding:0 4px;cursor:pointer}
.ay button{width:32px;height:32px;border-radius:50%;font-size:20px;color:var(--dim)}
.izgara{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}
.gunler{display:grid;grid-template-columns:repeat(7,1fr);font-size:11px;font-weight:700;color:#8a93a6;text-align:center;padding:8px 0;border-bottom:1px solid var(--line);background:#f8f9fc}
.hucreler{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.hucre{aspect-ratio:1/1;min-height:0;height:auto;align-self:stretch;display:flex;flex-direction:column;align-items:stretch;gap:2px;padding:3px 2px 4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;min-width:0}
.hucre{position:relative;overflow:hidden;width:100%;cursor:pointer;-webkit-tap-highlight-color:transparent}
.hucre .no,.hucre .et,.hucre .isaretler{position:relative;z-index:1;display:flex;gap:2px;margin-top:1px;padding-left:1px}
.hucre .is{font-style:normal;font-size:7px;font-weight:800;line-height:1;width:11px;height:11px;border-radius:3px;display:grid;place-items:center;color:#fff}
.hucre .is-tatil{background:#64748b}.hucre .is-toplanti{background:var(--mavi)}.hucre .is-dogumgunu{background:none;font-size:9px}
@media(min-width:600px){.hucre .is{width:14px;height:14px;font-size:8.5px}.hucre .is-dogumgunu{font-size:11px}}
.hucre .daha{position:relative;z-index:1}
.hucre .nfig{position:absolute;right:0;bottom:0;height:52%;max-width:92%;object-fit:contain;object-position:right bottom;pointer-events:none;z-index:0}
.hucre.bugun .nfig{height:60%}
.hucre.dis .nfig{opacity:.45}
.hucre .nfig.ofis,.hucre.bugun .nfig.ofis{left:4px;right:4px;bottom:auto;top:66%;transform:translateY(-50%);width:calc(100% - 8px);height:auto;max-width:none;max-height:58%;object-fit:contain;object-position:center}
.hucre:nth-child(7n){border-right:0}
.hucre:nth-last-child(-n+7){border-bottom:0}
.hucre .no{font-size:10.5px;font-weight:600;width:19px;height:19px;display:grid;place-items:center;border-radius:50%;margin:0 0 1px 1px}
.hucre.dis{background:#fafbfd}.hucre.dis .no,.hucre.dis .et{opacity:.45}
.hucre.tatil .no{color:var(--kirmizi)}
.hucre.secili{background:#eef3fc}
.hucre.bugun{background:var(--kirmizi)!important}
.hucre.bugun .no{color:#fff;font-weight:800}
.hucre.bugun .et.nb{color:#fff;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.35)}
.hucre .et{display:block;font-size:10px;font-weight:600;line-height:1.25;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.hucre .et.nb{background:none!important;color:var(--ink);font-weight:500;font-size:7.5px;line-height:1.1;padding:0 0 0 2px;margin-top:-3px;color:var(--dim);text-shadow:0 0 3px #fff,0 0 3px #fff}
@media(min-width:600px){.hucre .et.nb{font-size:9px;margin-top:-4px}}
.hucre .et.acik{background:#f0f3f8!important;color:var(--dim)}
.hucre .daha{font-size:10px;color:var(--dim);font-weight:600;padding-left:3px}
@media(min-width:600px){.hucre .nfig,.hucre.bugun .nfig{height:62%}.hucre{padding:4px}.hucre .et{font-size:11.5px;padding:2px 5px}.hucre .no{font-size:11.5px;width:22px;height:22px}}
.gunbaslik{font-family:'Archivo',sans-serif;font-size:15px;font-weight:800;margin:16px 2px 8px;display:flex;align-items:baseline;gap:8px}
.gunbaslik small{font-family:'Inter';font-size:12px;color:var(--dim);font-weight:500}
.olay{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;text-align:left;width:100%;align-items:center}
.olay .serit{width:4px;border-radius:4px;flex:none}
.olay .saat{width:48px;flex:none;font-size:12.5px;font-weight:700;line-height:1.3}
.olay .saat small{display:block;color:var(--dim);font-weight:500}
.olay .ic{flex:1;min-width:0}
.olay .bas{font-weight:700;font-size:14.5px;line-height:1.3}
.olay .alt{font-size:12.5px;color:var(--dim);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.rozet{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f0f3f8;color:var(--dim)}
.rozet.evet{background:#dcfce7;color:#15803d}
.rozet.hayir{background:#fee2e2;color:#b91c1c}
.rozet.bekle{background:#fef3c7;color:#a16207}
.kisirozet{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px}
.kisirozet img{width:20px;height:20px;border-radius:50%;object-fit:cover}
.olay .yuz{width:22px;height:22px;border-radius:50%;object-fit:cover;vertical-align:-5px;margin-right:2px}
.olay .yuz.fig{width:auto;height:30px;border-radius:0;object-fit:contain;vertical-align:-9px}
.bos{color:var(--dim);font-size:13.5px;text-align:center;padding:22px 10px;background:#fff;border:1px dashed var(--line);border-radius:14px}

.ekle{position:fixed;right:18px;bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 20px;border-radius:18px;background:var(--mavi);color:#fff;font-weight:700;font-size:15px;box-shadow:0 12px 28px rgba(0,61,165,.35);display:none;align-items:center;gap:8px;z-index:20}
.ekle.var{display:flex}

.perde{position:fixed;inset:0;background:rgba(10,15,31,.45);display:none;align-items:flex-end;justify-content:center;z-index:50}
.perde.acik{display:flex}
.sayfa{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:yuk .22s ease-out}
@keyframes yuk{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media(min-width:700px){.perde{align-items:center}.sayfa{border-radius:22px}}
.sayfa .tut{width:40px;height:4px;border-radius:4px;background:#d6dbe4;margin:-6px auto 12px}
.sayfa h2{font-family:'Archivo',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.01em;line-height:1.2}
.det{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin-top:12px;line-height:1.45}
.det .i{width:22px;flex:none;text-align:center;font-size:15px}
.det a{color:var(--mavi);font-weight:600}
.aciklama{white-space:pre-wrap;color:#323b4d}
.kisi{display:flex;flex-wrap:wrap;gap:6px}
.dugmeler{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;padding:13px;border-radius:12px;font-weight:700;font-size:14.5px;background:#f0f3f8;text-align:center}
.btn.ana{background:var(--mavi);color:#fff}
.btn.yesil{background:#16a34a;color:#fff}
.btn.kirmizi{background:#fee2e2;color:#b91c1c}
.btn.secili{outline:3px solid rgba(0,61,165,.25)}
.btn:disabled{opacity:.5}
.meet{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;padding:13px;border-radius:12px;background:#e8f0fe;color:#1a56db;font-weight:700;text-decoration:none}

form label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin:12px 0 5px;letter-spacing:.02em}
form input[type=text],form input[type=date],form input[type=time],form input[type=url],form select,form textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#fbfcfe;font-size:16px}
form textarea{min-height:80px;resize:vertical}
.iki{display:flex;gap:8px}.iki>*{flex:1;min-width:0}
.secim{display:flex;flex-wrap:wrap;gap:6px}
.secim button{padding:8px 11px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600;color:#3b4456}
.secim button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.renkler{display:flex;gap:8px;flex-wrap:wrap}
.renkler button{width:30px;height:30px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.renkler button.on{box-shadow:0 0 0 2px var(--ink)}
.kutu{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:12px}
.kutu input{width:20px;height:20px}
.durum{font-size:13px;color:var(--dim);text-align:center;min-height:18px;margin-top:10px}
@media(max-width:599px){.wrap{padding:8px 8px}.nobet{margin:0 4px 8px;padding:6px 10px;border-radius:14px}.nfoto.fig{width:58px;height:54px;margin:-8px 0 -7px -4px}.nobet b{font-size:16px}.nobet span{font-size:11.5px}.nobet .ikonbtn{width:34px;height:34px}
.bugunkutu{margin:12px 4px 8px}.bugunkutu .yaklasan{display:none}.bugunkutu h3{font-size:13.5px;margin-bottom:6px}.bugunkutu .olay{padding:8px 12px;margin-bottom:6px}
.arac{margin:0 4px 8px}.izgara{border-radius:14px}.gunler{padding:6px 0}
.hucre{aspect-ratio:auto}.hucre .nfig,.hucre.bugun .nfig{height:68%;width:auto;max-width:none}.hucre .no{font-size:11px;width:20px;height:20px}.hucre .et.nb{font-size:9.5px;margin-top:-2px}.hucre .isaretler{position:absolute;top:3px;right:3px;margin:0;padding:0;z-index:2;flex-direction:column}.hucre .is{width:15px;height:15px;font-size:9px}.hucre .is-dogumgunu{font-size:14px}
.arac{gap:4px}.arac .ekle{position:static;width:36px;height:36px;padding:0;justify-content:center;border-radius:11px;box-shadow:none;flex:none}.arac .ekle span{font-size:24px!important}.ekyazi{display:none}.ay b{font-size:17px;padding:0 2px}.ay button{width:26px}.sekme button{padding:7px 9px}}
/* Bilgisayarda Google Takvim gibi tam ekran: solda nöbetçi ve bugün, sağda ekranı dolduran ay ızgarası (Umut 18 Eki) */
@media(min-width:1000px){
body{padding-bottom:0}
.wrap{max-width:none;height:100vh;padding:16px 20px;display:grid;grid-template-columns:300px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);column-gap:20px;overflow:hidden}
.nobet{grid-column:1;grid-row:1/span 2;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:48px 14px 0;margin:0 0 14px;position:relative;border-left:1px solid var(--line);border-top:4px solid var(--kirmizi);overflow:hidden}
.nobet .nikon{position:absolute;top:10px;right:10px}
.nobet .nfoto.fig{order:2;width:200px;height:190px;margin:4px 0 0;align-self:center}
.nobet b{font-size:21px}.nobet span{font-size:13px}
.bugunkutu{grid-column:1;grid-row:3;margin:0;overflow-y:auto;min-height:0;padding-right:4px}
.arac{grid-column:2;grid-row:1;margin:0 0 12px;align-self:end}
.ay b{font-size:24px}
#icerik{grid-column:2;grid-row:2/span 2;min-height:0;overflow-y:auto}
.izgara{height:100%;display:flex;flex-direction:column}
.hucreler{flex:1;grid-auto-rows:1fr}
.hucre{aspect-ratio:auto;height:auto!important;padding:6px 8px}
.hucre .no{font-size:13px;width:26px;height:26px}
.hucre .et{font-size:12.5px;padding:2px 6px;max-width:62%}
.hucre .et.nb{font-size:12px;margin-top:-2px;max-width:none}
.hucre .nfig,.hucre.bugun .nfig{height:72%;max-width:60%}
.hucre .nfig.ofis,.hucre.bugun .nfig.ofis{width:66%;left:17%;right:auto;top:63%;max-height:52%}
.hucre .isaretler{position:absolute;top:7px;right:8px;margin:0;z-index:2;gap:4px}
.hucre .is{width:20px;height:20px;font-size:11px;border-radius:5px}.hucre .is-dogumgunu{font-size:17px}
.gunler{font-size:12.5px;padding:10px 0}
.arac .ekle{position:static;height:38px;padding:0 16px;border-radius:12px;font-size:14px;box-shadow:none}
.arac .ekle span{font-size:20px!important}
}
@media(max-width:420px){header h1{font-size:19px}.sekme button{padding:7px 10px}.ay b{font-size:17px}}
.yukbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:60;opacity:0;transition:opacity .25s;pointer-events:none;background:linear-gradient(90deg,transparent,var(--mavi),transparent);background-size:40% 100%;background-repeat:no-repeat;animation:kay 1.1s linear infinite}
.yukbar.on{opacity:1}
@keyframes kay{from{background-position:-40% 0}to{background-position:140% 0}}
.yukleniyor{text-align:center;color:var(--dim);padding:30px;font-size:14px}
</style>
</head>
<body>
<div class="giris" id="giris" hidden>
  <img class="logo" src="assets/dogus-logo-koyu.png" alt="RE/MAX Doğuş">
  <h2>Ofis Takvimi</h2>
  <p>Doğuş Posta'daki şifrenle gir. Bir kez girmen yeter.</p>
  <div class="kimler" id="kimler"></div>
  <input id="pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off" aria-label="Şifre" placeholder="••••">
  <button class="btn" id="girBtn">Giriş</button>
  <div class="hata" id="girisHata"></div>
</div>
<div class="yukbar" id="yukBar"></div>
<div class="wrap" id="ana" hidden>
  <header hidden>
    <button class="avatar" id="avatar" title="Hesap">
      <img id="benFoto" alt="" hidden><span id="benHarf">?</span>
    </button>
    <div class="kim"><h1>Ofis Takvimi</h1><small id="benYazi"></small></div>
    <div class="ben">
      <a class="ikonbtn" href="https://dogusportal.com" title="Portal" aria-label="Portal"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg></a>
    </div>
  </header>

  <div class="nobet" id="nobetKart">
    <div class="nfoto" id="nobetFoto">🛡️</div>
    <div style="min-width:0"><span>Bugün nöbette</span><b id="nobetAd">—</b></div>
    <div class="nikon">
      <button class="ikonbtn" id="zil" title="Telefon bildirimleri" onclick="window.bildirimPaneli&&bildirimPaneli()">🔔</button>
      <button class="ikonbtn" id="cikisBtn" title="Çıkış" aria-label="Çıkış"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
    </div>
  </div>

  <div class="bugunkutu" id="bugunKutu" hidden></div>

  <div class="arac">
    <div class="ay">
      <button id="once" aria-label="Önceki">‹</button><b id="ayAdi" title="Bugüne dön"></b><button id="sonra" aria-label="Sonraki">›</button>
    </div>
    <div class="sekme" id="gorunum">
      <button data-g="ay" class="on">Ay</button><button data-g="liste">Liste</button><button data-g="benim">Benim</button>
    </div>
    <button class="ekle" id="ekleBtn" aria-label="Etkinlik ekle"><span style="font-size:22px;line-height:1">+</span><b class="ekyazi"> Etkinlik</b></button>
  </div>

  <div id="icerik"><div class="yukleniyor">Takvim yükleniyor…</div></div>
</div>


<div class="perde" id="perde"><div class="sayfa" id="sayfa"></div></div>

<script src="assets/imza.js?v=4"></script>
<script>
const API = "https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec";
const EKIP = ['Ayşegül Alpay','Aysun Yılmaz','Evşen Özazman','Gamze Yetkin','Gizem Gök','İrem Aleyna Tetik','Makbule Tokkuş','Orhan Özazman','Özlem Varol','Umut Tokkuş'];
const AYLAR = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER = ['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const KISA = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const TURLER = {
  nobet:{ad:'Nöbet',renk:'kirmizi',ikon:'🛡️'}, toplanti:{ad:'Toplantı',renk:'mavi',ikon:'👥'},
  birebir:{ad:'Bire bir',renk:'mor',ikon:'🤝'}, egitim:{ad:'Eğitim',renk:'turuncu',ikon:'🎓'},
  dogumgunu:{ad:'Doğum günü',renk:'pembe',ikon:'🎂'}, etkinlik:{ad:'Etkinlik',renk:'turkuaz',ikon:'📌'},
  izin:{ad:'İzin',renk:'yesil',ikon:'🌴'}, duyuru:{ad:'Duyuru',renk:'sari',ikon:'📢'}, tatil:{ad:'Resmi tatil',renk:'gri',ikon:'🇹🇷'}
};
const RENKLER = ['kirmizi','mavi','yesil','mor','turuncu','pembe','sari','turkuaz','gri'];
const TEKRAR = {'':'Tekrar yok','haftalik':'Her hafta','aylik':'Her ay (aynı gün)','aylik-hafta':'Her ay (ör. ilk pazartesi)','yillik':'Her yıl'};
const HATIRLAT = [[10,'10 dk'],[30,'30 dk'],[60,'1 saat'],[120,'2 saat'],[720,'12 saat'],[1440,'1 gün'],[2880,'2 gün'],[10080,'1 hafta']];
const OFIS_ADRES = 'RE/MAX Doğuş, Dumlupınar, Özen Sk. Nuhoğlu Yenitepe Sitesi 2.Etap A Blok D:2, 34720 Kadıköy/İstanbul';

const FOTO = {'Ayşegül Alpay':'aysegul','Aysun Yılmaz':'aysun','Evşen Özazman':'evsen','Gamze Yetkin':'gamze','Gizem Gök':'gizem',
  'İrem Aleyna Tetik':'irem','Makbule Tokkuş':'makbule','Orhan Özazman':'orhan','Özlem Varol':'ozlem','Umut Tokkuş':'umut'};
const fotoUrl = ad => { const k=Object.keys(FOTO).find(e=>e.toLocaleLowerCase('tr').split(' ')[0]===String(ad||'').toLocaleLowerCase('tr').split(' ')[0] && e.split(' ').slice(-1)[0]===String(ad||'').split(' ').slice(-1)[0]); return k?'assets/ekip/yuz/'+FOTO[k]+'.webp':''; };
const fotoHtml = (ad, yedek) => { const u=fotoUrl(ad); return u?`<img src="${u}" alt="">`:(yedek||esc(String(ad||'?').charAt(0))); };
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ls = (k,v) => { try { if (v===undefined) return localStorage.getItem(k)||''; localStorage.setItem(k,v); } catch(e){} return ''; };
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const gunAl = s => new Date(s+'T12:00:00');
const gunEkle = (s,n) => { const d=gunAl(s); d.setDate(d.getDate()+n); return ymd(d); };
const bugun = () => ymd(new Date());
const renk = r => 'var(--c-'+(RENKLER.includes(r)?r:'mavi')+')';
const ilkAd = a => String(a||'').split(' ')[0];
const anahtar = a => String(a||'').toLocaleLowerCase('tr').split(/\s+/)[0];

let S = { gorunum: ls('ot_gorunum')||'ay', ay: (()=>{const d=new Date();return new Date(d.getFullYear(),d.getMonth(),1);})(),
          secili: bugun(), olaylar: [], kapsam: null, broker: false,
          oturum: ls('posta_oturum'), kim: ls('posta_kim'), ad: '' };

/* ---- kim: Doğuş Posta ile aynı oturum (posta_oturum); bir kez girilir ---- */
const kisi = id => (window.IMZA_KISILER||[]).find(x=>x.id===id);
function benAd(){ return S.ad || (kisi(S.kim)||{}).ad || ''; }
function benFoto(){
  const b=benAd(), u=fotoUrl(b);
  $('benFoto').hidden=!u; if(u) $('benFoto').src=u;
  $('benHarf').style.display=u?'none':''; $('benHarf').textContent=b?b.charAt(0):'?';
  $('benYazi').textContent = b ? 'Merhaba '+ilkAd(b)+(S.broker?' · Broker':'') : '';
}
let SECILEN = S.kim || ls('posta_son_kim') || 'umut';
function kimlerCiz(acik){
  const sirali=(window.IMZA_KISILER||[]).slice().sort((a,b)=>a.ad.localeCompare(b.ad,'tr'));
  const k=kisi(SECILEN)||sirali[0]; SECILEN=k.id;
  const foto=x=>`<img src="assets/imza/${x.id}.png" alt="">`;
  $('kimler').innerHTML=`<button type="button" class="kimSec">${foto(k)}<span>${esc(k.ad)}</span><span class="ok">▾</span></button>`+
    (acik?'<div class="kimListe">'+sirali.map(x=>`<button type="button" data-id="${x.id}" class="${x.id===k.id?'on':''}">${foto(x)}<span>${esc(x.ad)}<small>${esc(x.unvan)}</small></span></button>`).join('')+'</div>':'');
  $('kimler').querySelector('.kimSec').onclick=e=>{ e.stopPropagation(); kimlerCiz(!acik); };
  $('kimler').querySelectorAll('.kimListe button').forEach(x=>x.onclick=()=>{ SECILEN=x.dataset.id; ls('posta_son_kim',SECILEN); kimlerCiz(); $('pin').focus(); });
}
document.addEventListener('click',e=>{ if($('kimler').querySelector('.kimListe') && !$('kimler').contains(e.target)) kimlerCiz(); });
function girisGoster(m){
  $('ana').hidden=true; $('ekleBtn').classList.remove('var'); $('giris').hidden=false;
  kimlerCiz(); $('girisHata').textContent=m||''; $('pin').value=''; $('pin').focus();
}
async function girisYap(){
  const pin=$('pin').value.trim(); if(!pin){ $('pin').focus(); return; }
  $('girBtn').disabled=true; $('girisHata').textContent='Kontrol ediliyor…'; $('girisHata').classList.add('bekle');
  try{
    const j=await api({islem:'giris',kim:SECILEN,pin});
    S.oturum=j.oturum; S.kim=j.kim; S.ad=j.ad; S.broker=!!j.broker;
    ls('posta_oturum',S.oturum); ls('posta_kim',S.kim);
    $('giris').hidden=true; $('ana').hidden=false; benFoto(); await yukle(true); hashAc();
  }catch(e){ $('girisHata').textContent=e.message; $('pin').value=''; }
  finally{ $('girBtn').disabled=false; $('girisHata').classList.remove('bekle'); }
}
$('girBtn').onclick=girisYap;
$('pin').addEventListener('keydown',e=>{ if(e.key==='Enter') girisYap(); });
$('cikisBtn').onclick=$('avatar').onclick=()=>{ if(confirm(`${benAd()} olarak girdin. Çıkış yapılsın mı?\n(Doğuş Posta'dan da çıkılır.)`)) cikis(); };
function cikis(m){
  ['posta_oturum','posta_kim','posta_hesap','ot_onbellek','ot_depo'].forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
  S.oturum=''; S.kim=''; S.ad=''; S.broker=false; S.kapsam=null; S.olaylar=[]; girisGoster(m);
}

/* ---- veri ---- */
async function api(body){
  const r = await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action:'takvim',oturum:S.oturum},body))});
  const j = await r.json();
  if (!j.ok && j.error==='OTURUM_YOK' && body.islem!=='giris') cikis('Oturumun kapanmış, tekrar gir.');
  if (!j.ok) throw new Error(j.error||j.message||'Hata');
  return j;
}
function gorunurAralik(){
  if (S.gorunum!=='ay'){ const b=bugun(); return [b, gunEkle(b,90)]; }
  const ilk=new Date(S.ay); const bas=new Date(ilk); bas.setDate(1-((ilk.getDay()+6)%7));
  const son=new Date(bas); son.setDate(son.getDate()+41);
  return [ymd(bas), ymd(son)];
}
// Veri deposu: birkaç ayın etkinlikleri tek yerde, S.kapsam=[bas,son] hangi günleri kapsadığını tutar.
// Sunucu (Apps Script) 3-5 sn sürüyor: depo telefonda saklanır, açılışta ve ay geçişlerinde anında çizilir,
// gösterilen ayın öncesi/sonrası arkada çekilir (Umut 18 Eki: "çok bekletiyor", "aylar arası akıcı değil")
const OB='ot_depo'; let YUKLE_NO=0, YUK=0; const BEKLEYEN={};
function depoYukle(){ try{ const d=JSON.parse(ls(OB)||'null'); if(d && d.kim===(S.kim||'') && d.kapsam){ S.olaylar=d.olaylar||[]; S.kapsam=d.kapsam; S.broker=!!d.broker; if(d.ad) S.ad=d.ad; } }catch(e){} }
function depoYaz(){ try{ ls(OB, JSON.stringify({kim:S.kim||'',olaylar:S.olaylar,kapsam:S.kapsam,broker:S.broker,ad:S.ad||''})); }catch(e){} }
const kapsar=(b,e)=>!!S.kapsam && S.kapsam[0]<=b && S.kapsam[1]>=e;
function ihtiyac(){ const [b,e]=gorunurAralik(), g=bugun(), s=gunEkle(g,14); return [b<g?b:g, e>s?e:s]; }
function genis(){ const [b,e]=ihtiyac(); return [gunEkle(b,-63), gunEkle(e,63)]; }
function yukGoster(d){ YUK=Math.max(0,YUK+d); $('yukBar').classList.toggle('on', YUK>0); }
const gorunenImza=()=>{ const [b,e]=ihtiyac(); return JSON.stringify(S.olaylar.filter(o=>o.tarih>=b&&o.tarih<=e))+S.broker; };
function getir(b,e){
  const k=b+'_'+e; if (BEKLEYEN[k]) return BEKLEYEN[k];
  yukGoster(1);
  return BEKLEYEN[k]=api({islem:'liste', bas:b, bit:e}).then(j=>{
    if (S.oturum && !j.ad){ cikis('Oturumun kapanmış, tekrar gir.'); throw new Error('OTURUM'); }
    const ort=S.kapsam && !(e<S.kapsam[0] || b>S.kapsam[1]);
    if (ort){ S.olaylar=S.olaylar.filter(o=>o.tarih<b||o.tarih>e).concat(j.olaylar).sort((x,y)=>x.tarih<y.tarih?-1:x.tarih>y.tarih?1:0);
      S.kapsam=[b<S.kapsam[0]?b:S.kapsam[0], e>S.kapsam[1]?e:S.kapsam[1]]; }
    else { S.olaylar=j.olaylar; S.kapsam=[b,e]; }
    S.broker=!!j.broker; if(j.ad) S.ad=j.ad; depoYaz();
  }).finally(()=>{ delete BEKLEYEN[k]; yukGoster(-1); });
}
async function yukle(zorla){
  const no=++YUKLE_NO, [b,e]=ihtiyac(), [gb,ge]=genis();
  ciz(); benFoto();                       // elde ne varsa hemen (boşsa boş ızgara)
  if (!zorla && kapsar(gb,ge)) return;    // önceki/sonraki ay da hazır
  const once=gorunenImza(), vardi=kapsar(b,e);
  try{
    await getir(gb,ge);
    if (no===YUKLE_NO && gorunenImza()!==once){ ciz(); benFoto(); }
  }catch(err){
    if (err.message==='OTURUM' || vardi || no!==YUKLE_NO) return;
    $('icerik').innerHTML=`<div class="bos">Takvim yüklenemedi: ${esc(err.message)}<br><br><button class="btn" onclick="yukle(true)">Tekrar dene</button></div>`;
  }
}

/* ---- süzgeç ---- */
function benimMi(o, ben){
  if (!ben) return false;
  if (o.tur==='tatil') return true;
  if (o.tur==='nobet') return o.nobetci && anahtar(o.nobetci)===anahtar(ben) && o.nobetci.split(' ').slice(-1)[0]===ben.split(' ').slice(-1)[0];
  if (!o.kisiler || !o.kisiler.length) return o.tur!=='dogumgunu';
  return o.kisiler.includes(ben) || (o.tur==='birebir' && ben==='Umut Tokkuş');
}
/* ---- çizim ---- */
function ciz(){
  const liste = S.gorunum!=='ay';
  $('ayAdi').textContent = liste ? (S.gorunum==='benim'?'Benim takvimim':'Yaklaşanlar') : AYLAR[S.ay.getMonth()]+' '+S.ay.getFullYear();
  ['once','sonra'].forEach(i=>$(i).style.display = liste?'none':'');
  document.querySelectorAll('#gorunum button').forEach(b=>b.classList.toggle('on', b.dataset.g===S.gorunum));
  $('ekleBtn').classList.toggle('var', S.broker);
  nobetCiz(); bugunCiz();
  if (S.gorunum==='ay') ayCiz(); else listeCiz(S.gorunum==='benim');
}
function nobetCiz(){
  const a=(S.olaylar.find(o=>o.tur==='nobet'&&o.tarih===bugun())||{}).nobetci;
  if (!a){ $('nobetAd').textContent='—'; $('nobetFoto').classList.remove('fig'); $('nobetFoto').innerHTML='🛡️'; return; }
  $('nobetAd').textContent = a==='Ofis' ? 'Ofis' : a;
  const f=figUrl(a);
  $('nobetFoto').classList.toggle('fig', !!f);
  $('nobetFoto').innerHTML = f ? `<img src="${f}" alt="">` : a!=='Ofis' ? fotoHtml(a,'🛡️') : '🏢';
}
// Telefonda ilk ekranda bugünün etkinlikleri yazılı dursun (Umut 18 Eki); nöbet üstteki kartta
function bugunCiz(){
  if (!S.kapsam){ $('bugunKutu').hidden=true; return; }
  const g=bugun(), d=gunAl(g), son=gunEkle(g,14);
  const liste=S.olaylar.filter(o=>o.tarih===g && o.tur!=='nobet');
  // Bugün boşsa da ekran boş kalmasın: önümüzdeki 14 günün etkinlikleri kutu kutu (Umut 18 Eki)
  const yakin=S.olaylar.filter(o=>o.tarih>g && o.tarih<=son && o.tur!=='nobet').slice(0,6);
  let h=`<h3>Bugün<small>${d.getDate()} ${AYLAR[d.getMonth()]} ${GUNLER[d.getDay()]}</small></h3>`+
    (liste.length ? liste.map(olayKart).join('') : '<div class="bos">Bugün nöbet dışında etkinlik yok.</div>');
  if (yakin.length){
    h+='<div class="yaklasan"><h3 style="margin-top:16px">Yaklaşanlar</h3>'; let onceki='';
    yakin.forEach(o=>{ if(o.tarih!==onceki){ const x=gunAl(o.tarih), f=Math.round((x-d)/864e5);
      h+=`<div class="ygun">${f===1?'Yarın':x.getDate()+' '+AYLAR[x.getMonth()]} · ${GUNLER[x.getDay()]}</div>`; onceki=o.tarih; } h+=olayKart(o); });
    h+='</div>';
  }
  // Telefonda bugünün etkinlikleri takvimin altındaki boşlukta (Umut 18 Eki)
  const yer = innerWidth<600 ? $('icerik').nextSibling : document.querySelector('.arac');
  if ($('bugunKutu').nextSibling!==yer) $('icerik').parentNode.insertBefore($('bugunKutu'), yer);
  $('bugunKutu').hidden=false; $('bugunKutu').innerHTML=h;
  $('bugunKutu').querySelectorAll('.olay').forEach(b=>b.onclick=()=>detay(b.dataset.id,b.dataset.t));
}
// Nöbetçinin dekupe fotoğrafı kutunun sağ altında, yazıların arkasında (Umut 18 Eki); Ofis günlerinde yok
// Ofis (toplantı) günlerinde "Doğuş'la Gülen Yüzler" görseli (Umut 18 Eki)
const OFIS_FIG='assets/ekip/nobet/ofis.webp?v=2';
const NOBET_FIG = {aysegul:1,aysun:1,evsen:1,gamze:1,gizem:1,irem:1,orhan:1,ozlem:1};
// Nöbetçi resimleri baştan indirilsin, ızgarada sonradan belirmesin (Umut 18 Eki)
new Image().src=OFIS_FIG;
Object.keys(NOBET_FIG).forEach(id=>{ const i=new Image(); i.src=`assets/ekip/${innerWidth<600?'nobet/omuz':'nobet'}/${id}.webp?v=5`; });
function figUrl(ad){ if (ad==='Ofis') return OFIS_FIG; const u=fotoUrl(ad), id=u && u.split('/').pop().replace('.webp',''); return id && NOBET_FIG[id] ? `assets/ekip/nobet/${id}.webp?v=5` : ''; }
function nobetFig(o){
  if (!o || o.tur!=='nobet') return '';
  if (o.nobetci==='Ofis') return `<img class="nfig ofis" src="${OFIS_FIG}" alt="">`;
  const u=fotoUrl(o.nobetci), id=u && u.split('/').pop().replace('.webp','');
  // Telefonda diğer omuz kesik görsel: el görünür, kişi kutunun sağ kenarına yaslı (Umut 18 Eki)
  const yol=innerWidth<600?'nobet/omuz':'nobet';
  return id && NOBET_FIG[id] ? `<img class="nfig" src="assets/ekip/${yol}/${id}.webp?v=5" alt="">` : '';
}
// Telefonda ay ızgarası ekranın kalanını kaplar, kutular uzun (Umut 18 Eki, seçenek A)
function izgaraBoyut(){
  const hc=[...document.querySelectorAll('.hucre')], ic=document.querySelector('.hucreler');
  if (!ic || !hc.length) return;
  if (innerWidth>=600){ hc.forEach(x=>x.style.height=''); return; }
  const ust=ic.getBoundingClientRect().top+scrollY, sat=hc.length/7;
  // ince uzun olmasın: kutu boyu en fazla genişliğin 1,9 katı (Umut 18 Eki)
  const y=Math.max(70, Math.min(Math.floor((innerHeight-ust-12)/sat)-1, Math.round(hc[0].offsetWidth*1.9)));
  hc.forEach(x=>x.style.height=y+'px');
}
addEventListener('resize', ()=>{ if (S.gorunum==='ay') izgaraBoyut(); });
function gunAc(g){
  const liste=S.olaylar.filter(o=>o.tarih===g);
  ac(gunListesi(g, liste)+`<div class="dugmeler"><button class="btn" onclick="kapat()">Kapat</button></div>`);
  $('sayfa').querySelectorAll('.olay').forEach(b=>b.onclick=()=>detay(b.dataset.id,b.dataset.t));
}
function ayCiz(){
  const [b]=gorunurAralik(), ay=S.ay.getMonth(), olay=S.olaylar;
  const gunde={}; olay.forEach(o=>(gunde[o.tarih]=gunde[o.tarih]||[]).push(o));
  const tatil={}; S.olaylar.forEach(o=>{ if(o.tur==='tatil') tatil[o.tarih]=1; });
  let h='<div class="izgara"><div class="gunler">'+KISA.map(k=>`<div>${k}</div>`).join('')+'</div><div class="hucreler">';
  for(let i=0;i<42;i++){
    const g=gunEkle(b,i), d=gunAl(g), liste=(gunde[g]||[]);
    // Izgara kutuları: her günün içinde kısa yazıyla etkinlikler (Umut 18 Eki); nöbetçi en üstte
    const sirali=liste.slice().sort((x,y)=>(x.tur==='nobet'?0:x.tur==='tatil'?1:2)-(y.tur==='nobet'?0:y.tur==='tatil'?1:2));
    const kisa=o=>o.tur==='nobet'?(o.nobetci==='Ofis'?'Ofis':ilkAd(o.nobetci)):o.tur==='dogumgunu'?'🎂 '+ilkAd(String(o.baslik).replace(/^\W+/,'')):String(o.baslik||'').replace((TURLER[o.tur]||{}).ikon||'~','').trim();
    const cls=['hucre', d.getMonth()!==ay?'dis':'', (d.getDay()===0||d.getDay()===6)?'hs':'', tatil[g]?'tatil':'', g===bugun()?'bugun':'', g===S.secili?'secili':''].join(' ');
    // Bayram B, doğum günü 🎂, toplantı T: kısa işaretler tek satırda (Umut 18 Eki)
    const ISARET={tatil:'B',dogumgunu:'🎂',toplanti:'T'};
    const isaretli=sirali.filter(o=>ISARET[o.tur]), yazili=sirali.filter(o=>!ISARET[o.tur]);
    const sinir=innerWidth>=1000?4:2, gor=yazili.slice(0, yazili.length>sinir?sinir-1:sinir);
    h+=`<div class="${cls}" role="button" tabindex="0" data-g="${g}"><span class="no">${d.getDate()}</span>`+
       gor.map(o=>`<span class="et${o.tur==='nobet'?' nb':''}" style="background:${renk(o.renk||TURLER[o.tur].renk)}">${esc(kisa(o))}</span>`).join('')+
       (yazili.length>gor.length?`<span class="daha">+${yazili.length-gor.length}</span>`:'')+
       (isaretli.length?'<span class="isaretler">'+isaretli.map(o=>`<i class="is is-${o.tur}" title="${esc(o.baslik||'')}">${ISARET[o.tur]}</i>`).join('')+'</span>':'')+
       nobetFig(sirali[0])+'</div>';
  }
  h+='</div></div>';
  $('icerik').innerHTML=h;
  const hc=[...$('icerik').querySelectorAll('.hucre')];
  if ((innerWidth<600 || innerWidth>=1000) && hc.slice(35).every(x=>x.classList.contains('dis'))) hc.slice(35).forEach(x=>x.remove());
  izgaraBoyut();
  // Kutuya dokununca o günün ayrıntısı açılır (Umut 18 Eki)
  $('icerik').querySelectorAll('.hucre').forEach(c=>c.onclick=()=>gunAc(c.dataset.g));
  baglaOlay();
}
function gunBaslik(g){ const d=gunAl(g); const fark=Math.round((gunAl(g)-gunAl(bugun()))/864e5);
  const ek=fark===0?'Bugün':fark===1?'Yarın':fark===-1?'Dün':'';
  return `<div class="gunbaslik">${d.getDate()} ${AYLAR[d.getMonth()]} ${GUNLER[d.getDay()]}${ek?`<small>${ek}</small>`:''}</div>`; }
function gunListesi(g, liste){
  return gunBaslik(g) + (liste.length ? liste.map(olayKart).join('') : `<div class="bos">Bu gün için etkinlik yok${S.broker?'. Eklemek için <b>+ Etkinlik</b>':''}</div>`);
}
function listeCiz(benim){
  const ben=benAd();
  if (benim && !ben){ $('icerik').innerHTML='<div class="bos">Kendi takvimini görmek için giriş yap.</div>'; return; }
  const olay=S.olaylar.filter(o=>o.tarih>=bugun() && (benim ? benimMi(o,ben) && o.tur!=='tatil' : true));
  if (!olay.length){ $('icerik').innerHTML='<div class="bos">Önümüzdeki 90 günde etkinlik yok.</div>'; return; }
  let h='', son='';
  olay.forEach(o=>{ if(o.tarih!==son){ h+=gunBaslik(o.tarih); son=o.tarih; } h+=olayKart(o); });
  $('icerik').innerHTML=h; baglaOlay();
}
function yanitOzet(o){
  const ben=benAd(); if (o.salt || o.tur==='dogumgunu' || o.tur==='tatil' || o.tur==='duyuru') return '';
  const y=o.yanitlar||{}, kat=(o.kisiler&&o.kisiler.length?o.kisiler:EKIP);
  const evet=kat.filter(a=>y[a]==='evet').length, hayir=kat.filter(a=>y[a]==='hayir').length;
  let s=''; if (ben && kat.includes(ben)) s+= y[ben]==='evet'?'<span class="rozet evet">Katılıyorum</span>':y[ben]==='hayir'?'<span class="rozet hayir">Katılmıyorum</span>':'<span class="rozet bekle">Yanıt bekliyor</span>';
  if (evet||hayir) s+=`<span>${evet} katılıyor${hayir?' · '+hayir+' katılmıyor':''}</span>`;
  return s;
}
function olayKart(o){
  const t=TURLER[o.tur]||TURLER.etkinlik;
  const saat = o.tumGun||!o.bas ? '<span>Tüm<br>gün</span>' : `${o.bas}<small>${o.bit||''}</small>`;
  const baslik = o.tur==='nobet' ? (o.nobetci==='Ofis'?'Ofis nöbeti':o.nobetci+' nöbette') : String(o.baslik||'').replace(t.ikon,'').trim();
  const kisi = o.tur==='nobet'||o.tur==='tatil'||o.tur==='dogumgunu' ? '' : (o.kisiler&&o.kisiler.length ? o.kisiler.map(ilkAd).join(', ') : 'Herkes');
  return `<button class="olay" data-id="${esc(o.id)}" data-t="${o.tarih}"><span class="serit" style="background:${renk(o.renk||t.renk)}"></span>
    <span class="saat">${saat}</span><span class="ic"><span class="bas">${o.tur==='nobet'&&figUrl(o.nobetci)?`<img class="yuz fig" src="${figUrl(o.nobetci)}" alt="">`:o.tur==='nobet'&&fotoUrl(o.nobetci)?`<img class="yuz" src="${fotoUrl(o.nobetci)}" alt="">`:t.ikon} ${esc(baslik)}</span>
    <span class="alt">${kisi?`<span>${esc(kisi)}</span>`:''}${o.meet?'<span>· Görüntülü</span>':''}${yanitOzet(o)}</span></span></button>`;
}
function baglaOlay(){ $('icerik').querySelectorAll('.olay').forEach(b=>b.onclick=()=>detay(b.dataset.id,b.dataset.t)); }

/* ---- perde ---- */
function ac(html){ $('sayfa').innerHTML='<div class="tut"></div>'+html; $('perde').classList.add('acik'); document.body.style.overflow='hidden'; }
function kapat(){ $('perde').classList.remove('acik'); document.body.style.overflow=''; if(location.hash) history.replaceState(null,'',location.pathname+location.search); }
$('perde').onclick=e=>{ if(e.target===$('perde')) kapat(); };

function sureMetni(dk){ const h=HATIRLAT.find(x=>x[0]===dk); if(h) return h[1]; return dk>=1440? Math.round(dk/1440)+' gün' : dk>=60? Math.round(dk/60)+' saat' : dk+' dk'; }
function detay(id, tarih){
  const o=S.olaylar.find(x=>x.id===id && x.tarih===tarih) || S.olaylar.find(x=>x.id===id);
  if (!o) return;
  const t=TURLER[o.tur]||TURLER.etkinlik, d=gunAl(o.tarih), ben=benAd();
  const zaman = `${d.getDate()} ${AYLAR[d.getMonth()]} ${d.getFullYear()} ${GUNLER[d.getDay()]}` + (o.tumGun||!o.bas?' · Tüm gün':` · ${o.bas}–${o.bit}`);
  const kat = o.kisiler&&o.kisiler.length ? o.kisiler : null;
  const y=o.yanitlar||{};
  let h=`<div style="display:flex;gap:10px;align-items:center"><span class="rozet" style="background:${renk(o.renk||t.renk)};color:#fff">${t.ikon} ${t.ad}</span>${o.gizli?'<span class="rozet">🔒 Yalnız broker görür</span>':''}</div>
    <h2 style="margin-top:10px">${esc(o.tur==='nobet'?(o.nobetci==='Ofis'?'Ofis nöbeti':o.nobetci+' nöbette'):o.baslik)}</h2>
    <div class="det"><span class="i">🕒</span><span>${zaman}${o.tekrar?`<br><span style="color:var(--dim)">↻ ${esc(TEKRAR[o.tekrar])}</span>`:''}</span></div>`;
  if (o.konum) h+=`<div class="det"><span class="i">📍</span><a href="https://maps.google.com/?q=${encodeURIComponent(o.konum)}" target="_blank" rel="noopener">${esc(o.konum)}</a></div>`;
  if (o.tur!=='nobet'&&o.tur!=='tatil'&&o.tur!=='dogumgunu'){
    const liste=(kat||EKIP).map(a=>{ const s=y[a]; return `<span class="rozet kisirozet ${s==='evet'?'evet':s==='hayir'?'hayir':''}">${fotoUrl(a)?`<img src="${fotoUrl(a)}" alt="">`:''}${esc(a)}${s==='evet'?' ✓':s==='hayir'?' ✗':''}</span>`; }).join('');
    h+=`<div class="det"><span class="i">👥</span><div><div style="margin-bottom:6px;color:var(--dim)">${kat?kat.length+' kişi':'Herkes'}</div><div class="kisi">${liste}</div></div></div>`;
  }
  if (o.hatirlatma&&o.hatirlatma.length) h+=`<div class="det"><span class="i">🔔</span><span>${o.hatirlatma.map(sureMetni).join(', ')} önce hatırlatma</span></div>`;
  if (o.aciklama) h+=`<div class="det"><span class="i">📝</span><span class="aciklama">${esc(o.aciklama).replace(/(https?:\/\/[^\s<]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')}</span></div>`;
  if (o.meet) h+=`<a class="meet" href="${esc(o.meet)}" target="_blank" rel="noopener">🎥 Görüntülü toplantıya katıl</a>`;
  const yanitlanir = !o.salt && o.tur!=='dogumgunu' && o.tur!=='tatil' && o.tur!=='duyuru' && ben && (!kat || kat.includes(ben));
  if (yanitlanir) h+=`<div style="font-size:13px;font-weight:700;color:var(--dim);margin-top:18px">${esc(ilkAd(ben))}, katılıyor musun?</div>
    <div class="dugmeler" style="margin-top:8px"><button class="btn yesil ${y[ben]==='evet'?'secili':''}" data-y="evet">✓ Katılıyorum</button><button class="btn kirmizi ${y[ben]==='hayir'?'secili':''}" data-y="hayir">✗ Katılmıyorum</button></div>`;
  else if (!ben && !o.salt && o.tur!=='tatil' && o.tur!=='dogumgunu') h+=`<div class="durum">Yanıt vermek için üstten adını seç.</div>`;
  if (o.tur==='nobet' && S.broker) h+=`<div class="dugmeler"><a class="btn" href="https://dogusportal.com/nobet.html" target="_blank" rel="noopener" style="text-decoration:none;color:inherit">Nöbet planını aç</a></div>`;
  if (S.broker && !o.salt) h+=`<div class="dugmeler"><button class="btn ana" id="dzn">Düzenle</button>${o.tekrar?'<button class="btn kirmizi" id="silGun">Bu günü sil</button>':''}<button class="btn kirmizi" id="sil">${o.tekrar?'Tümünü sil':'Sil'}</button></div>`;
  h+=`<div class="durum" id="dDurum"></div><div class="dugmeler"><button class="btn" onclick="kapat()">Kapat</button></div>`;
  ac(h);
  history.replaceState(null,'','#'+o.id+'/'+o.tarih);
  $('sayfa').querySelectorAll('[data-y]').forEach(b=>b.onclick=async()=>{
    const yeni = y[ben]===b.dataset.y ? '' : b.dataset.y;
    $('dDurum').textContent='Kaydediliyor…';
    try{ await api({islem:'yanit',id:o.id,tarih:o.tarih,yanit:yeni});
      S.olaylar.filter(x=>x.id===o.id && (o.tekrar? x.tarih===o.tarih : true)).forEach(x=>{ x.yanitlar=Object.assign({},x.yanitlar); if(yeni) x.yanitlar[ben]=yeni; else delete x.yanitlar[ben]; });
      detay(o.id,o.tarih); ciz(); }catch(e){ $('dDurum').textContent='Hata: '+e.message; }
  });
  if ($('dzn')) $('dzn').onclick=()=>form(o);
  if ($('sil')) $('sil').onclick=()=>sil(o,false);
  if ($('silGun')) $('silGun').onclick=()=>sil(o,true);
}
async function sil(o, gun){
  if (!confirm(gun?'Yalnız bu günkü tekrar silinsin mi?':'"'+o.baslik+'" silinsin mi?')) return;
  $('dDurum').textContent='Siliniyor…';
  try{ await api({islem:'sil',id:o.id,tarih:gun?o.tarih:''}); kapat(); await yukle(true); }
  catch(e){ $('dDurum').textContent='Hata: '+e.message; }
}

/* ---- ekle / düzenle ---- */
function form(o){
  const yeni=!o; o = o ? Object.assign({},o,{tarih:o.ilkTarih||o.tarih}) : {tur:'toplanti',tarih:S.secili||bugun(),bas:'10:00',bit:'11:00',tumGun:false,kisiler:[],hatirlatma:[1440,60],konum:'RE/MAX Doğuş',renk:''};
  const f={...o, kisiler:[...(o.kisiler||[])], hatirlatma:[...(o.hatirlatma||[])]};
  const turSec=Object.keys(TURLER).filter(t=>t!=='nobet'&&t!=='tatil');
  ac(`<h2>${yeni?'Yeni etkinlik':'Etkinliği düzenle'}</h2><form id="frm" onsubmit="return false">
    <label>Tür</label><div class="secim" id="fTur">${turSec.map(t=>`<button type="button" data-v="${t}">${TURLER[t].ikon} ${TURLER[t].ad}</button>`).join('')}</div>
    <label>Başlık</label><input type="text" id="fBaslik" value="${esc(f.baslik||'')}" placeholder="Örn. Aylık ofis toplantısı" maxlength="140">
    <div class="iki"><div><label>Tarih</label><input type="date" id="fTarih" value="${f.tarih}"></div>
      <div><label>Tekrar</label><select id="fTekrar">${Object.entries(TEKRAR).map(([k,v])=>`<option value="${k}" ${k===(f.tekrar||'')?'selected':''}>${v}</option>`).join('')}</select></div></div>
    <div class="kutu"><input type="checkbox" id="fTum" ${f.tumGun?'checked':''}><label for="fTum" style="margin:0;font-size:14px;color:var(--ink)">Tüm gün</label></div>
    <div class="iki" id="fSaatler"><div><label>Başlangıç</label><input type="time" id="fBas" value="${f.bas||'10:00'}"></div><div><label>Bitiş</label><input type="time" id="fBit" value="${f.bit||'11:00'}"></div></div>
    <label>Kimler</label><div class="secim" id="fKisi"><button type="button" data-v="*">Herkes</button>${EKIP.map(a=>`<button type="button" data-v="${esc(a)}">${esc(a)}</button>`).join('')}</div>
    <label>Konum</label><div class="iki"><input type="text" id="fKonum" value="${esc(f.konum||'')}" placeholder="Ofis, adres ya da yer"><button type="button" class="btn" style="flex:none;min-width:0;padding:0 12px" id="fOfis">Ofis</button></div>
    <label>Görüntülü toplantı bağlantısı</label><input type="url" id="fMeet" value="${esc(f.meet||'')}" placeholder="https://meet.google.com/… ya da Zoom">
    <label>Açıklama / gündem</label><textarea id="fAciklama" placeholder="Gündem, notlar">${esc(f.aciklama||'')}</textarea>
    <label>Hatırlatma (telefon bildirimi${'' } ve WhatsApp)</label><div class="secim" id="fHat">${HATIRLAT.map(([m,a])=>`<button type="button" data-v="${m}">${a} önce</button>`).join('')}</div>
    <label>Renk</label><div class="renkler" id="fRenk"><button type="button" data-v="" title="Türün rengi" style="background:conic-gradient(#2563eb,#db2777,#16a34a,#ea580c,#2563eb)"></button>${RENKLER.map(r=>`<button type="button" data-v="${r}" style="background:${renk(r)}"></button>`).join('')}</div>
    <div class="kutu"><input type="checkbox" id="fGizli" ${f.gizli?'checked':''}><label for="fGizli" style="margin:0;font-size:14px;color:var(--ink)">Gizli (yalnız broker görür)</label></div>
    <div class="durum" id="fDurum"></div>
    <div class="dugmeler"><button type="button" class="btn" onclick="${yeni?'kapat()':`detay('${esc(o.id)}','${esc(o.tarih)}')`}">Vazgeç</button><button type="button" class="btn ana" id="fKaydet">Kaydet</button></div></form>`);
  const tek=(kap,deg,set)=>{ $(kap).querySelectorAll('button').forEach(b=>{ b.classList.toggle('on',b.dataset.v===deg()); b.onclick=()=>{ set(b.dataset.v); tek(kap,deg,set); }; }); };
  tek('fTur',()=>f.tur,v=>{ f.tur=v; if(v==='dogumgunu'){ $('fTum').checked=true; $('fTekrar').value='yillik'; saatGoster(); } });
  tek('fRenk',()=>f.renk||'',v=>f.renk=v);
  const kisiCiz=()=>$('fKisi').querySelectorAll('button').forEach(b=>{ b.classList.toggle('on', b.dataset.v==='*'? !f.kisiler.length : f.kisiler.includes(b.dataset.v));
    b.onclick=()=>{ const v=b.dataset.v; if(v==='*') f.kisiler=[]; else f.kisiler=f.kisiler.includes(v)?f.kisiler.filter(x=>x!==v):[...f.kisiler,v]; kisiCiz(); }; });
  kisiCiz();
  const hatCiz=()=>$('fHat').querySelectorAll('button').forEach(b=>{ const m=+b.dataset.v; b.classList.toggle('on',f.hatirlatma.includes(m));
    b.onclick=()=>{ f.hatirlatma=f.hatirlatma.includes(m)?f.hatirlatma.filter(x=>x!==m):[...f.hatirlatma,m].sort((a,b)=>b-a).slice(0,4); hatCiz(); }; });
  hatCiz();
  const saatGoster=()=>$('fSaatler').style.display=$('fTum').checked?'none':'flex';
  $('fTum').onchange=saatGoster; saatGoster();
  $('fOfis').onclick=()=>$('fKonum').value=OFIS_ADRES;
  $('fKaydet').onclick=async()=>{
    const ev={ id:yeni?'':o.id, tur:f.tur, baslik:$('fBaslik').value.trim(), tarih:$('fTarih').value, tumGun:$('fTum').checked,
      bas:$('fBas').value, bit:$('fBit').value, tekrar:$('fTekrar').value, kisiler:f.kisiler, konum:$('fKonum').value.trim(),
      meet:$('fMeet').value.trim(), aciklama:$('fAciklama').value, hatirlatma:f.hatirlatma, renk:f.renk, gizli:$('fGizli').checked };
    if (!ev.baslik){ $('fDurum').textContent='Başlık yaz.'; return; }
    if (!ev.tarih){ $('fDurum').textContent='Tarih seç.'; return; }
    if (ev.meet && !/^https:\/\//.test(ev.meet)){ $('fDurum').textContent='Bağlantı https:// ile başlamalı.'; return; }
    $('fKaydet').disabled=true; $('fDurum').textContent='Kaydediliyor…';
    try{ const j=await api({islem:'kaydet',ev}); S.secili=ev.tarih; const d=gunAl(ev.tarih);
      S.ay=new Date(d.getFullYear(),d.getMonth(),1); kapat(); await yukle(true); detay(j.sonuc.id, ev.tarih); }
    catch(e){ $('fDurum').textContent='Hata: '+e.message; $('fKaydet').disabled=false; }
  };
}

/* ---- olaylar ---- */
document.querySelectorAll('#gorunum button').forEach(b=>b.onclick=()=>{ S.gorunum=b.dataset.g; ls('ot_gorunum',S.gorunum); ciz(); yukle(); });
$('once').onclick=()=>{ S.ay=new Date(S.ay.getFullYear(),S.ay.getMonth()-1,1); S.secili=ymd(S.ay); yukle(); };
$('sonra').onclick=()=>{ S.ay=new Date(S.ay.getFullYear(),S.ay.getMonth()+1,1); S.secili=ymd(S.ay); yukle(); };
$('ayAdi').onclick=()=>{ if(S.gorunum!=='ay') return;  const d=new Date(); S.ay=new Date(d.getFullYear(),d.getMonth(),1); S.secili=bugun(); yukle(); };
$('ekleBtn').onclick=()=>form(null);

// bildirimden gelindiyse: #id/tarih
const HASH=location.hash.match(/^#([\w-]+)\/(\d{4}-\d\d-\d\d)$/);
if (HASH){ const d=gunAl(HASH[2]); S.ay=new Date(d.getFullYear(),d.getMonth(),1); S.secili=HASH[2]; S.gorunum='ay'; }
function hashAc(){ if (HASH && S.olaylar.length) detay(HASH[1], HASH[2]); }
(async function basla(){
  if (!S.oturum){ girisGoster(); return; }
  $('ana').hidden=false; depoYukle(); const vardi=!!S.kapsam; if (vardi) hashAc();
  await yukle(true); if (!vardi) hashAc();
})();
</script>
<script src="assets/bildirim.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Birebir Toplantı Raporu — RE/MAX Doğuş</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:#0a0b10;color:#e4e4e7;min-height:100vh}
.login{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:16px}
.login input{padding:12px 20px;background:#1a1b23;border:1px solid #333;border-radius:10px;color:#fff;font-size:16px;text-align:center;width:200px;font-family:inherit}
.login button{padding:12px 32px;background:#2563eb;color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
.login h2{color:#fff;font-size:20px}
.hidden{display:none!important}
.dash{max-width:900px;margin:0 auto;padding:20px}
.top-bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px}
.top-bar select{padding:8px 16px;background:#1a1b23;border:1px solid #333;border-radius:8px;color:#fff;font-size:14px;font-family:inherit}
.top-right{display:flex;gap:6px;align-items:center}
.pbtn{padding:6px 14px;background:#1a1b23;border:1px solid #333;color:#888;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit}
.pbtn.active{background:#2563eb;border-color:#2563eb;color:#fff}
.exit-btn{padding:8px 14px;background:#333;border:none;color:#fff;border-radius:8px;cursor:pointer;font-size:12px;margin-left:8px;font-family:inherit}
.profile{display:flex;align-items:center;gap:20px;background:linear-gradient(135deg,#1a1b23,#1e2030);border:1px solid #222;border-radius:16px;padding:24px;margin-bottom:20px;flex-wrap:wrap}
.profile img{width:80px;height:80px;border-radius:50%;object-fit:cover;object-position:center 20%;border:3px solid #2563eb}
.profile .initials{width:80px;height:80px;border-radius:50%;background:#2563eb;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff}
.profile .info{flex:1;min-width:150px}
.profile .info h2{font-size:22px;color:#fff}
.profile .info p{color:#888;font-size:13px;margin-top:4px}
.profile .rank{text-align:center}
.profile .rank .num{font-size:42px;font-weight:800;color:#f59e0b}
.profile .rank .lbl{font-size:12px;color:#888}
.period-lbl{font-size:13px;color:#888;text-align:center;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:#141520;border:1px solid #222;border-radius:12px;padding:16px;text-align:center}
.stat .val{font-size:24px;font-weight:700}
.stat .lbl{font-size:11px;color:#888;margin-top:4px}
.card{background:#141520;border:1px solid #222;border-radius:14px;padding:20px;margin-bottom:20px}
.card h3{font-size:14px;font-weight:700;color:#fff;margin-bottom:16px}
.act-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:13px}
.act-row .aname{width:120px;color:#888;text-align:right;flex-shrink:0;font-size:12px}
.act-row .bar-bg{flex:1;height:20px;background:#1e2030;border-radius:6px;overflow:hidden;position:relative}
.act-row .bar-fill{height:100%;border-radius:6px;transition:width 0.6s}
.act-row .bar-target{position:absolute;height:100%;border-right:2px dashed rgba(255,255,255,0.3);top:0}
.act-row .acount{width:36px;font-weight:600;color:#fff;text-align:right;font-size:13px}
.act-row .atarget{width:44px;font-size:11px;color:#666}
.comp-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:13px}
.comp-row .cl{width:90px;color:#888;text-align:right;font-size:12px}
.comp-row .bw{flex:1;display:flex;align-items:center;gap:6px}
.comp-row .b1{height:14px;border-radius:4px;background:#2563eb;min-width:2px}
.comp-row .b2{height:14px;border-radius:4px;background:#333;min-width:2px}
.comp-row .cv{font-size:12px;color:#fff;font-weight:500;width:55px}
.trend-chart{display:flex;align-items:flex-end;gap:10px;height:120px;padding:0 10px 24px;margin-top:8px}
.trend-bar{flex:1;border-radius:6px 6px 0 0;background:#2563eb;position:relative;min-width:24px;transition:height 0.5s}
.trend-bar .wval{position:absolute;top:-20px;width:100%;text-align:center;font-size:12px;font-weight:600;color:#fff}
.trend-bar .wlbl{position:absolute;bottom:-20px;width:100%;text-align:center;font-size:11px;color:#888}
.insight{padding:10px 14px;border-radius:8px;margin-bottom:8px;font-size:13px;line-height:1.5}
.insight.good{background:#14532d;border-left:3px solid #22c55e;color:#86efac}
.insight.warn{background:#422006;border-left:3px solid #f59e0b;color:#fcd34d}
.insight.bad{background:#450a0a;border-left:3px solid #ef4444;color:#fca5a5}
.no-data{color:#888;font-size:14px;text-align:center;padding:40px}
.insight.warn,.insight.bad{cursor:pointer}
.roadmap{display:none;padding:14px 16px;border-radius:0 0 8px 8px;background:#1a1a2e;border:1px solid #333;font-size:12.5px;line-height:1.7;color:#ccc;margin-bottom:10px}
.roadmap.show{display:block}
.roadmap h4{margin:0 0 8px;font-size:13px;color:#fff}
.rm-week{margin-bottom:10px;padding:8px 10px;background:#0f0f1e;border-radius:6px}
.rm-week b{color:#60a5fa;font-size:12px}
.roadmap ul{margin:4px 0 0 16px;padding:0}
.roadmap li{margin-bottom:3px;color:#ddd}
</style>
</head>
<body>
<div class="login" id="loginScreen">
<h2>🔒 Giriş</h2>
<input type="password" id="pin" placeholder="PIN" maxlength="4">
<button onclick="doLogin()">Giriş</button>
<p id="loginErr" style="color:#ef4444;font-size:13px"></p>
</div>
<div class="dash hidden" id="dashboard">
<div class="top-bar">
<select id="consultantSel" onchange="render()"></select>
<div class="top-right">
<button class="pbtn active" data-p="1" onclick="setPeriod(1)">1 Ay</button>
<button class="pbtn" data-p="3" onclick="setPeriod(3)">3 Ay</button>
<button class="pbtn" data-p="6" onclick="setPeriod(6)">6 Ay</button>
<button class="pbtn" data-p="12" onclick="setPeriod(12)">12 Ay</button>
<button class="exit-btn" onclick="location.reload()">Çıkış ↺</button>
</div>
</div>
<div id="report"><div class="no-data">Danışman seçin</div></div>
</div>
<script>
const API="https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec";
const KAPANIS_API="https://script.google.com/macros/s/AKfycby3N2cq5LI99_UgjzlxIjZr7looJz88Rft-BJ9E5ZgP9-ZmUEmoXARoIm717JAmTGuD/exec";
const KEY="dogus-performans";
const ACTS=[
{id:"fzbo",label:"FZBO Araması",wt:15},{id:"etki",label:"Etki Çevresi",wt:10},
{id:"sunum1",label:"1. Sunum",wt:3},{id:"sunum2",label:"2. Sunum",wt:2},
{id:"yetki",label:"Alınan Yetki",wt:1},{id:"gosterim",label:"Gösterim",wt:2},
{id:"kapora",label:"Kapora",wt:1},{id:"kibris_sunum",label:"Kıbrıs Sunum",wt:1},
{id:"emlak_nobet",label:"Emlak Nöbet",wt:1},{id:"brosur",label:"Broşür",wt:5},
{id:"sosyal_medya",label:"Sosyal Medya",wt:3},{id:"egitim",label:"Eğitim",wt:1}
];
const PHOTOS={
aysegul_alpay:"https://lh3.googleusercontent.com/d/1OWki4Z752FukK9Yk2io9R4zVwdhovd8q=w400",
evsen:"https://lh3.googleusercontent.com/d/1-J0do4DhzN_AGC0PU1hi-fu-YPIvr9AE=w400",
gamze:"https://lh3.googleusercontent.com/d/1qQjf0VhmCwLywOD9yBsMguPlCMt7wJr9=w400",
gizem:"https://lh3.googleusercontent.com/d/1ppuPVDhFcBZyY4QDBMHgL7acTy6SAQdR=w400",
irem:"https://lh3.googleusercontent.com/d/1K6kJuM3AnValMiy41pLuqN66WQmDXLjT=w400",
orhan:"https://lh3.googleusercontent.com/d/1JNN6eHt1Vy4YR-_taSkZxSQ7jrhDaxge=w400",
ozlem_varol:"https://lh3.googleusercontent.com/d/1ZcDqNhYVBJlARSUk46APolmWsyZLMexe=w400",
aysun:"https://lh3.googleusercontent.com/d/1qCW-9vQSnRgSNrqcUn_xIeuYP7oM2Wp9=w400"
};
const MN=["Oca","Şub","Mar","Nis","May","Haz","Tem","Ağu","Eyl","Eki","Kas","Ara"];
let DATA=null,ALL_DATA=[],PERIOD=1,AYLIK_CACHE={},KAPANIS_CACHE=null,LOGGED_USER=null;
var PINS={
"1520":"broker",
"2824":"aysegul_alpay",
"3847":"aysun",
"4657":"evsen",
"3286":"gamze",
"2679":"gizem",
"9935":"irem",
"7912":"orhan",
"2535":"ozlem_varol"
};

function doLogin(){
  var pin=document.getElementById("pin").value;
  var user=PINS[pin];
  if(!user){document.getElementById("loginErr").textContent="Hatalı PIN";return;}
  LOGGED_USER=user;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  if(user!=="broker") document.getElementById("consultantSel").style.display="none";
  loadData();
}
document.getElementById("pin").addEventListener("keyup",function(e){if(e.key==="Enter")doLogin();});

function setPeriod(p){
  PERIOD=p;
  document.querySelectorAll(".pbtn").forEach(function(b){b.classList.toggle("active",+b.dataset.p===p);});
  loadData();
}

function getMonthKeys(n){
  var keys=[],now=new Date();
  for(var i=0;i<n;i++){
    var d=new Date(now.getFullYear(),now.getMonth()-i,1);
    keys.push(d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"));
  }
  return keys;
}

async function loadData(){
  var months=getMonthKeys(PERIOD);
  document.getElementById("report").innerHTML='<div class="no-data">Yükleniyor...</div>';
  try{
    // Sadece önbellekte olmayan ayları çek
    var toFetch=months.filter(function(m){return !AYLIK_CACHE[m];});
    var promises=[];
    if(toFetch.length) promises.push(Promise.all(toFetch.map(function(m){return fetch(API+"?action=aylik&ay="+m+"&k="+KEY).then(function(r){return r.json();}).then(function(d){if(d.siralama)AYLIK_CACHE[m]=d;return d;});})));
    else promises.push(Promise.resolve([]));
    if(!KAPANIS_CACHE) promises.push(fetch(KAPANIS_API+"?action=getRecords",{redirect:"follow"}).then(function(r){return r.json();}).catch(function(){return null;}));
    else promises.push(Promise.resolve(KAPANIS_CACHE));
    var aylikResult=await promises[0];
    ALL_DATA=months.map(function(m){return AYLIK_CACHE[m];}).filter(Boolean);
    if(!ALL_DATA.length){document.getElementById("report").innerHTML='<div class="no-data">Veri bulunamadı</div>';return;}
    DATA=mergeData(ALL_DATA);
    // Kapanış verisi: varsa hemen uygula, yoksa arka planda çek
    if(KAPANIS_CACHE){
      applyKapanis(KAPANIS_CACHE,months);
    }else{
      promises[1].then(function(d){if(d){KAPANIS_CACHE=d;applyKapanis(d,months);}});
    }
    var cSel=document.getElementById("consultantSel");
    var prev=cSel.value;
    cSel.innerHTML="";
    DATA.siralama.forEach(function(r){
      var o=document.createElement("option");o.value=r.id;o.textContent=r.name;cSel.appendChild(o);
    });
    if(LOGGED_USER&&LOGGED_USER!=="broker"){
      var match=DATA.siralama.find(function(r){return r.id===LOGGED_USER;});
      if(match)cSel.value=match.id;
    }else if(prev&&cSel.querySelector('[value="'+prev+'"]'))cSel.value=prev;
    render();
  }catch(e){document.getElementById("report").innerHTML='<div class="no-data">Hata: '+e.message+'</div>';}
}

function mergeData(all){
  var first=all[all.length-1],last=all[0];
  var ids=first.siralama.map(function(r){return r.id;});
  var merged={
    ayAdi:all.length===1?last.ayAdi:first.ayAdi+" — "+last.ayAdi,
    yil:last.yil,
    siralama:ids.map(function(id){
      var rows=all.map(function(d){return d.siralama.find(function(r){return r.id===id;});}).filter(Boolean);
      if(!rows.length)return null;
      var r=rows[0],counts={};
      ACTS.forEach(function(a){counts[a.id]=rows.reduce(function(s,row){return s+(row.counts[a.id]||0);},0);});
      return{id:r.id,name:r.name,first:r.first,last:r.last,
        puan:rows.reduce(function(s,row){return s+row.puan;},0),
        aktivitePuan:rows.reduce(function(s,row){return s+row.aktivitePuan;},0),
        istikrar:rows.reduce(function(s,row){return s+row.istikrar;},0),
        kapanisPuan:rows.reduce(function(s,row){return s+row.kapanisPuan;},0),
        hedefBonus:rows.reduce(function(s,row){return s+(row.hedefBonus||0);},0),
        aktifGun:rows.reduce(function(s,row){return s+row.aktifGun;},0),
        kapanis:rows.reduce(function(s,row){return s+row.kapanis;},0),
        ciro:rows.reduce(function(s,row){return s+row.ciro;},0),
        counts:counts,monthly:rows};
    }).filter(Boolean).sort(function(a,b){return b.puan-a.puan;})
  };
  return merged;
}

function render(){
  if(!DATA||!DATA.siralama.length)return;
  var id=document.getElementById("consultantSel").value;
  var d=DATA.siralama.find(function(r){return r.id===id;});
  if(!d)return;
  var rank=DATA.siralama.indexOf(d)+1;
  var total=DATA.siralama.length;
  var avg=Math.round(DATA.siralama.reduce(function(s,r){return s+r.puan;},0)/total);
  var photoHtml=PHOTOS[d.id]?'<img src="'+PHOTOS[d.id]+'" alt="'+d.name+'">':'<div class="initials">'+(d.first?d.first[0]:"")+(d.last?d.last[0]:"")+"</div>";

  var h='<div class="profile">'+photoHtml+'<div class="info"><h2>'+d.name+'</h2><p>'+DATA.ayAdi+" "+DATA.yil+" Performans Raporu</p></div>"+'<div class="rank"><div class="num">#'+rank+'</div><div class="lbl">'+total+" danışman içinde</div></div></div>";
  h+='<div class="period-lbl">'+DATA.ayAdi+" "+DATA.yil+" · "+PERIOD+" aylık "+(PERIOD>1?"toplam":"detay")+"</div>";

  // Stats
  h+='<div class="stats">';
  h+='<div class="stat"><div class="val" style="color:#2563eb">'+d.puan+'</div><div class="lbl">Toplam Puan</div></div>';
  h+='<div class="stat"><div class="val" style="color:#22c55e">'+d.aktifGun+'/'+(PERIOD*22)+'</div><div class="lbl">Aktif Gün</div></div>';
  h+='<div class="stat"><div class="val" style="color:#f59e0b">'+d.kapanis+'</div><div class="lbl">Kapanış</div></div>';
  h+='<div class="stat"><div class="val" style="color:#a855f7;font-size:18px">'+(d.ciro?d.ciro.toLocaleString("tr-TR"):0)+' ₺</div><div class="lbl">Ciro</div></div>';
  h+='</div>';

  // Activities
  h+='<div class="card"><h3>📊 Aktivite Detayı — Hedef vs Gerçekleşen</h3>';
  var maxC=1;
  ACTS.forEach(function(a){var c=d.counts[a.id]||0;var t=a.wt*4*PERIOD;if(Math.max(c,t)>maxC)maxC=Math.max(c,t);});
  ACTS.forEach(function(a){
    var count=d.counts[a.id]||0,target=a.wt*4*PERIOD;
    var pct=Math.min(100,Math.round(count/maxC*100));
    var tPct=Math.min(100,Math.round(target/maxC*100));
    var color=count>=target?"#22c55e":count>=target*0.5?"#f59e0b":"#ef4444";
    h+='<div class="act-row"><div class="aname">'+a.label+'</div><div class="bar-bg"><div class="bar-fill" style="width:'+pct+"%;background:"+color+'"></div><div class="bar-target" style="left:'+tPct+'%"></div></div><div class="acount">'+count+'</div><div class="atarget">/ '+target+"</div></div>";
  });
  h+="</div>";

  // Comparison
  h+='<div class="card"><h3>📈 Takım Karşılaştırma (sen vs ortalama)</h3>';
  var compItems=[
    {l:"Toplam Puan",v:d.puan,a:avg},
    {l:"Aktif Gün",v:d.aktifGun,a:Math.round(DATA.siralama.reduce(function(s,r){return s+r.aktifGun;},0)/total)},
    {l:"Gösterim",v:d.counts.gosterim||0,a:Math.round(DATA.siralama.reduce(function(s,r){return s+(r.counts.gosterim||0);},0)/total)},
    {l:"Sunum",v:(d.counts.sunum1||0)+(d.counts.sunum2||0),a:Math.round(DATA.siralama.reduce(function(s,r){return s+(r.counts.sunum1||0)+(r.counts.sunum2||0);},0)/total)}
  ];
  compItems.forEach(function(c){
    var mx=Math.max(c.v,c.a,1);
    h+='<div class="comp-row"><div class="cl">'+c.l+'</div><div class="bw"><div class="b1" style="width:'+Math.round(c.v/mx*100)+'%"></div><div class="cv">'+c.v+'</div></div><div class="bw"><div class="b2" style="width:'+Math.round(c.a/mx*100)+'%"></div><div class="cv" style="color:#888">'+c.a+" ort.</div></div></div>";
  });
  h+="</div>";

  // Puan dağılımı
  h+='<div class="stats">';
  h+='<div class="stat"><div class="val" style="color:#2563eb;font-size:20px">'+d.aktivitePuan+'</div><div class="lbl">Aktivite Puanı</div></div>';
  h+='<div class="stat"><div class="val" style="color:#22c55e;font-size:20px">'+d.istikrar+'</div><div class="lbl">İstikrar Bonusu</div></div>';
  h+='<div class="stat"><div class="val" style="color:#f59e0b;font-size:20px">'+d.kapanisPuan+'</div><div class="lbl">Kapanış Puanı</div></div>';
  h+='<div class="stat"><div class="val" style="color:#a855f7;font-size:20px">'+(d.hedefBonus||0)+'</div><div class="lbl">Hedef Bonusu</div></div>';
  h+="</div>";

  // Monthly Trend
  if(PERIOD>1&&d.monthly&&d.monthly.length>1){
    h+='<div class="card"><h3>📈 Aylık Puan Trendi</h3><div class="trend-chart">';
    var maxP=Math.max.apply(null,d.monthly.map(function(m){return m.puan;}))||1;
    var reversed=d.monthly.slice().reverse();
    for(var i=0;i<reversed.length;i++){
      var m=reversed[i];
      var ht=Math.max(5,Math.round(m.puan/maxP*100));
      var mi=ALL_DATA.find(function(a){return a.siralama.some(function(r){return r.id===d.id&&r.puan===m.puan;});});
      var label=mi?MN[parseInt(mi.ay.split("-")[1])-1]:"";
      h+='<div class="trend-bar" style="height:'+ht+'%"><div class="wval">'+m.puan+'</div><div class="wlbl">'+label+"</div></div>";
    }
    h+="</div></div>";
  }

  // Analysis
  h+='<div class="card"><h3>💡 Analiz ve Öneriler</h3>';
  var ins=[];
  if(rank===1)ins.push({t:"good",m:"🏆 Bu dönem birinci sıradasın, tebrikler!"});
  else if(rank<=3)ins.push({t:"good",m:"🎯 İlk 3'te yer alıyorsun, harika!"});
  if(d.aktifGun>=20*PERIOD)ins.push({t:"good",m:"💪 "+d.aktifGun+" aktif gün — istikrarın çok iyi."});
  if((d.counts.gosterim||0)>=8*PERIOD)ins.push({t:"good",m:"🏠 Gösterim sayın yüksek."});
  if(d.kapanis>=2*PERIOD)ins.push({t:"good",m:"🤝 "+d.kapanis+" kapanış — harika iş!"});
  if(d.aktifGun<15*PERIOD)ins.push({t:"warn",m:"📅 Aktif gün sayın düşük ("+d.aktifGun+"). Her gün en az 1 aktivite gir."});
  if((d.counts.fzbo||0)<30*PERIOD)ins.push({t:"warn",m:"📞 FZBO arama düşük ("+(d.counts.fzbo||0)+"/"+(60*PERIOD)+"). Arama artır."});
  if((d.counts.gosterim||0)<4*PERIOD)ins.push({t:"bad",m:"🏠 Gösterim çok düşük ("+(d.counts.gosterim||0)+"/"+(8*PERIOD)+"). Müşteri portföyünü gözden geçir."});
  if((d.counts.sosyal_medya||0)<6*PERIOD)ins.push({t:"warn",m:"📱 Sosyal medya az ("+(d.counts.sosyal_medya||0)+"/"+(12*PERIOD)+"). Haftada 3+ paylaşım yap."});
  if(d.puan<avg)ins.push({t:"warn",m:"📊 Puanın takım ortalamasının ("+avg+") altında."});
  if(!ins.length)ins.push({t:"good",m:"Genel performans dengeli görünüyor."});
  var _rc=0;
  ins.forEach(function(i){
    var k=null;
    if(i.m.indexOf("Aktif")>=0&&i.t!=="good")k="ag";
    else if(i.m.indexOf("FZBO")>=0)k="fz";
    else if(i.m.indexOf("sterim")>=0&&i.t!=="good")k="go";
    else if(i.m.indexOf("osyal")>=0)k="sm";
    else if(i.m.indexOf("ortalama")>=0)k="pu";
    if(k){
      h+='<div class="insight '+i.t+'" onclick="toggleRM(this)" data-k="'+k+'">'+i.m+' ▼</div><div class="roadmap" id="rmx'+_rc+'">'+getRoadmap(k)+'</div>';
      _rc++;
    }else{
      h+='<div class="insight '+i.t+'">'+i.m+'</div>';
    }
  });
  h+="</div>";

  document.getElementById("report").innerHTML=h;
}

function applyKapanis(kData,months){
  if(!DATA||!kData||!kData.records)return;
  DATA.siralama.forEach(function(s){
    var cnt=0,ciroSum=0,ppm={};
    kData.records.forEach(function(r){
      if((r.advisor||"").trim()!==s.name)return;
      var dt=r.date||"";
      if(!months.some(function(m){return dt.startsWith(m);}))return;
      cnt++;ciroSum+=Number(r.totalHB)||Number(r.amount)||0;
      var ref=String(r.ref||""),cm=ref.match(/Co-op:\s*(.+)/);
      if(cm)ppm[cm[1].trim()+"_"+dt.substring(0,7)]=1;
    });
    kData.records.forEach(function(r){
      var adv=(r.advisor||"").trim(),ref=String(r.ref||"");
      if(adv===s.name||ref.indexOf("Co-op: "+s.name)<0)return;
      var dt=r.date||"";
      if(!months.some(function(m){return dt.startsWith(m);}))return;
      if(ppm[adv+"_"+dt.substring(0,7)])return;
      cnt++;ciroSum+=Number(r.totalHB)||Number(r.amount)||0;
    });
    if(cnt>0){s.kapanis=cnt;s.ciro=ciroSum;}
  });
  render();
}

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ajanda">
<meta name="theme-color" content="#FAFAFD">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23FF5A3C'/%3E%3Cpath d='M90 38a15 15 0 0 0-15 15v37a15 15 0 0 0 30 0V53a15 15 0 0 0-15-15z' fill='white'/%3E%3Cpath d='M125 78v12a35 35 0 0 1-70 0V78' stroke='white' stroke-width='11' fill='none' stroke-linecap='round'/%3E%3Cpath d='M90 125v20' stroke='white' stroke-width='11' stroke-linecap='round'/%3E%3C/svg%3E">
<title>Ajanda · RE/MAX Doğuş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Plus+Jakarta+Sans:wght@400..700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#FAFAFD;--ink:#16171D;--ink-2:#41434F;--mute:#83869A;--line:#E6E6EE;--card:#FFFFFF;
    --coral:#FF5A3C;  --coral-bg:#FFEEEA;  --coral-bd:#FFCFC4;
    --violet:#6C4CF1; --violet-bg:#EFEBFF; --violet-bd:#D3C8FF;
    --teal:#00A79B;   --teal-bg:#E1F7F5;   --teal-bd:#B4E9E4;
    --amber:#F5A104;  --amber-bg:#FFF3DC;  --amber-bd:#FBDFA6;
    --pink:#EE3D86;   --pink-bg:#FFEBF3;   --pink-bd:#FCC9DE;
    --indigo:#3355FF; --indigo-bg:#E8EDFF; --indigo-bd:#C3CFFF;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,sans-serif;
    font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
    padding-bottom:calc(124px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
  button,input,select,textarea{font:inherit;color:inherit}
  button{background:none;border:0;cursor:pointer}

  /* giriş */
  #gate{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:32px;gap:16px}
  #gate .logo{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 48,'wdth' 94,'wght' 800;
    font-size:40px;color:var(--coral);letter-spacing:-.03em;line-height:1}
  #gate p{color:var(--mute);font-size:14.5px;margin:0 0 6px;font-weight:500}
  #gate input{width:200px;text-align:center;letter-spacing:.4em;font-size:22px;font-weight:700;
    padding:15px;border:1.5px solid var(--line);background:var(--card);border-radius:16px;outline:none}
  #gate input:focus{border-color:var(--coral)}
  #gate button{background:var(--ink);color:#fff;padding:15px 40px;border-radius:16px;font-weight:700}

  header{padding:calc(24px + env(safe-area-inset-top)) 20px 16px;position:relative}
  .datewrap{display:flex;align-items:baseline;gap:11px}
  .daynum{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 72,'wdth' 96,'wght' 800;
    font-size:60px;line-height:.82;letter-spacing:-.035em;color:var(--coral)}
  .monthy{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 20,'wdth' 88,'wght' 600;
    font-size:18px;letter-spacing:-.01em}
  .subline{margin-top:10px;color:var(--mute);font-size:14px;font-weight:500}
  .subline b{color:var(--ink-2);font-weight:700}
  #info{position:absolute;top:calc(26px + env(safe-area-inset-top));right:16px;width:34px;height:34px;
    background:var(--card);border:1.5px solid var(--line);border-radius:12px;color:var(--mute);
    font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center}

  nav{display:flex;gap:6px;padding:2px 16px 12px;position:sticky;top:0;background:var(--bg);z-index:5}
  nav button{flex:1;padding:10px 4px;font-size:14px;font-weight:600;color:var(--mute);
    background:var(--card);border:1.5px solid var(--line);border-radius:13px}
  nav button[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  nav .badge{font-weight:700;opacity:.65;margin-left:3px}

  .searchrow{padding:0 16px 6px;display:none}
  .searchrow.on{display:block}
  .searchrow input{width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--card);
    border-radius:13px;outline:none;font-size:15px}
  .searchrow input:focus{border-color:var(--indigo)}

  main{padding:2px 16px 0}
  .daygroup{margin-bottom:8px}
  .daygroup h2{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 14,'wdth' 86,'wght' 700;
    font-size:13px;color:var(--mute);margin:16px 0 9px 4px}
  .item{display:grid;grid-template-columns:66px 1fr;gap:13px;align-items:start;width:100%;text-align:left;
    padding:14px 15px;border-radius:18px;margin-bottom:9px;background:var(--cbg);border:1.5px solid var(--cbd);
    transition:transform .12s ease}
  .item:active{transform:scale(.985)}
  .time{background:var(--c);color:#fff;border-radius:11px;padding:8px 4px;text-align:center;
    font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 14,'wdth' 92,'wght' 700;
    font-size:14.5px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .time.none{background:transparent;color:var(--c);border:1.5px dashed var(--cbd);font-size:12px;padding:9px 2px}
  .body h3{margin:0;font-size:16px;font-weight:700;line-height:1.32;letter-spacing:-.012em}
  .body p{margin:4px 0 0;font-size:13px;color:var(--ink-2);opacity:.72;font-weight:500}
  .item.done{background:var(--card);border-color:var(--line)}
  .item.done .time{background:var(--line);color:var(--mute)}
  .item.done .body h3{text-decoration:line-through;color:var(--mute);font-weight:600}
  .item.done .body p{color:var(--mute)}
  .item.late .time{box-shadow:0 0 0 3px var(--cbd)}
  .synced{display:inline-block;margin-left:6px;font-size:11px;color:var(--teal);font-weight:700}

  .empty{padding:44px 8px;color:var(--mute);font-size:15px;max-width:33ch;line-height:1.6;font-weight:500}
  .empty strong{display:block;color:var(--ink);font-size:19px;margin-bottom:9px;letter-spacing:-.02em;
    font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 24,'wdth' 92,'wght' 700}
  .empty em{font-style:normal;color:var(--violet);font-weight:600}

  .bar{position:fixed;left:0;right:0;bottom:0;z-index:20;
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(to top,var(--bg) 66%,rgba(250,250,253,0));display:flex;gap:10px}
  .heard{position:fixed;left:16px;right:16px;bottom:calc(88px + env(safe-area-inset-bottom));z-index:19;
    background:var(--ink);color:#fff;padding:12px 16px;border-radius:16px;font-size:15px;line-height:1.35;
    display:none;font-weight:500}
  .heard.on{display:block}
  .heard small{display:block;color:#9FA2B8;font-size:11.5px;font-weight:700;letter-spacing:.03em;margin-bottom:3px}

  #mic{flex:1;height:60px;border-radius:20px;color:#fff;
    background:linear-gradient(118deg,#FF5A3C 0%,#EE3D86 58%,#6C4CF1 100%);
    display:flex;align-items:center;justify-content:center;gap:11px;
    font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 18,'wdth' 96,'wght' 700;
    font-size:17px;letter-spacing:-.01em;transition:filter .15s}
  #mic:active{filter:brightness(.93)}
  #mic.listening{background:var(--coral)}
  #mic.busy{background:var(--violet)}
  #mic svg{width:19px;height:19px;flex:none}
  .wave{display:none;align-items:flex-end;gap:3px;height:20px}
  #mic.listening .wave{display:flex}
  #mic.listening .lbl,#mic.listening svg{display:none}
  .wave i{width:3.5px;background:#fff;border-radius:2px;animation:w .9s ease-in-out infinite}
  .wave i:nth-child(1){height:8px}.wave i:nth-child(2){height:18px;animation-delay:.12s}
  .wave i:nth-child(3){height:12px;animation-delay:.24s}.wave i:nth-child(4){height:20px;animation-delay:.36s}
  .wave i:nth-child(5){height:9px;animation-delay:.48s}
  @keyframes w{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
  #alt{width:60px;height:60px;border-radius:20px;border:1.5px solid var(--line);background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
  #alt svg{width:22px;height:22px}

  .scrim{position:fixed;inset:0;background:rgba(22,23,29,.45);z-index:30;display:none}
  .scrim.on{display:block}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:26px 26px 0 0;
    padding:8px 20px calc(20px + env(safe-area-inset-bottom));max-height:90vh;overflow-y:auto;display:none}
  .sheet.on{display:block}
  .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 18px}
  .sheet h2{font-family:"Bricolage Grotesque",sans-serif;font-variation-settings:'opsz' 30,'wdth' 94,'wght' 700;
    font-size:24px;margin:0 0 5px;letter-spacing:-.025em}
  .sheet .kicker{color:var(--mute);font-size:13.5px;margin:0 0 18px;line-height:1.5;font-weight:500}

  .field{margin-bottom:11px}
  .field label{display:block;font-size:12px;color:var(--mute);margin-bottom:5px;font-weight:600}
  .field input,.field select,.field textarea{width:100%;padding:12px 13px;border:1.5px solid var(--line);
    background:var(--card);border-radius:13px;outline:none;font-size:16px;font-family:inherit;font-weight:500}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--violet)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .draft{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:15px;margin-bottom:11px}

  .hintbox{background:var(--violet-bg);border:1.5px solid var(--violet-bd);border-radius:15px;padding:13px 15px;
    font-size:13.5px;color:#3B2C86;line-height:1.55;margin-bottom:14px;font-weight:500}
  .hintbox b{font-weight:700}

  .actions{display:flex;gap:9px;margin-top:18px}
  .btn{flex:1;padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:15.5px}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.ghost{background:var(--card);border:1.5px solid var(--line);color:var(--ink-2)}

  .opt{display:flex;align-items:center;gap:13px;width:100%;padding:14px 15px;font-size:15.5px;text-align:left;
    background:var(--card);border:1.5px solid var(--line);border-radius:15px;margin-bottom:8px;font-weight:600}
  .opt.danger{color:var(--coral);border-color:var(--coral-bd);background:var(--coral-bg)}
  .opt span.ic{width:22px;text-align:center;font-size:17px;flex:none}
  .diag{font-size:14px;line-height:1.9;color:var(--ink-2);padding-left:18px;margin:0 0 6px;font-weight:500}
  .diag code{background:var(--card);border:1.5px solid var(--line);padding:1px 7px;border-radius:7px;font-size:12.5px;font-weight:700}

  /* ---- takvim görünümleri ---- */
  .daynum.kisa{font-size:34px;letter-spacing:-.02em}
  nav.pager{justify-content:space-between}
  nav.pager button{flex:0 0 auto;padding:10px 16px;font-size:17px;line-height:1}
  nav.pager button.gecis{flex:1;font-size:14px}
  .gridwrap{display:grid;grid-template-columns:42px 1fr;margin-top:2px}
  .hours .hr{height:54px;font-size:10.5px;color:var(--mute);font-weight:600;text-align:right;
    padding-right:7px;transform:translateY(-6px)}
  .canvas{position:relative;border-left:1.5px solid var(--line)}
  .canvas .ln{position:absolute;left:0;right:0;border-top:1px solid var(--line)}
  .wkcol{position:absolute;top:0;bottom:0;border-left:1px solid var(--line)}
  .ev{position:absolute;background:var(--cbg);border:1.5px solid var(--cbd);border-left:4px solid var(--c);
    border-radius:9px;padding:5px 7px;overflow:hidden;text-align:left;z-index:2}
  .ev b{display:block;font-weight:700;font-size:12.5px;line-height:1.2;color:var(--ink);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ev i{font-style:normal;font-size:10.5px;color:var(--ink-2);opacity:.75;font-weight:600}
  .ev.dar{padding:4px 4px}
  .ev.dar b{font-size:10.5px}
  .ev.bitti{background:var(--card);border-color:var(--line);border-left-color:var(--line)}
  .ev.bitti b{text-decoration:line-through;color:var(--mute)}
  .simdi{position:absolute;left:0;right:0;height:2px;background:var(--coral);z-index:4}
  .simdi::before{content:'';position:absolute;left:-3px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--coral)}
  .allday{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px 42px}
  .allday button{background:var(--cbg);border:1.5px solid var(--cbd);border-left:4px solid var(--c);
    border-radius:10px;padding:7px 10px;font-size:12.5px;font-weight:700}
  .wkhead{display:grid;grid-template-columns:42px repeat(7,1fr);margin-bottom:4px;align-items:end}
  .wkhead div{text-align:center;font-size:10px;color:var(--mute);font-weight:700}
  .wkhead div span{display:block;font-size:15px;color:var(--ink);font-weight:700;margin-top:2px}
  .wkhead div.bg span{color:#fff;background:var(--coral);border-radius:50%;width:26px;height:26px;
    line-height:26px;margin:2px auto 0}
  .mo{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:4px}
  .mo .gh{text-align:center;font-size:10px;color:var(--mute);font-weight:700;padding-bottom:2px}
  .mo button{aspect-ratio:1/1.15;border:1.5px solid var(--line);border-radius:13px;background:var(--card);
    display:flex;flex-direction:column;align-items:center;padding:6px 2px 4px;gap:5px}
  .mo button.dis{opacity:.3}
  .mo button.bg{border-color:var(--coral);background:var(--coral-bg)}
  .mo button.sec{border-color:var(--ink);border-width:2px}
  .mo .no{font-size:13px;font-weight:700;line-height:1}
  .mo .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:32px}
  .mo .dots i{width:5px;height:5px;border-radius:50%}
  .opt.sec{border-color:var(--coral);background:var(--coral-bg)}
  .bosgun{padding:34px 8px;text-align:center;color:var(--mute);font-size:14px;font-weight:500}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(100px + env(safe-area-inset-bottom));
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:16px;font-size:14.5px;font-weight:600;z-index:40;
    opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
  .toast.on{opacity:1}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
  @media (min-width:720px){
    body{max-width:600px;margin:0 auto;min-height:100vh}
    .bar,.heard,.sheet{max-width:600px;left:50%;transform:translateX(-50%);right:auto;width:100%}
  }
</style>
</head>
<body>

<div id="gate">
  <div class="logo">Ajanda</div>
  <p>RE/MAX Doğuş</p>
  <input id="pin" type="tel" inputmode="numeric" maxlength="6" placeholder="••••" autocomplete="off">
  <button onclick="tryPin()">Giriş</button>
</div>

<header>
  <div class="datewrap"><div class="daynum" id="hDay">—</div><div class="monthy" id="hMonth"></div></div>
  <div class="subline" id="hSub"></div>
  <button id="info" aria-label="Görünüm">T</button>
</header>

<nav id="nav"></nav>

<div class="searchrow" id="searchRow"><input id="q" placeholder="Kayıtlarda ara" autocomplete="off"></div>
<main id="list"></main>

<div class="heard" id="heard"><small id="heardLbl">Dinliyorum</small><span id="heardTxt"></span></div>

<div class="bar">
  <button id="mic" aria-label="Sesle kayıt ekle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/></svg>
    <span class="lbl">Konuş</span>
    <span class="wave"><i></i><i></i><i></i><i></i><i></i></span>
  </button>
  <button id="alt" aria-label="Yazarak ekle">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M8 14h8"/></svg>
  </button>
</div>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"><div class="grab"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ═══════════════ AYAR ═══════════════
   Apps Script yayınlandığında URL'yi buraya yapıştır.
   Boş kalırsa uygulama yerleşik Türkçe çözümleyiciyi kullanır ve
   takvim kaydı manuel butonla yapılır. */
const API_URL = "";
const PIN = "1520";
/* ════════════════════════════════════ */

/* ---------- giriş ---------- */
function tryPin(){
  const v=document.getElementById('pin').value.trim();
  if(v===PIN){localStorage.setItem('ajanda_auth','1');document.getElementById('gate').style.display='none';boot();}
  else{document.getElementById('pin').value='';toast('Yanlış PIN');}
}
document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')tryPin()});
(function(){
  const p=new URLSearchParams(location.search).get('k');
  if(p===PIN)localStorage.setItem('ajanda_auth','1');
  if(localStorage.getItem('ajanda_auth')==='1')document.getElementById('gate').style.display='none';
})();

/* ---------- ortam ---------- */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const inFrame=(()=>{try{return window.self!==window.top}catch(e){return true}})();
const secure=window.isSecureContext!==false;
const UA=navigator.userAgent;
const isIOS=/iPad|iPhone|iPod/.test(UA)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isMac=/Macintosh/.test(UA)&&!isIOS;
let sesModu=(SR&&secure&&!inFrame)?'canli':'dikte';
function dikteIpucu(){
  if(isIOS)return `Klavye açılınca boşluk tuşunun yanındaki <b>🎤</b> simgesine bas ve konuş, sonra <b>Devam</b>.`;
  if(isMac)return `<b>fn</b> tuşuna iki kez bas, konuş, bitince <b>Return</b>.`;
  return `Dikte kısayolunu kullan — Windows'ta <b>Win + H</b>.`;
}

/* ---------- veri ---------- */
const KEY='ajanda_kayitlar_v1';
let entries=[],tab='bugun';
function load(){try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){entries=[]}}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(entries))}catch(e){}}

/* ---------- tarih ---------- */
const AYLAR=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
const GUNLER=['Pazar','Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi'];
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const bugun=()=>iso(new Date());
function gunEkle(n){const d=new Date();d.setDate(d.getDate()+n);return iso(d);}
const yarin=()=>gunEkle(1);
function parseISO(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function uzunTarih(s){
  const d=parseISO(s);
  if(s===bugun())return 'Bugün';
  if(s===yarin())return 'Yarın';
  return `${d.getDate()} ${AYLAR[d.getMonth()]} ${GUNLER[d.getDay()]}`;
}
const TURLER={
  'gösterim':{c:'var(--coral)',bg:'var(--coral-bg)',bd:'var(--coral-bd)',ad:'Gösterim'},
  'görüşme':{c:'var(--violet)',bg:'var(--violet-bg)',bd:'var(--violet-bd)',ad:'Görüşme'},
  'toplantı':{c:'var(--teal)',bg:'var(--teal-bg)',bd:'var(--teal-bd)',ad:'Toplantı'},
  'arama':{c:'var(--amber)',bg:'var(--amber-bg)',bd:'var(--amber-bd)',ad:'Arama'},
  'hatırlatma':{c:'var(--pink)',bg:'var(--pink-bg)',bd:'var(--pink-bd)',ad:'Hatırlatma'},
  'diğer':{c:'var(--indigo)',bg:'var(--indigo-bg)',bd:'var(--indigo-bd)',ad:'Kayıt'}
};
const turOf=t=>TURLER[t]||TURLER['diğer'];

/* ═══════════════ YERLEŞİK TÜRKÇE ÇÖZÜMLEYİCİ ═══════════════ */
const trKucuk=s=>s.replace(/I/g,'ı').replace(/İ/g,'i').toLowerCase();
const buyukIlk=s=>s?s.charAt(0).toLocaleUpperCase('tr')+s.slice(1):s;
const buyukMu=w=>/^[A-ZÇĞİÖŞÜ]/.test(w);
const kirp=w=>w.replace(/[.,!?;:()]/g,'').split(/['’]/)[0];
/* JS'te \b Türkçe harfleri tanımıyor — kendi kelime sınırımız */
function trRe(govde,ek){return new RegExp('(^|[^a-z0-9çğıöşü])'+govde+(ek||'')+'(?![a-zçğıöşü])','i');}

const SAYI_SIRA=[['on bir',11],['onbir',11],['on iki',12],['oniki',12],['on',10],['dokuz',9],
  ['sekiz',8],['yedi',7],['altı',6],['alti',6],['beş',5],['bes',5],['dört',4],['dort',4],
  ['üç',3],['uc',3],['iki',2],['bir',1],['yarım',12]];
const GUNADI={'pazartesi':1,'salı':2,'sali':2,'çarşamba':3,'carsamba':3,'perşembe':4,'persembe':4,
  'cuma':5,'cumartesi':6,'pazar':0};

const SEMTLER=['Fikirtepe','Kadıköy','Acıbadem','Koşuyolu','Göztepe','Bostancı','Ataşehir','Üsküdar',
 'Maltepe','Kartal','Merdivenköy','Hasanpaşa','Rasimpaşa','Osmanağa','Caferağa','Suadiye','Erenköy',
 'Kozyatağı','Küçükyalı','İçerenköy','Ümraniye','Çekmeköy','Sancaktepe','Pendik','Tuzla','Beykoz',
 'Moda','Fenerbahçe','Bağdat','Sahrayıcedit','Yenisahra','Barbaros','Kayışdağı','Dudullu','Şile',
 'Girne','Lefkoşa','Gazimağusa','İskele','Bafra','Kıbrıs','Beşiktaş','Şişli','Levent','Maslak','Bahçeşehir'];
const MEKANLAR={'ofiste':'Ofis','ofisde':'Ofis','ofis':'Ofis','tapuda':'Tapu','tapu':'Tapu',
 'belediyede':'Belediye','belediye':'Belediye','noterde':'Noter','noter':'Noter','bankada':'Banka',
 'şantiyede':'Şantiye','şantiye':'Şantiye','kafede':'Kafe','evde':'Ev','sitede':'Site'};

const ADSTOP=new Set([...SEMTLER,...AYLAR,...GUNLER,'Bey','Bay','Hanım','Hanim','Saat','Yarın','Yarin',
 'Bugün','Bugun','Öbür','Obur','Sabah','Akşam','Aksam','Öğlen','Oglen','Öğleden','Haftaya','Gelecek',
 'Gösterim','Gösterime','Toplantı','Görüşme','Randevu','Kapanış','Ekspertiz','Sözleşme','Ofis','Ofiste',
 'Tapu','Tapuda','Noter','Banka','Belediye','Şantiye','Emlak','Daire','Villa','Arsa','Dükkan','Depo',
 'Kira','Kiralık','Satılık','Satış','Müşteri','Müşterim','Sayın','Ben','Bir','Ve','Ile','İle','Var']);

/* --- kişi --- */
function kisiBul(metin,sil){
  var m=metin.match(/\b([A-ZÇĞİÖŞÜ][a-zçğıöşü]{1,})\s+([A-ZÇĞİÖŞÜ][a-zçğıöşü]{1,}\s+)?(Bey|Bay|Hanım|Hanim|bey|bay|hanım|hanim)\b/);
  if(m&&!ADSTOP.has(m[1])){
    var ad=m[1]+(m[2]?' '+m[2].trim():'');
    var unvan=/han/i.test(m[3])?'Hanım':'Bey';
    sil.push(new RegExp(m[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'[’\']?\\w{0,4}','g'));
    return ad+' '+unvan;
  }
  var m1=metin.match(/\b([a-zçğıöşü]{3,})\s+(bey|hanım|hanim)\b/i);
  if(m1&&!ADSTOP.has(buyukIlk(m1[1]))){
    sil.push(new RegExp(m1[0]+'[’\']?\\w{0,4}','gi'));
    return buyukIlk(m1[1])+' '+(/han/i.test(m1[2])?'Hanım':'Bey');
  }
  var kel=metin.replace(/[.,!?;:]/g,' ').split(/\s+/).filter(Boolean);
  for(var i=0;i<kel.length-1;i++){
    var a=kirp(kel[i]),b=kirp(kel[i+1]);
    if(a.length>1&&b.length>1&&buyukMu(a)&&buyukMu(b)&&!ADSTOP.has(a)&&!ADSTOP.has(b)){
      sil.push(new RegExp(a+'[’\'\\w]*\\s+'+b+'[’\'\\w]*','g'));
      return a+' '+b;
    }
  }
  var m3=metin.match(/(?:müşterim?|sayın|bayan)\s+([A-ZÇĞİÖŞÜ][a-zçğıöşü]{2,})/);
  if(m3&&!ADSTOP.has(buyukIlk(kirp(m3[1])))){sil.push(new RegExp(m3[0],'gi'));return buyukIlk(kirp(m3[1]));}
  var m4=metin.match(/\b([A-ZÇĞİÖŞÜ][a-zçğıöşü]{2,})[’'](?:la|le|yla|yle|a|e|ı|i|nin|nın)\b/);
  if(m4&&!ADSTOP.has(m4[1])){sil.push(new RegExp(m4[0].replace(/[’']/g,'[’\']'),'g'));return m4[1];}
  return null;
}

/* --- yer --- */
function yerBul(metin,kisi,sil){
  var t=trKucuk(metin);
  for(var i=0;i<SEMTLER.length;i++){
    var s=SEMTLER[i];
    if(t.indexOf(trKucuk(s))>-1){
      sil.push(new RegExp(s+'[’\']?(deki|daki|de|da|te|ta|nde|nda)?','gi'));
      return s;
    }
  }
  var m2=metin.match(/\b([A-ZÇĞİÖŞÜ][a-zçğıöşü]+)\s+(sitesi|sitesinde|projesi|projesinde|rezidans|avm|plaza|kule)/i);
  if(m2){sil.push(new RegExp(m2[0],'gi'));return m2[1]+' '+buyukIlk(trKucuk(m2[2]).replace(/nde$/,''));}
  var m=metin.match(/\b([A-ZÇĞİÖŞÜ][a-zçğıöşü]+)[’'](?:de|da|te|ta|nde|nda)\b/);
  if(m&&(!kisi||kisi.indexOf(m[1])<0)&&!ADSTOP.has(m[1])){
    sil.push(new RegExp(m[0].replace(/[’']/g,'[’\']'),'g'));return m[1];
  }
  for(var k in MEKANLAR){
    if(trRe(k,'').test(t)){sil.push(new RegExp(k,'gi'));return MEKANLAR[k];}
  }
  return null;
}

/* --- emlak niteliği --- */
function nitelikBul(metin,sil){
  var s='';
  var oda=metin.match(/(\d)\s*\+\s*(\d)/);
  if(oda){s=oda[1]+'+'+oda[2];sil.push(new RegExp(oda[0].replace(/\+/g,'\\+'),'g'));}
  var tip=metin.match(/\b(daire|dükkan|dukkan|villa|arsa|ofis|depo|bina|rezidans|stüdyo|studyo|dubleks|müstakil|tarla|mağaza|magaza|yazlık|yalı)\w*/i);
  if(tip){s+=(s?' ':'')+trKucuk(tip[1]);sil.push(new RegExp(tip[0],'gi'));}
  return s||null;
}

const TUR_ISIM={'gösterim':'Gösterim','görüşme':'Görüşme','toplantı':'Toplantı','arama':'Arama','hatırlatma':'Hatırlatma','diğer':'Kayıt'};
const TUR_EK={'gösterim':'gösterimi','görüşme':'görüşmesi','toplantı':'toplantısı','arama':'araması','hatırlatma':'hatırlatması','diğer':'kaydı'};

function yerelCozumle(metin){
  var t=trKucuk(metin), tarih=null, saat=null, tur='diğer';
  var sil=[];

  if(/(ne var|neler var|program(ım|im)|neyim var|ajandam|listele)/.test(t)){
    var kapsam='bugun';
    if(/yarın|yarin/.test(t))kapsam='yarin';
    else if(/hafta/.test(t))kapsam='hafta';
    else if(/tüm|hepsi/.test(t))kapsam='tumu';
    return {intent:'sorgu',sorgu:{kapsam:kapsam,anahtar:null},kayitlar:[]};
  }

  /* tarih */
  if(/bugün|bugun/.test(t)){tarih=bugun();sil.push(/bugün|bugun/gi);}
  else if(/yarın|yarin/.test(t)){tarih=yarin();sil.push(/yarın|yarin/gi);}
  else if(/öbür gün|obur gun|ertesi gün/.test(t)){tarih=gunEkle(2);sil.push(/öbür gün|obur gun|ertesi gün/gi);}
  if(!tarih){
    var ma=t.match(/ay(ın|in)\s+(\d{1,2})/);
    if(ma){var g=+ma[2],da=new Date();da.setDate(g);
      if(iso(da)<bugun())da.setMonth(da.getMonth()+1);
      tarih=iso(da);sil.push(/ay(ın|in)\s+\d{1,2}[’']?\w{0,3}/gi);}
  }
  if(!tarih){
    var mb=t.match(/(\d{1,2})\s+(ocak|şubat|subat|mart|nisan|mayıs|mayis|haziran|temmuz|ağustos|agustos|eylül|eylul|ekim|kasım|kasim|aralık|aralik)/);
    if(mb){
      var kok=['oca','şub','mar','nis','may','haz','tem','ağu','eyl','eki','kas','ara'];
      var kok2=['oca','sub','mar','nis','may','haz','tem','agu','eyl','eki','kas','ara'];
      var ix=kok.indexOf(mb[2].slice(0,3)); if(ix<0)ix=kok2.indexOf(mb[2].slice(0,3));
      if(ix>=0){var dc=new Date();dc.setMonth(ix,+mb[1]);
        if(iso(dc)<bugun())dc.setFullYear(dc.getFullYear()+1);
        tarih=iso(dc);sil.push(new RegExp(mb[0],'gi'));}
    }
  }
  if(!tarih){
    for(var ad in GUNADI){
      if(trRe(ad,'\\w*').test(t)){
        var bn=new Date().getDay(), fark=(GUNADI[ad]-bn+7)%7; if(fark===0)fark=7;
        if(/haftaya|gelecek hafta|önümüzdeki hafta/.test(t)&&fark<3)fark+=7;
        tarih=gunEkle(fark);
        sil.push(new RegExp('(haftaya |gelecek hafta |önümüzdeki hafta )?'+ad+'\\w*','gi'));
        break;
      }
    }
  }
  if(!tarih){
    var md=t.match(/\b(\d{1,2})[./](\d{1,2})\b/);
    if(md){var dd=new Date();dd.setMonth(+md[2]-1,+md[1]);
      if(iso(dd)<bugun())dd.setFullYear(dd.getFullYear()+1);
      tarih=iso(dd);sil.push(new RegExp(md[0].replace('.','\\.'),'g'));}
  }

  /* saat */
  var sn=null,dk=0;
  var ms=t.match(/\b(\d{1,2})[:.](\d{2})\b/);
  if(ms){sn=+ms[1];dk=+ms[2];sil.push(new RegExp(ms[0].replace('.','\\.'),'g'));}
  if(sn===null){
    var ms2=t.match(/saat\s+(\d{1,2})/)||t.match(/\b(\d{1,2})[’']?(de|da|te|ta)\b/);
    if(ms2){sn=+ms2[1];sil.push(new RegExp(ms2[0],'gi'));}
  }
  if(sn===null){
    for(var q=0;q<SAYI_SIRA.length;q++){
      var kw=SAYI_SIRA[q][0];
      var eki=trRe(kw,"[’']?(de|da|te|ta)").test(t);
      var onek=new RegExp('saat\\s+'+kw+'(?![a-zçğıöşü])','i').test(t);
      var buc=new RegExp(kw+'\\s+bu[çc]uk','i').test(t);
      if(eki||onek||buc){
        sn=SAYI_SIRA[q][1];
        sil.push(new RegExp(kw+"[’']?(de|da|te|ta)?","gi"));break;
      }
    }
  }
  if(sn!==null&&/buçuk|bucuk/.test(t)){dk=30;sil.push(/buçuk\w*|bucuk\w*/gi);}
  var sabah=/sabah/.test(t), oglen=/öğlen|oglen|öğle\b/.test(t),
      ikindi=/öğleden sonra|ogleden sonra|akşamüstü|aksamustu|ikindi/.test(t),
      aksam=/akşam|aksam|gece/.test(t);
  if(sn===null){
    if(sabah)sn=9; else if(oglen)sn=12; else if(ikindi)sn=14; else if(aksam)sn=18;
  }else{
    if((ikindi||aksam)&&sn<12)sn+=12;
    else if(!sabah&&!oglen&&sn>=1&&sn<=8)sn+=12;
  }
  sil.push(/sabah|öğleden sonra|ogleden sonra|akşamüstü|akşam|aksam|öğlen|oglen|gece|saat|ikindi/gi);
  if(sn!==null)saat=String(sn%24).padStart(2,'0')+':'+String(dk).padStart(2,'0');

  /* tür */
  if(/göster|gosterim|gezdir|bak(acağ|acak|arız|alım)/.test(t))tur='gösterim';
  else if(/topl(a|ı)nt|kapanış|kapanis|tapu|sözleşme|sozlesme|imza|ekspertiz/.test(t))tur='toplantı';
  else if(/\bara(yaca|caği|cağı|yacağ)|arama|telefon|geri dön/.test(t))tur='arama';
  else if(/hatırlat|hatirlat|unutma/.test(t))tur='hatırlatma';
  else if(/görüş|gorus|buluş|bulus|müşteri|musteri|randevu|sunum/.test(t))tur='görüşme';

  /* kişi → yer → nitelik  (sırayla çıkar) */
  var kisi=kisiBul(metin,sil);
  var yer=yerBul(metin,kisi,sil);
  var nitelik=nitelikBul(metin,sil);

  /* başlık */
  var kalan=metin;
  for(var q=0;q<sil.length;q++){
    try{kalan=kalan.replace(new RegExp(sil[q].source,'gi'),' ');}catch(e){}
  }
  kalan=kalan.replace(/\b(var|vardı|için|ile|ila|bir|ve|ben|benim|bana|olacak|olsun|yaz|ekle|kaydet|kayıt|kaydını|not|randevu|müşteri|müşterim|göstereceğim|gösterim|görüşeceğim|görüşme|buluşacağım|toplantı|arayacağım|arama|hatırlat|gideceğim|gelecek|beyin|beye|beyle)\b/gi,' ')
       .replace(/[’',.;:!?]/g,' ').replace(/\s+/g,' ').trim();

  var ozel=null;
  if(/ekspertiz/.test(t))ozel={tek:'Ekspertiz',ek:'ekspertizi'};
  else if(/kapanış|kapanis/.test(t))ozel={tek:'Kapanış',ek:'kapanışı'};
  else if(/sözleşme|sozlesme|imza/.test(t))ozel={tek:'Sözleşme',ek:'sözleşmesi'};
  else if(/kira kontrat|kontrat/.test(t))ozel={tek:'Kira kontratı',ek:'kira kontratı'};

  var baslik;
  if((tur==='diğer'||tur==='hatırlatma')&&kalan.length>2){
    baslik=buyukIlk(((nitelik?nitelik+' ':'')+kalan).split(' ').slice(0,5).join(' '));
  }else if(nitelik){
    baslik=buyukIlk(nitelik)+' '+(ozel?ozel.ek:TUR_EK[tur]);
  }else{
    baslik=ozel?ozel.tek:TUR_ISIM[tur];
  }
  if(!baslik||baslik.length<2)baslik=TUR_ISIM[tur];

  return {intent:'ekle',
    kayitlar:[{baslik:baslik,tarih:tarih||bugun(),saat:saat,kisi:kisi,yer:yer,tur:tur,not:metin}],
    cevap:'Şöyle anladım — gerekirse düzelt.'};
}

/* ═══════════════ SUNUCU ÇÖZÜMLEME (varsa) ═══════════════ */
async function sunucuCozumle(metin){
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'parse',metin,bugun:bugun(),gun:GUNLER[new Date().getDay()],
      saat:new Date().toTimeString().slice(0,5)})});
  const j=await r.json();
  if(!j.ok)throw new Error(j.hata||'sunucu');
  return j.sonuc;
}
async function takvimeYaz(e){
  if(!API_URL)return null;
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify({action:'takvim',kayit:e})});
  const j=await r.json();
  return j.ok?(j.eventId||true):null;
}

/* ---------- render ---------- */
function sortEntries(a,b){
  if(a.tarih!==b.tarih)return a.tarih<b.tarih?-1:1;
  const at=a.saat||'99:99',bt=b.saat||'99:99';
  return at<bt?-1:at>bt?1:0;
}
function filtered(){
  const t=bugun();let out;
  if(tab==='bugun')out=entries.filter(e=>e.tarih===t&&!e.done);
  else if(tab==='yaklasan')out=entries.filter(e=>e.tarih>t&&!e.done);
  else out=entries.filter(e=>e.tarih<t||e.done);
  const q=(document.getElementById('q').value||'').trim().toLowerCase();
  if(tab==='gecmis'&&q)out=out.filter(e=>[e.baslik,e.kisi,e.yer,e.not].join(' ').toLowerCase().includes(q));
  return out.sort(tab==='gecmis'?(a,b)=>sortEntries(b,a):sortEntries);
}
/* ---------- görünüm durumu ---------- */
let gorunum=localStorage.getItem('ajanda_gorunum')||'gun';
let odak=bugun();
const dkOf=s=>(+s.slice(0,2))*60+(+s.slice(3,5));
const SAAT_PX=54;
const KISAGUN=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];

function haftaBasi(s){var d=parseISO(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return d;}
function tarihEkle(d,n){var x=new Date(d);x.setDate(x.getDate()+n);return x;}
function haftaEtiket(s){
  var a=haftaBasi(s),b=tarihEkle(a,6);
  return a.getDate()+' '+AYLAR[a.getMonth()].slice(0,3)+' – '+b.getDate()+' '+AYLAR[b.getMonth()].slice(0,3);
}
function odakKaydir(n){
  var d=parseISO(odak);
  if(gorunum==='ay'){d.setDate(1);d.setMonth(d.getMonth()+n);}
  else if(gorunum==='hafta')d.setDate(d.getDate()+7*n);
  else d.setDate(d.getDate()+n);
  odak=iso(d);render();
}
function gunKayit(t){return entries.filter(function(e){return e.tarih===t}).sort(sortEntries);}

/* ---------- başlık ---------- */
function renderHeader(){
  var d=parseISO(odak), hD=document.getElementById('hDay'), hM=document.getElementById('hMonth');
  var n,alt;
  if(gorunum==='ay'){
    hD.textContent=AYLAR[d.getMonth()];hD.classList.add('kisa');
    hM.textContent=d.getFullYear();
    var ay=odak.slice(0,7);
    n=entries.filter(function(e){return e.tarih.slice(0,7)===ay&&!e.done}).length;
    alt=n?'<b>'+n+' kayıt</b>':'bu ay kayıt yok';
  }else if(gorunum==='hafta'){
    hD.textContent=d.getDate();hD.classList.remove('kisa');
    hM.textContent=haftaEtiket(odak);
    var b=iso(haftaBasi(odak)), s=iso(tarihEkle(haftaBasi(odak),6));
    n=entries.filter(function(e){return e.tarih>=b&&e.tarih<=s&&!e.done}).length;
    alt=GUNLER[d.getDay()]+' · '+(n?'<b>'+n+' kayıt</b>':'bu hafta kayıt yok');
  }else if(gorunum==='liste'){
    var t0=new Date();
    hD.textContent=t0.getDate();hD.classList.remove('kisa');
    hM.textContent=AYLAR[t0.getMonth()]+' '+t0.getFullYear();
    n=entries.filter(function(e){return e.tarih===bugun()&&!e.done}).length;
    var nx=entries.filter(function(e){return e.tarih===bugun()&&!e.done&&e.saat}).sort(sortEntries)[0];
    alt=GUNLER[t0.getDay()]+' · '+(n?'<b>'+n+' kayıt</b>':'bugün kayıt yok')+(nx?' · sıradaki '+nx.saat:'');
  }else{
    hD.textContent=d.getDate();hD.classList.remove('kisa');
    hM.textContent=AYLAR[d.getMonth()]+' '+d.getFullYear();
    var g=gunKayit(odak).filter(function(e){return !e.done});
    var nx2=g.filter(function(e){return e.saat})[0];
    alt=GUNLER[d.getDay()]+' · '+(g.length?'<b>'+g.length+' kayıt</b>':'kayıt yok')+
        (nx2&&odak===bugun()?' · sıradaki '+nx2.saat:'');
  }
  document.getElementById('hSub').innerHTML=alt;
}
function renderCounts(){
  var t=bugun(),set=function(id,v){var el=document.getElementById(id);if(el)el.textContent=v?' '+v:''};
  set('cBugun',entries.filter(function(e){return e.tarih===t&&!e.done}).length);
  set('cYaklasan',entries.filter(function(e){return e.tarih>t&&!e.done}).length);
}

/* ---------- gezinme çubuğu ---------- */
function renderNav(){

  if(gorunum==='liste'){
    n.className='';
    n.innerHTML=
      '<button data-tab="bugun" aria-selected="'+(tab==='bugun')+'">Bugün<span class="badge" id="cBugun"></span></button>'+
      '<button data-tab="yaklasan" aria-selected="'+(tab==='yaklasan')+'">Yaklaşan<span class="badge" id="cYaklasan"></span></button>'+
      '<button data-tab="gecmis" aria-selected="'+(tab==='gecmis')+'">Geçmiş<span class="badge" id="cGecmis"></span></button>';
  }else{
    var etiket=gorunum==='ay'?'Bu ay':(gorunum==='hafta'?'Bu hafta':'Bugün');
    n.className='pager';
    n.innerHTML='<button data-nav="geri" aria-label="önceki">‹</button>'+
      '<button class="gecis" data-nav="bugun">'+etiket+'</button>'+
      '<button data-nav="ileri" aria-label="sonraki">›</button>';
  }
}
document.getElementById('nav').addEventListener('click',function(ev){
  var b=ev.target.closest('button');if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;render();}
  else if(b.dataset.nav==='geri')odakKaydir(-1);
  else if(b.dataset.nav==='ileri')odakKaydir(1);
  else if(b.dataset.nav==='bugun'){odak=bugun();render();}
});

/* ---------- çakışma yerleşimi ---------- */
function yerlesim(list){
  var R=[],grup=[],son=-1;
  function bosalt(){for(var i=0;i<grup.length;i++)R.push({e:grup[i],kol:i,adet:grup.length});}
  for(var i=0;i<list.length;i++){
    var e=list[i],bas=dkOf(e.saat),bit=bas+(e.sure||60);
    if(grup.length&&bas>=son){bosalt();grup=[];son=-1;}
    grup.push(e);son=Math.max(son,bit);
  }
  if(grup.length)bosalt();
  return R;
}
function evHtml(e,stil,dar){
  var k=turOf(e.tur);
  return '<button class="ev'+(dar?' dar':'')+(e.done?' bitti':'')+'" data-id="'+e.id+'" '+
    'style="--c:'+k.c+';--cbg:'+k.bg+';--cbd:'+k.bd+';'+stil+'">'+
    '<b>'+esc(e.baslik)+'</b>'+(dar?'':'<i>'+e.saat+(e.yer?' · '+esc(e.yer):'')+'</i>')+'</button>';
}
function simdiCizgi(bas){
  var n=new Date(),dk=n.getHours()*60+n.getMinutes();
  if(dk<bas*60)return '';
  return '<div class="simdi" style="top:'+((dk-bas*60)/60*SAAT_PX)+'px"></div>';
}

/* ---------- GÜN ---------- */
function renderGun(){
  var g=gunKayit(odak), saatli=g.filter(function(e){return e.saat}), saatsiz=g.filter(function(e){return !e.saat});
  var bas=8,son=20;
  saatli.forEach(function(e){var h=+e.saat.slice(0,2);if(h<bas)bas=h;if(h+1>son)son=h+1;});
  if(odak===bugun()){var hn=new Date().getHours();if(hn<bas)bas=hn;if(hn+1>son)son=hn+1;}
  var h='';
  if(saatsiz.length){
    h+='<div class="allday">'+saatsiz.map(function(e){var k=turOf(e.tur);
      return '<button class="ev-day" data-id="'+e.id+'" style="--c:'+k.c+';--cbg:'+k.bg+';--cbd:'+k.bd+'">'+esc(e.baslik)+'</button>';
    }).join('')+'</div>';
  }
  var yuk=(son-bas)*SAAT_PX;
  var saatler='',cizgi='';
  for(var s=bas;s<=son;s++){
    saatler+='<div class="hr">'+String(s).padStart(2,'0')+':00</div>';
    cizgi+='<div class="ln" style="top:'+((s-bas)*SAAT_PX)+'px"></div>';
  }
  var bloklar=yerlesim(saatli).map(function(o){
    var e=o.e,top=(dkOf(e.saat)-bas*60)/60*SAAT_PX;
    var yk=Math.max(34,(e.sure||60)/60*SAAT_PX-3);
    var w=100/o.adet;
    return evHtml(e,'top:'+top+'px;height:'+yk+'px;left:calc('+(o.kol*w)+'% + 4px);width:calc('+w+'% - 8px)',false);
  }).join('');
  h+='<div class="gridwrap"><div class="hours" style="height:'+yuk+'px">'+saatler+'</div>'+
     '<div class="canvas" style="height:'+yuk+'px">'+cizgi+bloklar+
     (odak===bugun()?simdiCizgi(bas):'')+'</div></div>';
  if(!g.length)h+='<div class="bosgun">Bu gün için kayıt yok.<br>Alttaki butona bas ve söyle.</div>';
  return h;
}

/* ---------- HAFTA ---------- */
function renderHafta(){
  var b=haftaBasi(odak),gunler=[],bas=8,son=20,hepsi=[];
  for(var i=0;i<7;i++){var d=tarihEkle(b,i);gunler.push(iso(d));}
  gunler.forEach(function(t){gunKayit(t).forEach(function(e){hepsi.push(e);
    if(e.saat){var hh=+e.saat.slice(0,2);if(hh<bas)bas=hh;if(hh+1>son)son=hh+1;}});});
  var head='<div class="wkhead"><div></div>'+gunler.map(function(t,i){
    return '<div class="'+(t===bugun()?'bg':'')+'">'+KISAGUN[i]+'<span>'+parseISO(t).getDate()+'</span></div>';
  }).join('')+'</div>';
  var yuk=(son-bas)*SAAT_PX,saatler='',cizgi='';
  for(var s=bas;s<=son;s++){
    saatler+='<div class="hr">'+String(s).padStart(2,'0')+'</div>';
    cizgi+='<div class="ln" style="top:'+((s-bas)*SAAT_PX)+'px"></div>';
  }
  for(var c=1;c<7;c++)cizgi+='<div class="wkcol" style="left:'+(c*100/7)+'%"></div>';
  var bloklar='';
  gunler.forEach(function(t,gi){
    var saatli=gunKayit(t).filter(function(e){return e.saat});
    var saatsiz=gunKayit(t).filter(function(e){return !e.saat});
    yerlesim(saatli).forEach(function(o){
      var e=o.e,top=(dkOf(e.saat)-bas*60)/60*SAAT_PX;
      var yk=Math.max(28,(e.sure||60)/60*SAAT_PX-3);
      var kw=(100/7)/o.adet;
      bloklar+=evHtml(e,'top:'+top+'px;height:'+yk+'px;left:calc('+(gi*100/7+o.kol*kw)+'% + 2px);width:calc('+kw+'% - 4px)',true);
    });
    saatsiz.forEach(function(e,si){
      bloklar+=evHtml(e,'top:'+(si*20)+'px;height:18px;left:calc('+(gi*100/7)+'% + 2px);width:calc('+(100/7)+'% - 4px);opacity:.85',true);
    });
  });
  return head+'<div class="gridwrap"><div class="hours" style="height:'+yuk+'px">'+saatler+'</div>'+
    '<div class="canvas" style="height:'+yuk+'px">'+cizgi+bloklar+
    (gunler.indexOf(bugun())>-1?simdiCizgi(bas):'')+'</div></div>'+
    (hepsi.length?'':'<div class="bosgun">Bu hafta için kayıt yok.</div>');
}

/* ---------- AY ---------- */
function renderAy(){
  var d=parseISO(odak),ay=d.getMonth();
  var ilk=new Date(d.getFullYear(),ay,1);
  var bas=tarihEkle(ilk,-((ilk.getDay()+6)%7));
  var kayma=(ilk.getDay()+6)%7;
  var gunSayisi=new Date(d.getFullYear(),ay+1,0).getDate();
  var hucre=Math.ceil((kayma+gunSayisi)/7)*7;
  var h='<div class="mo">'+KISAGUN.map(function(g){return '<div class="gh">'+g+'</div>'}).join('');
  for(var i=0;i<hucre;i++){
    var c=tarihEkle(bas,i),t=iso(c);
    var kay=gunKayit(t).filter(function(e){return !e.done});
    var sinif=(c.getMonth()!==ay?'dis ':'')+(t===bugun()?'bg ':'')+(t===odak?'sec':'');
    var dots=kay.slice(0,4).map(function(e){return '<i style="background:'+turOf(e.tur).c+'"></i>'}).join('');
    h+='<button class="'+sinif.trim()+'" data-gun="'+t+'">'+
       '<span class="no">'+c.getDate()+'</span><span class="dots">'+dots+'</span></button>';
  }
  return h+'</div>';
}

/* ---------- LİSTE (eski görünüm) ---------- */
function renderListe(){
  var items=filtered();
  if(!items.length){
    var msg={
      bugun:'<strong>Bugün için kayıt yok.</strong>Alttaki butona bas ve söyle: <em>“Yarın saat üçte Fikirtepe\'de gösterim var, Ahmet Bey.”</em>',
      yaklasan:'<strong>İleri tarihli kayıt yok.</strong>Randevu ekledikçe burada sıraya girer.',
      gecmis:'<strong>Geçmiş boş.</strong>Tamamladığın ve tarihi geçen kayıtlar burada birikir.'
    }[tab];
    return '<div class="empty">'+msg+'</div>';
  }
  var html='',lastDate='',t=bugun(),now=new Date().toTimeString().slice(0,5);
  for(var q=0;q<items.length;q++){
    var e=items[q];
    if(e.tarih!==lastDate&&tab!=='bugun'){
      if(lastDate)html+='</div>';
      html+='<div class="daygroup"><h2>'+uzunTarih(e.tarih)+'</h2>';lastDate=e.tarih;
    }else if(!lastDate){html+='<div class="daygroup">';lastDate=e.tarih;}
    var late=!e.done&&e.saat&&(e.tarih<t||(e.tarih===t&&e.saat<now));
    var k=turOf(e.tur);
    var meta=[e.kisi,e.yer,k.ad].filter(Boolean).join(' · ');
    html+='<button class="item '+(e.done?'done':'')+' '+(late?'late':'')+'" data-id="'+e.id+'" '+
      'style="--c:'+k.c+';--cbg:'+k.bg+';--cbd:'+k.bd+'">'+
      '<span class="time '+(e.saat?'':'none')+'">'+(e.saat||'saatsiz')+'</span>'+
      '<span class="body"><h3>'+esc(e.baslik)+(e.eventId?'<span class="synced">✓</span>':'')+'</h3>'+
      (meta?'<p>'+esc(meta)+'</p>':'')+'</span></button>';
  }
  return html+'</div>';
}

/* ---------- detay ---------- */
function openDetail(id){
  const e=entries.find(x=>x.id===id);if(!e)return;
  const k=turOf(e.tur);
  const meta=[uzunTarih(e.tarih),e.saat,k.ad].filter(Boolean).join(' · ');
  openSheet(`<h2 style="color:${k.c}">${esc(e.baslik)}</h2>
    <p class="kicker">${esc(meta)}${e.kisi?' · '+esc(e.kisi):''}${e.yer?' · '+esc(e.yer):''}${e.eventId?' · takvimde':''}</p>
    ${e.not?`<p style="margin:-10px 0 18px;font-size:14px;color:var(--ink-2);opacity:.75;font-weight:500">${esc(e.not)}</p>`:''}
    <button class="opt" onclick="toggleDone('${id}')"><span class="ic">${e.done?'↩︎':'✓'}</span>${e.done?'Yapılmadı işaretle':'Tamamlandı işaretle'}</button>
    <button class="opt" onclick="postpone('${id}')"><span class="ic">→</span>Yarına ertele</button>
    <button class="opt" onclick="editEntry('${id}')"><span class="ic">✎</span>Düzenle</button>
    <button class="opt" onclick="toCalendar('${id}')"><span class="ic">◷</span>Google Takvim'e ekle</button>
    <button class="opt" onclick="toWhatsapp('${id}')"><span class="ic">↗</span>WhatsApp'ta paylaş</button>
    <button class="opt danger" onclick="removeEntry('${id}')"><span class="ic">✕</span>Sil</button>`);
}
function toggleDone(id){const e=entries.find(x=>x.id===id);e.done=!e.done;persist();closeSheet();render();}
function postpone(id){const e=entries.find(x=>x.id===id);const d=parseISO(e.tarih);d.setDate(d.getDate()+1);e.tarih=iso(d);persist();closeSheet();render();toast('Bir gün ertelendi');}
function removeEntry(id){entries=entries.filter(x=>x.id!==id);persist();closeSheet();render();toast('Kayıt silindi');}
function toCalendar(id){
  const e=entries.find(x=>x.id===id),d=e.tarih.replace(/-/g,'');let dates;
  if(e.saat){
    const p=e.saat.split(':').map(Number),sure=e.sure||60;
    const st=new Date(parseISO(e.tarih));st.setHours(p[0],p[1],0,0);
    const en=new Date(st.getTime()+sure*60000);
    const f=x=>`${x.getFullYear()}${String(x.getMonth()+1).padStart(2,'0')}${String(x.getDate()).padStart(2,'0')}T${String(x.getHours()).padStart(2,'0')}${String(x.getMinutes()).padStart(2,'0')}00`;
    dates=`${f(st)}/${f(en)}`;
  }else{const nx=parseISO(e.tarih);nx.setDate(nx.getDate()+1);dates=`${d}/${iso(nx).replace(/-/g,'')}`;}
  window.open('https://calendar.google.com/calendar/render?action=TEMPLATE'
    +'&text='+encodeURIComponent(e.baslik)+'&dates='+dates+'&ctz=Europe/Istanbul'
    +'&location='+encodeURIComponent(e.yer||'')
    +'&details='+encodeURIComponent([e.kisi,e.not].filter(Boolean).join(' — ')),'_blank');
}
function toWhatsapp(id){
  const e=entries.find(x=>x.id===id);
  const txt=`${e.baslik}\n${uzunTarih(e.tarih)}${e.saat?' '+e.saat:''}`+(e.yer?`\n${e.yer}`:'')+(e.kisi?`\n${e.kisi}`:'');
  window.open('https://wa.me/?text='+encodeURIComponent(txt),'_blank');
}

function confirmDrafts(drafts,cevap){

    <p class="kicker">${esc(cevap||'Gerekirse düzelt, sonra kaydet.')}</p>

async function saveDrafts(){
  const ds=readDrafts();const yeni=[];
  for(const d of ds){
    if(!d.baslik)continue;
    const e={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      baslik:d.baslik,tarih:d.tarih||bugun(),saat:d.saat||null,kisi:d.kisi,yer:d.yer,
      tur:d.tur||'diğer',not:d.not||null,sure:null,done:false,eventId:null,created:new Date().toISOString()};
    entries.push(e);yeni.push(e);
  }
  persist();closeSheet();
  if(ds[0]&&ds[0].tarih)odak=ds[0].tarih;
  tab=(ds[0]&&ds[0].tarih>bugun())?'yaklasan':'bugun';
  render();toast(yeni.length>1?`${yeni.length} kayıt eklendi`:'Ajandaya eklendi');
  if(API_URL){
    for(const e of yeni){
      try{const ev=await takvimeYaz(e);if(ev){e.eventId=ev;}}catch(err){}
    }
    persist();render();
  }
}

/* ---------- sorgu ---------- */
function answerQuery(sorgu){
  const t=bugun();let liste=[],baslik='';
  const k=(sorgu&&sorgu.kapsam)||'bugun';
  if(k==='bugun'){liste=entries.filter(e=>e.tarih===t&&!e.done);baslik='Bugün';}
  else if(k==='yarin'){liste=entries.filter(e=>e.tarih===yarin()&&!e.done);baslik='Yarın';}
  else if(k==='hafta'){const son=new Date();son.setDate(son.getDate()+7);
    liste=entries.filter(e=>e.tarih>=t&&e.tarih<=iso(son)&&!e.done);baslik='Önümüzdeki 7 gün';}
  else{liste=entries.filter(e=>!e.done);baslik='Tüm kayıtlar';}
  liste.sort(sortEntries);
  speak(liste.length?`${baslik} için ${liste.length} kayıt var. `+liste.slice(0,4).map(e=>`${e.saat?e.saat+'te ':''}${e.baslik}`).join(', ')
    :`${baslik} için kayıt yok.`);
  openSheet(`<h2>${esc(baslik)}</h2><p class="kicker">${liste.length} kayıt</p>
    ${liste.length?liste.map(e=>{const k2=turOf(e.tur);return `<button class="opt" style="border-color:${k2.bd};background:${k2.bg}" onclick="closeSheet();openDetail('${e.id}')">
      <span class="ic" style="color:${k2.c}">●</span>
      <span>${esc(e.baslik)}<br><small style="color:var(--ink-2);opacity:.7;font-weight:500">${uzunTarih(e.tarih)}${e.saat?' · '+e.saat:''}${e.yer?' · '+esc(e.yer):''}</small></span></button>`}).join('')
      :'<p style="color:var(--mute);padding:6px 0 18px;font-weight:500">Bu aralıkta kayıt bulunmuyor.</p>'}
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Kapat</button></div>`);
}
function speak(t){
  try{if(!window.speechSynthesis)return;speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='tr-TR';u.rate=1.05;speechSynthesis.speak(u);}catch(e){}
}

/* ---------- işleme ---------- */
async function process(text){
  if(!text||!text.trim())return;
  setMic('busy','Anlıyorum…');
  let res;
  if(API_URL){ try{res=await sunucuCozumle(text);}catch(e){res=yerelCozumle(text);} }
  else res=yerelCozumle(text);
  setMic('idle');hideHeard();
  if(res.intent==='sorgu'){answerQuery(res.sorgu);return;}
  const drafts=(res.kayitlar||[]).map(d=>({
    baslik:d.baslik||text.slice(0,50),tarih:d.tarih||bugun(),saat:d.saat||'',
    kisi:d.kisi||'',yer:d.yer||'',tur:d.tur||'diğer',not:d.not||''}));
  if(!drafts.length){toast('Anlaşılmadı, tekrar dener misin?');return;}
  confirmDrafts(drafts,res.cevap);
}

/* ---------- ses ---------- */
const micBtn=document.getElementById('mic'),heard=document.getElementById('heard'),heardTxt=document.getElementById('heardTxt');
let rec=null,listening=false;
function setMic(state,label){
  micBtn.className='';
  if(state==='listening')micBtn.classList.add('listening');
  if(state==='busy'){micBtn.classList.add('busy');micBtn.querySelector('.lbl').textContent=label||'…';}
  if(state==='idle')micBtn.querySelector('.lbl').textContent=sesModu==='canli'?'Konuş':'Söyle';
}
function showHeard(t,lbl){document.getElementById('heardLbl').textContent=lbl||'Dinliyorum';heardTxt.textContent=t;heard.classList.add('on');}
function hideHeard(){heard.classList.remove('on');heardTxt.textContent='';}
function startListening(){
  if(!SR){sesModu='dikte';setMic('idle');dikteAc();return;}
  if(listening){rec.stop();return;}
  rec=new SR();rec.lang='tr-TR';rec.interimResults=true;rec.continuous=false;rec.maxAlternatives=1;
  let finalText='';
  rec.onstart=()=>{listening=true;setMic('listening');showHeard('…');};
  rec.onresult=ev=>{
    let interim='';
    for(let i=ev.resultIndex;i<ev.results.length;i++){
      const s=ev.results[i][0].transcript;
      if(ev.results[i].isFinal)finalText+=s;else interim+=s;
    }
    showHeard((finalText+interim).trim()||'…');
  };
  rec.onerror=e=>{
    listening=false;hideHeard();
    if(e.error==='no-speech'){setMic('idle');toast('Ses alınamadı, tekrar dene.');return;}
    sesModu='dikte';setMic('idle');
    dikteAc(e.error==='not-allowed'||e.error==='service-not-allowed'
      ?'Mikrofon izni verilmedi. Klavye diktesiyle devam edelim.'
      :'Ses tanıma başlatılamadı. Klavye diktesiyle devam edelim.');
  };
  rec.onend=()=>{
    listening=false;
    if(finalText.trim()){showHeard(finalText.trim(),'Anlaşılan');process(finalText.trim());}
    else{setMic('idle');hideHeard();}
  };
  try{rec.start();}catch(e){sesModu='dikte';setMic('idle');dikteAc();}
}
function dikteAc(not){
  openSheet(`<h2>Söyle</h2>
    <p class="kicker">${not||'Konuşur gibi söyle — tarihi, saati, kişiyi ve yeri kendisi ayıklar.'}</p>
    <div class="hintbox">${dikteIpucu()}</div>
    <div class="field"><textarea id="typedIn" rows="3" placeholder="Yarın saat üçte Fikirtepe'de gösterim, Ahmet Bey"></textarea></div>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Vazgeç</button>
    <button class="btn primary" onclick="submitTyped()">Devam</button></div>`);
  setTimeout(()=>{const el=document.getElementById('typedIn');if(el)el.focus();},150);
}
function submitTyped(){const v=document.getElementById('typedIn').value;closeSheet();process(v);}
micBtn.onclick=()=>{sesModu==='canli'?startListening():dikteAc();};
document.getElementById('alt').onclick=()=>dikteAc('Yazarak da ekleyebilirsin.');

/* ---------- ayarlar ---------- */
function ayarlarAc(){
  openSheet(`<h2>Ayarlar</h2>
    <p class="kicker">Ses girişi: <b>${sesModu==='canli'?'canlı mikrofon':'klavye diktesi'}</b> · Çözümleme: <b>${API_URL?'sunucu':'yerleşik'}</b></p>
    <ul class="diag">
      <li>Ses tanıma: <code>${SR?'var':'yok'}</code></li>
      <li>Çerçeve içinde: <code>${inFrame?'evet':'hayır'}</code></li>
      <li>Takvim bağlantısı: <code>${API_URL?'açık':'kapalı'}</code></li>
      <li>Kayıt sayısı: <code>${entries.length}</code></li>
    </ul>
    <div class="hintbox">${dikteIpucu()}</div>
    ${SR&&sesModu!=='canli'?`<button class="opt" onclick="sesModu='canli';setMic('idle');closeSheet();toast('Canlı mikrofon denenecek')"><span class="ic">↻</span>Canlı mikrofonu dene</button>`:''}
    ${sesModu==='canli'?`<button class="opt" onclick="sesModu='dikte';setMic('idle');closeSheet();toast('Klavye diktesine geçildi')"><span class="ic">⌨</span>Klavye diktesine geç</button>`:''}
    <button class="opt" onclick="disaAktar()"><span class="ic">⤓</span>Kayıtları yedekle (JSON)</button>
    <button class="opt danger" onclick="if(confirm('Tüm kayıtlar silinsin mi?')){entries=[];persist();closeSheet();render()}"><span class="ic">✕</span>Tüm kayıtları sil</button>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Kapat</button></div>`);
}

/* ---------- T menüsü: görünüm seçimi ---------- */
const GORUNUMLER=[['gun','Gün','Saat saat, günün akışı'],
                  ['hafta','Hafta','Yedi gün yan yana'],
                  ['ay','Ay','Ayın tamamı, yoğunluk'],
                  ['liste','Liste','Bugün · Yaklaşan · Geçmiş']];
document.getElementById('info').onclick=function(){
  openSheet('<h2>Görünüm</h2><p class="kicker">Takvimi nasıl görmek istersin?</p>'+
    GORUNUMLER.map(function(g){
      return '<button class="opt'+(gorunum===g[0]?' sec':'')+'" onclick="gorunumSec(\''+g[0]+'\')">'+
        '<span class="ic">'+(gorunum===g[0]?'●':'○')+'</span>'+
        '<span>'+g[1]+'<br><small style="color:var(--mute);font-weight:500">'+g[2]+'</small></span></button>';
    }).join('')+
    '<button class="opt" style="margin-top:10px" onclick="ayarlarAc()"><span class="ic">⚙</span>Ayarlar</button>'+
    '<div class="actions"><button class="btn ghost" onclick="closeSheet()">Kapat</button></div>');
};
function gorunumSec(g){
  gorunum=g;localStorage.setItem('ajanda_gorunum',g);
  if(g!=='liste')odak=bugun();
  closeSheet();render();
}
function disaAktar(){
  const b=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='ajanda-yedek-'+bugun()+'.json';a.click();
}

/* ---------- sekmeler ---------- */

document.getElementById('q').oninput=render;

/* ---------- başlat ---------- */
function boot(){load();odak=bugun();render();setMic('idle');}
boot();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dijital Kart · RE/MAX Doğuş</title>
<meta name="description" content="RE/MAX Doğuş gayrimenkul danışmanı dijital kartvizit">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--red:#DC1C2E;--blue:#003DA5;--ink:#131a26;--dim:#68738a;--line:#e3e7ee;--bg:#f6f7f9}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
body{font-family:Inter,-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:18px 16px 40px}
h1{font-family:Archivo,sans-serif;font-weight:800;letter-spacing:-.02em}
.hide{display:none!important}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
label.sm{font-size:12px;font-weight:600;color:var(--dim);display:block;margin:0 0 5px}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:11px;font:16px Inter,sans-serif;background:#fff;color:var(--ink)}
textarea{height:72px;resize:vertical}
.f{display:grid;gap:12px}
.btn{width:100%;padding:14px;border:0;border-radius:13px;font:700 15px Archivo,sans-serif;color:#fff;background:var(--red);cursor:pointer;box-shadow:0 8px 20px -6px rgba(220,28,46,.5)}
.btn.b{background:var(--blue);box-shadow:0 8px 20px -6px rgba(0,61,165,.5)}
.btn.g{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.grow{flex:1}
.status{font-size:14px;font-weight:500;color:var(--dim);min-height:20px;margin-top:8px}
.status.ok{color:#15803d}.status.err{color:var(--red)}
.photo-pick{display:flex;gap:12px;align-items:center}
.photo-pick img,.photo-pick .ph{width:72px;height:72px;border-radius:50%;object-fit:cover;background:#eef0f5;border:2px solid var(--line)}
.themes{display:flex;gap:8px}
.themes button{flex:1;height:40px;border-radius:10px;border:2px solid transparent;cursor:pointer}
.themes button.on{border-color:var(--ink)}
.link-row{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px;margin-bottom:6px}
.link-row button{border:1px solid var(--line);background:#fff;border-radius:10px;width:42px;color:var(--red);font-size:18px}
.share{display:grid;gap:8px}
.share code{display:block;padding:10px 12px;background:#f0f2f6;border-radius:10px;font-size:13px;word-break:break-all}
#qr{display:flex;justify-content:center;padding:10px}
#qr img,#qr canvas{border-radius:12px}

/* ===== PUBLIC CARD ===== */
body.pub{background:var(--pbg)}
.pc{max-width:440px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.hero{position:relative;padding:0 0 26px;text-align:center;color:var(--pfg)}
.hero .band{height:170px;background:var(--phero);border-radius:0 0 40px 40px;position:relative;overflow:hidden}
.hero .band:after{content:"";position:absolute;inset:0;background:radial-gradient(120% 90% at 50% -20%,rgba(255,255,255,.28),transparent 60%)}
.hero .band img.lg{position:absolute;top:22px;left:50%;transform:translateX(-50%);height:54px;width:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.35));z-index:1}
.hero .bal{position:absolute;right:16px;top:14px;width:44px;z-index:1;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}.hero .bal img{width:100%;display:block}
.hero .pic{position:relative;margin:-72px auto 0;width:144px;height:144px;border-radius:50%;padding:5px;background:#fff;box-shadow:0 18px 40px -14px rgba(0,0,0,.45)}
.hero .pic img,.hero .pic .ph{width:100%;height:100%;border-radius:50%;object-fit:cover;background:#e6e9f0;display:block}
.hero .pic .mark{position:absolute;right:2px;bottom:4px;width:42px;height:42px;border-radius:50%;background:#fff;display:grid;place-items:center;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.hero .pic .mark img{width:24px;display:block}
.hero h1{font-size:27px;margin-top:14px;line-height:1.05;color:var(--ink);letter-spacing:-.02em}
.hero .t{font-size:13px;color:var(--dim);margin-top:6px;font-weight:600;letter-spacing:.02em}
.about{margin:16px 20px 4px;position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px 20px 18px;box-shadow:0 10px 30px -18px rgba(0,0,0,.25)}
.about:before{content:"";position:absolute;top:0;left:24px;right:24px;height:3px;border-radius:0 0 3px 3px;background:linear-gradient(90deg,#DC1C2E 0 50%,#003DA5 50%)}
.about .q{position:absolute;top:10px;left:18px;font:900 44px Archivo,serif;line-height:1;color:var(--pbadge);opacity:.18}
.about .lb{font:800 10.5px Archivo,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--pbadge);margin-bottom:8px}
.about p{font-size:14.5px;line-height:1.65;color:#2a3245;text-align:left}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 6px}
.quick a{display:flex;flex-direction:column;align-items:center;gap:6px;padding:13px 6px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font:600 12px Inter,sans-serif;box-shadow:0 6px 18px -10px rgba(0,0,0,.2)}
.quick a svg{width:22px;height:22px}
.links{padding:10px 20px 24px;display:grid;gap:10px}
.links a{display:flex;align-items:center;gap:12px;padding:15px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);text-decoration:none;color:var(--ink);font:600 15px Inter,sans-serif;box-shadow:0 6px 18px -10px rgba(0,0,0,.2);transition:transform .12s}
.links a:active{transform:scale(.98)}
.links a .ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--pbadge);color:#fff;flex-shrink:0}
.links a .ic svg{width:18px;height:18px}
.links a .ic img{width:20px;height:20px}
.links a .ic.ig{background:linear-gradient(45deg,#f9ce34,#ee2a7b 50%,#6228d7)}
.links a .ic.li{background:#0A66C2}
.links a .ic.wa{background:#25D366}
.links a .ic.sb{background:linear-gradient(180deg,#DC1C2E 0 50%,#003DA5 50%)}
.links a .ic.yt{background:#FF0000}
.links a .ic.web{background:#131a26}
.quick a svg.wa{color:#25D366}.quick a svg.ph{color:#0A66C2}.quick a svg.ml{color:#DC1C2E}
.links a .ar{margin-left:auto;color:#c3cad8}
.pfoot{text-align:center;font-size:11px;color:var(--dim);padding:10px 20px 30px;margin-top:auto;display:flex;flex-direction:column;align-items:center;gap:8px}
.pfoot img{height:22px;opacity:.85}
.vc{display:flex;justify-content:center;padding:0 20px 8px;gap:10px}
.vc button{padding:12px 22px;border-radius:999px;border:0;background:var(--ink);color:#fff;font:700 14px Archivo,sans-serif;cursor:pointer}
.vc button.qrb{background:#fff;color:var(--ink);border:1.5px solid var(--ink);padding:12px 18px}
.pshare{display:flex;justify-content:center;gap:18px;padding:14px 20px 4px}
.pshare a{display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;color:var(--dim);font:600 11px Inter,sans-serif}
.pshare a span{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff}
.pshare a span svg{width:18px;height:18px}
.qm{position:fixed;inset:0;background:rgba(10,14,28,.7);display:flex;align-items:flex-end;justify-content:center;z-index:99}
.qm .box{background:#fff;border-radius:26px 26px 0 0;padding:18px 20px calc(24px + env(safe-area-inset-bottom));width:100%;max-width:440px;text-align:center}
.qm #pqr{display:flex;justify-content:center;padding:6px 0 10px}
.qm #pqr canvas,.qm #pqr img{border-radius:14px;border:6px solid #fff;box-shadow:0 8px 24px -10px rgba(0,0,0,.3)}
.qm .hint{font-size:12.5px;color:var(--dim);line-height:1.5;margin-bottom:12px;min-height:38px}
.qm .row{display:flex;gap:8px}
.qm .row button{flex:1;padding:13px;border-radius:12px;border:1px solid var(--line);background:#fff;font:700 14px Archivo,sans-serif;color:var(--ink);cursor:pointer}
.qm .row button.p{background:var(--ink);color:#fff;border-color:var(--ink)}
.qm .x{position:absolute;top:12px;right:16px;font-size:26px;color:#fff;background:none;border:0}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.st div{background:#f6f7f9;border-radius:12px;padding:10px;text-align:center}
.st b{display:block;font:800 22px Archivo,sans-serif;color:var(--ink)}
.st span{font-size:11px;color:var(--dim);font-weight:600}
.bars{display:flex;align-items:flex-end;gap:3px;height:54px;margin-top:10px}
.bars i{flex:1;background:var(--blue);border-radius:3px 3px 0 0;min-height:2px;opacity:.85}
</style>
</head>
<body>

<!-- ======= PUBLIC ======= -->
<div id="pub" class="hide"><div class="pc" id="pcard"></div></div>

<!-- ======= EDITOR ======= -->
<div id="ed" class="wrap">
  <h1 style="font-size:22px;margin-bottom:4px">Dijital Kartım</h1>
  <div style="font-size:13px;color:var(--dim);margin-bottom:16px">Tek linkle paylaşılan kişisel sayfan. 2 dakikada hazır.</div>

  <div class="card" id="loginCard">
    <label class="sm">Danışman PIN</label>
    <input type="password" id="pin" inputmode="numeric" maxlength="6" style="letter-spacing:.4em;text-align:center;font-size:22px">
    <div style="height:10px"></div>
    <button class="btn" onclick="login()">Giriş</button>
    <div class="status" id="loginMsg"></div>
  </div>

  <div id="form" class="hide">
    <div class="card f">
      <div class="photo-pick">
        <img id="pImg" class="hide"><div class="ph" id="pPh"></div>
        <div class="grow">
          <label class="sm">Profil fotoğrafı</label>
          <input type="file" id="photo" accept="image/*" onchange="loadPhoto(this)">
        </div>
      </div>
      <div id="nameWrap"><label class="sm">Ad Soyad</label><input type="text" id="name"></div>
      <div><label class="sm">Ünvan</label><input type="text" id="title" value="Gayrimenkul Danışmanı · RE/MAX Doğuş"></div>
      <div><label class="sm">Kısa tanıtım</label><textarea id="bio" placeholder="Fikirtepe ve Kadıköy'de konut, kentsel dönüşüm ve yatırım danışmanlığı."></textarea></div>
    </div>

    <div class="card f">
      <div><label class="sm">Telefon</label><input type="tel" id="phone" placeholder="0532 000 00 00"></div>
      <div><label class="sm">WhatsApp (farklıysa)</label><input type="tel" id="whatsapp" placeholder="boş bırakırsan telefon kullanılır"></div>
      <div><label class="sm">E-posta</label><input type="email" id="email"></div>
      <div><label class="sm">Instagram kullanıcı adı</label><input type="text" id="instagram" placeholder="kullaniciadi"></div>
      <div><label class="sm">LinkedIn linki</label><input type="url" id="linkedin" placeholder="https://linkedin.com/in/..."></div>
      <div><label class="sm">RE/MAX portföy linki (Portföylerim)</label><input type="url" id="sahibinden" placeholder="https://www.remax.com.tr/... danışman sayfan"></div>
    </div>

    <div class="card">
      <label class="sm">Ek linkler (portföy, video, site…)</label>
      <div id="links"></div>
      <button class="btn g" onclick="addLink()">+ Link ekle</button>
    </div>

    <div class="card">
      <label class="sm">Renk</label>
      <div class="themes" id="themes"></div>
      <div style="height:12px"></div>
      <button class="btn" id="saveBtn" onclick="save()">Kaydet ve linkimi al</button>
      <div class="status" id="msg"></div>
    </div>

    <div class="card share hide" id="shareCard">
      <label class="sm">Kart linkin</label>
      <code id="myUrl"></code>
      <div class="row">
        <button class="btn b grow" onclick="copyUrl()">Linki kopyala</button>
        <button class="btn g grow" onclick="window.open($('myUrl').textContent,'_blank')">Önizle</button>
      </div>
      <div class="row">
        <button class="btn grow" style="background:#25D366;box-shadow:none" onclick="shareWa()">WhatsApp'ta paylaş</button>
        <button class="btn grow" style="background:#131a26;box-shadow:none" onclick="shareMail()">E-posta ile gönder</button>
      </div>
      <button class="btn g" id="nativeShare" onclick="shareNative()">Paylaş…</button>
      <div id="qr"></div>
      <div style="font-size:12px;color:var(--dim);text-align:center" id="qrHint">Müşteri tarayınca kartın açılır. Kartvizit, afiş, Instagram biyografisi için.</div>
      <button class="btn g" onclick="qrDownload()">QR'ı indir (PNG)</button>
    </div>

    <div class="card hide" id="statsCard"></div>
    <div class="card hide" id="brokerList"></div>
  </div>
</div>

  lacivert:{bg:"#f2f5fb",hero:"linear-gradient(155deg,#2a63d6 0%,#003DA5 55%,#002062 100%)",fg:"#fff",badge:"#003DA5",chip:"#003DA5"},

async function loadPublic(s){

}

function esc(s){ return String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function renderPublic(c){
  const t=THEMES[c.theme]||THEMES.kirmizi, r=document.documentElement.style;
  r.setProperty("--pbg",t.bg); r.setProperty("--phero",t.hero); r.setProperty("--pfg",t.fg); r.setProperty("--pbadge",t.badge);
  document.title=c.name+" · RE/MAX Doğuş";
  const ph=tel(c.phone), wa=tel(c.whatsapp||c.phone); const wa90=wa.startsWith("0")?"90"+wa.slice(1):wa;
  let q=[];
  if(ph) q.push(`<a href="tel:${ph}" onclick="hit('ara')">${I.phone.replace("<svg",'<svg class="ph"')}Ara</a>`);
  if(wa) q.push(`<a href="https://wa.me/${wa90}" target="_blank" onclick="hit('wa')">${I.wa.replace("<svg",'<svg class="wa"')}WhatsApp</a>`);
  if(c.email) q.push(`<a href="mailto:${esc(c.email)}" onclick="hit('mail')">${I.mail.replace("<svg",'<svg class="ml"')}E-posta</a>`);
  let L=[];
  if(c.sahibinden) L.push([I.sb,"Portföylerim",c.sahibinden,"sb","portfoy"]);
  if(c.instagram) L.push([I.ig,"Instagram · @"+c.instagram.replace(/^@/,""),"https://instagram.com/"+c.instagram.replace(/^@/,""),"ig","ig"]);
  if(c.linkedin) L.push([I.li,"LinkedIn",c.linkedin,"li","li"]);
  (c.links||[]).forEach(l=>{ if(!l.url) return; const u=l.url.toLowerCase();
    const k=/youtu/.test(u)?["yt",I.yt]:/instagram/.test(u)?["ig",I.ig]:/linkedin/.test(u)?["li",I.li]:/wa\.me|whatsapp/.test(u)?["wa",I.wa]:["web",I.link];
    L.push([k[1],l.label||l.url,l.url,k[0],"link"]); });
  L.push([I.home,"Yeni Fikirtepe Burada","https://yenifikirtepeburada.com","web","link"]);
  $("pcard").innerHTML=`
    <div class="hero">
      <div class="band"><img class="lg" src="${LOGO}" alt="RE/MAX Doğuş"><div class="bal">${BALLOON}</div></div>
      <div class="pic">${c.photo?`<img src="${c.photo}" alt="${esc(c.name)}">`:`<div class="ph"></div>`}<div class="mark">${BALLOON}</div></div>
      <h1>${esc(c.name)}</h1><div class="t">${esc(c.title)}</div>
    </div>
    ${c.bio?`<div class="about"><div class="q">“</div><div class="lb">Hakkımda</div><p>${esc(c.bio)}</p></div>`:""}
    <div class="quick">${q.join("")}</div>
    <div class="links">${L.map(([ic,lb,u,k,hk])=>`<a href="${esc(u)}" target="_blank" rel="noopener" onclick="hit('${hk||"link"}')"><span class="ic ${k||""}">${ic}</span>${esc(lb)}<span class="ar">${I.ar}</span></a>`).join("")}</div>
    <div class="vc"><button onclick="hit('vcard');vcard()">Rehbere kaydet</button><button class="qrb" onclick="hit('qr');openQr()">QR</button></div>
    <div class="pshare">
      <a href="#" onclick="pShare('wa');return false"><span style="background:#25D366">${I.wa}</span>WhatsApp</a>
      <a href="#" onclick="pShare('mail');return false"><span style="background:#DC1C2E">${I.mail}</span>E-posta</a>
      <a href="#" onclick="pShare('native');return false"><span style="background:#131a26">${I.link}</span>Paylaş</a>
    </div>
    <div class="pfoot"><img src="${LOGO}" alt=""><span>RE/MAX Doğuş · UMT GROUP Gayrimenkul · Fikirtepe, Kadıköy</span></div>`;
  window._card=c;
}
let pqrMode="vcard";
function openQr(){
  const c=window._card; if(!c) return;
  const m=document.createElement("div"); m.className="qm"; m.id="qm";
  m.innerHTML=`<button class="x" onclick="closeQr()">×</button><div class="box">
    <div id="pqr"></div><div class="hint" id="pqh"></div>
    <div class="row"><button onclick="pqrShare()">Paylaş</button><button class="p" onclick="pqrDownload()">İndir</button></div></div>`;
  m.addEventListener("click",e=>{ if(e.target===m) closeQr(); });
  document.body.appendChild(m); pqrSet("link");
}
function closeQr(){ const m=$("qm"); if(m) m.remove(); }
function pqrSet(mode){
  pqrMode="link"; const url=location.href.split("#")[0];
  $("pqh").textContent="Müşteri kamerasını tutsun, kart açılır; “Rehbere kaydet” ile kaydeder.";
  $("pqr").innerHTML=""; new QRCode($("pqr"),{text:url,width:210,height:210,colorDark:"#131a26",correctLevel:QRCode.CorrectLevel.M});
}
function pqrBlob(){ return new Promise(r=>{ const cv=$("pqr").querySelector("canvas"); cv?cv.toBlob(r,"image/png"):r(null); }); }
async function pqrDownload(){
  const cv=$("pqr").querySelector("canvas"), img=$("pqr").querySelector("img"); const src=cv?cv.toDataURL("image/png"):img&&img.src; if(!src) return;
  const a=document.createElement("a"); a.href=src; a.download=slugify(window._card.name)+"-qr.png"; a.click();
}
async function pqrShare(){
  const c=window._card, url=location.href.split("#")[0], b=await pqrBlob();
  const f=b&&new File([b],"qr.png",{type:"image/png"});
  const data={title:c.name+" · RE/MAX Doğuş",text:`${c.name} — RE/MAX Doğuş. Bilgiler: ${url}`};
  if(navigator.share&&f&&navigator.canShare&&navigator.canShare({files:[f]})) navigator.share({...data,files:[f]}).catch(()=>{});
  else if(navigator.share) navigator.share({...data,url}).catch(()=>{});
  else pqrDownload();
}
function pShare(k){
  const c=window._card, url=location.href.split("#")[0];
  const txt=`${c.name} — RE/MAX Doğuş Gayrimenkul Danışmanı. İletişim ve portföy: ${url}`;
  if(k==="wa") window.open("https://wa.me/?text="+encodeURIComponent(txt),"_blank");
  else if(k==="mail") location.href="mailto:?subject="+encodeURIComponent(c.name+" — RE/MAX Doğuş")+"&body="+encodeURIComponent(txt);
  else if(navigator.share) navigator.share({title:c.name+" · RE/MAX Doğuş",text:txt,url}).catch(()=>{});
  else navigator.clipboard.writeText(url).then(()=>alert("Link kopyalandı"));
}
function vcard(){
  const c=window._card, v=vcardText(c,location.href.split("#")[0]).replace(/\n/g,"\r\n");
  const a=document.createElement("a"); a.href="data:text/vcard;charset=utf-8,"+encodeURIComponent(v); a.download=c.name.replace(/\s+/g,"_")+".vcf"; a.click();
}

/* ---------- EDITOR ---------- */
$("pin").addEventListener("keydown",e=>{ if(e.key==="Enter") login(); });
async function login(){
  pin=$("pin").value.trim(); $("loginMsg").textContent="";
  try{
    const j=await api({action:"mine"}); me=j;
    $("loginCard").classList.add("hide"); $("form").classList.remove("hide");
    renderThemes();
    if(!j.broker){ $("name").value=j.name; $("name").readOnly=true; if(j.email) $("email").value=j.email; }
    if(j.card) fill(j.card);
    if(j.stats) renderStats(j.stats, j.card);
    if(j.broker) brokerList();
  }catch(e){ $("loginMsg").className="status err"; $("loginMsg").textContent=e.message==="Hatalı PIN"?"PIN yanlış.":"Bağlantı hatası: "+e.message; }
}
function renderThemes(){
  $("themes").innerHTML=Object.entries(THEMES).map(([k,t])=>`<button class="${k===theme?"on":""}" style="background:${t.hero}" onclick="theme='${k}';renderThemes()" title="${k}"></button>`).join("");
}
function addLink(l={}){
  const d=document.createElement("div"); d.className="link-row";
  d.innerHTML=`<input type="text" placeholder="Başlık" value="${esc(l.label)}"><input type="url" placeholder="https://" value="${esc(l.url)}"><button onclick="this.parentNode.remove()">✕</button>`;
  $("links").appendChild(d);
}
function fill(c){
  ["name","title","bio","phone","whatsapp","email","instagram","linkedin","sahibinden"].forEach(k=>{ if(c[k]!=null) $(k).value=c[k]; });
  theme=c.theme||"kirmizi"; renderThemes();
  if(c.photo){ photoData=c.photo; $("pImg").src=c.photo; $("pImg").classList.remove("hide"); $("pPh").classList.add("hide"); }
  $("links").innerHTML=""; (c.links||[]).forEach(addLink);
  showShare(c._slug);
}
function loadPhoto(inp){
  const f=inp.files[0]; if(!f) return;
  const img=new Image(); img.onload=()=>{
    const S=320, cv=document.createElement("canvas"); cv.width=cv.height=S; const x=cv.getContext("2d");
    const m=Math.min(img.width,img.height); x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);
    let q=0.82, out=cv.toDataURL("image/jpeg",q); while(out.length>40000&&q>0.3){ q-=0.1; out=cv.toDataURL("image/jpeg",q); }
    photoData=out; $("pImg").src=out; $("pImg").classList.remove("hide"); $("pPh").classList.add("hide");
  }; img.src=URL.createObjectURL(f);
}
function collect(){
  const links=[...$("links").querySelectorAll(".link-row")].map(r=>({label:r.children[0].value.trim(),url:r.children[1].value.trim()})).filter(l=>l.url);
  const c={theme,photo:photoData,links}; ["name","title","bio","phone","whatsapp","email","instagram","linkedin","sahibinden"].forEach(k=>c[k]=$(k).value.trim()); return c;
}
async function save(){
  const c=collect(); if(!c.name){ setMsg("Ad Soyad gerekli","err"); return; }
  $("saveBtn").disabled=true; setMsg("Kaydediliyor…");
  try{ const j=await api({action:"save",card:c}); setMsg("✓ Kaydedildi. Kartın yayında.","ok"); showShare(j.slug); }
  catch(e){ setMsg("Hata: "+e.message,"err"); }
  $("saveBtn").disabled=false;
}
function setMsg(t,c){ const m=$("msg"); m.className="status "+(c||""); m.textContent=t; }
function showShare(slug){
  if(!slug) return;
  const url=location.origin+location.pathname+"?d="+slug;
  $("myUrl").textContent=url; $("shareCard").classList.remove("hide"); if(!navigator.share) $("nativeShare").classList.add("hide");
  myUrlCache=url; qrMode(qrCur);
}
let myUrlCache="", qrCur="link";
function vcardText(c,url){
  const n=c.name.split(" "), last=n.pop(), first=n.join(" ");
  return ["BEGIN:VCARD","VERSION:3.0",`N:${last};${first};;;`,`FN:${c.name}`,"ORG:RE/MAX Doğuş",c.title?`TITLE:${c.title}`:"",
    c.phone?`TEL;TYPE=CELL:${tel(c.phone)}`:"",c.email?`EMAIL:${c.email}`:"",`URL:${url}`,"END:VCARD"].filter(Boolean).join("\n");
}
function qrMode(){
  qrCur="link";
  $("qr").innerHTML=""; new QRCode($("qr"),{text:myUrlCache,width:200,height:200,colorDark:"#131a26",correctLevel:QRCode.CorrectLevel.M});
}
function qrDownload(){
  const cv=$("qr").querySelector("canvas"), img=$("qr").querySelector("img"); const src=cv?cv.toDataURL("image/png"):img&&img.src; if(!src) return;
  const a=document.createElement("a"); a.href=src; a.download=slugify($("name").value||"kart")+"-qr.png"; a.click();
}
function shareText(){ const n=$("name").value.trim(); return `Merhaba, ben ${n} — RE/MAX Doğuş Gayrimenkul Danışmanı. İletişim bilgilerim ve portföyüm: ${$("myUrl").textContent}`; }
function shareWa(){ window.open("https://wa.me/?text="+encodeURIComponent(shareText()),"_blank"); }
function shareMail(){ location.href="mailto:?subject="+encodeURIComponent($("name").value.trim()+" — RE/MAX Doğuş")+"&body="+encodeURIComponent(shareText()); }
function shareNative(){ if(navigator.share) navigator.share({title:$("name").value.trim()+" · RE/MAX Doğuş",text:shareText(),url:$("myUrl").textContent}).catch(()=>{}); else copyUrl(); }
function copyUrl(){ navigator.clipboard.writeText($("myUrl").textContent).then(()=>setMsg("Link kopyalandı.","ok")); }
function renderStats(s,card){
  const c=s.clicks||{}, d=s.daily||{}; const days=[...Array(14)].map((_,i)=>{ const t=new Date(); t.setDate(t.getDate()-13+i); return t.toISOString().slice(0,10); });
  const vals=days.map(k=>d[k]||0), mx=Math.max(1,...vals), tot=Object.values(d).reduce((a,b)=>a+b,0), w7=days.slice(7).reduce((a,k)=>a+(d[k]||0),0);
  const box=$("statsCard"); box.classList.remove("hide");
  box.innerHTML=`<label class="sm">Kartın nasıl gidiyor</label>
    <div class="st"><div><b>${tot}</b><span>toplam açılma</span></div><div><b>${w7}</b><span>son 7 gün</span></div><div><b>${(c.ara||0)+(c.wa||0)+(c.mail||0)}</b><span>iletişim tıkı</span></div></div>
    <div class="bars" title="Son 14 gün">${vals.map(v=>`<i style="height:${Math.round(v/mx*100)}%"></i>`).join("")}</div>
    <div style="font-size:11px;color:var(--dim);text-align:center;margin-top:4px">son 14 gün, günlük açılma</div>
    <div class="st" style="grid-template-columns:repeat(4,1fr)"><div><b>${c.ara||0}</b><span>Ara</span></div><div><b>${c.wa||0}</b><span>WhatsApp</span></div><div><b>${c.vcard||0}</b><span>Rehbere</span></div><div><b>${c.portfoy||0}</b><span>Portföy</span></div></div>`;
}
async function brokerList(){
  try{ const j=await api({action:"list"}); const b=$("brokerList"); b.classList.remove("hide");
    b.innerHTML=`<label class="sm">Tüm kartlar (broker)</label>`+(j.items.length?j.items.map(i=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line);font-size:14px"><span class="grow">${esc(i.name)}<br><small style="color:var(--dim)">${i.views} açılma · ${(i.stats.clicks||{}).ara||0} ara · ${(i.stats.clicks||{}).wa||0} WhatsApp · ${(i.stats.clicks||{}).vcard||0} rehber</small></span><a href="?d=${i.slug}" target="_blank" style="color:var(--blue);font-weight:600">Aç</a></div>`).join(""):'<div style="font-size:13px;color:var(--dim)">Henüz kart yok.</div>');
  }catch(e){}
}
// slug'ı kartla birlikte sakla (yeniden girişte link gösterilsin)
const _fill=fill; fill=c=>{ c._slug=c._slug||slugify(c.name); _fill(c); };
function slugify(s){ const m={"ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","Ç":"c","Ğ":"g","İ":"i","Ö":"o","Ş":"s","Ü":"u"}; return String(s).replace(/[çğıöşüÇĞİÖŞÜ]/g,c=>m[c]).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,""); }
</script>

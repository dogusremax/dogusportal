<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misafirlere anket gönder</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f5f8;margin:0;padding:16px;color:#0b1f4b}.w{max-width:560px;margin:auto}.c{background:#fff;border-radius:14px;padding:16px;margin-bottom:12px;box-shadow:0 1px 4px #0001}input{width:100%;padding:12px;font-size:16px;border:1px solid #ccd;border-radius:10px;box-sizing:border-box}button,a.b{display:block;text-align:center;text-decoration:none;background:#DC1C2E;color:#fff;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:700;width:100%;margin-top:10px;box-sizing:border-box}.s{font-size:13px;color:#667}.m{background:#f4f5f8;border-radius:10px;padding:10px;font-size:14px;margin-top:8px}.sg{display:flex;gap:8px;margin-top:6px}.sg button{margin:0;background:#eef0f5;color:#0b1f4b;padding:10px}.sg button.on{background:#0b1f4b;color:#fff}.ok{color:#0a7d3b;font-weight:700}</style></head><body><div class="w">
<div class="c"><b>Misafirlerinize anket gönderin</b><div class="s">Her misafir için Bey ya da Hanım seçin, mesaj hazırlanır, WhatsApp'ta açıp gönderin.</div><input id="pin" type="password" placeholder="Danışman Takip PIN"><button id="gir">Göster</button><div id="h" class="s" style="color:#DC1C2E"></div></div><div id="ls"></div></div>
<script>var S='https://script.google.com/macros/s/AKfycbwqxxXftJ_b1TrF_GFYfus6dtBe6lp4gDWTZVl9QuXAjYxjHfSvl2Ni_X3mJKm6zAss_w/exec';
var $=function(i){return document.getElementById(i)};$('pin').value=localStorage.getItem('kb_pin')||'';
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function yukle(){fetch(S,{method:'POST',redirect:'follow',body:JSON.stringify({action:'lansman',islem:'anketLinkleri',pin:$('pin').value.trim()})}).then(function(r){return r.text()}).then(function(t){var r;try{r=JSON.parse(t)}catch(e){r={ok:false,error:'Bağlanılamadı'}}
if(!r.ok){$('h').textContent=r.error;return}localStorage.setItem('kb_pin',$('pin').value.trim());$('h').textContent='';
$('ls').innerHTML=r.liste.length?r.liste.map(function(x,i){return '<div class="c" data-i="'+i+'"><b>'+esc(x.ad)+'</b>'+(x.cevapladi?' <span class="ok">anketi doldurdu</span>':'')+('<div class="s" style="margin-top:6px">Hitap seçin:</div><div class="sg"><button type="button" data-h="Bey">Bey</button><button type="button" data-h="Hanım">Hanım</button></div><div class="m" style="display:none"></div><a class="b" style="display:none" target="_blank">WhatsApp\'ta aç</a>'+(x.telefonVar?'':'<div class="s">Numara kayıtlı değil, WhatsApp\'ta kişiyi siz seçersiniz.</div>'))+'</div>'}).join(''):'<div class="c">Henüz "Lansmana geldi" işaretlediğiniz misafir yok.</div>';
[].forEach.call(document.querySelectorAll('.c[data-i]'),function(card){var x=r.liste[+card.dataset.i];var m=card.querySelector('.m'),a=card.querySelector('a.b'),k='hitap:'+x.ad;
function ciz(h){var ilk=x.ad.split(' ').filter(function(w){return !/\.$/.test(w)})[0]||x.ad,t=x.metin.replace(/^Merhaba [^,]+,/,'Merhaba '+ilk+(h?' '+h:'')+',');m.textContent=t;m.style.display=h?'':'none';[].forEach.call(card.querySelectorAll('[data-h]'),function(b){b.className=(h&&b.dataset.h===h)?'on':''});
if(h){a.style.display='';a.href=(x.wa||'https://wa.me/').split('?text=')[0]+'?text='+encodeURIComponent(t);}else a.style.display='none';}
card.addEventListener('click',function(e){var b=e.target.closest('[data-h]');if(!b)return;localStorage.setItem(k,b.dataset.h);ciz(b.dataset.h);});ciz(localStorage.getItem(k)||'');});}).catch(function(){$('h').textContent='Bağlantı hatası'})}
$('gir').onclick=yukle;if($('pin').value)yukle();</script></body></html>

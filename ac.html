<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/assets/app-ikon-180.png">
<title>Bildirim — RE/MAX Doğuş</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root { --bg:#f6f7f9; --line:#e3e7ee; --red:#DC1C2E; --blue:#003DA5; --text:#131a26; --dim:#68738a; }
* { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
body { font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:env(safe-area-inset-bottom); }
main { max-width:600px; margin:0 auto; padding:0 16px 48px; }
header { display:flex; align-items:center; gap:12px; padding:calc(18px + env(safe-area-inset-top)) 0 14px; }
.geri { width:40px; height:40px; border-radius:12px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; color:var(--text); text-decoration:none; font-size:20px; flex:none; }
h1 { font-family:'Archivo',sans-serif; font-size:22px; font-weight:800; letter-spacing:-.01em; flex:1; }
.kart { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px 16px; margin-top:6px; }
.bas { font-weight:600; font-size:16px; line-height:1.4; }
.metin { font-size:14px; color:var(--dim); line-height:1.5; margin-top:6px; white-space:pre-line; }
.btn { display:block; text-align:center; text-decoration:none; font:700 16px 'Inter',sans-serif; padding:16px; border-radius:14px; margin-top:14px; }
.ana { background:var(--red); color:#fff; }
.ikincil { background:#fff; color:var(--blue); border:1px solid var(--line); font-weight:600; font-size:14.5px; padding:13px; }
.not { font-size:12px; color:#9aa3b5; text-align:center; margin-top:18px; line-height:1.5; }
</style>
</head>
<body>
<main>
  <header>
    <a class="geri" href="/" id="geri" aria-label="Portala dön">&#8249;</a>
    <h1>Bildirim</h1>
  </header>
  <div class="kart"><div class="bas" id="bas"></div><div class="metin" id="metin"></div></div>
  <a class="btn ana" id="git" href="/" target="_blank" rel="noopener">Aç</a>
  <a class="btn ikincil" id="kutu" href="/bildirimlerim.html">Tüm bildirimlerim</a>
  <p class="not">Bu bildirim Bildirimlerim kutusunda da duruyor, sonra oradan tekrar açabilirsin.</p>
</main>
<script>
(function () {
  // Telefon bildirimine dokununca sw.js dış linkleri buraya yönlendirir (?u=link&b=başlık&m=metin)
  var q = new URLSearchParams(location.search), $ = function (id) { return document.getElementById(id); };
  var u = q.get('u') || '', b = q.get('b') || 'Bildirim', m = q.get('m') || '';
  $('bas').textContent = b; $('metin').textContent = m;
  var cb = Date.now();
  $('geri').href = '/?cb=' + cb; $('kutu').href = '/bildirimlerim.html?cb=' + cb;
  if (!/^https:\/\//.test(u)) { $('git').style.display = 'none'; return; }
  $('git').href = u;
  $('git').textContent = /sahibinden\.com/.test(u) ? "İlanı sahibinden'de aç" : 'Bağlantıyı aç';
})();
</script>
</body>
</html>

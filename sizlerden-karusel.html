<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sizlerden Gelenler · Karusel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#0b0f2a;color:#fff}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .top img{height:26px}
  .top h1{font-size:16px;font-weight:700;flex:1;min-width:150px}
  .top a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px}
  select,button,textarea,input{font:600 13px 'Plus Jakarta Sans',sans-serif;border:0;border-radius:10px;padding:9px 14px}
  select,input{background:#161c44;color:#fff}
  button{background:#DC1C2E;color:#fff;cursor:pointer}
  button.ghost{background:rgba(255,255,255,.1)}
  .panel{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
  .panel label{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row>*{flex:1 1 180px}
  textarea{width:100%;height:110px;background:#161c44;color:#fff;font-weight:500;line-height:1.6;resize:vertical}
  .status{padding:10px 20px;font-size:12px;color:rgba(255,255,255,.6)}
  .grid{display:flex;gap:20px;flex-wrap:wrap;padding:10px 20px 40px;justify-content:center}
  .card{display:flex;flex-direction:column;align-items:center;gap:8px}
  .card small{font-size:11px;color:rgba(255,255,255,.5)}
  .slide{width:420px;height:560px;position:relative;overflow:hidden;border-radius:4px;flex:none;cursor:pointer}
  .sans{font-family:'Plus Jakarta Sans',sans-serif}
  @media (max-width:460px){
    .card .slide{transform:scale(.8);transform-origin:top center;margin-bottom:-112px}
  }
  body.oto .top,body.oto .panel,body.oto .status,body.oto small{display:none}
</style>
</head>
<body>
<div class="top">
  <a href="index.html">‹ Portal</a>
  <img src="assets/dogus-logo.png" alt="Doğuş">
  <h1>Sizlerden Gelenler · Karusel</h1>
  <button id="zipbtn" onclick="downloadAll()">Tümünü indir (ZIP)</button>
</div>

<div class="panel">
  <label>Google yorumlarından seç — seçince danışman, isim ve yorum otomatik dolar. İstersen aşağıdan düzenle.</label>
  <select id="yorumSec" style="width:100%" onchange="yorumYukle(this.value)"><option value="">Yükleniyor…</option></select>
  <div class="row">
    <select id="danisman" onchange="render()"></select>
    <input id="musteri" placeholder="Müşteri adı" oninput="render()">
  </div>
  <div class="row"><textarea id="metin" placeholder="Yorum metni" oninput="render()"></textarea></div>
</div>
<div class="status" id="status">Görsele tıklayınca tek tek PNG iner · 1080×1440 karusel</div>
<div class="grid" id="grid"></div>

<script>
const NAVY="#050A30", RED="#DC1C2E", REDD="#910B19", CORAL="#FB5160", LB="#F6F3F1";
const RGRAD=`linear-gradient(160deg,${REDD} 0%,${RED} 45%,${CORAL} 100%)`;
const TEL="0216 315 15 15", WEB="www.remaxdogus.com.tr";
const LOGO="assets/dogus-logo.png";
const q=new URLSearchParams(location.search);
let DANISMANLAR=[], YORUMLAR=[];

const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo=()=>`<img src="${LOGO}" style="position:absolute;top:30px;right:32px;width:104px;z-index:12;">`;
const foot=t=>`<div class="sans" style="position:absolute;left:32px;right:120px;bottom:26px;font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.4px;z-index:10;">${t}</div>`;
const kaydir=()=>`<div class="sans" style="position:absolute;right:32px;bottom:26px;font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.8);z-index:10;">KAYDIR →</div>`;
const yildiz=(fs,renk)=>`<span style="font-size:${fs}px;letter-spacing:2px;color:${renk||'#FBBB05'};">★★★★★</span>`;
const foto=id=>`assets/ekip/${id}.png`;
const secili=()=>DANISMANLAR.find(d=>d.id===document.getElementById('danisman').value)||{id:'',ad:''};

// 1) Kapak: başlık + danışman fotoğrafı
function kapak(d){
  const [ad,...soy]=d.ad.split(' ');
  return `<div class="slide" style="background:${RGRAD};">
<div class="sans" style="position:absolute;top:-96px;left:-14px;font-size:420px;font-weight:800;line-height:1;color:rgba(255,255,255,.09);">“</div>
${logo()}
<img src="${foto(d.id)}" style="position:absolute;right:-18px;bottom:0;height:400px;z-index:2;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25));">
<div style="position:absolute;left:32px;top:112px;z-index:3;">
<div class="sans" style="display:inline-block;background:${NAVY};color:#fff;font-size:11px;font-weight:800;letter-spacing:2px;padding:8px 14px;border-radius:9px;">MÜŞTERİ YORUMU</div>
<div class="sans" style="font-size:44px;font-weight:800;letter-spacing:-1.8px;line-height:1.02;margin-top:16px;color:#fff;">Sizlerden<br>Gelenler</div>
<div style="margin-top:14px;">${yildiz(18)}</div>
<div class="sans" style="font-size:12px;color:rgba(255,255,255,.85);margin-top:4px;font-weight:600;">Google yorumu</div>
</div>
<div style="position:absolute;left:32px;bottom:62px;z-index:3;max-width:200px;">
<div class="sans" style="font-size:11px;color:rgba(255,255,255,.8);letter-spacing:.4px;">Gayrimenkul Danışmanı</div>
<div class="sans" style="font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.08;color:#fff;margin-top:4px;">${esc(ad)}<br>${esc(soy.join(' '))}</div>
</div>
${foot('RE/MAX DOĞUŞ · '+TEL)}${kaydir()}</div>`;
}

// 2) Yorum: metin kutuya sığacak puntoyla
function yorum(d,musteri,metin){
  const n=metin.length;
  const fs=n<=140?21:n<=240?18:n<=380?15.5:n<=560?13.5:n<=800?12:11;
  const bas=(musteri||'?').trim().charAt(0).toLocaleUpperCase('tr');
  return `<div class="slide" style="background:${NAVY};">
<div class="sans" style="position:absolute;top:-60px;right:-10px;font-size:380px;font-weight:800;line-height:1;color:rgba(255,255,255,.05);">”</div>
${logo()}
<div style="position:absolute;left:32px;right:32px;top:100px;bottom:56px;display:flex;flex-direction:column;">
<div><div class="sans" style="display:inline-block;background:${CORAL};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 11px;border-radius:8px;">${esc(d.ad.toLocaleUpperCase('tr'))} İÇİN</div></div>
<div class="yorumKutu" style="flex:1 1 auto;min-height:0;overflow:hidden;display:flex;align-items:center;margin:14px 0;">
<div class="sans" style="font-size:${fs}px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.95);">“${esc(metin)}”</div>
</div>
<div style="display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);">
<div class="sans" style="width:42px;height:42px;border-radius:50%;background:${RGRAD};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex:0 0 42px;">${esc(bas)}</div>
<div style="flex:1;min-width:0;">
<div class="sans" style="font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(musteri)}</div>
<div style="margin-top:2px;">${yildiz(13)} <span class="sans" style="font-size:10px;color:rgba(255,255,255,.55);margin-left:4px;">Google</span></div>
</div></div>
</div>
${kaydir()}</div>`;
}

// 3) İletişim
function iletisim(d){
  const satir=(ikon,metin)=>`<div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
<div style="width:34px;height:34px;border-radius:10px;background:${LB};color:${REDD};display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;">${ikon}</div>
<div class="sans" style="font-size:15px;font-weight:700;color:#fff;">${metin}</div></div>`;
  return `<div class="slide" style="background:${RGRAD};">
<div class="sans" style="position:absolute;top:-70px;left:0px;font-size:380px;font-weight:800;line-height:1;color:rgba(255,255,255,.08);letter-spacing:-18px;">D</div>
${logo()}
<div style="position:absolute;left:34px;right:34px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;">
<div class="sans" style="font-size:32px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:#fff;margin-bottom:14px;">Teşekkür<br>ederiz!</div>
<div class="sans" style="font-size:13px;line-height:1.6;color:rgba(255,255,255,.92);margin-bottom:18px;">Güveniniz en büyük referansımız. Satış, kiralama ve değerleme süreçlerinizde ${esc(d.ad)} ve RE/MAX Doğuş ekibi yanınızda.</div>
<div style="display:flex;align-items:center;gap:12px;background:rgba(5,10,48,.28);border-radius:16px;padding:10px 12px;margin-bottom:8px;">
<div style="width:52px;height:52px;border-radius:50%;background:${LB};overflow:hidden;flex:0 0 52px;"><img src="${foto(d.id)}" style="width:100%;margin-top:4px;"></div>
<div><div class="sans" style="font-size:16px;font-weight:800;color:#fff;">${esc(d.ad)}</div>
<div class="sans" style="font-size:11px;color:rgba(255,255,255,.8);">Gayrimenkul Danışmanı</div></div></div>
${satir('☎',TEL)}${satir('⌂',WEB)}${satir('⌖','Fikirtepe · Kadıköy')}
<div style="margin-top:22px;"><div class="sans" style="display:inline-flex;padding:12px 32px;background:${LB};color:${REDD};font-weight:700;font-size:14px;border-radius:26px;">Hemen arayın</div></div>
</div></div>`;
}

function sigdir(){
  // Yorum kutusuna sığmazsa puntoyu küçült
  document.querySelectorAll('.yorumKutu').forEach(k=>{
    const t=k.firstElementChild; let fs=22;
    t.style.fontSize=fs+'px';
    while(t.scrollHeight>k.clientHeight&&fs>9){fs-=.5;t.style.fontSize=fs+'px';}
  });
}

function render(){
  const d=secili(); if(!d.id) return;
  const musteri=document.getElementById('musteri').value.trim(), metin=document.getElementById('metin').value.replace(/\s+/g,' ').trim();
  const g=document.getElementById('grid'); g.innerHTML='';
  [kapak(d),yorum(d,musteri,metin),iletisim(d)].forEach((html,i)=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=html+`<small>Gönderi ${i+1}/3 · indirmek için tıkla</small>`;
    c.querySelector('.slide').onclick=()=>shot(c.querySelector('.slide'),`sizlerden-${d.id}-${i+1}.png`);
    g.appendChild(c);
  });
  sigdir();
}

function yorumYukle(id){
  const r=YORUMLAR.find(x=>x.id===id); if(!r) return;
  document.getElementById('danisman').value=r.danismanlar[0];
  document.getElementById('musteri').value=r.yazar;
  document.getElementById('metin').value=r.metin;
  render();
}

async function canvasOf(el){
  return html2canvas(el,{scale:1080/420,useCORS:true,backgroundColor:null,logging:false,width:420,height:560});
}
async function shot(el,name){
  const s=document.getElementById('status'); s.textContent='Görsel hazırlanıyor…';
  try{const cv=await canvasOf(el);const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name;a.click();s.textContent='İndirildi: '+name;}
  catch(e){s.textContent='Hata: '+e.message;}
}
async function downloadAll(){
  const s=document.getElementById('status'), btn=document.getElementById('zipbtn'); btn.disabled=true;
  try{
    const zip=new JSZip(), els=[...document.querySelectorAll('.slide')];
    for(let i=0;i<els.length;i++){
      s.textContent=`Hazırlanıyor… ${i+1}/${els.length}`;
      zip.file(`sizlerden-${i+1}.png`,(await canvasOf(els[i])).toDataURL('image/png').split(',')[1],{base64:true});
    }
    const a=document.createElement('a');a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'}));
    a.download=`sizlerden-${secili().id}.zip`;a.click();
    s.textContent='ZIP indirildi.';
  }catch(e){s.textContent='Hata: '+e.message;}
  btn.disabled=false;
}

(async()=>{
  // ?oto=1&yorum=<id>: otomatik paylaşım için sadece slaytlar (scripts/sizlerden-story.js)
  if(q.get('oto')) document.body.classList.add('oto');
  const [d,y]=await Promise.all([fetch('data/danismanlar.json?t='+Date.now()).then(r=>r.json()),fetch('data/google-yorumlar.json?t='+Date.now()).then(r=>r.json())]);
  DANISMANLAR=d;
  YORUMLAR=(y.yorumlar||[]).filter(r=>r.puan>=4&&r.metin&&(r.danismanlar||[]).some(i=>d.some(x=>x.id===i)))
    .sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  document.getElementById('danisman').innerHTML=d.map(x=>`<option value="${x.id}">${esc(x.ad)}</option>`).join('');
  document.getElementById('yorumSec').innerHTML='<option value="">— Yorum seç —</option>'+YORUMLAR.map(r=>
    `<option value="${esc(r.id)}">${esc(r.danismanlar.map(i=>(d.find(x=>x.id===i)||{}).ad).filter(Boolean).join(', '))} · ${esc(r.yazar)} · ${esc(r.metin.slice(0,50))}…</option>`).join('');
  const hedef=q.get('yorum')||(YORUMLAR[0]||{}).id;
  if(hedef){document.getElementById('yorumSec').value=hedef;yorumYukle(hedef);}
  if(q.get('danisman')){document.getElementById('danisman').value=q.get('danisman');render();}
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
  sigdir();
  document.body.dataset.ready='1';
})();
</script>
</body>
</html>

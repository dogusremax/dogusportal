<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sizlerden Gelenler · Karusel</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#0b0f2a;color:#fff}
  .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.08)}
  .top img{height:26px}
  .top h1{font-size:16px;font-weight:700;flex:1;min-width:150px}
  .top a{color:rgba(255,255,255,.6);text-decoration:none;font-size:13px}
  select,button,textarea,input{font:600 13px 'Plus Jakarta Sans',sans-serif;border:0;border-radius:10px;padding:9px 14px}
  select,input{background:#161c44;color:#fff}
  button{background:#DC1C2E;color:#fff;cursor:pointer}
  button.ghost{background:rgba(255,255,255,.1)}
  .panel{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.06)}
  .panel label{display:block;font-size:12px;color:rgba(255,255,255,.6);margin-bottom:8px}
  .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
  .row>*{flex:1 1 180px}
  textarea{width:100%;height:110px;background:#161c44;color:#fff;font-weight:500;line-height:1.6;resize:vertical}
  .status{padding:10px 20px;font-size:12px;color:rgba(255,255,255,.6)}
  .grid{display:flex;gap:20px;flex-wrap:wrap;padding:10px 20px 40px;justify-content:center}
  .card{display:flex;flex-direction:column;align-items:center;gap:8px}
  .card small{font-size:11px;color:rgba(255,255,255,.5)}
  .slide{width:420px;height:560px;position:relative;overflow:hidden;border-radius:4px;flex:none;cursor:pointer}
  .slide.story{height:747px}
  .sans{font-family:'Plus Jakarta Sans',sans-serif}
  @media (max-width:460px){
    .card .slide{transform:scale(.8);transform-origin:top center;margin-bottom:-112px}
    .card .slide.story{margin-bottom:-149px}
  }
  body.oto .top,body.oto .panel,body.oto .status,body.oto small{display:none}
</style>
</head>
<body>
<div class="top">
  <a href="index.html">‹ Portal</a>
  <img src="assets/dogus-logo.png" alt="Doğuş">
  <h1>Sizlerden Gelenler · Karusel</h1>
  <!-- Story bu sayfadan değil, danışman şablonundan üretilir (sizlerden-gelenler.html) -->
  <select id="fmt" onchange="setFmt()" style="display:none"><option value="feed">Karusel (3:4)</option></select>
  <button id="zipbtn" class="ghost" onclick="downloadAll()">Tümünü indir (ZIP)</button>
  <button id="pubBtn" onclick="paylas()">📤 Paylaş</button>
</div>

<div class="panel">
  <label>Google yorumlarından seç — seçince danışman, isim ve yorum otomatik dolar. İstersen aşağıdan düzenle.</label>
  <select id="yorumSec" style="width:100%" onchange="yorumYukle(this.value)"><option value="">Yükleniyor…</option></select>
  <div class="row">
    <select id="danisman" onchange="render()"></select>
    <input id="musteri" placeholder="Müşteri adı" oninput="render()">
  </div>
  <div class="row"><textarea id="metin" placeholder="Yorum metni" oninput="render()"></textarea></div>
  <label style="margin-top:14px">Paylaşım açıklaması ve hashtag'ler — yorum seçince otomatik dolar, istersen düzenle</label>
  <textarea id="caption" style="height:190px" oninput="capElle=true"></textarea>
  <div class="row" style="margin-top:8px"><button class="ghost" style="flex:0 0 auto" onclick="capElle=false;aciklamaYap()">↺ Açıklamayı yeniden oluştur</button></div>
</div>
<div class="status" id="status">Görsele tıklayınca tek tek PNG iner · 1080×1440 karusel</div>
<div class="grid" id="grid"></div>

<script>
const NAVY="#050A30", RED="#DC1C2E", REDD="#910B19", CORAL="#FB5160", LB="#F6F3F1";
const RGRAD=`linear-gradient(160deg,${REDD} 0%,${RED} 45%,${CORAL} 100%)`;
const TEL="0216 315 15 15", WEB="www.remaxdogus.com.tr";
const LOGO="assets/dogus-logo.png";
const q=new URLSearchParams(location.search);
let DANISMANLAR=[], YORUMLAR=[], STORY=false;

// "Canan Akşar" → "Canan A." (soyadın sadece baş harfi)
const kisaAd=a=>{const p=String(a||'').trim().split(/\s+/);return p.length<2?p[0]||'':p.slice(0,-1).map(w=>w.charAt(0).toLocaleUpperCase('tr')+w.slice(1)).join(' ')+' '+p[p.length-1].charAt(0).toLocaleUpperCase('tr')+'.';};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const logo=()=>`<img src="${LOGO}" style="position:absolute;top:30px;right:32px;width:104px;z-index:12;">`;
const foot=t=>`<div class="sans" style="position:absolute;left:32px;right:120px;bottom:26px;font-size:10px;color:rgba(255,255,255,.6);letter-spacing:.4px;z-index:10;">${t}</div>`;
const kaydir=()=>`<div class="sans" style="position:absolute;right:32px;bottom:26px;font-size:10px;font-weight:700;letter-spacing:2px;color:rgba(255,255,255,.8);z-index:10;">KAYDIR →</div>`;
const yildiz=(fs,renk)=>`<span style="font-size:${fs}px;letter-spacing:2px;color:${renk||'#FBBB05'};">★★★★★</span>`;
const foto=id=>`assets/ekip/${id}.png`;
const secili=()=>DANISMANLAR.find(d=>d.id===document.getElementById('danisman').value)||{id:'',ad:''};

// 1) Kapak: başlık + danışman fotoğrafı
function kapak(d){
  const [ad,...soy]=d.ad.split(' ');
  return `<div class="slide" style="background:${RGRAD};">
<div class="sans" style="position:absolute;top:-96px;left:-14px;font-size:420px;font-weight:800;line-height:1;color:rgba(255,255,255,.09);">“</div>
${logo()}
<img src="${foto(d.id)}" style="position:absolute;right:-18px;bottom:0;height:400px;z-index:2;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25));">
<div style="position:absolute;left:32px;top:112px;z-index:3;">
<div class="sans" style="display:inline-block;background:${NAVY};color:#fff;font-size:11px;font-weight:800;letter-spacing:2px;padding:8px 14px;border-radius:9px;">MÜŞTERİ YORUMU</div>
<div class="sans" style="font-size:44px;font-weight:800;letter-spacing:-1.8px;line-height:1.02;margin-top:16px;color:#fff;">Sizlerden<br>Gelenler</div>
<div style="margin-top:14px;">${yildiz(18)}</div>
<div class="sans" style="font-size:12px;color:rgba(255,255,255,.85);margin-top:4px;font-weight:600;">Google yorumu</div>
</div>
<div style="position:absolute;left:32px;bottom:62px;z-index:3;max-width:200px;">
<div class="sans" style="font-size:11px;color:rgba(255,255,255,.8);letter-spacing:.4px;">Gayrimenkul Danışmanı</div>
<div class="sans" style="font-size:24px;font-weight:800;letter-spacing:-.6px;line-height:1.08;color:#fff;margin-top:4px;">${esc(ad)}<br>${esc(soy.join(' '))}</div>
</div>
${foot('RE/MAX DOĞUŞ · '+TEL)}${kaydir()}</div>`;
}

// 2) Yorum: tek sayfaya sığarsa punto büyür; sığmazsa YAZI_MIN puntoda birden çok sayfaya bölünür (yorumSayfalari)
const YAZI_MIN=15;
function yorum(d,musteri,metin,s={ilk:true,son:true,no:1,top:1}){
  const bas=(musteri||'?').trim().charAt(0).toLocaleUpperCase('tr');
  return `<div class="slide" style="background:${NAVY};">
<div class="sans" style="position:absolute;top:-60px;right:-10px;font-size:380px;font-weight:800;line-height:1;color:rgba(255,255,255,.05);">”</div>
${logo()}
<div style="position:absolute;left:32px;right:32px;top:100px;bottom:56px;display:flex;flex-direction:column;">
<div><div class="sans" style="display:inline-block;background:${CORAL};color:#fff;font-size:10px;font-weight:800;letter-spacing:1.6px;padding:6px 11px;border-radius:8px;">${esc(d.ad.toLocaleUpperCase('tr'))} İÇİN</div>${s.top>1?`<span class="sans" style="font-size:11px;font-weight:700;color:rgba(255,255,255,.5);margin-left:8px;">${s.no}/${s.top}</span>`:''}</div>
<div class="yorumKutu"${s.top>1?' data-sabit="1"':''} style="flex:1 1 auto;min-height:0;overflow:hidden;display:flex;align-items:center;margin:14px 0;">
<div class="sans" style="font-size:${s.top>1?YAZI_MIN:21}px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.95);">${s.ilk?'“':'…'}${esc(metin)}${s.son?'”':` <b style="color:${CORAL};font-weight:700;white-space:nowrap;">devamı →</b>`}</div>
</div>
<div style="display:flex;align-items:center;gap:12px;padding-top:14px;border-top:1px solid rgba(255,255,255,.12);">
<div class="sans" style="width:42px;height:42px;border-radius:50%;background:${RGRAD};display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:#fff;flex:0 0 42px;">${esc(bas)}</div>
<div style="flex:1;min-width:0;">
<div class="sans" style="font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(musteri)}</div>
<div style="margin-top:2px;">${yildiz(13)} <span class="sans" style="font-size:10px;color:rgba(255,255,255,.55);margin-left:4px;">Google</span></div>
</div></div>
</div>
${kaydir()}</div>`;
}

// 3) İletişim
function iletisim(d){
  const satir=(ikon,metin)=>`<div style="display:flex;align-items:center;gap:12px;margin-top:12px;">
<div style="width:34px;height:34px;border-radius:10px;background:${LB};color:${REDD};display:flex;align-items:center;justify-content:center;font-size:16px;flex:0 0 34px;">${ikon}</div>
<div class="sans" style="font-size:15px;font-weight:700;color:#fff;">${metin}</div></div>`;
  return `<div class="slide" style="background:${RGRAD};">
<div class="sans" style="position:absolute;top:-70px;left:0px;font-size:380px;font-weight:800;line-height:1;color:rgba(255,255,255,.08);letter-spacing:-18px;">D</div>
${logo()}
<div style="position:absolute;left:34px;right:34px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;">
<div class="sans" style="font-size:32px;font-weight:700;letter-spacing:-1.2px;line-height:1.05;color:#fff;margin-bottom:14px;">Teşekkür<br>ederiz!</div>
<div class="sans" style="font-size:13px;line-height:1.6;color:rgba(255,255,255,.92);margin-bottom:18px;">Güveniniz en büyük referansımız. Satış, kiralama ve değerleme süreçlerinizde ${esc(d.ad)} ve RE/MAX Doğuş ekibi yanınızda.</div>
<div style="display:flex;align-items:center;gap:12px;background:rgba(5,10,48,.28);border-radius:16px;padding:10px 12px;margin-bottom:8px;">
<div style="width:52px;height:52px;border-radius:50%;background:${LB};overflow:hidden;flex:0 0 52px;"><img src="${foto(d.id)}" style="width:100%;margin-top:4px;"></div>
<div><div class="sans" style="font-size:16px;font-weight:800;color:#fff;">${esc(d.ad)}</div>
<div class="sans" style="font-size:11px;color:rgba(255,255,255,.8);">Gayrimenkul Danışmanı</div></div></div>
${satir('☎',TEL)}${satir('⌂',WEB)}${satir('⌖','Fikirtepe · Kadıköy')}
<div style="margin-top:22px;"><div class="sans" style="display:inline-flex;padding:12px 32px;background:${LB};color:${REDD};font-weight:700;font-size:14px;border-radius:26px;">Hemen arayın</div></div>
</div></div>`;
}

function sigdir(){
  // Yorum kutusuna sığmazsa puntoyu küçült
  document.querySelectorAll('.yorumKutu:not([data-sabit]),.storyKutu').forEach(k=>{
    const t=k.firstElementChild; let fs=22;
    t.style.fontSize=fs+'px';
    while(t.scrollHeight>k.clientHeight&&fs>YAZI_MIN){fs-=.5;t.style.fontSize=fs+'px';}
  });
}

// Uzun yorumu YAZI_MIN puntoda sayfalara böl; mümkünse cümle sonundan kes
function yorumSayfalari(d,musteri,metin){
  const tmp=document.createElement('div'); tmp.style.cssText='position:absolute;left:-9999px;top:0;';
  document.body.appendChild(tmp);
  const sigar=(t,s)=>{tmp.innerHTML=yorum(d,musteri,t,{...s,top:2});const k=tmp.querySelector('.yorumKutu');return k.firstElementChild.scrollHeight<=k.clientHeight;};
  try{
    if(sigar(metin,{ilk:true,son:true})) return [metin];
    const w=metin.split(' '), sayfalar=[]; let i=0;
    while(i<w.length){
      let j=i+1;
      while(j<w.length&&sigar(w.slice(i,j+1).join(' '),{ilk:i===0,son:j+1===w.length})) j++;
      if(j<w.length) for(let k=j;k>i+(j-i)*.6;k--) if(/[.!?…:)]["”']?$/.test(w[k-1])){j=k;break;}
      sayfalar.push(w.slice(i,j).join(' ')); i=j;
    }
    return sayfalar;
  }finally{tmp.remove();}
}

// Story (9:16): gönderinin kapağıyla aynı yapı + altta yorum kutusu ve iletişim
const STORY_EK='Devamı gönderimizde 👆';
function storySlide(d,musteri,metin,devam){
  const bas=(musteri||'?').trim().charAt(0).toLocaleUpperCase('tr');
  return `<div class="slide story" style="background:${RGRAD};">
<div class="sans" style="position:absolute;top:-96px;left:-14px;font-size:420px;font-weight:800;line-height:1;color:rgba(255,255,255,.09);">“</div>
${logo()}
<img src="${foto(d.id)}" style="position:absolute;right:-24px;top:150px;height:440px;z-index:2;filter:drop-shadow(0 10px 30px rgba(0,0,0,.25));">
<div style="position:absolute;left:32px;top:120px;z-index:3;">
<div class="sans" style="display:inline-block;background:${NAVY};color:#fff;font-size:11px;font-weight:800;letter-spacing:2px;padding:8px 14px;border-radius:9px;">MÜŞTERİ YORUMU</div>
<div class="sans" style="font-size:46px;font-weight:800;letter-spacing:-1.8px;line-height:1.02;margin-top:16px;color:#fff;">Sizlerden<br>Gelenler</div>
<div style="margin-top:14px;">${yildiz(18)}</div>
<div class="sans" style="font-size:12px;color:rgba(255,255,255,.85);margin-top:4px;font-weight:600;">Google yorumu</div>
</div>
<div style="position:absolute;left:20px;right:20px;bottom:100px;z-index:4;background:${NAVY};border-radius:22px;padding:20px 22px 16px;box-shadow:0 16px 40px rgba(0,0,0,.35);">
<div class="storyKutu" style="max-height:210px;overflow:hidden;">
<div class="sans" style="font-size:20px;line-height:1.5;font-weight:500;color:rgba(255,255,255,.95);">“${esc(metin)}${devam?` …”<br><b style="color:${CORAL};font-weight:700;font-size:13px;">${STORY_EK}</b>`:'”'}</div>
</div>
<div style="display:flex;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.12);">
<div class="sans" style="width:38px;height:38px;border-radius:50%;background:${RGRAD};display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:#fff;flex:0 0 38px;">${esc(bas)}</div>
<div style="flex:1;min-width:0;"><div class="sans" style="font-size:14px;font-weight:700;color:#fff;">${esc(musteri)}</div>
<div>${yildiz(12)} <span class="sans" style="font-size:10px;color:rgba(255,255,255,.55);margin-left:4px;">Google</span></div></div>
</div></div>
<div style="position:absolute;left:32px;right:32px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;z-index:4;">
<div><div class="sans" style="font-size:10.5px;color:rgba(255,255,255,.8);">Gayrimenkul Danışmanı</div>
<div class="sans" style="font-size:20px;font-weight:800;letter-spacing:-.4px;color:#fff;margin-top:2px;">${esc(d.ad)}</div></div>
<div class="sans" style="text-align:right;font-size:11.5px;font-weight:700;color:#fff;line-height:1.6;">☎ ${TEL}<br>${WEB}</div>
</div></div>`;
}
// Story kutusuna sığdır: tamamı 15px'te sığmazsa danışmanın adının geçtiği cümleden başlayan bir bölüm + "Devamı gönderimizde"
function storyIcerik(d,musteri,metin){
  const tmp=document.createElement('div'); tmp.style.cssText='position:absolute;left:-9999px;top:0;';
  document.body.appendChild(tmp);
  const sigar=(t,devam)=>{tmp.innerHTML=storySlide(d,musteri,t,devam);const k=tmp.querySelector('.storyKutu'),x=k.firstElementChild;x.style.fontSize=YAZI_MIN+'px';return x.scrollHeight<=k.clientHeight;};
  try{
    if(sigar(metin,false)) return {metin,devam:false};
    const cumleler=(metin.match(/[^.!?…]+[.!?…]+["”')]*|[^.!?…]+$/g)||[metin]).map(c=>c.trim()).filter(Boolean);
    const re=new RegExp('(?<![a-zçğıöşü])(?:'+(d.desen||'^$')+')');
    let bas=cumleler.findIndex(c=>re.test(c.toLocaleLowerCase('tr'))); if(bas<0) bas=0;
    const on=bas>0?'… ':'';
    let t='';
    for(let i=bas;i<cumleler.length&&sigar(on+(t+' '+cumleler[i]).trim(),true);i++) t=(t+' '+cumleler[i]).trim();
    if(!t){const w=cumleler[bas].split(' ');let j=1;while(j<w.length&&sigar(on+w.slice(0,j+1).join(' '),true))j++;t=w.slice(0,j).join(' ');}
    return {metin:on+t,devam:true};
  }finally{tmp.remove();}
}
function setFmt(){STORY=document.getElementById('fmt').value==='story';render();}

function render(){
  const d=secili(); if(!d.id) return;
  const musteri=document.getElementById('musteri').value.trim(), metin=document.getElementById('metin').value.replace(/\s+/g,' ').trim();
  const g=document.getElementById('grid'); g.innerHTML='';
  let sayfalar;
  if(STORY){const s=storyIcerik(d,musteri,metin);sayfalar=[storySlide(d,musteri,s.metin,s.devam)];}
  else{
    const parca=yorumSayfalari(d,musteri,metin);
    sayfalar=[kapak(d),...parca.map((t,i)=>yorum(d,musteri,t,{ilk:i===0,son:i===parca.length-1,no:i+1,top:parca.length})),iletisim(d)];
  }
  sayfalar.forEach((html,i)=>{
    const c=document.createElement('div'); c.className='card';
    c.innerHTML=html+`<small>${STORY?'Story':'Gönderi '+(i+1)+'/'+sayfalar.length} · indirmek için tıkla</small>`;
    c.querySelector('.slide').onclick=()=>shot(c.querySelector('.slide'),`sizlerden-${d.id}-${STORY?'story':i+1}.png`);
    g.appendChild(c);
  });
  sigdir();
  aciklamaYap();
}
function yorumYukle(id){
  const r=YORUMLAR.find(x=>x.id===id); if(!r) return;
  document.getElementById('danisman').value=r.danismanlar[0];
  document.getElementById('musteri').value=kisaAd(r.yazar);
  document.getElementById('metin').value=r.metin;
  capElle=false;
  render();
}

// ── Paylaşım: açıklama + Instagram/Facebook karusel ─────────────
const APPS_SCRIPT_URL="https://script.google.com/macros/s/AKfycbylNnt48KJxD-HBqoopEfYZjv4A06hKo3RjUclILLh9g8bDIno73dDti_PUFECC4F0utg/exec";
let capElle=false;
function ilkCumle(m){
  const c=(m.match(/[^.!?…]+[.!?…]+/g)||[m]).map(x=>x.trim()).filter(Boolean);
  let t=''; for(const x of c){ if((t+' '+x).length>220) break; t=(t+' '+x).trim(); }
  return t||m.slice(0,200).trim()+'…';
}
function aciklamaYap(){
  if(capElle) return;
  const d=secili(), musteri=document.getElementById('musteri').value.trim();
  const metin=document.getElementById('metin').value.replace(/\s+/g,' ').trim();
  if(!d.id||!metin){document.getElementById('caption').value='';return;}
  const ing=!/[çğışöüÇĞİŞÖÜ]/.test(metin.replace(new RegExp(d.ad.split(' ').join('|'),'g'),'').replace(/Doğuş|Türkiye/g,'')) && /\b(the|and|with|was|very)\b/i.test(metin);
  const tags=['#remaxdogus','#remax','#sizlerdengelenler','#müşteriyorumu','#mutlumüşteri','#gayrimenkul',
    '#emlakdanışmanı','#fikirtepe','#yenifikirtepe','#kadıköy','#istanbul'];
  if(ing) tags.push('#istanbulrealestate','#propertyinturkey');
  document.getElementById('caption').value=
`Sizlerden Gelenler 💬 ⭐⭐⭐⭐⭐

“${ilkCumle(metin)}”
— ${musteri||'Müşterimiz'}

Güzel sözleriniz için çok teşekkür ederiz 🙏 Danışmanımız ${d.ad}'a özverili çalışması için teşekkürler.

📞 ${TEL}
🌐 ${WEB}
📍 RE/MAX Doğuş · Fikirtepe / Kadıköy

${tags.join(' ')}`;
}
async function paylas(){
  const st=document.getElementById('status'), btn=document.getElementById('pubBtn');
  const els=[...document.querySelectorAll('.slide')];
  const cap=document.getElementById('caption').value.trim();
  if(!els.length){alert('Önce bir yorum seç.');return;}
  if(els.length>10){alert('Instagram karuselde en fazla 10 görsel olabilir, bu yorum '+els.length+' sayfa tutuyor. Yorumu kısalt.');return;}
  if(!/dogusportal\.com$|github\.io$/.test(location.hostname)){st.textContent='Önizleme modunda yayın kapalı. Portaldan açınca çalışır.';return;}
  if(!confirm(els.length+" görsellik karusel açıklamasıyla birlikte @remaxdogus Instagram ve Facebook sayfasında yayınlanacak. Onaylıyor musun?")) return;
  btn.disabled=true; btn.textContent='⏳ Hazırlanıyor…';
  try{
    const images=[];
    for(let i=0;i<els.length;i++){
      st.textContent=`Görseller hazırlanıyor… ${i+1}/${els.length}`;
      // Otomatik paylaşımla aynı: 1080×1440 (3:4), kapak birebir aynı kalır
      images.push((await canvasOf(els[i])).toDataURL('image/jpeg',.92).split(',')[1]);
    }
    st.textContent='📤 Gönderiliyor… (1-2 dakika sürebilir)'; btn.textContent='📤 Yayınlanıyor…';
    const resp=await fetch(APPS_SCRIPT_URL,{method:'POST',redirect:'follow',body:JSON.stringify({action:'instagramYayinla',ay:'sizlerden-'+Date.now(),set:'karusel',images,caption:cap,facebook:true})});
    const r=await resp.json();
    if(r.success){btn.textContent='✅ Yayınlandı';st.textContent='Instagram'+(r.fbPostId?' + Facebook':'')+' yayınlandı.'+(r.fbPostId?'':(r.fbError?' Facebook: '+r.fbError:''));}
    else throw new Error(r.error||'bilinmeyen hata');
  }catch(e){st.textContent='❌ '+e.message;btn.disabled=false;btn.textContent='Tekrar dene';}
}
async function canvasOf(el){
  return html2canvas(el,{scale:1080/420,useCORS:true,backgroundColor:null,logging:false,width:420,height:el.classList.contains('story')?747:560});
}
async function shot(el,name){
  const s=document.getElementById('status'); s.textContent='Görsel hazırlanıyor…';
  try{const cv=await canvasOf(el);const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download=name;a.click();s.textContent='İndirildi: '+name;}
  catch(e){s.textContent='Hata: '+e.message;}
}
async function downloadAll(){
  const s=document.getElementById('status'), btn=document.getElementById('zipbtn'); btn.disabled=true;
  try{
    const zip=new JSZip(), els=[...document.querySelectorAll('.slide')];
    for(let i=0;i<els.length;i++){
      s.textContent=`Hazırlanıyor… ${i+1}/${els.length}`;
      zip.file(`sizlerden-${i+1}.png`,(await canvasOf(els[i])).toDataURL('image/png').split(',')[1],{base64:true});
    }
    zip.file('aciklama.txt',document.getElementById('caption').value);
    const a=document.createElement('a');a.href=URL.createObjectURL(await zip.generateAsync({type:'blob'}));
    a.download=`sizlerden-${secili().id}.zip`;a.click();
    s.textContent='ZIP indirildi.';
  }catch(e){s.textContent='Hata: '+e.message;}
  btn.disabled=false;
}

(async()=>{
  // ?oto=1&yorum=<id>: otomatik paylaşım için sadece slaytlar (scripts/sizlerden-story.js)
  if(q.get('oto')) document.body.classList.add('oto');
  if(q.get('fmt')==='story'){document.getElementById('fmt').value='story';STORY=true;}
  const [d,y]=await Promise.all([fetch('data/danismanlar.json?t='+Date.now()).then(r=>r.json()),fetch('data/google-yorumlar.json?t='+Date.now()).then(r=>r.json())]);
  DANISMANLAR=d;
  YORUMLAR=(y.yorumlar||[]).filter(r=>r.puan>=4&&r.metin&&(r.danismanlar||[]).some(i=>d.some(x=>x.id===i)))
    .sort((a,b)=>(b.tarih||'').localeCompare(a.tarih||''));
  document.getElementById('danisman').innerHTML=d.map(x=>`<option value="${x.id}">${esc(x.ad)}</option>`).join('');
  document.getElementById('yorumSec').innerHTML='<option value="">— Yorum seç —</option>'+YORUMLAR.map(r=>
    `<option value="${esc(r.id)}">${esc(r.danismanlar.map(i=>(d.find(x=>x.id===i)||{}).ad).filter(Boolean).join(', '))} · ${esc(kisaAd(r.yazar))} · ${esc(r.metin.slice(0,50))}…</option>`).join('');
  const elleGecis=q.get('musteri')||q.get('metin');
  const hedef=q.get('yorum')||(elleGecis?null:(YORUMLAR[0]||{}).id);
  if(hedef){document.getElementById('yorumSec').value=hedef;yorumYukle(hedef);}
  if(q.get('danisman')){document.getElementById('danisman').value=q.get('danisman');}
  if(q.get('musteri')){document.getElementById('musteri').value=q.get('musteri');}
  if(q.get('metin')){document.getElementById('metin').value=q.get('metin');}
  if(q.get('danisman')||q.get('musteri')||q.get('metin')){capElle=false;aciklamaYap();render();}
  await document.fonts.ready;
  await Promise.all([...document.images].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r;})));
  sigdir();
  document.body.dataset.ready='1';
})();
</script>

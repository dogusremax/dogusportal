<style>
:root{--navy:#050A30;--red:#DC1C2E;--redd:#910B19;--coral:#FB5160;--ink:#0d1330;--dim:#5d6585;--line:#e6e8f0;--bg:#f6f7fb;--grad:linear-gradient(160deg,#910B19,#DC1C2E 45%,#FB5160)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Plus Jakarta Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
a{color:inherit;text-decoration:none}
.w{max-width:1080px;margin:0 auto;padding:0 20px}
.hide{display:none!important}

header{position:sticky;top:0;z-index:20;background:rgba(5,10,48,.92);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
header .w{display:flex;align-items:center;gap:18px;height:64px}
header .ad{color:#fff;font-weight:800;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
header nav{display:flex;gap:18px;margin-inline-start:auto}

.btn-ghost{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn svg{width:18px;height:18px}

.hero{background:var(--navy);color:#fff;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-180px;top:-160px;width:560px;height:560px;border-radius:50%;background:var(--grad);opacity:.9}
.hero .w{position:relative;display:grid;grid-template-columns:1.25fr 1fr;gap:40px;align-items:center;padding-top:64px;padding-bottom:72px}
.kicker{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--coral);margin-bottom:14px}
.hero h1{font-size:clamp(36px,6vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.03em}
.hero .unvan{font-size:17px;font-weight:600;color:rgba(255,255,255,.8);margin-top:10px}
.hero .ozet{font-size:17px;color:rgba(255,255,255,.72);margin:20px 0 28px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.portre{justify-self:center;align-self:end;position:relative;width:min(380px,80vw);margin-bottom:-24px}
.portre img{position:relative;z-index:1;width:84%;height:auto;display:block;margin:0 auto}
.portre .bant{position:relative;z-index:2;margin-top:-2px;background:var(--grad);border-radius:16px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 18px 40px rgba(0,0,0,.35)}
.portre .bant b{color:#fff;font-size:15px;font-weight:800;letter-spacing:.06em}
.portre .bant span{color:rgba(255,255,255,.85);font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
@media(max-width:760px){.hero .w{grid-template-columns:1fr;padding-top:36px;padding-bottom:48px;gap:32px}.portre{order:-1;width:min(280px,76vw);margin-bottom:0}.portre .bant{justify-content:center}.portre .bant span{display:none}.hero{text-align:center}.hero .ozet{margin-left:auto;margin-right:auto}.hero .cta{justify-content:center}}

.sayilar{margin-top:-34px;position:relative;z-index:2}
.sayilar .k{background:#fff;border-radius:22px;box-shadow:0 16px 40px rgba(5,10,48,.08);display:grid;grid-template-columns:repeat(3,1fr)}
.sayilar .s{padding:22px 18px;text-align:center}
.sayilar .s+.s{border-left:1px solid var(--line)}
.sayilar b{display:block;font-size:36px;font-weight:800;color:var(--navy);letter-spacing:-.02em}
.sayilar b em{font-style:normal;color:var(--red)}
.sayilar .s>span{font-size:13px;color:var(--dim);font-weight:600}

section{padding:72px 0 0}
.bas{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--red);margin-bottom:8px}
h2{font-size:clamp(26px,4vw,36px);font-weight:800;letter-spacing:-.02em;color:var(--navy);margin-bottom:22px}
.hakkimda p{font-size:17px;color:#2b3254;max-width:760px;margin-bottom:14px}

.hiz{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.hiz .c{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px}

.yor{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}

.tum{margin-top:18px;display:inline-flex;font-weight:700;color:var(--red);font-size:14px}

.ilan{background:var(--navy);color:#fff;border-radius:28px;padding:38px;display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;position:relative;overflow:hidden}

.ilan .btn{justify-content:center}

.form{display:grid;grid-template-columns:1fr 1.2fr;gap:30px;background:#fff;border:1px solid var(--line);border-radius:28px;padding:34px}
.form .bilgi a{display:flex;align-items:center;gap:12px;min-width:0;padding:12px 0;border-bottom:1px solid var(--line);font-weight:600;color:var(--navy)}
.form .bilgi a>span:first-child{width:38px;height:38px;border-radius:12px;background:#fdecee;color:var(--red);display:grid;place-items:center;flex:none}
.form .bilgi svg{width:18px;height:18px}
form{display:grid;gap:12px}
form .iki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font:15px 'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--ink)}

form .btn{justify-content:center}

.yok{padding:120px 20px;text-align:center;color:var(--dim)}
.flag{display:inline-block;flex:0 0 auto;width:24px;height:16px;border-radius:3px;background-size:cover;background-position:center;box-shadow:0 0 0 1px rgba(0,0,0,.18)}

.flag-fa{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 7 4%22%3E%3Crect width=%227%22 height=%224%22 fill=%22%23DA0000%22/%3E%3Crect width=%227%22 height=%222.67%22 fill=%22%23fff%22/%3E%3Crect width=%227%22 height=%221.33%22 fill=%22%23239F40%22/%3E%3C/svg%3E")}
.flag-de{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 5 3%22%3E%3Crect width=%225%22 height=%223%22 fill=%22%23FFCE00%22/%3E%3Crect width=%225%22 height=%222%22 fill=%22%23DD0000%22/%3E%3Crect width=%225%22 height=%221%22 fill=%22%23000%22/%3E%3C/svg%3E")}
.flag-pl{background-image:url("data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 8 5%22%3E%3Crect width=%228%22 height=%225%22 fill=%22%23DC143C%22/%3E%3Crect width=%228%22 height=%222.5%22 fill=%22%23fff%22/%3E%3C/svg%3E")}
.langsel{position:relative;margin-inline-start:4px}
.langbtn{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:6px 12px 6px 8px;font:700 12px 'Plus Jakarta Sans',sans-serif;letter-spacing:.06em;cursor:pointer}
.langbtn::after{content:"";width:6px;height:6px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:translateY(-2px) rotate(45deg);opacity:.8;margin-inline-start:2px}
.langbtn .flag{width:22px;height:15px}
.langmenu{position:absolute;inset-inline-end:0;top:calc(100% + 8px);list-style:none;margin:0;padding:6px;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 20px 40px -16px rgba(0,0,0,.45);min-width:180px;z-index:30}
.langmenu button{width:100%;display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--ink);padding:10px 12px;border-radius:9px;font:600 15px 'Plus Jakarta Sans','Vazirmatn',sans-serif;text-align:start;cursor:pointer}
.langmenu button:hover,.langmenu button[aria-selected="true"]{background:#fdecee}
.niyet{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:520px;margin-bottom:14px}
.nb{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 16px;border-radius:18px;border:0;background:#fff;color:var(--navy);font:800 17px 'Plus Jakarta Sans','Vazirmatn',sans-serif;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .15s}
.nb svg{width:24px;height:24px;color:var(--red);flex:none}
.nb:hover{transform:translateY(-2px)}
.nb:last-child{background:var(--grad);color:#fff}

.modal{position:fixed;inset:0;z-index:50;background:rgba(5,10,48,.6);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px}

.mk{position:relative;background:#fff;border-radius:24px;padding:28px 24px 24px;width:min(440px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.mk h3{font-size:24px;font-weight:800;color:var(--navy);margin:2px 0 16px;letter-spacing:-.01em}
.mk form{display:grid;gap:10px}
.mk .btn{justify-content:center;margin-top:4px}
.mk .btn[disabled]{opacity:.6;cursor:wait}
.mx{position:absolute;top:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--bg);font-size:22px;line-height:1;color:var(--navy);cursor:pointer}
.kvkk{font-size:11.5px;color:var(--dim);line-height:1.45}
.mok{text-align:center;padding:10px 0 4px}
.mok .tik{width:64px;height:64px;border-radius:50%;background:var(--grad);color:#fff;font-size:32px;display:grid;place-items:center;margin:0 auto 14px}
.mok p{font-size:16px;color:#2b3254;font-weight:600}
.mhata{color:var(--red);font-size:13px;font-weight:600}
.orj{font-size:13px;color:var(--dim);margin:-12px 0 18px}
.orj:empty{display:none}
.hiz .c:last-child:nth-child(3n+1){grid-column:1/-1}
.hiz .c:last-child:nth-child(3n+1) ul{grid-template-columns:1fr 1fr;column-gap:28px}
@media(max-width:600px){.hiz .c:last-child:nth-child(3n+1) ul{grid-template-columns:1fr}}
.yfb{margin-top:28px}
.yfb button{width:100%;display:flex;align-items:center;gap:18px;padding:20px 22px;border:0;border-radius:24px;background:var(--navy);color:#fff;cursor:pointer;text-align:start;font-family:inherit;position:relative;overflow:hidden;box-shadow:0 16px 40px rgba(5,10,48,.18);transition:transform .15s}
.yfb button:hover{transform:translateY(-2px)}
.yfb button:after{content:"";position:absolute;inset-inline-end:-70px;top:-90px;width:220px;height:220px;border-radius:50%;background:var(--grad);opacity:.9}
.yfb .ik{width:54px;height:54px;border-radius:16px;background:var(--grad);display:grid;place-items:center;flex:none;position:relative;z-index:1}
.yfb .ik svg{width:28px;height:28px}
.yfb .yz{flex:1;min-width:0;position:relative;z-index:1}
.yfb b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em}

.yfb .ok{width:42px;height:42px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;flex:none;position:relative;z-index:1;font-size:20px;font-weight:800}

.mk.genis{width:min(620px,100%);padding:0;overflow:auto}
.yfu{background:var(--navy);color:#fff;padding:26px 24px 22px;position:relative;overflow:hidden;border-radius:24px 24px 0 0}
.yfu:after{content:"";position:absolute;inset-inline-end:-90px;top:-110px;width:200px;height:200px;border-radius:50%;background:var(--grad);opacity:.85}
.yfu .bas{color:var(--coral);position:relative;z-index:1}
.yfu h3{color:#fff;margin:2px 0 6px;position:relative;z-index:1;font-size:26px}

.vk{position:relative}
.vid{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;padding:6px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.vid::-webkit-scrollbar{display:none}
.vid .v{flex:0 0 168px;scroll-snap-align:start;font-family:inherit;position:relative;aspect-ratio:9/16;border-radius:16px;overflow:hidden;background:var(--navy);border:0;padding:0;cursor:pointer;display:block;transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s;box-shadow:0 6px 18px rgba(5,10,48,.15);animation:vGir .6s both}
